<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مركز الألعاب | Game Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #0a0a0c;
            --card-black: #141419;
            --border-dark: #2a2a35;
            --red-main: #ff1e42;
            --red-glow: rgba(255, 30, 66, 0.4);
            --red-hover: #e01737;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --gold: #ffb703;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        .header {
            background: rgba(20, 20, 25, 0.95);
            border-bottom: 2px solid var(--red-main);
            box-shadow: 0 4px 20px var(--red-glow);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--red-main), #500);
            border: 2px solid var(--red-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 0 10px var(--red-glow);
        }

        .user-meta {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.2;
        }

        .user-id {
            font-size: 11px;
            color: var(--text-gray);
        }

        .balance-badge {
            background: #1e1e26;
            border: 1.5px solid var(--red-main);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px var(--red-glow);
        }

        .balance-val {
            font-weight: 900;
            color: var(--text-white);
            font-size: 15px;
        }

        .balance-unit {
            font-size: 11px;
            color: var(--red-main);
            font-weight: 900;
        }

        .refresh-btn {
            background: none;
            border: none;
            color: var(--red-main);
            font-size: 16px;
            cursor: pointer;
            margin-right: 4px;
        }

        .hero {
            padding: 20px 16px 10px;
            text-align: center;
        }

        .hero h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-white);
            text-shadow: 0 0 12px var(--red-glow);
            margin-bottom: 4px;
        }

        .hero p {
            font-size: 12px;
            color: var(--text-gray);
        }

        .section-title {
            padding: 10px 16px;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--red-main);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            padding: 0 16px;
        }

        .game-card {
            background: var(--card-black);
            border: 1.5px solid var(--border-dark);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .game-card:hover, .game-card:active {
            border-color: var(--red-main);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px var(--red-glow);
        }

        .game-thumb {
            width: 100%;
            height: 120px;
            background: #1a1a22;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border-dark);
            overflow: hidden;
        }

        .game-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--red-main);
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .game-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-white);
            line-height: 1.2;
        }

        .play-btn {
            background: var(--red-main);
            color: var(--text-white);
            border: none;
            padding: 6px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 10px var(--red-glow);
        }

        .game-player-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            z-index: 1000;
            flex-direction: column;
        }

        .player-header {
            background: var(--card-black);
            border-bottom: 1.5px solid var(--red-main);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-player-btn {
            background: var(--red-main);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <div class="avatar" id="uAvatar">U</div>
            <div class="user-meta">
                <div class="user-name" id="uName">جاري التحميل...</div>
                <div class="user-id" id="uId">ID: 00000000</div>
            </div>
        </div>
        <div class="balance-badge">
            <span class="balance-val" id="uBalance">0.00</span>
            <span class="balance-unit">NSP</span>
            <button class="refresh-btn" onclick="initPage()">🔄</button>
        </div>
    </div>

    <div class="hero">
        <h1>🎮 مركز الألعاب الملكي</h1>
        <p>اختر لعبتك المفضلة واستمتع بالتحدي</p>
    </div>

    <div class="section-title">
        <span>🔥</span> الألعاب المتاحة
    </div>

    <div class="games-grid" id="gamesGrid"></div>

    <div class="game-player-modal" id="playerModal">
        <div class="player-header">
            <span style="font-weight: 800; font-size: 14px;" id="activeGameTitle">اللعبة</span>
            <button class="close-player-btn" onclick="closeGamePlayer()">إغلاق اللعبة ✖</button>
        </div>
        <iframe class="game-iframe" id="gameFrame" src=""></iframe>
    </div>

    <script>
        const SERVER_URL = "https://my-bot-s23a.onrender.com";
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.expand();
            tg.ready();
        }

        const currentUser = {
            id: tg?.initDataUnsafe?.user?.id || "demo_user",
            name: tg?.initDataUnsafe?.user?.first_name || "لاعب تجريبي"
        };

        let GAMES_LIST = [];

        async function fetchUserData() {
            document.getElementById('uName').innerText = currentUser.name;
            document.getElementById('uId').innerText = `ID: ${currentUser.id}`;
            document.getElementById('uAvatar').innerText = currentUser.name[0].toUpperCase();

            try {
                const response = await fetch(`${SERVER_URL}/api/get_user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, name: currentUser.name })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        document.getElementById('uBalance').innerText = parseFloat(data.balance).toFixed(2);
                    }
                }
            } catch (error) {
                console.warn("خطأ جلب الرصيد:", error);
            }
        }

        async function fetchGames() {
            try {
                const response = await fetch(`${SERVER_URL}/api/get_games`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.games) {
                        GAMES_LIST = data.games;
                        renderGames();
                    }
                }
            } catch (error) {
                console.warn("خطأ جلب الألعاب:", error);
            }
        }

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (GAMES_LIST.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-gray); padding: 20px;">لا توجد ألعاب متاحة حالياً</div>`;
                return;
            }

            GAMES_LIST.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGamePlayer(game.title, game.url);

                const thumbHTML = game.image && game.image.trim() !== ""
                    ? `<img src="${game.image}" alt="${game.title}" onerror="this.parentElement.innerHTML='<span style=\\'font-size:40px;\\'>🎮</span>'">`
                    : `<span style="font-size: 40px;">🎮</span>`;

                card.innerHTML = `
                    <div class="game-thumb">
                        ${thumbHTML}
                        <span class="game-tag">${game.tag || 'جديد'}</span>
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <button class="play-btn">تشغيل الآن 🚀</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openGamePlayer(title, url) {
            document.getElementById('activeGameTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closeGamePlayer() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('playerModal').style.display = 'none';
            fetchUserData();
        }

        function initPage() {
            fetchUserData();
            fetchGames();
        }

        initPage();
    </script>
</body>
</html>
