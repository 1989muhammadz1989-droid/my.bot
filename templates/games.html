<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب المباشرة | AUREX GAMES</title>
    <!-- مكتبة تلجرام للألعاب والـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- خط Tajawal لتصميم عصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: rgba(22, 12, 16, 0.85);
            --primary-red: #ff0033;
            --dark-red: #8b001a;
            --accent-gold: #ffcc00;
            --text-light: #f5f5f7;
            --text-dim: #a0a0ab;
            --glass-border: rgba(255, 0, 51, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #2b0008 0%, var(--bg-dark) 70%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        /* شريط العنونة والرصيد */
        .header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(255, 0, 51, 0.15);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
        }

        .user-details h3 {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .user-details p {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-btn {
            display: none;
            background: linear-gradient(135deg, var(--accent-gold), #ff9900);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
            transition: transform 0.2s;
        }

        .admin-btn:hover {
            transform: scale(1.05);
        }

        .balance-box {
            background: linear-gradient(135deg, rgba(139, 0, 26, 0.4), rgba(20, 0, 5, 0.8));
            border: 1px solid var(--primary-red);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.3);
            cursor: pointer;
        }

        .balance-amount {
            font-weight: 900;
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .currency-symbol {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
        }

        /* المحتوى الرئيسي */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 4px solid var(--primary-red);
            padding-right: 10px;
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
        }

        /* شبكة الألعاب */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
        }

        @media (min-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 25px;
            }
        }

        /* كارت اللعبة */
        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary-red);
            box-shadow: 0 10px 25px rgba(255, 0, 51, 0.4);
        }

        .game-img-wrapper {
            position: relative;
            width: 100%;
            height: 140px;
            background: #111;
            overflow: hidden;
        }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover .game-img {
            transform: scale(1.1);
        }

        .game-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255, 0, 51, 0.85);
            color: #fff;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        .game-badge-live {
            background: linear-gradient(135deg, #00c853, #00e676) !important;
            color: #000 !important;
        }

        .game-info {
            padding: 12px;
            text-align: center;
        }

        .game-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .game-desc {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 10px;
            height: 32px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-play {
            width: 100%;
            padding: 8px 0;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--dark-red), var(--primary-red));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-play:active {
            opacity: 0.8;
        }

        /* نافذة تشغيل اللعبة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-card {
            background: #14080b;
            border: 2px solid var(--primary-red);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.5);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 15px;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
        }

        .bet-input-group {
            margin: 20px 0;
        }

        .bet-input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .bet-input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-weight: 700;
        }

        .result-win {
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid #00c853;
            color: #00e676;
        }

        .result-loss {
            background: rgba(255, 0, 51, 0.2);
            border: 1px solid var(--primary-red);
            color: #ff5252;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--primary-red);
            font-size: 1.2rem;
        }

        /* حاوية عرض الألعاب الحية عبر Iframe */
        .live-iframe-container {
            width: 100%;
            flex-grow: 1;
            min-height: 450px;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--glass-border);
        }

        .live-iframe {
            width: 100%;
            height: 100%;
            min-height: 450px;
            border: none;
            display: block;
        }

        /* تنسيقات لوحة الإدارة */
        .admin-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .admin-tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .admin-tab-btn.active {
            background: var(--primary-red);
        }

        .admin-form-group {
            margin-bottom: 12px;
        }

        .admin-form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .admin-form-group input, .admin-form-group select {
            width: 100%;
            padding: 8px;
            background: #000;
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 6px;
        }

        .user-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- الهيدر والمعلومات الشخصية -->
    <header class="header-bar">
        <div class="user-info">
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
            <div class="user-details">
                <h3 id="u-name">جاري التحميل...</h3>
                <p>ID: <span id="u-id">--</span></p>
            </div>
        </div>

        <div class="header-controls">
            <!-- زر لوحة الإدارة (يظهر فقط للحساب 7255100997) -->
            <button id="admin-btn" class="admin-btn" onclick="openAdminModal()">
                <i class="fa-solid fa-shield-halved"></i> الأدمن
            </button>

            <div class="balance-box" onclick="fetchUserData()">
                <i class="fa-solid fa-wallet" style="color: var(--accent-gold);"></i>
                <span class="balance-amount" id="u-balance">0.00</span>
                <span class="currency-symbol">nps</span>
                <i class="fa-solid fa-rotate-right" style="font-size: 0.7rem; color: var(--text-dim);"></i>
            </div>
        </div>
    </header>

    <!-- قائمة الألعاب -->
    <main class="container">
        <div class="section-title">
            <i class="fa-solid fa-gamepad" style="color: var(--primary-red);"></i>
            <span>قائمة الألعاب المتاحة</span>
        </div>

        <div id="loading-state" class="loader">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الألعاب والتكامل مع قواعد البيانات...
        </div>

        <div class="games-grid" id="games-container" style="display: none;">
            <!-- يتم توليد كروت الألعاب ديناميكياً هنا -->
        </div>
    </main>

    <!-- نافذة تشغيل اللعبة وإجراء الرهان (يدعم الألعاب المباشرة والحية) -->
    <div class="modal-overlay" id="game-modal">
        <div class="modal-card" id="modal-card-element">
            <i class="fa-solid fa-xmark close-btn" onclick="closeModal('game-modal')"></i>
            <h2 id="modal-game-title" style="text-align: center; color: var(--primary-red); margin-bottom: 5px;">اسم اللعبة</h2>
            <p id="modal-game-desc" style="text-align: center; font-size: 0.8rem; color: var(--text-dim);">وصف اللعبة</p>

            <!-- منطقة الألعاب السريعة/العادية -->
            <div id="static-play-area">
                <div class="bet-input-group">
                    <label>حدد قيمة الرهان (nps):</label>
                    <input type="number" id="bet-amount" class="bet-input" value="1.0" min="0.1" step="0.5">
                </div>

                <button class="btn-play" style="padding: 12px; font-size: 1.1rem;" onclick="executePlay()">
                    <i class="fa-solid fa-dice"></i> العب الآن
                </button>

                <div id="result-box" class="result-box"></div>
            </div>

            <!-- منطقة الألعاب التفاعلية الحية (Motion / Live HTML5 Games) -->
            <div id="live-iframe-container" class="live-iframe-container" style="display: none;">
                <iframe id="game-iframe" class="live-iframe" src="about:blank" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>
    </div>

    <!-- نافذة لوحة الإدارة (حصرياً للحساب 7255100997) -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark close-btn" onclick="closeModal('admin-modal')"></i>
            <h2 style="text-align: center; color: var(--accent-gold); margin-bottom: 15px;">
                <i class="fa-solid fa-user-shield"></i> لوحة تحكم الأدمن
            </h2>

            <div class="admin-nav">
                <button class="admin-tab-btn active" onclick="switchAdminTab('algo')">الخوارزميات</button>
                <button class="admin-tab-btn" onclick="switchAdminTab('users')">المستخدمين والأرصدة</button>
            </div>

            <!-- تبويب التحكم بالخوارزمية -->
            <div id="admin-tab-algo">
                <div class="admin-form-group">
                    <label>اختر اللعبة:</label>
                    <select id="admin-game-select" onchange="onAdminGameSelected()"></select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="admin-form-group">
                        <label>نسبة الخسارة (%):</label>
                        <input type="number" id="algo-loss" step="0.1">
                    </div>
                    <div class="admin-form-group">
                        <label>ربح عادي (%):</label>
                        <input type="number" id="algo-normal" step="0.1">
                    </div>
                    <div class="admin-form-group">
                        <label>ربح متوسط (%):</label>
                        <input type="number" id="algo-medium" step="0.1">
                    </div>
                    <div class="admin-form-group">
                        <label>ربح عالي (%):</label>
                        <input type="number" id="algo-high" step="0.1">
                    </div>
                    <div class="admin-form-group" style="grid-column: span 2;">
                        <label>ربح ضخم Mega (%):</label>
                        <input type="number" id="algo-mega" step="0.1">
                    </div>
                </div>
                <button class="btn-play" style="margin-top: 10px;" onclick="saveAlgorithm()">حفظ وتطبيق الخوارزمية</button>
            </div>

            <!-- تبويب إدارة المستخدمين والرصيد -->
            <div id="admin-tab-users" style="display: none;">
                <div class="admin-form-group">
                    <label>معرف المستخدم (Telegram ID):</label>
                    <input type="text" id="admin-target-user" placeholder="مثال: 123456789">
                </div>
                <div class="admin-form-group">
                    <label>الرصيد الجديد (nps):</label>
                    <input type="number" id="admin-target-balance" placeholder="0.00" step="0.5">
                </div>
                <button class="btn-play" style="margin-bottom: 15px;" onclick="updateUserBalance()">تحديث رصيد المستخدم</button>
                
                <h4 style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px;">آخر المستخدمين المسجلين:</h4>
                <div id="admin-users-list" style="max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div id="admin-msg" class="result-box"></div>
        </div>
    </div>

    <script>
        const ADMIN_ID = "7255100997";

        // تهيئة Telegram WebApp
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // استخراج user_id من التلجرام أو رابط الصفحة
        const urlParams = new URLSearchParams(window.location.search);
        let userId = tg?.initDataUnsafe?.user?.id || urlParams.get('user_id') || urlParams.get('telegram_id') || "123456789";
        
        let currentGameId = null;
        let loadedGamesCache = [];

        // التحقق من صلاحيات الأدمن وإظهار الزر عند تطابق المعرف
        if (String(userId) === ADMIN_ID) {
            document.getElementById('admin-btn').style.display = 'inline-block';
        }

        // 1. جلب بيانات المستخدم المحدثة تلقائياً من قواعد البيانات
        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?telegram_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('u-name').innerText = data.full_name || 'مستخدم تلجرام';
                    document.getElementById('u-id').innerText = data.user_id;
                    document.getElementById('u-balance').innerText = parseFloat(data.balance).toFixed(2);
                }
            } catch (err) {
                console.error("خطأ في جلب بيانات المستخدم:", err);
            }
        }

        // 2. جلب قائمة الألعاب المتاحة ديناميكياً (الألعاب العادية والألعاب الحية)
        async function loadGames() {
            try {
                const res = await fetch('/api/games');
                const data = await res.json();
                
                const container = document.getElementById('games-container');
                const loader = document.getElementById('loading-state');
                
                container.innerHTML = '';

                if (data.success && data.games.length > 0) {
                    loadedGamesCache = data.games;
                    data.games.forEach(game => {
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.onclick = () => openGameModal(game);

                        const isLive = (game.type === 'live' || game.entry_point);
                        const badgeClass = isLive ? 'game-badge game-badge-live' : 'game-badge';
                        const badgeText = isLive ? '🎮 حركة حية' : 'متصل باللوحة';

                        let iconPath = game.icon || 'https://cdn-icons-png.flaticon.com/512/808/808439.png';
                        if (iconPath && !iconPath.startsWith('http') && !iconPath.startsWith('/')) {
                            iconPath = `/games/${iconPath}`;
                        }

                        card.innerHTML = `
                            <div class="game-img-wrapper">
                                <span class="${badgeClass}">${badgeText}</span>
                                <img src="${iconPath}" class="game-img" alt="${game.title || game.name}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/808/808439.png'">
                            </div>
                            <div class="game-info">
                                <div class="game-title">${game.title || game.name || game.id}</div>
                                <div class="game-desc">${game.description || 'لعبة حظ ومكافآت مباشرة معالجة فورياً'}</div>
                                <button class="btn-play"><i class="fa-solid fa-play"></i> ${isLive ? 'تشغيل اللعبة' : 'ابدأ اللعب'}</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim);">لا يوجد ألعاب مضافة حالياً في مجلد games/</p>`;
                }

                loader.style.display = 'none';
                container.style.display = 'grid';
            } catch (err) {
                console.error("خطأ في جلب الألعاب:", err);
            }
        }

        // 3. فتح/إغلاق النوافذ (يدعم الواجهة الحية iframe أو الرهان المباشر)
        function openGameModal(game) {
            currentGameId = game.id;
            document.getElementById('modal-game-title').innerText = game.title || game.name || game.id;
            document.getElementById('modal-game-desc').innerText = game.description || '';

            const staticPlayArea = document.getElementById('static-play-area');
            const liveIframeContainer = document.getElementById('live-iframe-container');
            const modalCard = document.getElementById('modal-card-element');
            const gameIframe = document.getElementById('game-iframe');

            const isLive = (game.type === 'live' || game.entry_point);

            if (isLive) {
                // ضبط النافذة لاستيعاب اللعبة الحية
                modalCard.style.maxWidth = '850px';
                modalCard.style.height = '85vh';
                staticPlayArea.style.display = 'none';
                liveIframeContainer.style.display = 'block';

                // تجهيز رابط اللعبة الحية وتمرير user_id و game_id
                const entryUrl = game.entry_point || `/games/${game.id}/index.html`;
                const finalUrl = `${entryUrl}${entryUrl.includes('?') ? '&' : '?'}user_id=${encodeURIComponent(userId)}&game_id=${encodeURIComponent(game.id)}`;
                
                gameIframe.src = finalUrl;
            } else {
                // ضبط النافذة للعب المباشر القديم
                modalCard.style.maxWidth = '500px';
                modalCard.style.height = 'auto';
                staticPlayArea.style.display = 'block';
                liveIframeContainer.style.display = 'none';
                document.getElementById('result-box').style.display = 'none';
                gameIframe.src = 'about:blank';
            }

            document.getElementById('game-modal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if (modalId === 'game-modal') {
                // إيقاف اللعبة الحية لتوفير الأداء وإيقاف الصوت بالخلفية
                document.getElementById('game-iframe').src = 'about:blank';
                fetchUserData(); // تحديث الرصيد بعد إغلاق اللعبة
            }
        }

        // 4. تنفيذ اللعبة وقراءة النتيجة بالعملة nps (للألعاب العادية)
        async function executePlay() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            const resultBox = document.getElementById('result-box');

            if (!betAmount || betAmount <= 0) {
                alert("يرجى إدخال مبلغ رهان صالح");
                return;
            }

            try {
                resultBox.style.display = 'block';
                resultBox.className = 'result-box';
                resultBox.innerText = 'جاري تنفيذ اللعبة وحساب الخوارزمية...';

                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: currentGameId,
                        bet_amount: betAmount
                    })
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('u-balance').innerText = parseFloat(data.new_balance).toFixed(2);

                    if (data.multiplier > 0) {
                        resultBox.className = 'result-box result-win';
                        resultBox.innerHTML = `🎉 مبروك! فزت بـ <b>${data.win_amount.toFixed(2)} nps</b> (مضاعف: ${data.multiplier}x)<br><small>${data.tier_label}</small>`;
                    } else {
                        resultBox.className = 'result-box result-loss';
                        resultBox.innerHTML = `❌ حظ أوفر! خسرت الرهان (${betAmount.toFixed(2)} nps)`;
                    }
                } else {
                    resultBox.className = 'result-box result-loss';
                    resultBox.innerText = data.message || 'حدث خطأ أثناء اللعب';
                }
            } catch (err) {
                resultBox.className = 'result-box result-loss';
                resultBox.innerText = 'تعذر الاتصال بالسيرفر!';
            }
        }

        // ------------------------------------
        // وظائف لوحة تحكم الأدمن (7255100997)
        // ------------------------------------
        function openAdminModal() {
            if (String(userId) !== ADMIN_ID) return;
            document.getElementById('admin-msg').style.display = 'none';
            document.getElementById('admin-modal').style.display = 'flex';
            populateAdminGames();
            loadAdminUsers();
        }

        function switchAdminTab(tab) {
            document.getElementById('admin-tab-algo').style.display = tab === 'algo' ? 'block' : 'none';
            document.getElementById('admin-tab-users').style.display = tab === 'users' ? 'block' : 'none';
            const tabs = document.querySelectorAll('.admin-tab-btn');
            tabs[0].classList.toggle('active', tab === 'algo');
            tabs[1].classList.toggle('active', tab === 'users');
        }

        function populateAdminGames() {
            const select = document.getElementById('admin-game-select');
            select.innerHTML = '';
            loadedGamesCache.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = `${g.title || g.name} (${g.id})`;
                select.appendChild(opt);
            });
            onAdminGameSelected();
        }

        function onAdminGameSelected() {
            const selectedId = document.getElementById('admin-game-select').value;
            const game = loadedGamesCache.find(g => g.id === selectedId);
            if (game && game.algo) {
                document.getElementById('algo-loss').value = game.algo.loss_rate;
                document.getElementById('algo-normal').value = game.algo.normal_rate;
                document.getElementById('algo-medium').value = game.algo.medium_rate;
                document.getElementById('algo-high').value = game.algo.high_rate;
                document.getElementById('algo-mega').value = game.algo.mega_rate;
            }
        }

        async function saveAlgorithm() {
            const msgBox = document.getElementById('admin-msg');
            msgBox.style.display = 'block';
            
            const payload = {
                admin_id: userId,
                game_id: document.getElementById('admin-game-select').value,
                loss_rate: parseFloat(document.getElementById('algo-loss').value),
                normal_rate: parseFloat(document.getElementById('algo-normal').value),
                medium_rate: parseFloat(document.getElementById('algo-medium').value),
                high_rate: parseFloat(document.getElementById('algo-high').value),
                mega_rate: parseFloat(document.getElementById('algo-mega').value)
            };

            try {
                const res = await fetch('/api/admin/algo/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                msgBox.className = data.success ? 'result-box result-win' : 'result-box result-loss';
                msgBox.innerText = data.message;
                if(data.success) loadGames();
            } catch(e) {
                msgBox.className = 'result-box result-loss';
                msgBox.innerText = 'حدث خطأ في الحفظ';
            }
        }

        async function loadAdminUsers() {
            try {
                const res = await fetch(`/api/admin/users?admin_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    const listContainer = document.getElementById('admin-users-list');
                    listContainer.innerHTML = '';
                    data.users.forEach(u => {
                        const item = document.createElement('div');
                        item.className = 'user-list-item';
                        item.innerHTML = `
                            <span><b>${u.full_name}</b> (ID: ${u.user_id})</span>
                            <span style="color: var(--accent-gold);">${parseFloat(u.balance).toFixed(2)} nps</span>
                        `;
                        item.onclick = () => {
                            document.getElementById('admin-target-user').value = u.user_id;
                            document.getElementById('admin-target-balance').value = u.balance;
                        };
                        listContainer.appendChild(item);
                    });
                }
            } catch(e){}
        }

        async function updateUserBalance() {
            const msgBox = document.getElementById('admin-msg');
            msgBox.style.display = 'block';

            const payload = {
                admin_id: userId,
                user_id: document.getElementById('admin-target-user').value,
                balance: parseFloat(document.getElementById('admin-target-balance').value)
            };

            try {
                const res = await fetch('/api/admin/user/update-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                msgBox.className = data.success ? 'result-box result-win' : 'result-box result-loss';
                msgBox.innerText = data.message;
                if(data.success) {
                    loadAdminUsers();
                    fetchUserData();
                }
            } catch(e) {
                msgBox.className = 'result-box result-loss';
                msgBox.innerText = 'فشل تعديل الرصيد';
            }
        }

        // تشغيل الوظائف عند فتح الصفحة
        window.onload = () => {
            fetchUserData();
            loadGames();
        };
    </script>
</body>
</html>
