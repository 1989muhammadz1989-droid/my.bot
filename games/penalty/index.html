<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ضربات جزاء - فرفوش HD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #060913;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* Modern Glassmorphic Header */
        .header {
            width: 100%;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .balance-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #f59e0b;
            font-weight: 800;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
        }
        .title {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fce7f3, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        /* Canvas Game Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 56vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #02040a;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Dashboard & Controls */
        .controls {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(180deg, #0f172a 0%, #080d1a 100%);
            padding: 16px 20px;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            border-top: 2px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 -10px 35px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }
        .target-hint {
            text-align: center;
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 600;
        }
        .aim-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .aim-btn {
            background: #1e293b;
            border: 2px solid rgba(255,255,255,0.08);
            color: #94a3b8;
            padding: 10px 4px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .aim-btn.selected {
            border-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(251, 191, 36, 0.05));
            color: #fbbf24;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .bet-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090d16;
            padding: 8px 16px;
            border-radius: 16px;
            border: 1px solid #1e293b;
        }
        .btn-step {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s;
        }
        .btn-step:active { transform: scale(0.92); }
        .bet-display { text-align: center; }
        .bet-amount {
            font-size: 1.35rem;
            font-weight: 900;
            color: #f8fafc;
        }
        .bet-label {
            font-size: 0.72rem;
            color: #fbbf24;
            font-weight: bold;
        }
        
        .shoot-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #090d16;
            border: none;
            border-radius: 16px;
            font-size: 1.35rem;
            font-weight: 900;
            box-shadow: 0 4px 25px rgba(245, 158, 11, 0.5);
            cursor: pointer;
            transition: all 0.2s;
        }
        .shoot-btn:active { transform: scale(0.98); }
        .shoot-btn:disabled {
            background: #334155;
            box-shadow: none;
            color: #64748b;
            cursor: not-allowed;
        }

        /* Result Popup Modal */
        .modal {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 23, 42, 0.96);
            border: 2px solid #f59e0b;
            padding: 24px 38px;
            border-radius: 22px;
            text-align: center;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 10px 45px rgba(0,0,0,0.9);
        }
        .modal.show { transform: translate(-50%, -50%) scale(1); }
        .modal-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 6px; }
        .win { color: #22c55e; text-shadow: 0 0 12px rgba(34, 197, 94, 0.6); }
        .loss { color: #ef4444; text-shadow: 0 0 12px rgba(239, 68, 68, 0.6); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">⚽ ضربات جزاء - فرفوش</div>
        <div class="balance-box">
            <span id="userBalance">0.00</span>
            <small>NPS</small>
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="modal" id="resultModal">
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalSub" style="font-size: 0.95rem; color: #cbd5e1;"></div>
        </div>
    </div>

    <div class="controls">
        <div class="target-hint">🎯 اختر زاوية التسديد:</div>
        <div class="aim-grid">
            <button class="aim-btn" onclick="setAim(event, 'top-left')">يسار علوي</button>
            <button class="aim-btn selected" onclick="setAim(event, 'center')">الوسط</button>
            <button class="aim-btn" onclick="setAim(event, 'top-right')">يمين علوي</button>
            <button class="aim-btn" onclick="setAim(event, 'bottom-left')">يسار سفلي</button>
            <button class="aim-btn" onclick="setAim(event, 'bottom-center')">أسفل الوسط</button>
            <button class="aim-btn" onclick="setAim(event, 'bottom-right')">يمين سفلي</button>
        </div>

        <div class="bet-selector">
            <button class="btn-step" onclick="changeBet(-5)">-</button>
            <div class="bet-display">
                <div class="bet-amount"><span id="betAmount">5</span> NPS</div>
                <div class="bet-label">مضاعف الربح (2x)</div>
            </div>
            <button class="btn-step" onclick="changeBet(5)">+</button>
        </div>

        <button class="shoot-btn" id="shootBtn" onclick="playGame()">سدد الآن 🚀</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = new URLSearchParams(window.location.search).get('user_id') || 
                     tg?.initDataUnsafe?.user?.id || 123456;

        let currentBet = 5;
        let userBalance = 0;
        let selectedAim = 'center';
        let isAnimating = false;

        // Target coordinates relative to goal center
        const aimCoords = {
            'top-left': { x: -115, y: -85 },
            'center': { x: 0, y: -50 },
            'top-right': { x: 115, y: -85 },
            'bottom-left': { x: -115, y: -5 },
            'bottom-center': { x: 0, y: 5 },
            'bottom-right': { x: 115, y: -5 }
        };

        // Synthesized AudioFX Engine
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playKick() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },
            playGoal() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            },
            playSave() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        // Canvas & High Visual Quality Render Engine
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 50);

        let ball = { x: 0, y: 140, scale: 1, rotation: 0 };
        let keeper = { x: 0, y: -35, targetX: 0, targetY: -35, angle: 0, targetAngle: 0 };

        function addParticles(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function drawStadiumBackground(cx, cy) {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;

            // Night Sky Dynamic Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, cy - 90);
            skyGrad.addColorStop(0, '#030712');
            skyGrad.addColorStop(0.7, '#0b1329');
            skyGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, cy - 90);

            // Volumetric Stadium Floodlights
            drawSpotlight(width * 0.15, 20, 140, 'rgba(251, 191, 36, 0.25)');
            drawSpotlight(width * 0.85, 20, 140, 'rgba(251, 191, 36, 0.25)');
            drawSpotlight(width * 0.5, 10, 180, 'rgba(56, 189, 248, 0.15)');

            // LED Advertising Wall
            const adY = cy - 110;
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, adY, width, 22);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(0, adY, width, 22);

            ctx.fillStyle = '#fbbf24';
            ctx.font = '900 11px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('👑 FARFOOSH PENALTY LEAGUE 👑 WIN 2X NPS 👑 FARFOOSH PENALTY LEAGUE 👑', width / 2, adY + 15);
        }

        function drawSpotlight(x, y, radius, color) {
            let grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
            grad.addColorStop(0, color);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPitch(cx, cy) {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;

            const pitchTop = cy - 88;
            const pitchHeight = height - pitchTop;
            const strips = 9;

            // Grass Pitch Perspective Strips
            for (let i = 0; i < strips; i++) {
                let y1 = pitchTop + (i / strips) * pitchHeight;
                let y2 = pitchTop + ((i + 1) / strips) * pitchHeight;
                ctx.fillStyle = (i % 2 === 0) ? '#15803d' : '#166534';
                ctx.beginPath();
                ctx.moveTo(0, y1);
                ctx.lineTo(width, y1);
                ctx.lineTo(width, y2);
                ctx.lineTo(0, y2);
                ctx.fill();
            }

            // Pitch Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 3;

            // Penalty Box Line
            const boxTopWidth = 270;
            const boxBottomWidth = 370;
            ctx.beginPath();
            ctx.moveTo(cx - boxTopWidth / 2, pitchTop);
            ctx.lineTo(cx + boxTopWidth / 2, pitchTop);
            ctx.lineTo(cx + boxBottomWidth / 2, pitchTop + 135);
            ctx.lineTo(cx - boxBottomWidth / 2, pitchTop + 135);
            ctx.closePath();
            ctx.stroke();

            // Goal Line
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(cx - 160, pitchTop);
            ctx.lineTo(cx + 160, pitchTop);
            ctx.stroke();

            // Penalty Spot
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(cx, cy + 140, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawGoal(cx, cy) {
            const gx = cx - 145;
            const gy = cy - 135;
            const gw = 290;
            const gh = 125;

            // Goal Net Backing
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fillRect(gx + 10, gy - 10, gw - 20, gh);

            // Realistic Net Pattern
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;

            for (let x = gx; x <= gx + gw; x += 11) {
                ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + gh); ctx.stroke();
            }
            for (let y = gy; y <= gy + gh; y += 9) {
                ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke();
            }

            // Realistic Goal Posts
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 12;

            ctx.beginPath();
            ctx.moveTo(gx, gy + gh);
            ctx.lineTo(gx, gy);
            ctx.lineTo(gx + gw, gy);
            ctx.lineTo(gx + gw, gy + gh);
            ctx.stroke();

            ctx.shadowBlur = 0;
        }

        // Draw High-Quality Cat Character "فرفوش" (Based on Image Reference)
        function drawFarfoosh(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Shadow under Keeper
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 36, 24, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Yellow Goalkeeper Jersey (Detailed Gradient)
            let jerseyGrad = ctx.createLinearGradient(-22, -10, 22, 32);
            jerseyGrad.addColorStop(0, '#fde047');
            jerseyGrad.addColorStop(0.5, '#f59e0b');
            jerseyGrad.addColorStop(1, '#d97706');
            ctx.fillStyle = jerseyGrad;
            ctx.beginPath();
            ctx.roundRect(-22, -5, 44, 38, 14);
            ctx.fill();

            // Black Trim & Crown Logo on Jersey
            ctx.strokeStyle = '#090d16';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#090d16';
            ctx.font = '900 8px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('👑 فرفوش', 0, 15);

            // Fluffy Cat Head (Grey & White Fur Gradient)
            let headGrad = ctx.createRadialGradient(-3, -20, 2, 0, -18, 22);
            headGrad.addColorStop(0, '#f1f5f9');
            headGrad.addColorStop(0.6, '#94a3b8');
            headGrad.addColorStop(1, '#475569');

            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(0, -18, 22, 0, Math.PI * 2);
            ctx.fill();

            // White Muzzle Area
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, -12, 11, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Ears (Pink Inner)
            // Left Ear
            ctx.fillStyle = '#475569';
            ctx.beginPath(); ctx.moveTo(-14, -30); ctx.lineTo(-26, -46); ctx.lineTo(-6, -36); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath(); ctx.moveTo(-13, -32); ctx.lineTo(-22, -43); ctx.lineTo(-7, -36); ctx.closePath(); ctx.fill();

            // Right Ear
            ctx.fillStyle = '#475569';
            ctx.beginPath(); ctx.moveTo(14, -30); ctx.lineTo(26, -46); ctx.lineTo(6, -36); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath(); ctx.moveTo(13, -32); ctx.lineTo(22, -43); ctx.lineTo(7, -36); ctx.closePath(); ctx.fill();

            // Black Cap with "فرفوش" & Crown Emblem
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(0, -25, 22.5, Math.PI, 0); ctx.fill();
            ctx.fillStyle = '#020617';
            ctx.beginPath(); ctx.roundRect(-25, -25, 50, 7, 3); ctx.fill();

            ctx.fillStyle = '#fbbf24';
            ctx.font = '900 9px Tahoma';
            ctx.fillText('👑 فرفوش', 0, -30);

            // Large Cute Expressive Eyes
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.ellipse(-8, -17, 6, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(8, -17, 6, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // White Pupil Highlights (Cute Look)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6, -19, 2.5, 0, Math.PI * 2);
            ctx.arc(10, -19, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Pink Nose & Whiskers
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath(); ctx.arc(0, -11, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-9, -10); ctx.lineTo(-26, -14);
            ctx.moveTo(-9, -8); ctx.lineTo(-27, -7);
            ctx.moveTo(9, -10); ctx.lineTo(26, -14);
            ctx.moveTo(9, -8); ctx.lineTo(27, -7);
            ctx.stroke();

            // Goalkeeper Gloves (Black & Gold Trim)
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;

            ctx.beginPath(); ctx.arc(-28, 5, 9.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(28, 5, 9.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.restore();
        }

        // Draw 3D Realistic Football
        function drawBall(x, y, scale, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.scale(scale, scale);

            const r = 15;

            // Ball Ground Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(0, r + 4, r * scale, (r * 0.35) * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Sphere Gradient
            let ballGrad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r);
            ballGrad.addColorStop(0, '#ffffff');
            ballGrad.addColorStop(0.75, '#cbd5e1');
            ballGrad.addColorStop(1, '#64748b');

            ctx.fillStyle = ballGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Football Pentagons
            ctx.fillStyle = '#0f172a';
            drawPentagon(0, 0, 5);
            for (let i = 0; i < 5; i++) {
                let ang = (i * Math.PI * 2 / 5);
                drawPentagon(Math.cos(ang) * 10, Math.sin(ang) * 10, 3.5);
            }

            ctx.restore();
        }

        function drawPentagon(x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                let angle = (i * Math.PI * 2 / 5) - Math.PI / 2;
                let px = x + Math.cos(angle) * radius;
                let py = y + Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
        }

        function renderField() {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            const cx = width / 2;
            const cy = height * 0.62;

            ctx.clearRect(0, 0, width, height);

            drawStadiumBackground(cx, cy);
            drawPitch(cx, cy);
            drawGoal(cx, cy);

            // Render Keeper Farfoosh
            drawFarfoosh(cx + keeper.x, cy + keeper.y, keeper.angle);

            // Render Ball
            drawBall(cx + ball.x, cy + ball.y, ball.scale, ball.rotation);

            // Render Particle Effects
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // Idle Animation Loop
        let idleTimer = 0;
        function animate() {
            if (!isAnimating) {
                idleTimer += 0.04;
                keeper.x = Math.sin(idleTimer) * 18;
                keeper.y = -35 + Math.cos(idleTimer * 2) * 2;
            }
            renderField();
            requestAnimationFrame(animate);
        }
        animate();

        // Database & API Logic
        async function fetchUserData() {
            try {
                let res = await fetch(`/api/user/get?user_id=${userId}`);
                let data = await res.json();
                if (data.success) {
                    userBalance = data.balance;
                    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                }
            } catch(e) { console.error(e); }
        }
        fetchUserData();

        function setAim(e, aim) {
            if (isAnimating) return;
            selectedAim = aim;
            document.querySelectorAll('.aim-btn').forEach(btn => btn.classList.remove('selected'));
            e.target.classList.add('selected');
        }

        function changeBet(delta) {
            if (isAnimating) return;
            currentBet = Math.min(1000, Math.max(5, currentBet + delta));
            document.getElementById('betAmount').innerText = currentBet;
        }

        async function playGame() {
            if (isAnimating) return;
            if (userBalance < currentBet) {
                alert("رصيدك غير كافٍ للعب!");
                return;
            }

            isAnimating = true;
            document.getElementById('shootBtn').disabled = true;
            document.getElementById('resultModal').classList.remove('show');

            try {
                // Isolated Round API Request
                let res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: 'penalty',
                        bet_amount: currentBet
                    })
                });
                let data = await res.json();

                if (!data.success) {
                    alert(data.message || "حدث خطأ أثناء اللعب");
                    isAnimating = false;
                    document.getElementById('shootBtn').disabled = false;
                    return;
                }

                // Balance updated from API verdict
                userBalance = data.new_balance;
                document.getElementById('userBalance').innerText = userBalance.toFixed(2);

                const isWin = data.win_amount > 0;
                const targetPos = aimCoords[selectedAim];

                AudioFX.playKick();

                // Keeper Outcome Mapping
                if (isWin) {
                    // WIN: Ball enters goal, Farfoosh dives WRONG direction
                    keeper.targetX = -targetPos.x * 0.85;
                    keeper.targetY = targetPos.y - 10;
                    keeper.targetAngle = (keeper.targetX > 0) ? 0.6 : -0.6;
                } else {
                    // LOSS: Farfoosh SAVES the ball completely
                    keeper.targetX = targetPos.x;
                    keeper.targetY = targetPos.y;
                    keeper.targetAngle = (keeper.targetX > 0) ? 0.75 : -0.75;
                }

                let startTime = performance.now();
                const duration = 650;

                function animateShot(now) {
                    let elapsed = now - startTime;
                    let progress = Math.min(elapsed / duration, 1);

                    // Ball Trajectory
                    ball.x = targetPos.x * progress;
                    let startY = 140;
                    let arcY = Math.sin(progress * Math.PI) * -30;
                    ball.y = startY + (targetPos.y - startY) * progress + arcY;
                    ball.scale = 1 - (progress * 0.48);
                    ball.rotation += 0.28;

                    // Keeper Dive Animation
                    keeper.x += (keeper.targetX - keeper.x) * 0.15;
                    keeper.y += (keeper.targetY - keeper.y) * 0.15;
                    keeper.angle += (keeper.targetAngle - keeper.angle) * 0.15;

                    if (progress < 1) {
                        requestAnimationFrame(animateShot);
                    } else {
                        const cx = canvas.parentElement.clientWidth / 2;
                        const cy = canvas.parentElement.clientHeight * 0.62;

                        if (isWin) {
                            AudioFX.playGoal();
                            addParticles(cx + ball.x, cy + ball.y, '#f59e0b', 35);
                            showModal("هدف! 🎉", `ربحت ${data.win_amount} NPS`, "win");
                        } else {
                            AudioFX.playSave();
                            addParticles(cx + keeper.x, cy + keeper.y, '#ef4444', 25);
                            showModal("تصدي رائع! ❌", "تصدر الحارس فرفوش للكرة", "loss");
                        }

                        setTimeout(resetRound, 2200);
                    }
                }

                requestAnimationFrame(animateShot);

            } catch(e) {
                console.error(e);
                isAnimating = false;
                document.getElementById('shootBtn').disabled = false;
            }
        }

        function showModal(title, sub, type) {
            const modal = document.getElementById('resultModal');
            const mTitle = document.getElementById('modalTitle');
            const mSub = document.getElementById('modalSub');

            mTitle.innerText = title;
            mTitle.className = `modal-title ${type}`;
            mSub.innerText = sub;
            modal.classList.add('show');
        }

        function resetRound() {
            ball = { x: 0, y: 140, scale: 1, rotation: 0 };
            keeper = { x: 0, y: -35, targetX: 0, targetY: -35, angle: 0, targetAngle: 0 };
            document.getElementById('resultModal').classList.remove('show');
            document.getElementById('shootBtn').disabled = false;
            isAnimating = false;
        }
    </script>
</body>
</html>
