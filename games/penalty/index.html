<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ضربات جزاء - فرفوش HD VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #030712;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Glassmorphic Header */
        .header {
            width: 100%;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 10;
            flex-shrink: 0;
        }
        .balance-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 5px 12px;
            border-radius: 16px;
            border: 1.5px solid #f59e0b;
            font-weight: 800;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
            font-size: 0.9rem;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        /* Responsive Canvas Game Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Responsive Controls Dashboard */
        .controls {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(180deg, #0f172a 0%, #030712 100%);
            padding: 10px 14px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-top: 2px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            flex-shrink: 0;
        }

        .target-hint {
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .aim-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .aim-btn {
            background: #1e293b;
            border: 1.5px solid rgba(255,255,255,0.08);
            color: #cbd5e1;
            padding: 6px 2px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }
        .aim-btn.selected {
            border-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(251, 191, 36, 0.08));
            color: #fbbf24;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
            transform: scale(1.02);
        }

        /* Bet Dashboard */
        .bet-dashboard {
            background: #090d16;
            padding: 6px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .bet-presets {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }
        .preset-btn {
            flex: 1;
            background: #1e293b;
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            padding: 4px 0;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.1s;
        }
        .preset-btn:active { transform: scale(0.95); background: #f59e0b; color: #000; }

        .bet-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-step {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s;
        }
        .btn-step:active { transform: scale(0.92); }
        .bet-display { text-align: center; }
        .bet-amount {
            font-size: 1.15rem;
            font-weight: 900;
            color: #f8fafc;
        }
        .bet-payout {
            font-size: 0.7rem;
            color: #22c55e;
            font-weight: 800;
        }

        /* Main Shoot Button */
        .shoot-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #090d16;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 26px rgba(245, 158, 11, 0.8); }
            100% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
        }
        .shoot-btn:active { transform: scale(0.97); }
        .shoot-btn:disabled {
            background: #334155;
            box-shadow: none;
            color: #64748b;
            cursor: not-allowed;
            animation: none;
        }

        /* Modal Overlay Result */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 23, 42, 0.96);
            border: 2px solid #f59e0b;
            padding: 20px 28px;
            border-radius: 20px;
            text-align: center;
            transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 40px rgba(0,0,0,0.95);
            width: 82%;
            max-width: 320px;
        }
        .modal.show { transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        .modal-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
        .win { color: #22c55e; text-shadow: 0 0 15px rgba(34, 197, 94, 0.6); }
        .loss { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
        .multiplier-tag {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-top: 6px;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">⚽ ضربات جزاء VIP</div>
        <div class="balance-box">
            <span id="userBalance">0.00</span>
            <small>NPS</small>
        </div>
    </div>

    <div class="game-container" id="gameWindow">
        <canvas id="gameCanvas"></canvas>
        <div class="modal" id="resultModal">
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalSub" style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 6px;"></div>
            <div id="modalBadge" class="multiplier-tag">مضاعفة 2x 🔥</div>
        </div>
    </div>

    <div class="controls">
        <div class="target-hint">🎯 اختر زاوية التسديد المفضلة:</div>
        <div class="aim-grid">
            <button class="aim-btn" onclick="setAim(event, 'top-left')">يسار علوي</button>
            <button class="aim-btn selected" onclick="setAim(event, 'center')">الوسط</button>
            <button class="aim-btn" onclick="setAim(event, 'top-right')">يمين علوي</button>
            <button class="aim-btn" onclick="setAim(event, 'bottom-left')">يسار سفلي</button>
            <button class="aim-btn" onclick="setAim(event, 'bottom-center')">أسفل الوسط</button>
            <button class="aim-btn" onclick="setAim(event, 'bottom-right')">يمين سفلي</button>
        </div>

        <div class="bet-dashboard">
            <div class="bet-presets">
                <button class="preset-btn" onclick="setBet(5)">5</button>
                <button class="preset-btn" onclick="setBet(10)">10</button>
                <button class="preset-btn" onclick="setBet(25)">25</button>
                <button class="preset-btn" onclick="setBet(50)">50</button>
                <button class="preset-btn" onclick="setBet('MAX')">المكس</button>
            </div>
            <div class="bet-selector">
                <button class="btn-step" onclick="changeBet(-5)">-</button>
                <div class="bet-display">
                    <div class="bet-amount"><span id="betAmount">5</span> NPS</div>
                    <div class="bet-payout">الربح المتوقع: <span id="payoutAmount">10.00</span> NPS (2x)</div>
                </div>
                <button class="btn-step" onclick="changeBet(5)">+</button>
            </div>
        </div>

        <button class="shoot-btn" id="shootBtn" onclick="playGame()">
            <span>سدد الآن 🚀</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = new URLSearchParams(window.location.search).get('user_id') || 
                     tg?.initDataUnsafe?.user?.id || 123456;

        let currentBet = 5;
        let userBalance = 0;
        let selectedAim = 'center';
        let isAnimating = false;
        let cameraShake = 0;

        const aimCoords = {
            'top-left': { x: -115, y: -85 },
            'center': { x: 0, y: -50 },
            'top-right': { x: 115, y: -85 },
            'bottom-left': { x: -115, y: -5 },
            'bottom-center': { x: 0, y: 5 },
            'bottom-right': { x: 115, y: -5 }
        };

        // Audio Engine
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playWhistle() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1800, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            },
            playKick() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            },
            playGoal() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(840, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            },
            playSave() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }
        };

        // Render Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let stadiumFlashes = [];

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 50);

        let ball = { x: 0, y: 140, scale: 1, rotation: 0 };
        let keeper = { x: 0, y: -35, targetX: 0, targetY: -35, angle: 0, targetAngle: 0 };
        let netBulge = 0;

        function addParticles(x, y, color, count = 25, isSparkle = false) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * (isSparkle ? 12 : 8),
                    vy: (Math.random() - 0.5) * (isSparkle ? 12 : 8),
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2,
                    sparkle: isSparkle
                });
            }
        }

        for (let i = 0; i < 35; i++) {
            stadiumFlashes.push({
                x: Math.random(),
                y: Math.random() * 0.3,
                brightness: Math.random(),
                speed: 0.02 + Math.random() * 0.05
            });
        }

        function drawStadiumBackground(cx, cy) {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;

            let skyGrad = ctx.createLinearGradient(0, 0, 0, cy - 80);
            skyGrad.addColorStop(0, '#020617');
            skyGrad.addColorStop(0.6, '#0f172a');
            skyGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, cy - 80);

            stadiumFlashes.forEach(f => {
                f.brightness += f.speed;
                if (f.brightness > 1 || f.brightness < 0) f.speed = -f.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(f.brightness)) * 0.6})`;
                ctx.beginPath();
                ctx.arc(f.x * width, f.y * (cy - 100), 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            drawSpotlight(width * 0.15, 10, 160, 'rgba(251, 191, 36, 0.28)');
            drawSpotlight(width * 0.85, 10, 160, 'rgba(251, 191, 36, 0.28)');
            drawSpotlight(width * 0.5, 0, 200, 'rgba(56, 189, 248, 0.18)');

            const adY = cy - 110;
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, adY, width, 24);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(0, adY, width, 24);

            ctx.fillStyle = '#fbbf24';
            ctx.font = '900 11px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('⚽ FARFOOSH LEAGUE ⚽ WIN 2X NPS ⚽ FARFOOSH LEAGUE ⚽ WIN 2X NPS ⚽', width / 2, adY + 16);
        }

        function drawSpotlight(x, y, radius, color) {
            let grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
            grad.addColorStop(0, color);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPitch(cx, cy) {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;

            const pitchTop = cy - 86;
            const pitchHeight = height - pitchTop;
            const strips = 10;

            for (let i = 0; i < strips; i++) {
                let y1 = pitchTop + (i / strips) * pitchHeight;
                let y2 = pitchTop + ((i + 1) / strips) * pitchHeight;
                ctx.fillStyle = (i % 2 === 0) ? '#15803d' : '#166534';
                ctx.beginPath();
                ctx.moveTo(0, y1); ctx.lineTo(width, y1); ctx.lineTo(width, y2); ctx.lineTo(0, y2);
                ctx.fill();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 3;

            const boxTopWidth = 270;
            const boxBottomWidth = 370;
            ctx.beginPath();
            ctx.moveTo(cx - boxTopWidth / 2, pitchTop);
            ctx.lineTo(cx + boxTopWidth / 2, pitchTop);
            ctx.lineTo(cx + boxBottomWidth / 2, pitchTop + 135);
            ctx.lineTo(cx - boxBottomWidth / 2, pitchTop + 135);
            ctx.closePath();
            ctx.stroke();

            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(cx - 160, pitchTop);
            ctx.lineTo(cx + 160, pitchTop);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, cy + 140, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGoal(cx, cy) {
            const gx = cx - 145;
            const gy = cy - 135;
            const gw = 290;
            const gh = 125;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fillRect(gx + 10, gy - 10, gw - 20, gh);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;

            for (let x = gx; x <= gx + gw; x += 11) {
                ctx.beginPath();
                ctx.moveTo(x, gy);
                ctx.lineTo(x + (netBulge * 0.2), gy + gh);
                ctx.stroke();
            }
            for (let y = gy; y <= gy + gh; y += 9) {
                ctx.beginPath();
                ctx.moveTo(gx, y);
                ctx.lineTo(gx + gw, y + (netBulge * 0.1));
                ctx.stroke();
            }

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.moveTo(gx, gy + gh);
            ctx.lineTo(gx, gy);
            ctx.lineTo(gx + gw, gy);
            ctx.lineTo(gx + gw, gy + gh);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 🎨 HIGH QUALITY GOALKEEPER CAT ("FARFOOSH 3D/HD")
        function drawFarfoosh(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Ground Shadow
            let shadowGrad = ctx.createRadialGradient(0, 38, 5, 0, 38, 28);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0.6)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.ellipse(0, 38, 28, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body & Pro Jersey
            let jerseyGrad = ctx.createLinearGradient(-24, -10, 24, 34);
            jerseyGrad.addColorStop(0, '#fef08a');
            jerseyGrad.addColorStop(0.3, '#f59e0b');
            jerseyGrad.addColorStop(1, '#b45309');
            ctx.fillStyle = jerseyGrad;
            ctx.beginPath();
            ctx.roundRect(-24, -6, 48, 42, 16);
            ctx.fill();

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Collar & Stripes
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(-10, -6); ctx.lineTo(0, 6); ctx.lineTo(10, -6);
            ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 10px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('1', 0, 22);

            // Cat Head Fur & Shape
            let headGrad = ctx.createRadialGradient(-4, -20, 2, 0, -18, 25);
            headGrad.addColorStop(0, '#ffffff');
            headGrad.addColorStop(0.65, '#cbd5e1');
            headGrad.addColorStop(1, '#64748b');

            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(0, -18, 24, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Fluffy Cheeks
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(-14, -10, 9, 0, Math.PI * 2);
            ctx.arc(14, -10, 9, 0, Math.PI * 2);
            ctx.fill();

            // Detailed Ears
            ctx.fillStyle = '#475569';
            ctx.beginPath(); ctx.moveTo(-13, -32); ctx.lineTo(-28, -50); ctx.lineTo(-5, -38); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fb7185';
            ctx.beginPath(); ctx.moveTo(-12, -34); ctx.lineTo(-23, -46); ctx.lineTo(-6, -37); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#475569';
            ctx.beginPath(); ctx.moveTo(13, -32); ctx.lineTo(28, -50); ctx.lineTo(5, -38); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fb7185';
            ctx.beginPath(); ctx.moveTo(12, -34); ctx.lineTo(23, -46); ctx.lineTo(6, -37); ctx.closePath(); ctx.fill();

            // Golden VIP Crown
            ctx.fillStyle = 'radial-gradient(circle, #fde047 0%, #d97706 100%)';
            ctx.beginPath();
            ctx.moveTo(-12, -40);
            ctx.lineTo(-16, -55);
            ctx.lineTo(-7, -46);
            ctx.lineTo(0, -58);
            ctx.lineTo(7, -46);
            ctx.lineTo(16, -55);
            ctx.lineTo(12, -40);
            ctx.closePath();
            ctx.fillStyle = '#fbbf24';
            ctx.fill();
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Crown Jewels
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(0, -48, 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath(); ctx.arc(-10, -45, 1.5, 0, Math.PI * 2); ctx.arc(10, -45, 1.5, 0, Math.PI * 2); ctx.fill();

            // Big Anime Cat Eyes
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.ellipse(-8, -19, 7, 8.5, 0, 0, Math.PI * 2);
            ctx.ellipse(8, -19, 7, 8.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Iris Sparkles
            let eyeIrisGrad = ctx.createLinearGradient(0, -25, 0, -11);
            eyeIrisGrad.addColorStop(0, '#f59e0b');
            eyeIrisGrad.addColorStop(1, '#fbbf24');
            ctx.fillStyle = eyeIrisGrad;
            ctx.beginPath();
            ctx.ellipse(-8, -18, 4.5, 6, 0, 0, Math.PI * 2);
            ctx.ellipse(8, -18, 4.5, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-8, -18, 2, 4.5, 0, 0, Math.PI * 2);
            ctx.ellipse(8, -18, 2, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Eye Glare
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6, -22, 2.5, 0, Math.PI * 2);
            ctx.arc(10, -22, 2.5, 0, Math.PI * 2);
            ctx.arc(-9, -15, 1, 0, Math.PI * 2);
            ctx.arc(7, -15, 1, 0, Math.PI * 2);
            ctx.fill();

            // Nose & Mouth
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath(); ctx.ellipse(0, -11, 2.5, 1.8, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-2.5, -8, 2.5, 0.2, Math.PI * 0.8);
            ctx.arc(2.5, -8, 2.5, 0.2, Math.PI * 0.8);
            ctx.stroke();

            // Cute Whiskers
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-14, -11); ctx.lineTo(-29, -15);
            ctx.moveTo(-14, -8); ctx.lineTo(-31, -7);
            ctx.moveTo(14, -11); ctx.lineTo(29, -15);
            ctx.moveTo(14, -8); ctx.lineTo(31, -7);
            ctx.stroke();

            // Pro Goalkeeper Gloves
            let gloveGrad = ctx.createRadialGradient(-30, 4, 2, -30, 4, 10);
            gloveGrad.addColorStop(0, '#38bdf8');
            gloveGrad.addColorStop(1, '#0284c7');

            ctx.fillStyle = gloveGrad;
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(-30, 4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(30, 4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.restore();
        }

        // Draw 3D Football
        function drawBall(x, y, scale, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.scale(scale, scale);

            const r = 15;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(0, r + 4, r * scale, (r * 0.35) * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            let ballGrad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r);
            ballGrad.addColorStop(0, '#ffffff');
            ballGrad.addColorStop(0.75, '#cbd5e1');
            ballGrad.addColorStop(1, '#475569');

            ctx.fillStyle = ballGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            drawPentagon(0, 0, 5);
            for (let i = 0; i < 5; i++) {
                let ang = (i * Math.PI * 2 / 5);
                drawPentagon(Math.cos(ang) * 10, Math.sin(ang) * 10, 3.5);
            }

            ctx.restore();
        }

        function drawPentagon(x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                let angle = (i * Math.PI * 2 / 5) - Math.PI / 2;
                let px = x + Math.cos(angle) * radius;
                let py = y + Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
        }

        function renderField() {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            const cx = width / 2;
            const cy = height * 0.62;

            ctx.save();

            if (cameraShake > 0) {
                ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
                cameraShake *= 0.88;
                if (cameraShake < 0.2) cameraShake = 0;
            }

            ctx.clearRect(0, 0, width, height);

            drawStadiumBackground(cx, cy);
            drawPitch(cx, cy);
            drawGoal(cx, cy);

            drawFarfoosh(cx + keeper.x, cy + keeper.y, keeper.angle);
            drawBall(cx + ball.x, cy + ball.y, ball.scale, ball.rotation);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            if (netBulge > 0) netBulge *= 0.9;

            ctx.restore();
        }

        let idleTimer = 0;
        function animate() {
            if (!isAnimating) {
                idleTimer += 0.04;
                keeper.x = Math.sin(idleTimer) * 18;
                keeper.y = -35 + Math.cos(idleTimer * 2) * 2;
            }
            renderField();
            requestAnimationFrame(animate);
        }
        animate();

        // API User Data Fetching (Exact Logic Kept)
        async function fetchUserData() {
            try {
                let res = await fetch(`/api/user/get?user_id=${userId}`);
                let data = await res.json();
                if (data.success) {
                    userBalance = data.balance;
                    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                }
            } catch(e) { console.error(e); }
        }
        fetchUserData();

        function setAim(e, aim) {
            if (isAnimating) return;
            selectedAim = aim;
            document.querySelectorAll('.aim-btn').forEach(btn => btn.classList.remove('selected'));
            e.target.classList.add('selected');
        }

        function updatePayoutDisplay() {
            document.getElementById('betAmount').innerText = currentBet;
            document.getElementById('payoutAmount').innerText = (currentBet * 2).toFixed(2);
        }

        function changeBet(delta) {
            if (isAnimating) return;
            currentBet = Math.min(1000, Math.max(5, currentBet + delta));
            updatePayoutDisplay();
        }

        function setBet(amount) {
            if (isAnimating) return;
            if (amount === 'MAX') {
                currentBet = Math.max(5, Math.floor(userBalance));
            } else {
                currentBet = amount;
            }
            updatePayoutDisplay();
        }

        // Gameplay Main Function (Preserving API & Database logic)
        async function playGame() {
            if (isAnimating) return;
            if (userBalance < currentBet) {
                alert("رصيدك غير كافٍ للعب بهذه القيمة!");
                return;
            }

            isAnimating = true;
            document.getElementById('shootBtn').disabled = true;
            document.getElementById('resultModal').classList.remove('show');

            AudioFX.playWhistle();

            try {
                let res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: 'penalty',
                        bet_amount: currentBet
                    })
                });
                let data = await res.json();

                if (!data.success) {
                    alert(data.message || "حدث خطأ أثناء الاتصال بالخادم");
                    isAnimating = false;
                    document.getElementById('shootBtn').disabled = false;
                    return;
                }

                userBalance = data.new_balance;
                document.getElementById('userBalance').innerText = userBalance.toFixed(2);

                const isWin = data.win_amount > 0;
                const targetPos = aimCoords[selectedAim];

                AudioFX.playKick();

                if (isWin) {
                    keeper.targetX = -targetPos.x * 0.85;
                    keeper.targetY = targetPos.y - 10;
                    keeper.targetAngle = (keeper.targetX > 0) ? 0.6 : -0.6;
                } else {
                    keeper.targetX = targetPos.x;
                    keeper.targetY = targetPos.y;
                    keeper.targetAngle = (keeper.targetX > 0) ? 0.75 : -0.75;
                }

                let startTime = performance.now();
                const duration = 620;

                function animateShot(now) {
                    let elapsed = now - startTime;
                    let progress = Math.min(elapsed / duration, 1);

                    ball.x = targetPos.x * progress;
                    let startY = 140;
                    let arcY = Math.sin(progress * Math.PI) * -35;
                    ball.y = startY + (targetPos.y - startY) * progress + arcY;
                    ball.scale = 1 - (progress * 0.48);
                    ball.rotation += 0.3;

                    keeper.x += (keeper.targetX - keeper.x) * 0.16;
                    keeper.y += (keeper.targetY - keeper.y) * 0.16;
                    keeper.angle += (keeper.targetAngle - keeper.angle) * 0.16;

                    if (progress < 1) {
                        requestAnimationFrame(animateShot);
                    } else {
                        const cx = canvas.parentElement.clientWidth / 2;
                        const cy = canvas.parentElement.clientHeight * 0.62;

                        if (isWin) {
                            AudioFX.playGoal();
                            cameraShake = 12;
                            netBulge = 30;
                            addParticles(cx + ball.x, cy + ball.y, '#f59e0b', 40, true);
                            showModal("هدف رائع! 🎉", `ربحت ${data.win_amount} NPS`, "win");
                        } else {
                            AudioFX.playSave();
                            cameraShake = 6;
                            addParticles(cx + keeper.x, cy + keeper.y, '#ef4444', 30);
                            showModal("تصدي حاسم! ❌", "تصدر الحارس فرفوش للكرة ببراعة", "loss");
                        }

                        setTimeout(resetRound, 2400);
                    }
                }

                requestAnimationFrame(animateShot);

            } catch(e) {
                console.error(e);
                isAnimating = false;
                document.getElementById('shootBtn').disabled = false;
            }
        }

        function showModal(title, sub, type) {
            const modal = document.getElementById('resultModal');
            const mTitle = document.getElementById('modalTitle');
            const mSub = document.getElementById('modalSub');

            mTitle.innerText = title;
            mTitle.className = `modal-title ${type}`;
            mSub.innerText = sub;
            modal.classList.add('show');
        }

        function resetRound() {
            ball = { x: 0, y: 140, scale: 1, rotation: 0 };
            keeper = { x: 0, y: -35, targetX: 0, targetY: -35, angle: 0, targetAngle: 0 };
            document.getElementById('resultModal').classList.remove('show');
            document.getElementById('shootBtn').disabled = false;
            isAnimating = false;
        }
    </script>
</body>
</html>
