<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 لعبة السلوتس الملكية | GOLDEN GAME VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-light: #fff5c0;
            --gold-bright: #ffd700;
            --gold-mid: #dfa837;
            --gold-dark: #7a4e05;
            --bg-burgundy: #1a0006;
            --card-bg: #0f0003;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #420512 0%, #120004 70%, #050001 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 215, 0, 0.12) 1.5px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
        }

        /* 🎈 احتفالية البالونات */
        .balloon-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 52px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.95;
            animation: floatUp 3.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 14px;
            background: rgba(255, 255, 255, 0.8);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
        }

        /* ------------------ Header ------------------ */
        .header {
            background: linear-gradient(180deg, rgba(25, 1, 6, 0.98) 0%, rgba(8, 0, 2, 0.95) 100%);
            border-bottom: 2px solid var(--gold-mid);
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.9);
            z-index: 50;
        }

        .jackpot-container {
            background: linear-gradient(135deg, #4a3002 0%, #b88214 50%, #291a00 100%);
            border: 2px solid var(--gold-bright);
            border-radius: 20px;
            padding: 4px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 6px;
        }

        .jackpot-title {
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: 900;
        }

        .jackpot-amount {
            color: #fff;
            font-size: 1.35rem;
            font-weight: 900;
            text-shadow: 0 0 12px var(--gold-bright);
        }

        .user-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-badge {
            background: rgba(0,0,0,0.65);
            border: 1px solid var(--gold-mid);
            padding: 4px 14px;
            border-radius: 14px;
            color: var(--gold-bright);
            font-weight: 900;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ------------------ Slot Machine Area ------------------ */
        .slot-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        .slot-frame {
            position: relative;
            background: linear-gradient(145deg, #ffd700, #593e0b, #d4af37, #1a1001);
            padding: 14px;
            border-radius: 35px;
            box-shadow: 0 12px 45px rgba(0,0,0,0.95), inset 0 0 20px rgba(255,240,180,0.8);
            border: 3px solid var(--gold-light);
            width: 100%;
            max-width: 390px;
            transition: transform 0.2s;
        }

        .slot-frame.shake {
            animation: frameShake 0.4s ease-in-out;
        }

        @keyframes frameShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px) rotate(-1deg); }
            40% { transform: translateX(6px) rotate(1deg); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .slot-housing {
            background: #000;
            border-radius: 22px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            border: 2px solid var(--gold-mid);
            box-shadow: inset 0 0 25px #000;
            position: relative;
        }

        .reel-window {
            flex: 1;
            height: 125px;
            background: linear-gradient(180deg, #0d0d0d 0%, #ffffff 48%, #ffffff 52%, #0d0d0d 100%);
            border-radius: 14px;
            border: 3px solid #8c6827;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 14px 18px rgba(0,0,0,0.9), inset 0 -14px 18px rgba(0,0,0,0.9);
        }

        .reel-window.teaser-glow {
            border-color: #ff0055;
            box-shadow: 0 0 15px #ff0055, inset 0 14px 18px rgba(0,0,0,0.9);
        }

        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reel-symbol {
            height: 125px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3.3rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        /* 🌟 الرمز الملكي 7️⃣ */
        .seven-symbol {
            font-size: 3.6rem;
            font-weight: 900;
            background: linear-gradient(180deg, #fff275 0%, #ff9800 45%, #e60000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.95));
            animation: pulse7 1.2s infinite alternate ease-in-out;
        }

        @keyframes pulse7 {
            0% { transform: scale(0.94); }
            100% { transform: scale(1.08); }
        }

        /* 🌟 شجرة الجوكر والمضاعفات */
        .tree-symbol {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .tree-symbol .tree-icon {
            font-size: 2.8rem;
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 1)) drop-shadow(0 0 25px rgba(255, 180, 0, 0.9));
            animation: treeGlow 1.1s infinite alternate ease-in-out;
        }

        @keyframes treeGlow {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.1); }
        }

        .tree-symbol .tree-badge {
            font-size: 0.85rem;
            background: linear-gradient(135deg, #ffffff 0%, #ffd700 50%, #b8860b 100%);
            color: #000;
            font-weight: 900;
            padding: 2px 12px;
            border-radius: 12px;
            margin-top: 2px;
            border: 1.5px solid #fff;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.9);
            position: relative;
            overflow: hidden;
        }

        .tree-symbol .tree-badge::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255,255,255,0.9) 50%, transparent 70%);
            transform: rotate(25deg);
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(25deg); }
            100% { transform: translateX(100%) rotate(25deg); }
        }

        .golden-banner {
            margin-top: 12px;
            background: linear-gradient(180deg, #ffe082 0%, #cfa138 50%, #7a540c 100%);
            border: 2px solid var(--gold-light);
            border-radius: 12px;
            padding: 6px 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .golden-banner h2 {
            color: #2b020a;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
        }

        .golden-banner span {
            display: block;
            color: #000;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .blur { filter: blur(7px); }

        .status-msg {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 900;
            min-height: 28px;
            text-align: center;
            text-shadow: 0 2px 4px #000;
        }

        /* ------------------ Control Panel ------------------ */
        .controls-panel {
            background: var(--card-bg);
            border-top: 2px solid var(--gold-mid);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bet-selector {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 14px;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #ccc;
        }

        .bet-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .btn-bet {
            background: #2a0810;
            border: 1px solid #541926;
            color: #fff;
            padding: 8px 0;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-bet.active {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-mid));
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .page-nav {
            background: #44101c;
            color: var(--gold-bright);
            border: 1px solid var(--gold-mid);
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .action-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-speed {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--gold-mid);
            color: var(--gold-bright);
            padding: 12px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-width: 90px;
        }

        .btn-speed.fast {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: #fff;
            border-color: var(--gold-bright);
            box-shadow: 0 0 12px rgba(230, 126, 34, 0.7);
        }

        .btn-spin {
            flex: 1;
            background: linear-gradient(180deg, #ffe082 0%, #db9d24 50%, #8c5a08 100%);
            color: #000;
            font-weight: 900;
            border: 2px solid var(--gold-light);
            padding: 12px;
            border-radius: 16px;
            font-size: 1.35rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-spin:active { transform: scale(0.97); }
        .btn-spin:disabled { opacity: 0.5; filter: grayscale(0.8); }

        /* 🏆 نافذة الربح الضخم (Big Win Modal) */
        .win-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .win-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .win-box {
            background: linear-gradient(135deg, #3d000c, #1a0005);
            border: 3px solid var(--gold-bright);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,215,0,0.8);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
            width: 90%;
        }

        .win-modal.active .win-box {
            transform: scale(1);
        }

        .win-box h3 {
            font-size: 1.8rem;
            color: var(--gold-bright);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--gold-mid);
        }

        .win-amount-num {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            margin: 15px 0;
            text-shadow: 0 0 20px var(--gold-bright);
        }

        .btn-close-win {
            background: linear-gradient(180deg, #ffd700, #b8860b);
            border: none;
            color: #000;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 🎈 احتفالية الفوز -->
    <div class="balloon-container" id="balloonContainer"></div>

    <!-- 🏆 نافذة الربح الأسطوري -->
    <div class="win-modal" id="winModal">
        <div class="win-box">
            <h3 id="winTitle">فوز أسطوري! 🎉</h3>
            <div class="win-amount-num" id="winModalAmount">0.00</div>
            <button class="btn-close-win" onclick="closeWinModal()">متابعة اللعب 🚀</button>
        </div>
    </div>

    <!-- 🏆 Header -->
    <header class="header">
        <div class="jackpot-container">
            <i class="fa-solid fa-trophy" style="color: var(--gold-light);"></i>
            <span class="jackpot-title">الجاكبوت الملكي:</span>
            <span class="jackpot-amount" id="jackpotCounter">1,250,000</span>
            <span style="font-size:0.75rem; color: var(--gold-light);">NPS</span>
        </div>

        <div class="user-bar">
            <div class="balance-badge">
                <i class="fa-solid fa-coins"></i>
                <span id="userBalance">0.00</span> NPS
            </div>
            <div style="font-size: 0.85rem; color: #ddd; font-weight: 700;">
                الرهان: <span id="currentBetLbl" style="color: var(--gold-bright);">3</span> NPS
            </div>
        </div>
    </header>

    <!-- 🎰 Slot Machine -->
    <div class="slot-container">
        <div class="slot-frame" id="slotFrame">
            <div class="slot-housing">
                <div class="reel-window" id="reelWin1"><div class="reel-strip" id="reel1"></div></div>
                <div class="reel-window" id="reelWin2"><div class="reel-strip" id="reel2"></div></div>
                <div class="reel-window" id="reelWin3"><div class="reel-strip" id="reel3"></div></div>
            </div>

            <div class="golden-banner">
                <h2>لعبة السلوتس الملكية</h2>
                <span>GOLDEN GAME VIP</span>
            </div>
        </div>

        <div class="status-msg" id="statusMessage">اختر الرهان واضغط دوران للبدء!</div>
    </div>

    <!-- 🎮 Control Panel -->
    <div class="controls-panel">
        <div class="bet-selector">
            <div class="bet-header">
                <span>خيارات الرهان السريع (NPS):</span>
                <div>
                    <button class="page-nav" id="prevPageBtn" onclick="changeBetPage(-1)">❮</button>
                    <span id="pageIndicator" style="margin: 0 4px; color: #fff;">1</span>
                    <button class="page-nav" onclick="changeBetPage(1)">❯</button>
                </div>
            </div>
            <div class="bet-grid" id="betButtonsContainer"></div>
        </div>

        <div class="action-row">
            <button class="btn-speed" id="speedBtn" onclick="toggleSpeed()">
                <i class="fa-solid fa-bolt" id="speedIcon"></i>
                <span id="speedTxt">سرعة: عادية</span>
            </button>
            <button class="btn-spin" id="spinBtn" onclick="spin()">
                <i class="fa-solid fa-rotate-right"></i> دوران 🚀
            </button>
        </div>
    </div>

    <script>
        // ------------------ Web Audio API Engine ------------------
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.03);
            } catch(e) {}
        }

        function playStopSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playImpactSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(90, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

        function playWinSound() {
            try {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                        osc.stop(audioCtx.currentTime + 0.35);
                    }, idx * 80);
                });
            } catch(e) {}
        }

        // ------------------ State & Params ------------------
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || '1000';

        let userBalance = 0.0;
        let selectedBet = 3;
        let currentBetPage = 1;
        let isFastSpeed = false;

        const baseFruits = ['🍊', '🍋', '🍒', '🍉', '🍇', '🔔'];

        // ------------------ Jackpot Counter ------------------
        function initJackpot() {
            let storedVal = parseFloat(localStorage.getItem('royal_slot_jackpot_val')) || 1250000;
            const counterEl = document.getElementById('jackpotCounter');

            setInterval(() => {
                storedVal += Math.floor(Math.random() * 12) + 2;
                localStorage.setItem('royal_slot_jackpot_val', storedVal);
                counterEl.innerText = Math.floor(storedVal).toLocaleString('en-US');
            }, 400);
        }

        // ------------------ Speed Toggle ------------------
        function toggleSpeed() {
            playClickSound();
            isFastSpeed = !isFastSpeed;
            const speedBtn = document.getElementById('speedBtn');
            const speedTxt = document.getElementById('speedTxt');
            const speedIcon = document.getElementById('speedIcon');

            if (isFastSpeed) {
                speedBtn.classList.add('fast');
                speedTxt.innerText = 'سرعة: فائقة';
                speedIcon.className = 'fa-solid fa-bolt-lightning';
            } else {
                speedBtn.classList.remove('fast');
                speedTxt.innerText = 'سرعة: عادية';
                speedIcon.className = 'fa-solid fa-bolt';
            }
        }

        // ------------------ Bet Quick Selector ------------------
        function getBetsForPage(page) {
            if (page === 1) return [1, 3, 5, 10, 25];
            if (page === 2) return [50, 100, 200, 300, 500];
            return [1000, 2000, 3000, 5000, 10000];
        }

        function renderBetButtons() {
            const container = document.getElementById('betButtonsContainer');
            container.innerHTML = '';
            const currentBets = getBetsForPage(currentBetPage);

            currentBets.forEach(val => {
                const btn = document.createElement('button');
                btn.className = `btn-bet ${val === selectedBet ? 'active' : ''}`;
                btn.innerText = val;
                btn.onclick = () => {
                    playClickSound();
                    selectedBet = val;
                    document.getElementById('currentBetLbl').innerText = selectedBet;
                    renderBetButtons();
                };
                container.appendChild(btn);
            });

            document.getElementById('pageIndicator').innerText = currentBetPage;
            document.getElementById('prevPageBtn').disabled = (currentBetPage === 1);
        }

        function changeBetPage(dir) {
            playClickSound();
            if (currentBetPage + dir < 1) return;
            currentBetPage += dir;
            renderBetButtons();
        }

        // ------------------ API User Balance ------------------
        async function fetchBalance() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if(data.success) {
                    userBalance = parseFloat(data.balance);
                    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                }
            } catch(e) {}
        }

        // ------------------ Symbol Element Renderer ------------------
        function renderSymbolElement(symData) {
            const div = document.createElement('div');
            div.className = 'reel-symbol';
            
            if (typeof symData === 'object') {
                div.innerHTML = `
                    <div class="tree-symbol">
                        <span class="tree-icon">${symData.icon}</span>
                        <span class="tree-badge">${symData.label}</span>
                    </div>`;
            } else if (symData === '7️⃣') {
                div.innerHTML = `<span class="seven-symbol">7</span>`;
            } else {
                div.innerText = symData;
            }
            return div;
        }

        function initReels() {
            const initialSet = ['🍊', '🍋', '🍒'];
            for (let i = 1; i <= 3; i++) {
                const strip = document.getElementById(`reel${i}`);
                strip.innerHTML = '';
                strip.appendChild(renderSymbolElement(initialSet[i-1]));
            }
        }

        // ------------------ الخوارزمية الصارمة والدقيقة للرموز ------------------
        function mapOutcomeToSymbols(multiplier) {
            let spinCount = parseInt(localStorage.getItem('slot_spin_counter') || '0') + 1;
            localStorage.setItem('slot_spin_counter', spinCount);

            let teaserInterval = parseInt(localStorage.getItem('next_teaser_interval') || '35');

            // 1. الخسارة المؤكدة (0x)
            if (multiplier <= 0) {
                // ظهور شجرات التشويق الخاسرة (50x, 100x, 500x) كل 25 إلى 500 جولة
                if (spinCount >= teaserInterval) {
                    localStorage.setItem('slot_spin_counter', '0');
                    localStorage.setItem('next_teaser_interval', Math.floor(Math.random() * 476) + 25); // بين 25 و 500

                    const teaserLabels = ['50x', '100x', '500x'];
                    const chosenLabel = teaserLabels[Math.floor(Math.random() * teaserLabels.length)];
                    
                    const f1 = baseFruits[0];
                    const f2 = baseFruits[1];
                    return [f1, f2, { icon: '🎄', label: chosenLabel, isTeaser: true }];
                }

                // احتمال ظهور سبعات مشوقة مفردة أو مزدوجة لخلق الحماس في الخسارة
                if (Math.random() < 0.25) {
                    const numSevens = Math.random() < 0.8 ? 1 : 2;
                    if (numSevens === 1) {
                        const pool = [...baseFruits];
                        const f1 = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
                        const f2 = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
                        return [f1, f2, '7️⃣'].sort(() => Math.random() - 0.5);
                    } else {
                        const f1 = baseFruits[Math.floor(Math.random() * baseFruits.length)];
                        return [f1, '7️⃣', '7️⃣'].sort(() => Math.random() - 0.5);
                    }
                }

                // خسارة عادية بفواكه غير متشابهة
                let pool = [...baseFruits];
                let f1 = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
                let f2 = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
                let f3 = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
                return [f1, f2, f3];
            }

            // 2. الربح الأسطوري لرفع خوارزمية الربح 100% (500x و 1000x)
            if (multiplier >= 1000) {
                return ['7️⃣', '7️⃣', { icon: '🎄', label: '500x' }];
            }
            if (multiplier >= 500) {
                return ['7️⃣', '7️⃣', '7️⃣'];
            }

            // 3. ربح 1x -> ثلاثية برتقال، ليمون، أو كرز حصراً
            if (multiplier === 1) {
                const fruits1x = ['🍊', '🍋', '🍒'];
                const chosen = fruits1x[Math.floor(Math.random() * fruits1x.length)];
                return [chosen, chosen, chosen];
            }

            // 4. ربح 3x -> ثلاثية أجراس حصراً
            if (multiplier === 3) {
                if (Math.random() < 0.7) {
                    return ['🔔', '🔔', '🔔'];
                } else {
                    const f = ['🍊', '🍋', '🍒'][Math.floor(Math.random() * 3)];
                    return [f, f, { icon: '🌳', label: '3x' }]; // 1x base * 3 = 3x
                }
            }

            // 5. ربح 4x -> ثلاثية بطيخ أو عنب حصراً
            if (multiplier === 4) {
                if (Math.random() < 0.7) {
                    const sym = Math.random() > 0.5 ? '🍉' : '🍇';
                    return [sym, sym, sym];
                } else {
                    const sym = Math.random() > 0.5 ? '🍉' : '🍇';
                    return [sym, sym, { icon: '🌳', label: '1x' }]; // 4x base * 1 = 4x
                }
            }

            // 6. ربح الشجرات المكملة المباشرة (1x, 2x, 3x, 5x)
            if (multiplier === 2) { // 1x * 2 = 2x
                const f = ['🍊', '🍋', '🍒'][Math.floor(Math.random() * 3)];
                return [f, f, { icon: '🌳', label: '2x' }];
            }
            if (multiplier === 5) { // 1x * 5 = 5x
                const f = ['🍊', '🍋', '🍒'][Math.floor(Math.random() * 3)];
                return [f, f, { icon: '🌳', label: '5x' }];
            }
            if (multiplier === 6) { // Bell 3x * 2 = 6x
                return ['🔔', '🔔', { icon: '🌳', label: '2x' }];
            }
            if (multiplier === 8) { // Watermelon 4x * 2 = 8x
                const sym = Math.random() > 0.5 ? '🍉' : '🍇';
                return [sym, sym, { icon: '🌳', label: '2x' }];
            }
            if (multiplier === 12) { // Watermelon 4x * 3 = 12x
                const sym = Math.random() > 0.5 ? '🍉' : '🍇';
                return [sym, sym, { icon: '🌳', label: '3x' }];
            }
            if (multiplier === 15) { // Bell 3x * 5 = 15x
                return ['🔔', '🔔', { icon: '🌳', label: '5x' }];
            }
            if (multiplier === 20) { // Watermelon 4x * 5 = 20x
                const sym = Math.random() > 0.5 ? '🍉' : '🍇';
                return [sym, sym, { icon: '🌳', label: '5x' }];
            }

            // Fallback لأي مضاعف فوز غير متوقع
            const sym = Math.random() > 0.5 ? '🍉' : '🍇';
            return [sym, sym, sym];
        }

        // ------------------ دوران البكرات الميكانيكي ------------------
        function animateSingleReel(reelIdx, targetSymbol, totalSpinSymbols, spinDuration, isTeaserDrop, callback) {
            const strip = document.getElementById(`reel${reelIdx}`);
            strip.innerHTML = '';

            let lastSym = '';
            for (let i = 0; i < totalSpinSymbols; i++) {
                let sym;
                if (i === totalSpinSymbols - 1) {
                    sym = targetSymbol;
                } else {
                    do {
                        sym = baseFruits[Math.floor(Math.random() * baseFruits.length)];
                    } while (sym === lastSym);
                    lastSym = sym;
                }
                strip.appendChild(renderSymbolElement(sym));
            }

            const symbolHeight = 125;
            const targetY = -(totalSpinSymbols - 1) * symbolHeight;

            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            strip.classList.add('blur');

            let tickMs = isFastSpeed ? 30 : 50;
            let tickInterval = setInterval(() => { playClickSound(); }, tickMs);

            requestAnimationFrame(() => {
                strip.style.transition = `transform ${spinDuration}s cubic-bezier(0.15, 0.85, 0.35, 1.15)`;
                strip.style.transform = `translateY(${targetY}px)`;

                setTimeout(() => {
                    clearInterval(tickInterval);
                    strip.classList.remove('blur');
                    
                    if (isTeaserDrop && reelIdx === 3) {
                        playImpactSound();
                        document.getElementById('slotFrame').classList.add('shake');
                        setTimeout(() => document.getElementById('slotFrame').classList.remove('shake'), 400);
                    } else {
                        playStopSound();
                    }

                    if (callback) callback();
                }, spinDuration * 1000);
            });
        }

        // ------------------ Balloons Celebration Trigger ------------------
        function triggerBalloons() {
            const container = document.getElementById('balloonContainer');
            container.innerHTML = '';
            
            const colors = ['#ffd700', '#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6b81', '#a55eea'];
            for (let i = 0; i < 30; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const randomLeft = Math.random() * 92 + 4;
                const randomDelay = Math.random() * 1.2;
                const randomScale = 0.8 + Math.random() * 0.5;

                balloon.style.backgroundColor = randomColor;
                balloon.style.left = `${randomLeft}%`;
                balloon.style.animationDelay = `${randomDelay}s`;
                balloon.style.transform = `scale(${randomScale})`;
                balloon.style.boxShadow = `inset -4px -4px 10px rgba(0,0,0,0.3), 0 0 12px ${randomColor}`;

                container.appendChild(balloon);
            }
            setTimeout(() => { container.innerHTML = ''; }, 4500);
        }

        // ------------------ Big Win Modal Handler ------------------
        function showWinModal(winAmount, isJackpot) {
            const modal = document.getElementById('winModal');
            document.getElementById('winTitle').innerText = isJackpot ? '🎰 جاكبوت ملكي أسطوري! 🏆' : '🎉 فوز ضخم جداً!';
            document.getElementById('winModalAmount').innerText = `${winAmount.toFixed(2)} NPS`;
            modal.classList.add('active');
        }

        function closeWinModal() {
            document.getElementById('winModal').classList.remove('active');
        }

        // ------------------ Spin Execution ------------------
        async function spin() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (userBalance < selectedBet) {
                alert('⚠️ رصيدك غير كافٍ لإجراء هذه الدورة!');
                return;
            }

            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            // 1. الخصم المباشر لمبلغ الرهان من واجهة المستخدم
            userBalance -= selectedBet;
            document.getElementById('userBalance').innerText = userBalance.toFixed(2);

            document.getElementById('statusMessage').innerText = 'جاري دوران البكرات... 🎲';
            document.getElementById('statusMessage').style.color = 'var(--gold-bright)';

            document.getElementById('reelWin3').classList.remove('teaser-glow');

            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: 'fruit_slot', bet_amount: selectedBet })
                });
                const data = await res.json();

                if (!data.success) {
                    alert(data.message || 'حدث خطأ بالاتصال');
                    userBalance += selectedBet;
                    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                    spinBtn.disabled = false;
                    return;
                }

                const resultSymbols = mapOutcomeToSymbols(data.multiplier || 0);

                let finishedCount = 0;
                const isTeaserDrop = typeof resultSymbols[2] === 'object' && resultSymbols[2].isTeaser;

                // تفعيل توهج التشويق على البكرة الثالثة عند نزول شجرة التشويق
                if (isTeaserDrop) {
                    document.getElementById('reelWin3').classList.add('teaser-glow');
                }

                const baseDuration = isFastSpeed ? 0.3 : 0.7;
                const stagger = isFastSpeed ? 0.15 : (isTeaserDrop ? 0.8 : 0.35); // إبطاء البكرة الثالثة للتشويق

                for (let i = 1; i <= 3; i++) {
                    const duration = baseDuration + (i - 1) * stagger;
                    const totalSpinSymbols = isFastSpeed ? (8 + i * 2) : (12 + i * 3);

                    animateSingleReel(i, resultSymbols[i-1], totalSpinSymbols, duration, isTeaserDrop, () => {
                        finishedCount++;
                        if (finishedCount === 3) {
                            processResult(data);
                        }
                    });
                }

            } catch(e) {
                userBalance += selectedBet;
                document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                document.getElementById('statusMessage').innerText = '❌ خطأ في الاتصال بالسيرفر';
                document.getElementById('statusMessage').style.color = '#ff5252';
                spinBtn.disabled = false;
            }
        }

        // ------------------ معالجة النتيجة والأرباح ------------------
        function processResult(data) {
            userBalance = parseFloat(data.new_balance);
            document.getElementById('userBalance').innerText = userBalance.toFixed(2);

            const msgEl = document.getElementById('statusMessage');

            if (data.win_amount > 0) {
                playWinSound();
                triggerBalloons();

                if (data.multiplier >= 15) {
                    showWinModal(data.win_amount, data.multiplier >= 500);
                }

                msgEl.style.color = '#4cd137';
                msgEl.innerText = `🎉 مبروك! ربحت ${data.win_amount.toFixed(2)} NPS!`;
            } else {
                msgEl.style.color = '#ff5252';
                msgEl.innerText = '💥 حظ أوفر في المرة القادمة!';
            }

            document.getElementById('spinBtn').disabled = false;
        }

        // Init Game
        window.onload = () => {
            initJackpot();
            renderBetButtons();
            initReels();
            fetchBalance();
        };
    </script>
</body>
