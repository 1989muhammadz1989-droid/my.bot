<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 سلوت الفواكه الثلاثية Pro | Royal Fruit Slot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #fbc531;
            --gold-bright: #ffeaa7;
            --gold-dark: #e1b12c;
            --bg-dark: #0d0d14;
            --card-bg: #161622;
            --neon-border: rgba(251, 197, 49, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: var(--bg-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ------------------ Jackpot Header ------------------ */
        .header {
            background: linear-gradient(180deg, rgba(22, 22, 34, 0.98) 0%, rgba(13, 13, 20, 0.95) 100%);
            border-bottom: 2px solid var(--gold);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 50;
            flex-shrink: 0;
        }

        .jackpot-container {
            background: linear-gradient(135deg, #271c04, #4a3507);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 4px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(251, 197, 49, 0.3);
            margin-bottom: 6px;
        }

        .jackpot-title {
            color: var(--gold-bright);
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .jackpot-amount {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--gold);
        }

        .user-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .balance-badge {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-border);
            padding: 4px 12px;
            border-radius: 14px;
            color: var(--gold);
            font-weight: 900;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ------------------ Slot Machine Area ------------------ */
        .slot-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 14px;
            position: relative;
            background: radial-gradient(circle at center, #1f1f30 0%, #0d0d14 100%);
            min-height: 0;
        }

        .slot-housing {
            background: #000;
            border: 4px solid var(--gold);
            border-radius: 22px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(251, 197, 49, 0.25), inset 0 0 20px #000;
            position: relative;
        }

        .slot-housing::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            border-radius: 18px;
        }

        .reel-window {
            flex: 1;
            height: 120px;
            background: linear-gradient(180deg, #111 0%, #1a1a1a 50%, #111 100%);
            border-radius: 14px;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 5px 10px #000, inset 0 -5px 10px #000;
        }

        .reel-window.tree-flash {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            animation: pulseTree 0.5s infinite alternate;
        }

        @keyframes pulseTree {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reel-symbol {
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3.2rem;
            user-select: none;
        }

        .tree-badge {
            font-size: 0.75rem;
            background: var(--gold);
            color: #000;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .blur { filter: blur(4px); }

        .status-msg {
            margin-top: 14px;
            font-size: 1rem;
            font-weight: 900;
            min-height: 28px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* ------------------ Control Panel ------------------ */
        .controls-panel {
            background: var(--card-bg);
            border-top: 2px solid var(--gold);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .bet-selector {
            background: rgba(0,0,0,0.4);
            padding: 8px 10px;
            border-radius: 14px;
            border: 1px solid var(--neon-border);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #aaa;
        }

        .bet-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .btn-bet {
            background: #232334;
            border: 1px solid #3a3a52;
            color: #fff;
            padding: 9px 0;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-bet.active {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(251, 197, 49, 0.4);
        }

        .page-nav {
            background: #333;
            color: var(--gold);
            border: none;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-spin {
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-dark) 100%);
            color: #000;
            font-weight: 900;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(251, 197, 49, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease;
        }

        .btn-spin:active { transform: scale(0.97); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }
    </style>
</head>
<body>

    <!-- 🏆 Jackpot & User Header -->
    <header class="header">
        <div class="jackpot-container">
            <i class="fa-solid fa-trophy" style="color: var(--gold);"></i>
            <span class="jackpot-title">الجاكبوت الملكي:</span>
            <span class="jackpot-amount" id="jackpotCounter">1,250,000</span>
            <span style="font-size:0.75rem; color: var(--gold-bright);">NPS</span>
        </div>

        <div class="user-bar">
            <div class="balance-badge">
                <i class="fa-solid fa-coins"></i>
                <span id="userBalance">0.00</span> NPS
            </div>
            <div style="font-size: 0.8rem; color: #aaa; font-weight: 700;">
                رهان الجولة: <span id="currentBetLbl" style="color: var(--gold);">3</span> NPS
            </div>
        </div>
    </header>

    <!-- 🎰 Slot Reels Machine -->
    <div class="slot-container">
        <div class="slot-housing">
            <div class="reel-window" id="reelWin1"><div class="reel-strip" id="reel1"></div></div>
            <div class="reel-window" id="reelWin2"><div class="reel-strip" id="reel2"></div></div>
            <div class="reel-window" id="reelWin3"><div class="reel-strip" id="reel3"></div></div>
        </div>

        <div class="status-msg" id="statusMessage">اختر الرهان واضغط دوران للبدء!</div>
    </div>

    <!-- 🎮 Control Panel -->
    <div class="controls-panel">
        <div class="bet-selector">
            <div class="bet-header">
                <span>خيارات الرهان السريع (NPS):</span>
                <div>
                    <button class="page-nav" id="prevPageBtn" onclick="changeBetPage(-1)">❮</button>
                    <span id="pageIndicator" style="margin: 0 4px; color: #fff;">1</span>
                    <button class="page-nav" onclick="changeBetPage(1)">❯</button>
                </div>
            </div>
            <div class="bet-grid" id="betButtonsContainer"></div>
        </div>

        <button class="btn-spin" id="spinBtn" onclick="spin()">
            <i class="fa-solid fa-rotate-right"></i> دوران 🚀
        </button>
    </div>

    <script>
        // ------------------ Audio Synthesizer ------------------
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        function playStopSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(190, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playWinSound() {
            try {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                        osc.stop(audioCtx.currentTime + 0.2);
                    }, idx * 90);
                });
            } catch(e) {}
        }

        // ------------------ Integration Setup ------------------
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || '1000';

        let userBalance = 0.0;
        let selectedBet = 3;
        let currentBetPage = 1;

        const baseFruits = ['🍊', '🍋', '🍒', '🍉', '🍇', '🔔', '7️⃣'];
        const teaserTrees = [
            { icon: '🌲', label: '2x' },
            { icon: '🌳', label: '5x' },
            { icon: '🌴', label: '10x' },
            { icon: '🎄', label: '50x' }
        ];

        // ------------------ Jackpot Counter (Continuous Increment & 3-Day Reset) ------------------
        function initJackpot() {
            const STORAGE_KEY_VAL = 'royal_slot_jackpot_val';
            const STORAGE_KEY_TIME = 'royal_slot_jackpot_time';
            
            let storedVal = parseFloat(localStorage.getItem(STORAGE_KEY_VAL));
            let storedTime = parseInt(localStorage.getItem(STORAGE_KEY_TIME));
            const now = Date.now();

            // إعادت التصفير كل 3 أيام (259200000 ms)
            if (!storedVal || !storedTime || (now - storedTime > 259200000)) {
                storedVal = 1245000 + Math.floor(Math.random() * 50000);
                storedTime = now;
                localStorage.setItem(STORAGE_KEY_TIME, storedTime);
            }

            const counterEl = document.getElementById('jackpotCounter');

            setInterval(() => {
                storedVal += Math.floor(Math.random() * 15) + 3;
                localStorage.setItem(STORAGE_KEY_VAL, storedVal);
                counterEl.innerText = storedVal.toLocaleString('en-US');
            }, 300);
        }

        // ------------------ Bet Quick Selector ------------------
        function getBetsForPage(page) {
            if (page === 1) return [1, 3, 5, 10, 25];
            if (page === 2) return [50, 100, 200, 300, 500];
            return [1000, 2000, 3000, 5000, 10000];
        }

        function renderBetButtons() {
            const container = document.getElementById('betButtonsContainer');
            container.innerHTML = '';
            const currentBets = getBetsForPage(currentBetPage);

            currentBets.forEach(val => {
                const btn = document.createElement('button');
                btn.className = `btn-bet ${val === selectedBet ? 'active' : ''}`;
                btn.innerText = val;
                btn.onclick = () => {
                    playClickSound();
                    selectedBet = val;
                    document.getElementById('currentBetLbl').innerText = selectedBet;
                    renderBetButtons();
                };
                container.appendChild(btn);
            });

            document.getElementById('pageIndicator').innerText = currentBetPage;
            document.getElementById('prevPageBtn').disabled = (currentBetPage === 1);
        }

        function changeBetPage(dir) {
            playClickSound();
            if (currentBetPage + dir < 1) return;
            currentBetPage += dir;
            renderBetButtons();
        }

        // ------------------ API User Balance ------------------
        async function fetchBalance() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if(data.success) {
                    userBalance = parseFloat(data.balance);
                    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                }
            } catch(e) {}
        }

        // ------------------ Render Single Symbol Helper ------------------
        function renderSymbolElement(symData) {
            const div = document.createElement('div');
            div.className = 'reel-symbol';
            if (typeof symData === 'object') {
                div.innerHTML = `<span>${symData.icon}</span><span class="tree-badge">${symData.label}</span>`;
            } else {
                div.innerText = symData;
            }
            return div;
        }

        // ------------------ Slot Reels Initialization ------------------
        function initReels() {
            const initialSet = ['🍊', '🍋', '🍒'];
            for (let i = 1; i <= 3; i++) {
                const strip = document.getElementById(`reel${i}`);
                strip.innerHTML = '';
                strip.appendChild(renderSymbolElement(initialSet[i-1]));
            }
        }

        // ------------------ Reel Physics Animation ------------------
        function animateSingleReel(reelIdx, targetSymbol, delay, callback) {
            const strip = document.getElementById(`reel${reelIdx}`);
            const reelWin = document.getElementById(`reelWin${reelIdx}`);
            reelWin.classList.remove('tree-flash');

            const totalSpinSymbols = 16;
            strip.innerHTML = '';

            // بناء شريط البكرة مع تجنب تكرار نفس الفاكهة متتالية بنفس العمود
            let lastSym = '';
            for (let i = 0; i < totalSpinSymbols; i++) {
                let sym;
                if (i === totalSpinSymbols - 1) {
                    sym = targetSymbol;
                } else {
                    do {
                        sym = baseFruits[Math.floor(Math.random() * baseFruits.length)];
                    } while (sym === lastSym);
                    lastSym = sym;
                }
                strip.appendChild(renderSymbolElement(sym));
            }

            const symbolHeight = 120;
            const targetY = -(totalSpinSymbols - 1) * symbolHeight;

            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            strip.classList.add('blur');

            let tickInterval = setInterval(() => { playClickSound(); }, 65);

            setTimeout(() => {
                strip.style.transition = `transform ${0.9 + (reelIdx * 0.25)}s cubic-bezier(0.12, 0.8, 0.3, 1.15)`;
                strip.style.transform = `translateY(${targetY}px)`;

                setTimeout(() => {
                    clearInterval(tickInterval);
                    strip.classList.remove('blur');
                    playStopSound();

                    if (typeof targetSymbol === 'object') {
                        reelWin.classList.add('tree-flash');
                    }

                    if (callback) callback();
                }, (0.9 + (reelIdx * 0.25)) * 1000);

            }, delay);
        }

        // ------------------ Math Logic (10% Win - 90% Loss) ------------------
        function generateControlledOutcome(serverWin, bet) {
            // 10% احتمال الفوز
            const isWin = serverWin > 0 || (Math.random() < 0.10);

            if (isWin) {
                const winRoll = Math.random();
                
                // 5% احتمال ظهور شجرة 1x كمكمل رابح
                if (winRoll < 0.05) {
                    return ['🍊', '🍊', { icon: '🌲', label: '1x' }];
                } 
                // مضاعف 2x مع البرتقال
                else if (winRoll < 0.20) {
                    return ['🍊', '🍊', { icon: '🌲', label: '2x' }];
                }
                // ثلاثيات العنب/البطيخ (5x)
                else if (winRoll < 0.45) {
                    const sym = Math.random() > 0.5 ? '🍉' : '🍇';
                    return [sym, sym, sym];
                }
                // ثلاثية الأجراس (2x)
                else if (winRoll < 0.70) {
                    return ['🔔', '🔔', '🔔'];
                }
                // ثلاثية البرتقال / الليمون / الكرز (1x)
                else {
                    const syms = ['🍊', '🍋', '🍒'];
                    const chosen = syms[Math.floor(Math.random() * syms.length)];
                    return [chosen, chosen, chosen];
                }
            } else {
                // خسارة 90%
                const teaserRoll = Math.random();

                // ظهور شجرة مضاعف عالي كتشويق بدون إكمال الفوز
                if (teaserRoll < 0.35) {
                    const tree = teaserTrees[Math.floor(Math.random() * teaserTrees.length)];
                    return ['🍊', '🍉', tree];
                } 
                // رموش فواكه عادية بدون تطابق (تضمن عدم ظهور 3 سبعات أبدًا)
                else {
                    return ['🍊', '🍋', '7️⃣'];
                }
            }
        }

        // ------------------ Spin Execution ------------------
        async function spin() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (userBalance < selectedBet) {
                alert('⚠️ رصيدك غير كافٍ لإجراء هذه الدورة!');
                return;
            }

            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            document.getElementById('statusMessage').innerText = 'جاري دوران البكرات... 🎲';
            document.getElementById('statusMessage').style.color = 'var(--gold)';

            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: 'fruit_slot', bet_amount: selectedBet })
                });
                const data = await res.json();

                if (!data.success) {
                    alert(data.message || 'حدث خطأ بالاتصال');
                    spinBtn.disabled = false;
                    return;
                }

                const resultSymbols = generateControlledOutcome(data.win_amount || 0, selectedBet);

                let finishedCount = 0;
                for (let i = 0; i < 3; i++) {
                    animateSingleReel(i + 1, resultSymbols[i], i * 140, () => {
                        finishedCount++;
                        if (finishedCount === 3) {
                            processResult(data, resultSymbols);
                        }
                    });
                }

            } catch(e) {
                // في حال عدم توفر السيرفر، يتم إجراء دورة محلية مبسطة للعرض
                const resultSymbols = generateControlledOutcome(0, selectedBet);
                let finishedCount = 0;
                for (let i = 0; i < 3; i++) {
                    animateSingleReel(i + 1, resultSymbols[i], i * 140, () => {
                        finishedCount++;
                        if (finishedCount === 3) {
                            userBalance -= selectedBet;
                            document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                            document.getElementById('statusMessage').innerText = 'حظ أوفر في المرة القادمة!';
                            document.getElementById('statusMessage').style.color = '#ff5252';
                            spinBtn.disabled = false;
                        }
                    });
                }
            }
        }

        function processResult(data, symbols) {
            userBalance = parseFloat(data.new_balance);
            document.getElementById('userBalance').innerText = userBalance.toFixed(2);

            const msgEl = document.getElementById('statusMessage');

            if (data.win_amount > 0) {
                playWinSound();
                msgEl.style.color = '#4cd137';
                msgEl.innerText = `🎉 مبروك! ربحت ${data.win_amount.toFixed(2)} NPS!`;
            } else {
                msgEl.style.color = '#ff5252';
                msgEl.innerText = '💥 حظ أوفر في المرة القادمة!';
            }

            document.getElementById('spinBtn').disabled = false;
        }

        // Init Game
        window.onload = () => {
            initJackpot();
            renderBetButtons();
            initReels();
            fetchBalance();
        };
    </script>
</body>
</html>
