<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 لعبة السلوتس | GOLDEN GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-light: #fff0a5;
            --gold-bright: #ffd700;
            --gold-mid: #dfa837;
            --gold-dark: #8c5a08;
            --bg-burgundy: #2b020a;
            --card-bg: #180005;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #4a0715 0%, #1a0005 70%, #0d0002 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* خلفية زخرفية مخملية */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 215, 0, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
        }

        /* ------------------ Header ------------------ */
        .header {
            background: linear-gradient(180deg, rgba(30, 1, 7, 0.95) 0%, rgba(15, 0, 3, 0.9) 100%);
            border-bottom: 2px solid var(--gold-mid);
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.9);
            z-index: 50;
        }

        .jackpot-container {
            background: linear-gradient(135deg, #4a3002 0%, #8c5a08 50%, #291a00 100%);
            border: 2px solid var(--gold-bright);
            border-radius: 20px;
            padding: 4px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            margin-bottom: 6px;
        }

        .jackpot-title {
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: 900;
        }

        .jackpot-amount {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 900;
            text-shadow: 0 0 10px var(--gold-bright);
        }

        .user-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-badge {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--gold-mid);
            padding: 4px 14px;
            border-radius: 14px;
            color: var(--gold-bright);
            font-weight: 900;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ------------------ Slot Machine Area ------------------ */
        .slot-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        /* إطار السلوت الذهبي المصمم طابق الصورة */
        .slot-frame {
            position: relative;
            background: linear-gradient(145deg, #bf8f30, #593e0b, #e6be65, #422d05);
            padding: 14px;
            border-radius: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,235,170,0.5);
            border: 3px solid var(--gold-light);
            width: 100%;
            max-width: 390px;
        }

        .slot-housing {
            background: #000;
            border-radius: 22px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            border: 2px solid var(--gold-mid);
            box-shadow: inset 0 0 20px #000;
        }

        .reel-window {
            flex: 1;
            height: 125px;
            background: linear-gradient(180deg, #dcd1be 0%, #ffffff 48%, #ffffff 52%, #c2b49d 100%);
            border-radius: 14px;
            border: 3px solid #8c6827;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.7), inset 0 -8px 12px rgba(0,0,0,0.7);
        }

        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reel-symbol {
            height: 125px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3.2rem;
            color: #000;
        }

        /* شجرة الجوكر والمضاعف */
        .tree-symbol {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .tree-symbol .tree-icon {
            font-size: 2.7rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .tree-symbol .tree-badge {
            font-size: 0.85rem;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 2px;
            border: 1px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        /* اللافتة الذهبية السفلى مثل الصورة تماماً */
        .golden-banner {
            margin-top: 12px;
            background: linear-gradient(180deg, #ffe082 0%, #cfa138 50%, #7a540c 100%);
            border: 2px solid var(--gold-light);
            border-radius: 12px;
            padding: 6px 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .golden-banner h2 {
            color: #2b020a;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            margin: 0;
        }

        .golden-banner span {
            display: block;
            color: #000;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .blur { filter: blur(5px); }

        .status-msg {
            margin-top: 10px;
            font-size: 1.05rem;
            font-weight: 900;
            min-height: 28px;
            text-align: center;
            text-shadow: 0 2px 4px #000;
        }

        /* ------------------ Control Panel ------------------ */
        .controls-panel {
            background: var(--card-bg);
            border-top: 2px solid var(--gold-mid);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bet-selector {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 14px;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #ccc;
        }

        .bet-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .btn-bet {
            background: #2a0810;
            border: 1px solid #541926;
            color: #fff;
            padding: 8px 0;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-bet.active {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-mid));
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .page-nav {
            background: #44101c;
            color: var(--gold-bright);
            border: 1px solid var(--gold-mid);
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-spin {
            background: linear-gradient(180deg, #ffe082 0%, #db9d24 50%, #8c5a08 100%);
            color: #000;
            font-weight: 900;
            border: 2px solid var(--gold-light);
            padding: 12px;
            border-radius: 16px;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-spin:active { transform: scale(0.97); }
        .btn-spin:disabled { opacity: 0.5; filter: grayscale(0.8); }
    </style>
</head>
<body>

    <!-- 🏆 Header -->
    <header class="header">
        <div class="jackpot-container">
            <i class="fa-solid fa-trophy" style="color: var(--gold-light);"></i>
            <span class="jackpot-title">الجاكبوت الملكي:</span>
            <span class="jackpot-amount" id="jackpotCounter">1,250,000</span>
            <span style="font-size:0.75rem; color: var(--gold-light);">NPS</span>
        </div>

        <div class="user-bar">
            <div class="balance-badge">
                <i class="fa-solid fa-coins"></i>
                <span id="userBalance">0.00</span> NPS
            </div>
            <div style="font-size: 0.85rem; color: #ddd; font-weight: 700;">
                الرهان: <span id="currentBetLbl" style="color: var(--gold-bright);">3</span> NPS
            </div>
        </div>
    </header>

    <!-- 🎰 Slot Machine -->
    <div class="slot-container">
        <div class="slot-frame">
            <div class="slot-housing">
                <div class="reel-window" id="reelWin1"><div class="reel-strip" id="reel1"></div></div>
                <div class="reel-window" id="reelWin2"><div class="reel-strip" id="reel2"></div></div>
                <div class="reel-window" id="reelWin3"><div class="reel-strip" id="reel3"></div></div>
            </div>

            <!-- اللافتة الذهبية مثل الصورة -->
            <div class="golden-banner">
                <h2>لعبة السلوتس</h2>
                <span>GOLDEN GAME</span>
            </div>
        </div>

        <div class="status-msg" id="statusMessage">اختر الرهان واضغط دوران للبدء!</div>
    </div>

    <!-- 🎮 Control Panel -->
    <div class="controls-panel">
        <div class="bet-selector">
            <div class="bet-header">
                <span>خيارات الرهان السريع (NPS):</span>
                <div>
                    <button class="page-nav" id="prevPageBtn" onclick="changeBetPage(-1)">❮</button>
                    <span id="pageIndicator" style="margin: 0 4px; color: #fff;">1</span>
                    <button class="page-nav" onclick="changeBetPage(1)">❯</button>
                </div>
            </div>
            <div class="bet-grid" id="betButtonsContainer"></div>
        </div>

        <button class="btn-spin" id="spinBtn" onclick="spin()">
            <i class="fa-solid fa-rotate-right"></i> دوران 🚀
        </button>
    </div>

    <script>
        // ------------------ Audio Web Audio API ------------------
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        function playStopSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.06);
            } catch(e) {}
        }

        function playWinSound() {
            try {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                        osc.stop(audioCtx.currentTime + 0.25);
                    }, idx * 90);
                });
            } catch(e) {}
        }

        // ------------------ Param Setup ------------------
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || '1000';

        let userBalance = 0.0;
        let selectedBet = 3;
        let currentBetPage = 1;

        const baseFruits = ['🍊', '🍋', '🍒', '🍉', '🍇', '🔔'];

        // ------------------ Jackpot Counter ------------------
        function initJackpot() {
            let storedVal = parseFloat(localStorage.getItem('royal_slot_jackpot_val')) || 1250000;
            const counterEl = document.getElementById('jackpotCounter');

            setInterval(() => {
                storedVal += Math.floor(Math.random() * 12) + 2;
                localStorage.setItem('royal_slot_jackpot_val', storedVal);
                counterEl.innerText = Math.floor(storedVal).toLocaleString('en-US');
            }, 400);
        }

        // ------------------ Bet Quick Selector ------------------
        function getBetsForPage(page) {
            if (page === 1) return [1, 3, 5, 10, 25];
            if (page === 2) return [50, 100, 200, 300, 500];
            return [1000, 2000, 3000, 5000, 10000];
        }

        function renderBetButtons() {
            const container = document.getElementById('betButtonsContainer');
            container.innerHTML = '';
            const currentBets = getBetsForPage(currentBetPage);

            currentBets.forEach(val => {
                const btn = document.createElement('button');
                btn.className = `btn-bet ${val === selectedBet ? 'active' : ''}`;
                btn.innerText = val;
                btn.onclick = () => {
                    playClickSound();
                    selectedBet = val;
                    document.getElementById('currentBetLbl').innerText = selectedBet;
                    renderBetButtons();
                };
                container.appendChild(btn);
            });

            document.getElementById('pageIndicator').innerText = currentBetPage;
            document.getElementById('prevPageBtn').disabled = (currentBetPage === 1);
        }

        function changeBetPage(dir) {
            playClickSound();
            if (currentBetPage + dir < 1) return;
            currentBetPage += dir;
            renderBetButtons();
        }

        // ------------------ API User Balance ------------------
        async function fetchBalance() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if(data.success) {
                    userBalance = parseFloat(data.balance);
                    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
                }
            } catch(e) {}
        }

        // ------------------ Symbol Element Renderer ------------------
        function renderSymbolElement(symData) {
            const div = document.createElement('div');
            div.className = 'reel-symbol';
            
            if (typeof symData === 'object') {
                div.innerHTML = `
                    <div class="tree-symbol">
                        <span class="tree-icon">${symData.icon}</span>
                        <span class="tree-badge">${symData.label}</span>
                    </div>`;
            } else {
                div.innerText = symData;
            }
            return div;
        }

        function initReels() {
            const initialSet = ['🍊', '🍋', '🍒'];
            for (let i = 1; i <= 3; i++) {
                const strip = document.getElementById(`reel${i}`);
                strip.innerHTML = '';
                strip.appendChild(renderSymbolElement(initialSet[i-1]));
            }
        }

        // ------------------ Reel Physics Animation ------------------
        function animateSingleReel(reelIdx, targetSymbol, delay, callback) {
            const strip = document.getElementById(`reel${reelIdx}`);
            const totalSpinSymbols = 15;
            strip.innerHTML = '';

            let lastSym = '';
            for (let i = 0; i < totalSpinSymbols; i++) {
                let sym;
                if (i === totalSpinSymbols - 1) {
                    sym = targetSymbol;
                } else {
                    do {
                        sym = baseFruits[Math.floor(Math.random() * baseFruits.length)];
                    } while (sym === lastSym);
                    lastSym = sym;
                }
                strip.appendChild(renderSymbolElement(sym));
            }

            const symbolHeight = 125;
            const targetY = -(totalSpinSymbols - 1) * symbolHeight;

            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            strip.classList.add('blur');

            let tickInterval = setInterval(() => { playClickSound(); }, 70);

            setTimeout(() => {
                strip.style.transition = `transform ${0.9 + (reelIdx * 0.25)}s cubic-bezier(0.12, 0.8, 0.3, 1.12)`;
                strip.style.transform = `translateY(${targetY}px)`;

                setTimeout(() => {
                    clearInterval(tickInterval);
                    strip.classList.remove('blur');
                    playStopSound();
                    if (callback) callback();
                }, (0.9 + (reelIdx * 0.25)) * 1000);

            }, delay);
        }

        // ------------------ Mapping Backend Outcome to Symbols ------------------
        function mapOutcomeToSymbols(multiplier) {
            // الخسارة (0x)
            if (multiplier <= 0) {
                const teaserRoll = Math.random();
                // 35% احتمال ظهور شجرة مضاعف عالي (100x أو 500x) كعنصر تشويق غير مكمل بالخسارة
                if (teaserRoll < 0.20) {
                    return ['🍊', '🍉', { icon: '🌳', label: '100x' }];
                } else if (teaserRoll < 0.35) {
                    return ['🍇', '🔔', { icon: '🎄', label: '500x' }];
                } else {
                    // فواكه غير متشابهة
                    return ['🍊', '🍋', '🍉'];
                }
            }

            // الربح الضخم جداً (500x) -> 777
            if (multiplier >= 450) {
                return ['7️⃣', '7️⃣', '7️⃣'];
            }

            // ربح 5 ضعف رهان -> ثلاثية بطيخ أو عنب
            if (multiplier >= 4.5 && multiplier <= 6) {
                const sym = Math.random() > 0.5 ? '🍉' : '🍇';
                return [sym, sym, sym];
            }

            // ربح 3 ضعف رهان -> ثلاثية أجراس
            if (multiplier >= 2.5 && multiplier < 4.5) {
                return ['🔔', '🔔', '🔔'];
            }

            // ربح مضاعف شجرة (مثال: برتقال + برتقال + شجرة 2x)
            if (multiplier >= 1.8 && multiplier < 2.5) {
                const sym = Math.random() > 0.5 ? '🍊' : '🍋';
                return [sym, sym, { icon: '🌳', label: '2x' }];
            }

            // ربح عادي بنفس سعر الرهان (1x)
            const syms = ['🍊', '🍋', '🍒'];
            const chosen = syms[Math.floor(Math.random() * syms.length)];
            
            if (Math.random() < 0.3) {
                // شجرة 1x كمكمل رابح
                return [chosen, chosen, { icon: '🌲', label: '1x' }];
            }
            return [chosen, chosen, chosen];
        }

        // ------------------ Spin Execution ------------------
        async function spin() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (userBalance < selectedBet) {
                alert('⚠️ رصيدك غير كافٍ لإجراء هذه الدورة!');
                return;
            }

            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            document.getElementById('statusMessage').innerText = 'جاري دوران البكرات... 🎲';
            document.getElementById('statusMessage').style.color = 'var(--gold-bright)';

            try {
                // الاتصال بـ API السيرفر app.py
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: 'fruit_slot', bet_amount: selectedBet })
                });
                const data = await res.json();

                if (!data.success) {
                    alert(data.message || 'حدث خطأ بالاتصال');
                    spinBtn.disabled = false;
                    return;
                }

                // تعيين الرموز بناءً على النتيجة القادمة من السيرفر
                const resultSymbols = mapOutcomeToSymbols(data.multiplier || 0);

                let finishedCount = 0;
                for (let i = 0; i < 3; i++) {
                    animateSingleReel(i + 1, resultSymbols[i], i * 130, () => {
                        finishedCount++;
                        if (finishedCount === 3) {
                            processResult(data);
                        }
                    });
                }

            } catch(e) {
                document.getElementById('statusMessage').innerText = '❌ خطأ في الاتصال بالسيرفر';
                document.getElementById('statusMessage').style.color = '#ff5252';
                spinBtn.disabled = false;
            }
        }

        function processResult(data) {
            userBalance = parseFloat(data.new_balance);
            document.getElementById('userBalance').innerText = userBalance.toFixed(2);

            const msgEl = document.getElementById('statusMessage');

            if (data.win_amount > 0) {
                playWinSound();
                msgEl.style.color = '#4cd137';
                msgEl.innerText = `🎉 مبروك! ربحت ${data.win_amount.toFixed(2)} NPS!`;
            } else {
                msgEl.style.color = '#ff5252';
                msgEl.innerText = '💥 حظ أوفر في المرة القادمة!';
            }

            document.getElementById('spinBtn').disabled = false;
        }

        // Init Game
        window.onload = () => {
            initJackpot();
            renderBetButtons();
            initReels();
            fetchBalance();
        };
    </script>
</body>
</html>
