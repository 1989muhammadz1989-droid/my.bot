    <style>

            -webkit-background-clip: text;

        /* النوافذ والـ Toasts التشويقية */
        .result-toast {

        /* ألوان الفئات للمضاعفات */
        .tier-loss { background: rgba(255, 42, 95, 0.18); color: #ff2a5f; border: 1px solid #ff2a5f; }

        .tier-jackpot { background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,61,0,0.3)); color: #ffd700; border: 1px solid #ffd700; box-shadow: 0 0 18px rgba(255, 215, 0, 0.6); }
    </style>

<body>

    <!-- هيدر اللعبة -->
    <div class="header">

            <i class="fa-solid fa-crown"></i> بلينكو VIP
        </div>
        <div class="balance-box">

        </div>
    </div>

    <!-- حاوية اللوحة والكانفاس -->
    <div class="game-container">
        <div class="history-bar" id="historyBar"></div>

        <div class="canvas-wrapper">
            <canvas id="plinkoCanvas" width="440" height="500"></canvas>
            
            <div class="result-toast" id="resultToast">
                <div class="title" id="toastTitle">جولة مكتملة!</div>

    <!-- لوحة أزرار الرهان والتفاعل -->
    <div class="controls-panel">
        <div class="control-group">
            <div class="control-label">
                <span>مبلغ الرهان (NPS)</span>
                <span>الأدنى: 5 | الأقصى: 1000</span>
            </div>
            <div class="bet-input-box">
                <button class="btn-adjust" id="btnMinus"><i class="fa-solid fa-minus"></i></button>
                <input type="number" id="betAmount" class="bet-amount-display" value="10" min="5" max="1000" readonly>
                <button class="btn-adjust" id="btnPlus"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="quick-bets">
                <button class="btn-quick" onclick="setBet(5)">5</button>
                <button class="btn-quick" onclick="setBet(25)">25</button>
                <button class="btn-quick" onclick="setBet(100)">100</button>
                <button class="btn-quick" onclick="setBet(500)">500</button>
                <button class="btn-quick" onclick="setBet(1000)">1000</button>
            </div>
        </div>

        <button class="btn-play" id="btnPlay" onclick="playGame()">
            <i class="fa-solid fa-circle-dot"></i> إطلاق الكرة VIP
        </button>
    </div>

    <script>
        // إعدادات اللعبة المعرفات والحدود
        const GAME_ID = "plinko";
        const MIN_BET = 5;
        const MAX_BET = 1000;
        
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || "1001";

        let currentBalance = 0;
        let isPlaying = false;

        // نظام الصوتيات عبر Web Audio API
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type, pitchModifier = 1) {
            try {
                if (AudioCtx.state === 'suspended') AudioCtx.resume();
                const osc = AudioCtx.createOscillator();
                const gain = AudioCtx.createGain();
                osc.connect(gain);
                gain.connect(AudioCtx.destination);

                if (type === 'bounce') {
                    const freq = (320 + Math.random() * 180) * pitchModifier;
                    osc.frequency.setValueAtTime(freq, AudioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, AudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, AudioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(AudioCtx.currentTime + 0.05);
                } else if (type === 'near_miss') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, AudioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, AudioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.08, AudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, AudioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(AudioCtx.currentTime + 0.15);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, AudioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, AudioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.2, AudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(AudioCtx.currentTime + 0.35);
                } else if (type === 'loss') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, AudioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(90, AudioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.1, AudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(AudioCtx.currentTime + 0.25);
                }
            } catch (e) {}
        }

        // إعدادات لوحة الكانفاس وسلال المضاعفات
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');

        const ROWS = 10; // عدد صفوف الدبابيس
        const PEGS = [];

        // قائمة السلال مرتبة لتضع الأرقام الضخمة المحظورة بجانب أصغر الأرقام لإعطاء التشويق الأقصى Near-Miss
        const BUCKETS = [
            { label: '500x', tier: 'jackpot', mult: 500, prob: 0 },
            { label: '0.1x', tier: 'loss',    mult: 0.1, prob: 0.60 },
            { label: '10x',  tier: 'high',    mult: 10,  prob: 0.02 },
            { label: '0.2x', tier: 'loss',    mult: 0.2, prob: 0.40 },
            { label: '3x',   tier: 'medium',  mult: 3,   prob: 0.10 },
            { label: '0.5x', tier: 'normal',  mult: 0.5, prob: 0.30 },
            { label: '1x',   tier: 'even',    mult: 1,   prob: 0.20 },
            { label: '0.1x', tier: 'loss',    mult: 0.1, prob: 0.60 },
            { label: '2x',   tier: 'medium',  mult: 2,   prob: 0.15 },
            { label: '0.5x', tier: 'normal',  mult: 0.5, prob: 0.30 },
            { label: '5x',   tier: 'high',    mult: 5,   prob: 0.05 },
            { label: '0.2x', tier: 'loss',    mult: 0.2, prob: 0.40 },
            { label: '50x',  tier: 'jackpot', mult: 50,  prob: 0 },
            { label: '0.1x', tier: 'loss',    mult: 0.1, prob: 0.60 },
            { label: '100x', tier: 'jackpot', mult: 100, prob: 0 }
        ];

        let activeBalls = [];
        let particles = [];

        function initBoard() {
            PEGS.length = 0;
            const startY = 48;
            const rowSpacing = 38;

            for (let r = 0; r < ROWS; r++) {
                const count = r + 3;
                const spacing = 29;
                const startX = (canvas.width - (count - 1) * spacing) / 2;

                for (let c = 0; c < count; c++) {
                    PEGS.push({
                        x: startX + c * spacing,
                        y: startY + r * rowSpacing,
                        radius: 4,
                        glow: 0
                    });
                }
            }
        }

        initBoard();

        // نظام مؤشرات والشرارات عند الارتطام
        function createParticles(x, y, color, count = 16) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7 - 2,
                    radius: Math.random() * 3.5 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // شبكة خلفية سينمائية
            ctx.strokeStyle = "rgba(255, 215, 0, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 25) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            // رسم الدبابيس المضيئة (Pegs)
            PEGS.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.glow > 0 ? 6 : 4, 0, Math.PI * 2);
                
                if (peg.glow > 0) {
                    ctx.fillStyle = "#ffd700";
                    ctx.shadowColor = "#ffd700";
                    ctx.shadowBlur = 15;
                    peg.glow--;
                } else {
                    ctx.fillStyle = "#637b9d";
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // رسم سلال المضاعفات المبتكرة
            const bucketWidth = 26;
            const bucketGap = 3;
            const totalBucketWidth = (BUCKETS.length * bucketWidth) + ((BUCKETS.length - 1) * bucketGap);
            const startX = (canvas.width - totalBucketWidth) / 2;
            const bucketY = canvas.height - 42;

            BUCKETS.forEach((b, i) => {
                const x = startX + i * (bucketWidth + bucketGap);
                
                let bgColor = "rgba(255, 42, 95, 0.15)";
                let borderColor = "#ff2a5f";
                let textColor = "#ff2a5f";

                if (b.tier === 'normal')  { bgColor = "rgba(255, 170, 0, 0.18)"; borderColor = "#ffaa00"; textColor = "#ffaa00"; }
                if (b.tier === 'even')    { bgColor = "rgba(255, 255, 255, 0.15)"; borderColor = "#ffffff"; textColor = "#ffffff"; }
                if (b.tier === 'medium')  { bgColor = "rgba(0, 230, 118, 0.18)"; borderColor = "#00e676"; textColor = "#00e676"; }
                if (b.tier === 'high')    { bgColor = "rgba(0, 242, 254, 0.2)";  borderColor = "#00f2fe"; textColor = "#00f2fe"; }
                if (b.tier === 'jackpot') { bgColor = "rgba(255, 215, 0, 0.3)";   borderColor = "#ffd700"; textColor = "#ffd700"; }

                ctx.fillStyle = bgColor;
                ctx.beginPath();
                ctx.roundRect(x, bucketY, bucketWidth, 30, 5);
                ctx.fill();

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.fillStyle = textColor;
                ctx.font = "bold 9.5px Cairo";
                ctx.textAlign = "center";
                ctx.fillText(b.label, x + bucketWidth / 2, bucketY + 19);
            });

            // تحديث الشرارات
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.035;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            // رسم حركة الكرة مع التأثير الفيزيائي والانعطاف المثير (Near-Miss)
            activeBalls.forEach((ball, index) => {
                ball.trail.push({ x: ball.x, y: ball.y });
                if (ball.trail.length > 9) ball.trail.shift();

                // رسم ذيل النيون المضيء للكرة
                for (let t = 0; t < ball.trail.length; t++) {
                    const pt = ball.trail[t];
                    const alpha = (t + 1) / ball.trail.length;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, ball.radius * (alpha * 0.75), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${alpha * 0.45})`;
                    ctx.fill();
                }

                // جسم الكرة الملكية الذهبية
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ffd700";
                ctx.shadowColor = "#ffd700";
                ctx.shadowBlur = 16;
                ctx.fill();
                ctx.shadowBlur = 0;

                updateBallPath(ball, index);
            });

            requestAnimationFrame(drawBoard);
        }

        // تحديث المسار بفيزيائية طبيعية ومشوقة
        function updateBallPath(ball, index) {
            if (ball.step >= ball.path.length) {
                createParticles(ball.x, ball.y, ball.resultData.win_amount > 0 ? "#ffd700" : "#ff2a5f", 20);
                activeBalls.splice(index, 1);
                onBallLanded(ball.resultData);
                return;
            }

            const target = ball.path[ball.step];
            const dx = target.x - ball.x;
            const dy = target.y - ball.y;
            const dist = Math.hypot(dx, dy);

            // سرعة الكرة المتغيرة تلقائياً لإعطاء شعور الترقب قبل السقوط
            let speed = 7.2;
            if (ball.step >= ball.path.length - 3) {
                speed = 4.8; // إبطاء تشويقي عند الاقتراب من السلال
            }

            if (dist < speed) {
                ball.x = target.x;
                ball.y = target.y;
                ball.step++;

                if (target.pegRef) {
                    target.pegRef.glow = 12;
                    playSound('bounce', 0.9 + (ball.step / ball.path.length) * 0.4);
                    
                    if (target.isNearMiss) {
                        playSound('near_miss');
                        createParticles(target.x, target.y, "#00f2fe", 8);
                    }
                }
            } else {
                ball.x += (dx / dist) * speed;
                ball.y += (dy / dist) * speed;
            }
        }

        requestAnimationFrame(drawBoard);

        // خوارزمية توليد المسار التشويقي (Near-Miss)
        // تقرب الكرة من الخانات الكبيرة (مثل 500x أو 100x) ثم تنحرف بحركة فيزيائية طبيعية نحو الرقم الصغير المجاور
        function generateSuspensePath(targetMultiplier) {
            let validIndices = [];
            BUCKETS.forEach((b, idx) => {
                if (b.mult === targetMultiplier) validIndices.push(idx);
            });

            let targetBucketIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
            if (targetBucketIdx === undefined) targetBucketIdx = 7; // افتراضي في المنتصف

            const path = [];
            let currentX = canvas.width / 2;
            let currentY = 18;

            path.push({ x: currentX, y: currentY });

            // حساب عدد التحركات
            let rightMovesNeeded = targetBucketIdx;
            let totalSteps = BUCKETS.length - 1;

            let moves = [];
            for (let i = 0; i < rightMovesNeeded; i++) moves.push(1);
            while (moves.length < totalSteps) moves.push(0);

            // خلط الترتيب
            moves.sort(() => Math.random() - 0.5);

            // إذا كان الهدف رقم صغير بجانب رقم ضخم، لنجعل الانحراف يحدث في الصفوف الأخيرة لإثارة اللاعب
            const jackpotIndices = [0, 12, 14]; // 500x, 50x, 100x
            let buildSuspense = jackpotIndices.some(jIdx => Math.abs(jIdx - targetBucketIdx) === 1);

            const startY = 48;
            const rowSpacing = 38;
            const spacing = 29;

            let colIndex = 0;

            for (let r = 0; r < ROWS; r++) {
                const count = r + 3;
                const rowStartX = (canvas.width - (count - 1) * spacing) / 2;
                
                let move = moves[r];

                const pegX = rowStartX + (colIndex + move) * spacing;
                const pegY = startY + r * rowSpacing;

                const pegObj = PEGS.find(p => Math.abs(p.x - pegX) < 6 && Math.abs(p.y - pegY) < 6);

                let isNearMissPoint = false;
                if (buildSuspense && r >= ROWS - 3) {
                    isNearMissPoint = true; // علامة للتأثير المضيء والتشويق
                }

                path.push({ x: pegX, y: pegY - 6, pegRef: pegObj, isNearMiss: isNearMissPoint });

                if (move === 1) colIndex++;
            }

            const bucketWidth = 26;
            const bucketGap = 3;
            const totalBucketWidth = (BUCKETS.length * bucketWidth) + ((BUCKETS.length - 1) * bucketGap);
            const startX = (canvas.width - totalBucketWidth) / 2;
            const finalX = startX + targetBucketIdx * (bucketWidth + bucketGap) + bucketWidth / 2;
            const finalY = canvas.height - 25;

            path.push({ x: finalX, y: finalY });

            return path;
        }

        // الربط المباشر مع API السيرفر (app.py / app-٩.py)
        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    currentBalance = data.balance;
                    updateUIBalance();
                }
            } catch (err) {
                console.error("خطأ في جلب بيانات المستخدم:", err);
            }
        }

        function updateUIBalance() {
            document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
        }

        // بدء اللعب ودفع الرهان
        async function playGame() {
            if (isPlaying) return;

            const betInput = document.getElementById('betAmount');
            const betAmount = parseFloat(betInput.value);

            if (isNaN(betAmount) || betAmount < MIN_BET || betAmount > MAX_BET) {
                alert(`الرهان يجب أن يكون بين ${MIN_BET} و ${MAX_BET} NPS`);
                return;
            }

            if (currentBalance < betAmount) {
                alert("رصيدك غير كافٍ لإجراء هذا الرهان!");
                return;
            }

            isPlaying = true;
            document.getElementById('btnPlay').disabled = true;

            try {
                // خصم الرهان وإرسال الطلب للباك إند
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: GAME_ID,
                        bet_amount: betAmount
                    })
                });

                const result = await response.json();

                if (!result.success) {
                    alert(result.message || "حدث خطأ أثناء اللعب");
                    isPlaying = false;
                    document.getElementById('btnPlay').disabled = false;
                    return;
                }

                // تحديث رصيد اللاعب بعد استجابة السيرفر الفورية
                currentBalance = result.new_balance;
                updateUIBalance();

                // توليد مسار الحركة بناءً على نتيجة المضاعف
                const generatedPath = generateSuspensePath(result.multiplier);

                activeBalls.push({
                    x: canvas.width / 2,
                    y: 15,
                    radius: 6,
                    step: 0,
                    trail: [],
                    path: generatedPath,
                    resultData: result
                });

            } catch (err) {
                console.error("خطأ في الاتصال بالسيرفر:", err);
                alert("تعذر الاتصال بالسيرفر! يرجى التحقق من الشبكة.");
                isPlaying = false;
                document.getElementById('btnPlay').disabled = false;
            }
        }

        // عند هبوط الكرة وحساب النتيجة النهائية
        function onBallLanded(data) {
            isPlaying = false;
            document.getElementById('btnPlay').disabled = false;

            const toast = document.getElementById('resultToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastValue = document.getElementById('toastValue');

            // احتساب العائد: سعر الرهان * المضاعف
            if (data.win_amount > 0) {
                toastTitle.innerText = `عائد مضاعف (${data.multiplier}x)!`;
                toastValue.innerText = `+${data.win_amount.toFixed(2)} NPS`;
                
                if (data.multiplier >= 1.0) {
                    toastValue.style.color = "var(--accent-gold)";
                    playSound('win');
                } else {
                    toastValue.style.color = "var(--accent-cyan)";
                    playSound('loss');
                }
            } else {
                toastTitle.innerText = "لم تحالفك الحظ!";
                toastValue.innerText = `0.00 NPS`;
                toastValue.style.color = "var(--accent-red)";
                playSound('loss');
            }

            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);

            addHistoryBadge(data.multiplier, data.tier);
        }

        // إضافة الشارة للوحة السجل
        function addHistoryBadge(mult, tier) {
            const bar = document.getElementById('historyBar');
            const badge = document.createElement('div');
            badge.className = `history-badge tier-${tier}`;
            badge.innerText = `${mult}x`;

            bar.insertBefore(badge, bar.firstChild);

            if (bar.children.length > 8) {
                bar.removeChild(bar.lastChild);
            }
        }

        function setBet(val) {
            document.getElementById('betAmount').value = val;
        }

        document.getElementById('btnPlus').addEventListener('click', () => {
            const input = document.getElementById('betAmount');
            let val = parseInt(input.value) || MIN_BET;
            if (val < MAX_BET) input.value = Math.min(MAX_BET, val + 5);
        });

        document.getElementById('btnMinus').addEventListener('click', () => {
            const input = document.getElementById('betAmount');
            let val = parseInt(input.value) || MIN_BET;
            if (val > MIN_BET) input.value = Math.max(MIN_BET, val - 5);
        });

        // جلب رصيد المستخدم عند التحميل الأول
        fetchUserData();
    </script>
</body>
