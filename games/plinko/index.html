<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بلينكو VIP - Plinko NPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: #121824;
            --accent-gold: #ffd700;
            --accent-cyan: #00f2fe;
            --accent-green: #00e676;
            --accent-red: #ff2a5f;
            --text-main: #ffffff;
            --text-muted: #7e8b9b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            background: radial-gradient(circle at top, #182238 0%, #080b12 75%);
        }

        .header {
            width: 100%;
            max-width: 480px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-gold), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 5px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
        }

        .balance-box i { color: var(--accent-gold); font-size: 1rem; }
        .balance-amount { font-size: 1.05rem; font-weight: 800; color: #fff; }
        .currency-tag { color: var(--accent-gold); font-size: 0.8rem; font-weight: 700; }

        .game-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .history-bar {
            width: 100%;
            height: 34px;
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
            overflow-x: hidden;
            padding: 0 5px;
            margin-bottom: 8px;
        }

        .history-badge {
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 800;
            animation: slideIn 0.25s ease-out;
            white-space: nowrap;
        }

        @keyframes slideIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            background: rgba(10, 14, 23, 0.75);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9), 0 12px 35px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        canvas { display: block; max-width: 100%; }

        .controls-panel {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 22px 22px 0 0;
            padding: 18px;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
        }

        .control-group { margin-bottom: 12px; }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .bet-input-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 3px;
        }

        .btn-adjust {
            width: 42px;
            height: 42px;
            background: #1c2434;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-adjust:active { transform: scale(0.92); background: var(--accent-cyan); color: #000; }

        .bet-amount-display {
            flex: 1;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent-gold);
            border: none;
            background: transparent;
            outline: none;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .btn-quick {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 7px 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-quick:active { background: rgba(0, 242, 254, 0.2); border-color: var(--accent-cyan); }

        .btn-play {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            border: none;
            border-radius: 14px;
            color: #050a10;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 230, 118, 0.35);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-play:active { transform: translateY(2px); box-shadow: 0 2px 10px rgba(0, 230, 118, 0.2); }
        .btn-play:disabled { background: #222c3d; color: #505f75; box-shadow: none; cursor: not-allowed; }

        .result-toast {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(8, 12, 20, 0.94);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 12px 26px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
            z-index: 20;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-toast.show { transform: translate(-50%, -50%) scale(1); }
        .result-toast .title { font-size: 0.85rem; color: var(--text-muted); }
        .result-toast .value { font-size: 1.7rem; font-weight: 900; color: var(--accent-gold); }

        .tier-loss { background: rgba(255, 42, 95, 0.18); color: #ff2a5f; border: 1px solid #ff2a5f; }
        .tier-normal { background: rgba(255, 170, 0, 0.18); color: #ffaa00; border: 1px solid #ffaa00; }
        .tier-medium { background: rgba(0, 230, 118, 0.18); color: #00e676; border: 1px solid #00e676; }
        .tier-high { background: rgba(0, 242, 254, 0.18); color: #00f2fe; border: 1px solid #00f2fe; }
        .tier-mega { background: rgba(255, 215, 0, 0.25); color: #ffd700; border: 1px solid #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
    </style>
</head>
<body>

    <div class="header">
        <div class="game-title">
            <i class="fa-solid fa-circle-nodes"></i> بلينكو VIP
        </div>
        <div class="balance-box">
            <i class="fa-solid fa-coins"></i>
            <span class="balance-amount" id="userBalance">0.00</span>
            <span class="currency-tag">NPS</span>
        </div>
    </div>

    <div class="game-container">
        <div class="history-bar" id="historyBar"></div>

        <div class="canvas-wrapper">
            <canvas id="plinkoCanvas" width="420" height="460"></canvas>
            
            <div class="result-toast" id="resultToast">
                <div class="title" id="toastTitle">ربح جديد!</div>
                <div class="value" id="toastValue">+0.00 NPS</div>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <div class="control-label">
                <span>مبلغ الرهان (NPS)</span>
                <span>الحد الأدنى: 5 | الأقصى: 1000</span>
            </div>
            <div class="bet-input-box">
                <button class="btn-adjust" id="btnMinus"><i class="fa-solid fa-minus"></i></button>
                <input type="number" id="betAmount" class="bet-amount-display" value="10" min="5" max="1000" readonly>
                <button class="btn-adjust" id="btnPlus"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="quick-bets">
                <button class="btn-quick" onclick="setBet(5)">5</button>
                <button class="btn-quick" onclick="setBet(25)">25</button>
                <button class="btn-quick" onclick="setBet(100)">100</button>
                <button class="btn-quick" onclick="setBet(500)">500</button>
                <button class="btn-quick" onclick="setBet(1000)">1000</button>
            </div>
        </div>

        <button class="btn-play" id="btnPlay" onclick="playGame()">
            <i class="fa-solid fa-play"></i> إسقاط الكرة
        </button>
    </div>

    <script>
        const GAME_ID = "plinko";
        const MIN_BET = 5;
        const MAX_BET = 1000;
        
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || "1001";

        let currentBalance = 0;
        let isPlaying = false;

        // توليد الأصوات ديناميكياً بواسطة Web Audio API
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            try {
                if (AudioCtx.state === 'suspended') AudioCtx.resume();
                const osc = AudioCtx.createOscillator();
                const gain = AudioCtx.createGain();
                osc.connect(gain);
                gain.connect(AudioCtx.destination);

                if (type === 'bounce') {
                    osc.frequency.setValueAtTime(350 + Math.random() * 250, AudioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, AudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, AudioCtx.currentTime + 0.04);
                    osc.start();
                    osc.stop(AudioCtx.currentTime + 0.04);
                } else if (type === 'win') {
                    osc.frequency.setValueAtTime(400, AudioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(850, AudioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.15, AudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(AudioCtx.currentTime + 0.3);
                } else if (type === 'loss') {
                    osc.frequency.setValueAtTime(220, AudioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, AudioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, AudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(AudioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        // إعدادات اللوحة والـ Canvas
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');

        const ROWS = 8;
        const PEGS = [];
        const BUCKETS = [
            { label: '5x',   tier: 'mega', mult: 5 },
            { label: '2x',   tier: 'high', mult: 2 },
            { label: '1.2x', tier: 'medium', mult: 1.2 },
            { label: '0.5x', tier: 'normal', mult: 0.5 },
            { label: '0.1x', tier: 'loss', mult: 0.1 },
            { label: '0.2x', tier: 'loss', mult: 0.2 },
            { label: '1.2x', tier: 'medium', mult: 1.2 },
            { label: '2x',   tier: 'high', mult: 2 },
            { label: '5x',   tier: 'mega', mult: 5 }
        ];

        let activeBalls = [];
        let particles = [];

        function initBoard() {
            PEGS.length = 0;
            const startY = 55;
            const rowSpacing = 42;

            for (let r = 0; r < ROWS; r++) {
                const count = r + 3;
                const spacing = 36;
                const startX = (canvas.width - (count - 1) * spacing) / 2;

                for (let c = 0; c < count; c++) {
                    PEGS.push({
                        x: startX + c * spacing,
                        y: startY + r * rowSpacing,
                        radius: 4.5,
                        glow: 0
                    });
                }
            }
        }

        initBoard();

        // محرك الشرارات والجرافيكس
        function createParticles(x, y, color) {
            for (let i = 0; i < 14; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم شبكة خلفية ملونة ناعمة
            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            // رسم الدبابيس (Pegs)
            PEGS.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.glow > 0 ? 6.5 : 4.5, 0, Math.PI * 2);
                
                if (peg.glow > 0) {
                    ctx.fillStyle = "#00f2fe";
                    ctx.shadowColor = "#00f2fe";
                    ctx.shadowBlur = 18;
                    peg.glow--;
                } else {
                    ctx.fillStyle = "#8aa0b8";
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // رسم السلال
            const bucketWidth = 38;
            const bucketGap = 4;
            const totalBucketWidth = (BUCKETS.length * bucketWidth) + ((BUCKETS.length - 1) * bucketGap);
            const startX = (canvas.width - totalBucketWidth) / 2;
            const bucketY = canvas.height - 45;

            BUCKETS.forEach((b, i) => {
                const x = startX + i * (bucketWidth + bucketGap);
                
                let bgColor = "rgba(255, 42, 95, 0.15)";
                let borderColor = "#ff2a5f";
                let textColor = "#ff2a5f";

                if (b.tier === 'normal') { bgColor = "rgba(255, 170, 0, 0.18)"; borderColor = "#ffaa00"; textColor = "#ffaa00"; }
                if (b.tier === 'medium') { bgColor = "rgba(0, 230, 118, 0.18)"; borderColor = "#00e676"; textColor = "#00e676"; }
                if (b.tier === 'high') { bgColor = "rgba(0, 242, 254, 0.18)"; borderColor = "#00f2fe"; textColor = "#00f2fe"; }
                if (b.tier === 'mega') { bgColor = "rgba(255, 215, 0, 0.25)"; borderColor = "#ffd700"; textColor = "#ffd700"; }

                ctx.fillStyle = bgColor;
                ctx.beginPath();
                ctx.roundRect(x, bucketY, bucketWidth, 32, 6);
                ctx.fill();

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = textColor;
                ctx.font = "bold 11px Cairo";
                ctx.textAlign = "center";
                ctx.fillText(b.label, x + bucketWidth / 2, bucketY + 20);
            });

            // تحديث ورسم الشرارات
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            // رسم وتحديث الكرات مع ذيل الحركة (Trail)
            activeBalls.forEach((ball, index) => {
                ball.trail.push({ x: ball.x, y: ball.y });
                if (ball.trail.length > 8) ball.trail.shift();

                // ذيل الحركة
                for (let t = 0; t < ball.trail.length; t++) {
                    const pt = ball.trail[t];
                    const alpha = (t + 1) / ball.trail.length;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, ball.radius * (alpha * 0.7), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${alpha * 0.4})`;
                    ctx.fill();
                }

                // جسم الكرة
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ffd700";
                ctx.shadowColor = "#ffd700";
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;

                updateBallPath(ball, index);
            });

            requestAnimationFrame(drawBoard);
        }

        function updateBallPath(ball, index) {
            if (ball.step >= ball.path.length) {
                const targetBucketX = ball.x;
                const targetBucketY = ball.y;
                createParticles(targetBucketX, targetBucketY, ball.resultData.win_amount > 0 ? "#ffd700" : "#ff2a5f");
                
                activeBalls.splice(index, 1);
                onBallLanded(ball.resultData);
                return;
            }

            const target = ball.path[ball.step];
            const dx = target.x - ball.x;
            const dy = target.y - ball.y;
            const dist = Math.hypot(dx, dy);

            // إعطاء تأثير التشويق عبر تخفيف سرعة الكرة قليلاً عند الاقتراب من النهاية
            let speed = 7.5;
            if (ball.step >= ball.path.length - 3) {
                speed = 5.2; // إبطاء تشويقي قبل السقوط النهائي
            }

            if (dist < speed) {
                ball.x = target.x;
                ball.y = target.y;
                ball.step++;

                if (target.pegRef) {
                    target.pegRef.glow = 10;
                    playSound('bounce');
                }
            } else {
                ball.x += (dx / dist) * speed;
                ball.y += (dy / dist) * speed;
            }
        }

        requestAnimationFrame(drawBoard);

        // توليد مسار انسيابي طردي يطابق نتيجة السيرفر
        function generatePathForTier(targetTier) {
            let validIndices = [];
            BUCKETS.forEach((b, idx) => {
                if (b.tier === targetTier) validIndices.push(idx);
            });

            const targetBucketIdx = validIndices[Math.floor(Math.random() * validIndices.length)] || 4;

            const path = [];
            let currentX = canvas.width / 2;
            let currentY = 18;

            path.push({ x: currentX, y: currentY });

            let rightMovesNeeded = targetBucketIdx;
            let totalSteps = BUCKETS.length - 1;

            let moves = [];
            for (let i = 0; i < rightMovesNeeded; i++) moves.push(1);
            while (moves.length < totalSteps) moves.push(0);

            moves.sort(() => Math.random() - 0.5);

            const startY = 55;
            const rowSpacing = 42;
            const spacing = 36;

            let colIndex = 0;

            for (let r = 0; r < ROWS; r++) {
                const count = r + 3;
                const rowStartX = (canvas.width - (count - 1) * spacing) / 2;
                
                const pegX = rowStartX + (colIndex + moves[r]) * spacing;
                const pegY = startY + r * rowSpacing;

                const pegObj = PEGS.find(p => Math.abs(p.x - pegX) < 5 && Math.abs(p.y - pegY) < 5);

                path.push({ x: pegX, y: pegY - 7, pegRef: pegObj });

                if (moves[r] === 1) colIndex++;
            }

            const bucketWidth = 38;
            const bucketGap = 4;
            const totalBucketWidth = (BUCKETS.length * bucketWidth) + ((BUCKETS.length - 1) * bucketGap);
            const startX = (canvas.width - totalBucketWidth) / 2;
            const finalX = startX + targetBucketIdx * (bucketWidth + bucketGap) + bucketWidth / 2;
            const finalY = canvas.height - 28;

            path.push({ x: finalX, y: finalY });

            return path;
        }

        // الربط المباشر مع APIs السيرفر (app-٩.py)
        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    currentBalance = data.balance;
                    updateUIBalance();
                }
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        function updateUIBalance() {
            document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
        }

        async function playGame() {
            if (isPlaying) return;

            const betInput = document.getElementById('betAmount');
            const betAmount = parseFloat(betInput.value);

            if (isNaN(betAmount) || betAmount < MIN_BET || betAmount > MAX_BET) {
                alert(`الرهان يجب أن يكون بين ${MIN_BET} و ${MAX_BET} NPS`);
                return;
            }

            if (currentBalance < betAmount) {
                alert("رصيدك غير كافٍ للعب!");
                return;
            }

            isPlaying = true;
            document.getElementById('btnPlay').disabled = true;

            try {
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: GAME_ID,
                        bet_amount: betAmount
                    })
                });

                const result = await response.json();

                if (!result.success) {
                    alert(result.message || "حدث خطأ أثناء اللعب");
                    isPlaying = false;
                    document.getElementById('btnPlay').disabled = false;
                    return;
                }

                currentBalance = result.new_balance;
                updateUIBalance();

                const generatedPath = generatePathForTier(result.tier);

                activeBalls.push({
                    x: canvas.width / 2,
                    y: 15,
                    radius: 6.5,
                    step: 0,
                    trail: [],
                    path: generatedPath,
                    resultData: result
                });

            } catch (err) {
                console.error("خطأ بالسيرفر:", err);
                alert("تعذر الاتصال بالسيرفر!");
                isPlaying = false;
                document.getElementById('btnPlay').disabled = false;
            }
        }

        function onBallLanded(data) {
            isPlaying = false;
            document.getElementById('btnPlay').disabled = false;

            const toast = document.getElementById('resultToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastValue = document.getElementById('toastValue');

            if (data.win_amount > 0) {
                toastTitle.innerText = `عائد (${data.multiplier}x)!`;
                toastValue.innerText = `+${data.win_amount.toFixed(2)} NPS`;
                toastValue.style.color = data.multiplier >= 1.0 ? "var(--accent-gold)" : "var(--accent-cyan)";
                playSound('win');
            } else {
                toastTitle.innerText = "لم تحالفك الحظ!";
                toastValue.innerText = `0.00 NPS`;
                toastValue.style.color = "var(--accent-red)";
                playSound('loss');
            }

            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);

            addHistoryBadge(data.multiplier, data.tier);
        }

        function addHistoryBadge(mult, tier) {
            const bar = document.getElementById('historyBar');
            const badge = document.createElement('div');
            badge.className = `history-badge tier-${tier}`;
            badge.innerText = `${mult}x`;

            bar.insertBefore(badge, bar.firstChild);

            if (bar.children.length > 7) {
                bar.removeChild(bar.lastChild);
            }
        }

        function setBet(val) {
            document.getElementById('betAmount').value = val;
        }

        document.getElementById('btnPlus').addEventListener('click', () => {
            const input = document.getElementById('betAmount');
            let val = parseInt(input.value) || MIN_BET;
            if (val < MAX_BET) input.value = Math.min(MAX_BET, val + 5);
        });

        document.getElementById('btnMinus').addEventListener('click', () => {
            const input = document.getElementById('betAmount');
            let val = parseInt(input.value) || MIN_BET;
            if (val > MIN_BET) input.value = Math.max(MIN_BET, val - 5);
        });

        fetchUserData();
    </script>
</body>
</html>
