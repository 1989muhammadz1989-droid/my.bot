<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الخيل المباشر 🏇 - VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #070a12;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
        }

        /* الشريط العلوي الفاخر */
        .header {
            width: 100%;
            height: 52px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            z-index: 20;
        }
        .user-info { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.9rem; color: #e2e8f0; }
        .balance-box { 
            background: linear-gradient(135deg, #059669, #10b981); 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 0.95rem; 
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); 
            border: 1px solid #34d399;
        }
        .btn-close {
            background: rgba(239, 68, 68, 0.85);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-close:active { transform: scale(0.9); }

        /* شريط الرهانات المباشرة العائم (لا يغطي المضمار) */
        .live-ticker {
            width: 100%;
            height: 28px;
            background: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 15;
            font-size: 0.78rem;
        }
        .ticker-title {
            background: #d97706;
            color: #fff;
            padding: 0 10px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: bold;
            white-space: nowrap;
            z-index: 2;
            box-shadow: 2px 0 6px rgba(0,0,0,0.5);
        }
        .ticker-track {
            display: flex;
            gap: 20px;
            white-space: nowrap;
            will-change: transform;
            animation: tickerScroll 25s linear infinite;
        }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* منطقة مضمار السباق */
        .canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
            background: #020617;
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* حالة الرهان والعداد الصغير العائم */
        .status-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-weight: bold;
            color: #fbbf24;
            font-size: 0.88rem;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* لوحة الرهان السفلية */
        .controls {
            width: 100%;
            background: #0f172a;
            padding: 10px 12px;
            border-top: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
        }

        .horse-selector { display: flex; justify-content: space-between; gap: 6px; }
        .horse-btn { 
            flex: 1; 
            padding: 6px 0; 
            background: #1e293b; 
            border: 2px solid transparent; 
            border-radius: 8px; 
            color: #fff; 
            font-weight: bold; 
            font-size: 0.8rem; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
        }
        .horse-btn span.badge { font-size: 0.68rem; padding: 1px 4px; border-radius: 4px; background: rgba(255,255,255,0.12); }
        .horse-btn.selected { 
            background: linear-gradient(135deg, #b45309, #f59e0b); 
            border-color: #fef08a; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); 
        }

        .action-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .bet-control { 
            display: flex; 
            align-items: center; 
            background: #020617; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            padding: 2px;
        }
        .btn-step { 
            background: #2563eb; 
            border: none; 
            color: #fff; 
            width: 34px; 
            height: 34px; 
            border-radius: 6px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-step:active { transform: scale(0.92); }
        .bet-display { 
            padding: 0 10px; 
            font-size: 1rem; 
            font-weight: bold; 
            color: #38bdf8; 
            min-width: 75px; 
            text-align: center; 
        }

        .btn-play { 
            flex: 1;
            height: 38px;
            background: linear-gradient(135deg, #15803d, #22c55e); 
            border: none; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 0.95rem; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); 
            transition: all 0.2s; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-play.placed {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-play:disabled { background: #334155; cursor: not-allowed; box-shadow: none; filter: grayscale(0.8); }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="header">
        <div class="user-info">👤 <span id="userName">لاعب</span></div>
        <div class="balance-box">💰 <span id="userBalance">0</span> NPS</div>
        <button class="btn-close" onclick="exitGame()">✕</button>
    </div>

    <!-- شريط الرهانات المباشرة التلقائي -->
    <div class="live-ticker">
        <div class="ticker-title">🔴 مباشر</div>
        <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <!-- شاشة السباق Canvas -->
    <div class="canvas-container" id="canvasContainer">
        <div class="status-overlay" id="statusBar">⏳ جاري التحضير...</div>
        <canvas id="raceCanvas"></canvas>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls">
        <div class="horse-selector">
            <button class="horse-btn selected" onclick="selectHorse(1)">
                <span>خيل 1</span><span class="badge" style="color:#f87171">🔴 أحمر</span>
            </button>
            <button class="horse-btn" onclick="selectHorse(2)">
                <span>خيل 2</span><span class="badge" style="color:#60a5fa">🔵 أزرق</span>
            </button>
            <button class="horse-btn" onclick="selectHorse(3)">
                <span>خيل 3</span><span class="badge" style="color:#facc15">🟡 أصفر</span>
            </button>
            <button class="horse-btn" onclick="selectHorse(4)">
                <span>خيل 4</span><span class="badge" style="color:#c084fc">🟣 بنفسجي</span>
            </button>
            <button class="horse-btn" onclick="selectHorse(5)">
                <span>خيل 5</span><span class="badge" style="color:#4ade80">🟢 أخضر</span>
            </button>
        </div>

        <div class="action-row">
            <div class="bet-control">
                <button class="btn-step" onclick="adjustBet(-5)">-</button>
                <div class="bet-display"><span id="betAmount">5</span> NPS</div>
                <button class="btn-step" onclick="adjustBet(5)">+</button>
            </div>
            <button class="btn-play" id="playBtn" onclick="placeBet()">تاكيد الرهان للجولة القادمة</button>
        </div>
    </div>

    <script>
        // --- المحرك الصوتي الاصطناعي (Web Audio API) ---
        class SoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, duration, type = 'sine', gainVal = 0.1) {
                if (!this.ctx) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            playGallop() {
                if (!this.ctx) return;
                this.playTone(110, 0.04, 'triangle', 0.12);
                setTimeout(() => this.playTone(75, 0.04, 'sine', 0.08), 50);
            }
            playWhinny() {
                if (!this.ctx) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    let now = this.ctx.currentTime;
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.25);
                    osc.frequency.linearRampToValueAtTime(350, now + 0.6);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(now + 0.6);
                } catch(e){}
            }
            playBugle() {
                [300, 392, 493, 587].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.12, 'square', 0.06), i * 90);
                });
            }
            playWin() {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.22, 'sine', 0.18), i * 110);
                });
            }
            playLose() {
                [380, 320, 260, 200].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.2, 'sawtooth', 0.12), i * 130);
                });
            }
        }

        const audio = new SoundEngine();

        // --- المتغيرات العامة ---
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || '123456';

        let currentBalance = 0;
        let selectedHorse = 1;
        let betAmount = 5;
        let userHasBetInCurrentRound = false;
        let pendingBet = null; // { horse, amount }

        // أوقات الدورة التلقائية (بالثواني)
        const BETTING_TIME = 10; 
        const LOCK_TIME = 5;     // قفل الرهان في آخر 5 ثوانٍ قبل السباق
        const RACE_TIME = 15;    // مدة السباق 15 ثانية
        const RESULT_TIME = 4;

        let currentPhase = 'BETTING'; // BETTING, LOCKED, RACING, RESULT
        let phaseTimer = BETTING_TIME;
        let lastTimerUpdate = performance.now();

        const horseColors = ['#ef4444', '#3b82f6', '#eab308', '#a855f7', '#22c55e'];
        const horseDarkColors = ['#991b1b', '#1e40af', '#854d0e', '#6b21a8', '#166534'];

        let horses = [];
        let particles = [];
        let trackOffset = 0;
        let raceStartTime = 0;
        let winningHorseIndex = 1;
        let isWinResult = false;
        let lastGallopSoundTime = 0;

        // أسماء لاعبي الشريط المباشر
        const fakeNames = ['أحمد', 'سامر', 'عمر', 'خالد', 'محمد', 'يوسف', 'حمزة', 'علي', 'رامي', 'وسيم'];

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initHorses() {
            horses = [];
            let trackHeight = canvas.height;
            let laneHeight = trackHeight / 5;
            for (let i = 0; i < 5; i++) {
                horses.push({
                    id: i + 1,
                    x: 50,
                    y: laneHeight * i + laneHeight / 2,
                    color: horseColors[i],
                    darkColor: horseDarkColors[i],
                    gallopCycle: Math.random() * Math.PI * 2,
                    progress: 0
                });
            }
        }

        async function fetchUser() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    currentBalance = data.balance;
                    document.getElementById('userBalance').innerText = currentBalance;
                    document.getElementById('userName').innerText = data.full_name;
                }
            } catch (e) { console.error(e); }
        }

        function generateLiveTicker() {
            const track = document.getElementById('tickerTrack');
            let html = '';
            for (let i = 0; i < 15; i++) {
                let name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                let hNum = Math.floor(Math.random() * 5) + 1;
                let amt = (Math.floor(Math.random() * 10) + 1) * 5;
                html += `<div class="ticker-item">👤 <b>${name}</b> رهان <b>${amt} NPS</b> على 🐎 <b>خيل ${hNum}</b></div>`;
            }
            track.innerHTML = html + html; // تكرار لتمرير انسيابي
        }

        function selectHorse(num) {
            if (currentPhase === 'LOCKED' || currentPhase === 'RACING') return;
            selectedHorse = num;
            document.querySelectorAll('.horse-btn').forEach((btn, idx) => {
                btn.classList.toggle('selected', idx + 1 === num);
            });
        }

        function adjustBet(val) {
            if (currentPhase === 'LOCKED' || currentPhase === 'RACING') return;
            betAmount = Math.min(100, Math.max(5, betAmount + val));
            document.getElementById('betAmount').innerText = betAmount;
        }

        function exitGame() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                alert("إغلاق اللعبة");
            }
        }

        function placeBet() {
            audio.init();
            if (currentPhase === 'LOCKED' || currentPhase === 'RACING') return;
            if (currentBalance < betAmount) {
                alert("رصيدك غير كافٍ!");
                return;
            }

            pendingBet = { horse: selectedHorse, amount: betAmount };
            userHasBetInCurrentRound = true;

            let playBtn = document.getElementById('playBtn');
            playBtn.classList.add('placed');
            playBtn.innerText = `تم الرهان على خيل ${selectedHorse} (${betAmount} NPS) ✓`;
        }

        // --- محرك ورسم مضمار 2.5D الفاخر ---
        function drawTrack() {
            let w = canvas.width;
            let h = canvas.height;

            let bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, '#064e3b');
            bgGrad.addColorStop(1, '#022c22');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            let trackGrad = ctx.createLinearGradient(0, 0, 0, h);
            trackGrad.addColorStop(0, '#78350f');
            trackGrad.addColorStop(0.5, '#92400e');
            trackGrad.addColorStop(1, '#451a03');
            ctx.fillStyle = trackGrad;
            ctx.fillRect(0, 8, w, h - 16);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 2;
            ctx.setLineDash([15, 12]);
            let laneHeight = (h - 16) / 5;
            for (let i = 1; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 8 + i * laneHeight);
                ctx.lineTo(w, 8 + i * laneHeight);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // السياج
            ctx.fillStyle = '#f8fafc';
            let fenceSpacing = 45;
            for (let x = - (trackOffset % fenceSpacing); x < w + 20; x += fenceSpacing) {
                ctx.fillRect(x, 2, 6, 6);
                ctx.fillRect(x, h - 8, 6, 6);
            }

            // خط النهاية الشطرنجي
            let finishX = w - 60;
            let sq = 8;
            for (let y = 8; y < h - 8; y += sq) {
                let isWhite = Math.floor(y / sq) % 2 === 0;
                ctx.fillStyle = isWhite ? '#ffffff' : '#000000';
                ctx.fillRect(finishX, y, sq, sq);
                ctx.fillStyle = isWhite ? '#000000' : '#ffffff';
                ctx.fillRect(finishX + sq, y, sq, sq);
            }
        }

        function createDust(x, y) {
            if (Math.random() < 0.5) {
                particles.push({
                    x: x - 18,
                    y: y + 8 + (Math.random() * 6 - 3),
                    vx: -(Math.random() * 3 + 2),
                    vy: (Math.random() - 0.5) * 1.2,
                    radius: Math.random() * 4 + 2,
                    alpha: 0.6
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.035;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = '#d97706';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawRealisticHorse(h) {
            ctx.save();
            ctx.translate(h.x, h.y);
            let scale = 0.8;
            ctx.scale(scale, scale);

            // ظل
            ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
            ctx.beginPath();
            ctx.ellipse(0, 16, 26, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            let c = Math.sin(h.gallopCycle);
            let c2 = Math.cos(h.gallopCycle);

            drawLeg(ctx, -12, 4, c, true);
            drawLeg(ctx, -8, 4, -c, true);

            // جسم الخيل
            ctx.fillStyle = '#582f0e';
            ctx.beginPath();
            ctx.ellipse(0, -2, 20, 10, -0.05, 0, Math.PI * 2);
            ctx.fill();

            drawLeg(ctx, 10, 4, -c2, false);
            drawLeg(ctx, 14, 4, c2, false);

            // ذيل
            ctx.strokeStyle = '#1c1917';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(-20, -4);
            ctx.quadraticCurveTo(-30 + c * 3, -2 + c * 5, -32, 7);
            ctx.stroke();

            // السرج بلون الخيل
            ctx.fillStyle = h.color;
            ctx.beginPath();
            ctx.roundRect(-7, -12, 14, 9, 3);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 8px Arial';
            ctx.fillText(h.id, -2, -5);

            // الخيال
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(1, -16, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // الرأس والرقبة
            ctx.fillStyle = '#582f0e';
            ctx.beginPath();
            ctx.moveTo(10, -6);
            ctx.lineTo(22, -20 + c * 2);
            ctx.lineTo(29, -15 + c * 2);
            ctx.lineTo(18, 2);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawLeg(ctx, x, y, cycle, isBack) {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = '#3a1e08';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            let angle1 = cycle * 0.55;
            let angle2 = Math.sin(cycle) * 0.45 + 0.35;

            ctx.rotate(angle1);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, 9);
            ctx.translate(0, 9);
            ctx.rotate(isBack ? -angle2 : angle2);
            ctx.lineTo(0, 9);
            ctx.stroke();

            ctx.fillStyle = '#000';
            ctx.fillRect(-2, 8, 4, 3);
            ctx.restore();
        }

        // --- المعالجة الخلفية وتزامن الجولات ---
        async function processRoundBet() {
            if (!pendingBet) {
                // سباق وهمي عشوائي في حال عدم وجود رهان للمستخدم
                winningHorseIndex = Math.floor(Math.random() * 5) + 1;
                isWinResult = false;
                return;
            }

            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: 'horse_racing',
                        bet_amount: pendingBet.amount
                    })
                });
                const data = await res.json();

                if (data.success) {
                    currentBalance = data.new_balance;
                    isWinResult = data.win_amount > 0;

                    if (isWinResult) {
                        winningHorseIndex = pendingBet.horse;
                    } else {
                        let others = [1, 2, 3, 4, 5].filter(h => h !== pendingBet.horse);
                        winningHorseIndex = others[Math.floor(Math.random() * others.length)];
                    }
                } else {
                    winningHorseIndex = Math.floor(Math.random() * 5) + 1;
                    isWinResult = false;
                }
            } catch (e) {
                winningHorseIndex = Math.floor(Math.random() * 5) + 1;
                isWinResult = false;
            }
        }

        // --- الحلقة الرئيسية ذات الـ 60 إطار/ثانية ---
        function gameLoop(now) {
            let delta = (now - lastTimerUpdate) / 1000;
            lastTimerUpdate = now;

            // إدارة العداد والافتراضيات
            phaseTimer -= delta;

            if (currentPhase === 'BETTING') {
                if (phaseTimer <= LOCK_TIME) {
                    currentPhase = 'LOCKED';
                    document.getElementById('playBtn').disabled = true;
                }
                let secLeft = Math.ceil(phaseTimer);
                document.getElementById('statusBar').innerText = `🏇 فترة الرهان: تبقى ${secLeft} ثوانٍ`;
                trackOffset += 1;
                horses.forEach((h, idx) => {
                    h.gallopCycle += 0.08;
                    h.x = 50 + Math.sin(now / 350 + idx) * 8;
                });
            } 
            else if (currentPhase === 'LOCKED') {
                let secLeft = Math.ceil(phaseTimer);
                document.getElementById('statusBar').innerText = `🔒 تم قفل الرهان! ينطلق السباق خلال ${secLeft} ثوانٍ...`;
                trackOffset += 1;
                horses.forEach((h, idx) => {
                    h.gallopCycle += 0.08;
                    h.x = 50 + Math.sin(now / 350 + idx) * 8;
                });

                if (phaseTimer <= 0) {
                    startRacePhase();
                }
            } 
            else if (currentPhase === 'RACING') {
                let raceElapsed = (now - raceStartTime) / 1000;
                let progressRatio = Math.min(1, raceElapsed / RACE_TIME);
                let remaining = Math.max(0, RACE_TIME - raceElapsed).toFixed(1);

                document.getElementById('statusBar').innerText = `🏁 السباق جارٍ! متبقي: ${remaining} ثانية`;
                trackOffset += 12;

                if (now - lastGallopSoundTime > 190) {
                    audio.playGallop();
                    lastGallopSoundTime = now;
                }

                // خوارزمية السحب والحساب اللحظي المتقدمة
                horses.forEach((h, idx) => {
                    h.gallopCycle += 0.45;
                    createDust(h.x, h.y);

                    if (progressRatio < 0.70) {
                        // إيهام اللاعب بالتقدم والتقارب
                        if (pendingBet && h.id === pendingBet.horse) {
                            h.progress = progressRatio * 75 + (Math.sin(now / 140 + idx) * 3);
                        } else {
                            h.progress = progressRatio * 70 + (Math.cos(now / 140 + idx) * 3.5);
                        }
                    } else {
                        // آخر 30% من الوقت (التجاوز وإبطاء الخيل بشكل سلس عند الخسارة)
                        if (isWinResult) {
                            if (h.id === winningHorseIndex) h.progress = 75 + (progressRatio - 0.70) * 83;
                            else h.progress = 70 + (progressRatio - 0.70) * 55;
                        } else {
                            // الحصان المحدد يتباطأ بذكاء ليسبقه الحصان الفائز
                            if (h.id === winningHorseIndex) h.progress = 70 + (progressRatio - 0.70) * 100;
                            else if (pendingBet && h.id === pendingBet.horse) h.progress = 75 + (progressRatio - 0.70) * 60; // إبطاء ملموس
                            else h.progress = 68 + (progressRatio - 0.70) * 55;
                        }
                    }

                    h.x = 50 + (h.progress / 100) * (canvas.width - 120);
                });

                if (progressRatio >= 1) {
                    endRacePhase();
                }
            }
            else if (currentPhase === 'RESULT') {
                if (phaseTimer <= 0) {
                    resetToBettingPhase();
                }
            }

            // الرسم
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            updateAndDrawParticles();
            horses.forEach(drawRealisticHorse);

            requestAnimationFrame(gameLoop);
        }

        async function startRacePhase() {
            currentPhase = 'RACING';
            audio.playBugle();
            setTimeout(() => audio.playWhinny(), 400);

            initHorses();
            await processRoundBet();
            raceStartTime = performance.now();
        }

        function endRacePhase() {
            currentPhase = 'RESULT';
            phaseTimer = RESULT_TIME;
            document.getElementById('userBalance').innerText = currentBalance;

            if (pendingBet) {
                if (isWinResult) {
                    let winAmt = pendingBet.amount * 2;
                    document.getElementById('statusBar').innerText = `🎉 مبروك! فاز الخيل رقم ${winningHorseIndex} وحصلت على ${winAmt} NPS!`;
                    audio.playWin();
                } else {
                    document.getElementById('statusBar').innerText = `❌ خسارة! فاز الخيل رقم ${winningHorseIndex}`;
                    audio.playLose();
                }
            } else {
                document.getElementById('statusBar').innerText = `🏆 انتهى السباق! فاز الخيل رقم ${winningHorseIndex}`;
            }
        }

        function resetToBettingPhase() {
            currentPhase = 'BETTING';
            phaseTimer = BETTING_TIME;
            userHasBetInCurrentRound = false;
            pendingBet = null;

            let playBtn = document.getElementById('playBtn');
            playBtn.disabled = false;
            playBtn.classList.remove('placed');
            playBtn.innerText = "تاكيد الرهان للجولة القادمة";

            initHorses();
        }

        // تشغيل اللعبة عند التحميل
        initHorses();
        fetchUser();
        generateLiveTicker();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
