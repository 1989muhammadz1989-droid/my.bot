<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 لعبة إطلاق الصاروخ التفاعلية | Live Crash Rocket</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050204;
            --bg-card: rgba(18, 6, 10, 0.92);
            --primary-red: #ff0033;
            --bright-red: #ff2a55;
            --dark-red: #7a0016;
            --gold: #ffcc00;
            --green-cashout: #00e676;
            --text-light: #ffffff;
            --text-dim: #a0a0ab;
            --border-red: rgba(255, 0, 51, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #260008 0%, var(--bg-dark) 85%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Header */
        .header {
            background: rgba(8, 3, 5, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-red);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 0, 51, 0.25);
            z-index: 50;
        }

        .user-box { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; box-shadow: 0 0 12px rgba(255, 0, 51, 0.6);
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(122, 0, 22, 0.6), rgba(8, 0, 3, 0.95));
            border: 1px solid var(--primary-red);
            padding: 6px 14px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.35);
        }
        .balance-val { font-weight: 900; color: var(--gold); font-size: 1.1rem; }

        /* Canvas Display */
        .game-display {
            position: relative;
            width: 100%; height: 360px;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid var(--border-red);
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* Multiplier Overlay */
        .canvas-overlay {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .multiplier-text {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 25px var(--primary-red), 0 0 50px var(--bright-red);
            line-height: 1;
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-top: 8px;
        }
        .status-crashed { color: var(--primary-red) !important; text-shadow: 0 0 15px var(--primary-red); }
        .status-cashed { color: var(--green-cashout) !important; text-shadow: 0 0 15px var(--green-cashout); }

        /* Controls Panel */
        .controls-container {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .control-row { display: flex; gap: 10px; }

        .input-box {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-red);
            border-radius: 14px;
            padding: 8px 12px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .input-label { font-size: 0.72rem; color: var(--text-dim); font-weight: 700; }
        .input-controls { display: flex; align-items: center; justify-content: space-between; }

        .btn-step {
            width: 34px; height: 34px; border-radius: 8px;
            border: 1px solid var(--border-red);
            background: rgba(255, 0, 51, 0.15);
            color: #fff; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-step:active { transform: scale(0.92); background: var(--primary-red); }

        .bet-num {
            font-size: 1.2rem; font-weight: 900; color: #fff;
            background: transparent; border: none; text-align: center; width: 70px; outline: none;
        }

        /* Preset Row */
        .preset-row { display: flex; gap: 6px; }
        .btn-preset {
            flex: 1; padding: 6px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: var(--text-dim); font-size: 0.75rem; font-weight: 700; cursor: pointer;
        }

        /* Main Buttons */
        .btn-action {
            width: 100%; padding: 18px; border: none; border-radius: 16px;
            font-size: 1.35rem; font-weight: 900; color: #fff; cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 0, 51, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-launch {
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 50%, #ff5252 100%);
        }

        /* زر الانسحاب (سحب الأرباح) في وقت محدد */
        .btn-withdraw {
            background: linear-gradient(135deg, #007e33 0%, var(--green-cashout) 100%) !important;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.8) !important;
            animation: pulse-withdraw 0.8s infinite alternate;
        }

        @keyframes pulse-withdraw {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 230, 118, 0.6); }
            100% { transform: scale(1.02); box-shadow: 0 0 40px rgba(0, 230, 118, 1); }
        }

        .btn-disabled { background: #333 !important; color: #666 !important; box-shadow: none !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="header">
        <div class="user-box">
            <div class="avatar"><i class="fa-solid fa-rocket"></i></div>
            <div>
                <div class="user-name" id="u-name">جاري التحميل...</div>
                <div class="user-id">ID: <span id="u-id">--</span></div>
            </div>
        </div>
        <div class="balance-card">
            <i class="fa-solid fa-coins" style="color: var(--gold);"></i>
            <span class="balance-val" id="u-balance">0.00</span>
            <span style="font-size: 0.8rem;">$</span>
        </div>
    </header>

    <div class="game-display" id="display-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div class="canvas-overlay">
            <div class="multiplier-text" id="mult-display">1.00x</div>
            <div class="status-text" id="status-display">جاهز للإطلاق</div>
        </div>
    </div>

    <div class="controls-container">
        <div class="control-row">
            <div class="input-box">
                <span class="input-label">مبلغ الرهان (يبدأ من 5$)</span>
                <div class="input-controls">
                    <button class="btn-step" onclick="adjustBet(-5)">-</button>
                    <input type="number" id="bet-amount" class="bet-num" value="5" min="5" step="5">
                    <button class="btn-step" onclick="adjustBet(5)">+</button>
                </div>
            </div>

            <div class="input-box">
                <span class="input-label">الانسحاب التلقائي (Auto)</span>
                <div class="input-controls">
                    <button class="btn-step" onclick="adjustAuto(-0.5)">-</button>
                    <input type="number" id="auto-cashout" class="bet-num" value="2.00" min="1.1" step="0.5">
                    <button class="btn-step" onclick="adjustAuto(0.5)">+</button>
                </div>
            </div>
        </div>

        <div class="preset-row">
            <button class="btn-preset" onclick="setBet(5)">5$</button>
            <button class="btn-preset" onclick="adjustBet(5)">+5</button>
            <button class="btn-preset" onclick="adjustBet(10)">+10</button>
            <button class="btn-preset" onclick="multiplyBet(2)">X2</button>
            <button class="btn-preset" onclick="multiplyBet(0.5)">1/2</button>
        </div>

        <!-- زر الإطلاق وزر الانسحاب في الوقت المحدد -->
        <button id="action-btn" class="btn-action btn-launch" onclick="handleMainAction()">
            <i class="fa-solid fa-paper-plane"></i> <span>إطلاق الصاروخ (5.00 $)</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const urlParams = new URLSearchParams(window.location.search);
        const userId = tg?.initDataUnsafe?.user?.id || urlParams.get('user_id') || urlParams.get('telegram_id') || "123456789";

        let userBalance = 0.0;
        let gameState = 'IDLE'; // IDLE, RUNNING, CRASHED, CASHED_OUT
        let currentMult = 1.00;
        let targetCrashMult = 1.00;
        let betAmount = 5.0;
        let animProgress = 0;
        let particles = [];
        let stars = [];
        let shakeTime = 0;

        // Sound System
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'launch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 1.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.1);
                    osc.frequency.setValueAtTime(783, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                } else if (type === 'boom') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(25, now + 0.5);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                }
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.5);
            } catch(e) {}
        }

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?telegram_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    userBalance = data.balance;
                    document.getElementById('u-name').innerText = data.full_name || 'مستخدم تلجرام';
                    document.getElementById('u-id').innerText = data.user_id;
                    document.getElementById('u-balance').innerText = parseFloat(data.balance).toFixed(2);
                    updateActionBtnLabel();
                }
            } catch (err) {}
        }

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2,
                speed: Math.random() * 2 + 0.5
            });
        }

        // رسم الصاروخ الحي والنمو (Scaling Effect)
        function drawRealisticRocket(x, y, scaleMult) {
            ctx.save();
            ctx.translate(x, y);

            // اهتزاز محاكاة السرعة
            if (gameState === 'RUNNING' && currentMult > 2.0) {
                const shake = Math.random() * 3 - 1.5;
                ctx.translate(shake, shake);
            }

            // نمو وتكبير الصاروخ مع ارتفاغ المضاعف
            const baseScale = Math.min(1.8, 0.9 + (scaleMult - 1) * 0.12);
            ctx.scale(baseScale, baseScale);
            ctx.rotate(Math.PI / 3.8);

            // 1. لهب المحرك المباشر (Fire Exhaust)
            if (gameState === 'RUNNING') {
                const flameLength = 20 + Math.random() * 15;
                const grad = ctx.createLinearGradient(0, 15, 0, 15 + flameLength);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#ffcc00');
                grad.addColorStop(0.7, '#ff0033');
                grad.addColorStop(1, 'transparent');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(-6, 15);
                ctx.lineTo(6, 15);
                ctx.lineTo(0, 15 + flameLength);
                ctx.closePath();
                ctx.fill();
            }

            // 2. هيكل الصاروخ (Body)
            ctx.fillStyle = '#e6e6ed';
            ctx.beginPath();
            ctx.moveTo(0, -24);
            ctx.quadraticCurveTo(10, -5, 8, 15);
            ctx.lineTo(-8, 15);
            ctx.quadraticCurveTo(-10, -5, 0, -24);
            ctx.closePath();
            ctx.fill();

            // 3. أجنحة الصاروخ الحمراء (Wings)
            ctx.fillStyle = '#ff0033';
            // الجناح الأيمن
            ctx.beginPath();
            ctx.moveTo(7, 2); ctx.lineTo(16, 16); ctx.lineTo(7, 14);
            ctx.closePath(); ctx.fill();
            // الجناح الأيسر
            ctx.beginPath();
            ctx.moveTo(-7, 2); ctx.lineTo(-16, 16); ctx.lineTo(-7, 14);
            ctx.closePath(); ctx.fill();

            // 4. مقدمة الصاروخ (Red Nose)
            ctx.beginPath();
            ctx.moveTo(0, -24);
            ctx.quadraticCurveTo(6, -15, 6, -10);
            ctx.lineTo(-6, -10);
            ctx.quadraticCurveTo(-6, -15, 0, -24);
            ctx.fillStyle = '#ff0033';
            ctx.fill();

            // 5. نافذة القيادة المضيئة (Window)
            ctx.fillStyle = '#00e676';
            ctx.shadowColor = '#00e676';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(0, -3, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawExplosion(x, y) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, (1 - shakeTime) * 60, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 51, 0.4)';
            ctx.fill();
            ctx.restore();
        }

        function renderLoop() {
            // Background
            ctx.fillStyle = '#050204';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars Movement
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                if (gameState === 'RUNNING') {
                    s.y += s.speed * (currentMult * 0.4);
                    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                }
            });

            const startX = 50;
            const startY = canvas.height - 50;
            const targetX = canvas.width - 70;
            const targetY = 70;

            if (gameState === 'RUNNING') {
                animProgress += 0.006 * (1 + currentMult * 0.08);
                if (animProgress > 1) animProgress = 1;

                const curX = startX + (targetX - startX) * Math.min(animProgress, 0.85);
                const curY = startY - (startY - targetY) * Math.min(animProgress, 0.85);

                // Trajectory Glow Line
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(canvas.width * 0.35, canvas.height - 40, curX, curY);
                ctx.strokeStyle = '#ff0033';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0033';
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Fire Particles
                for (let i = 0; i < 2; i++) {
                    particles.push({
                        x: curX - 10, y: curY + 10,
                        vx: -Math.random() * 3, vy: Math.random() * 3 + 2,
                        size: Math.random() * 5 + 2,
                        color: Math.random() > 0.5 ? '#ffcc00' : '#ff0033',
                        life: 1.0
                    });
                }

                drawRealisticRocket(curX, curY, currentMult);

                // Growth Rate
                currentMult += 0.012 * Math.pow(currentMult, 1.04);
                document.getElementById('mult-display').innerText = currentMult.toFixed(2) + 'x';
                updateActionBtnLabel();

                // Auto Cashout
                const autoVal = parseFloat(document.getElementById('auto-cashout').value);
                if (autoVal && currentMult >= autoVal) {
                    executeCashout();
                }

                // Crash Check
                if (currentMult >= targetCrashMult) {
                    gameState = 'CRASHED';
                    playSound('boom');
                    shakeTime = 1.0;
                    createExplosionParticles(curX, curY);
                    onRocketCrashed();
                }

            } else if (gameState === 'CRASHED') {
                if (shakeTime > 0) {
                    shakeTime -= 0.03;
                    drawExplosion(targetX, targetY);
                }
                drawParticles();
            } else if (gameState === 'CASHED_OUT') {
                drawParticles();
            } else {
                drawRealisticRocket(startX, startY, 1.0);
            }

            requestAnimationFrame(renderLoop);
        }

        function createExplosionParticles(x, y) {
            particles = [];
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 7 + 2,
                    color: ['#ff0033', '#ffcc00', '#ffffff', '#ff2a55'][Math.floor(Math.random() * 4)],
                    life: 1.0
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                p.x += p.vx; p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        requestAnimationFrame(renderLoop);

        // التحكم بالأزرار و "زر الانسحاب في الوقت المحدد"
        function updateActionBtnLabel() {
            const btn = document.getElementById('action-btn');
            if (gameState === 'IDLE') {
                btn.className = 'btn-action btn-launch';
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>إطلاق الصاروخ (${betAmount.toFixed(2)} $)</span>`;
            } else if (gameState === 'RUNNING') {
                // زر الانسحاب المباشر مفعل فقط أثناء الطيران
                const currentProfit = (betAmount * currentMult).toFixed(2);
                btn.className = 'btn-action btn-withdraw';
                btn.innerHTML = `<i class="fa-solid fa-hand-holding-dollar"></i> <span>انسحاب الآن ($${currentProfit})</span>`;
            }
        }

        async function handleMainAction() {
            if (gameState === 'IDLE') {
                await startLaunch();
            } else if (gameState === 'RUNNING') {
                executeCashout();
            }
        }

        async function startLaunch() {
            if (userBalance < betAmount) {
                alert("رصيدك غير كافٍ للرهان!");
                return;
            }

            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = true;
            actionBtn.className = 'btn-action btn-disabled';

            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: "rocket", bet_amount: betAmount })
                });

                const data = await res.json();
                if (!data.success) {
                    alert(data.message || "خطأ في السيرفر!");
                    fetchUserData(); actionBtn.disabled = false; return;
                }

                userBalance = data.new_balance;
                document.getElementById('u-balance').innerText = userBalance.toFixed(2);
                targetCrashMult = data.multiplier === 0 ? (Math.random() * 0.25 + 1.03) : data.multiplier;

                gameState = 'RUNNING';
                currentMult = 1.00;
                animProgress = 0;
                document.getElementById('status-display').innerText = '🚀 الصاروخ يحلق بك... اضغط انسحاب قبل الانفجار!';
                document.getElementById('status-display').className = 'status-text';
                playSound('launch');

                actionBtn.disabled = false;
                updateActionBtnLabel();
            } catch (e) {
                alert("تعذر الاتصال بالسيرفر!");
                fetchUserData(); actionBtn.disabled = false;
            }
        }

        function executeCashout() {
            if (gameState !== 'RUNNING') return;
            gameState = 'CASHED_OUT';
            playSound('win');

            const winMult = currentMult.toFixed(2);
            document.getElementById('status-display').innerText = `🎉 تم الانسحاب بنجاح عند ${winMult}x!`;
            document.getElementById('status-display').className = 'status-text status-cashed';
            document.getElementById('mult-display').style.color = '#00e676';

            fetchUserData();
            setTimeout(resetToIdle, 3000);
        }

        function onRocketCrashed() {
            document.getElementById('status-display').innerText = `💥 انفجر الصاروخ عند ${targetCrashMult.toFixed(2)}x! (خسارة)`;
            document.getElementById('status-display').className = 'status-text status-crashed';
            document.getElementById('mult-display').style.color = '#ff0033';

            const btn = document.getElementById('action-btn');
            btn.className = 'btn-action btn-disabled';
            btn.innerHTML = `<span>انفجر الصاروخ!</span>`;

            fetchUserData();
            setTimeout(resetToIdle, 3000);
        }

        function resetToIdle() {
            gameState = 'IDLE';
            currentMult = 1.00;
            document.getElementById('mult-display').innerText = '1.00x';
            document.getElementById('mult-display').style.color = '#ffffff';
            document.getElementById('status-display').innerText = 'جاهز للإطلاق';
            document.getElementById('status-display').className = 'status-text';
            updateActionBtnLabel();
        }

        function adjustBet(delta) {
            betAmount = Math.max(5, betAmount + delta);
            document.getElementById('bet-amount').value = betAmount;
            updateActionBtnLabel();
        }
        function setBet(val) {
            betAmount = Math.max(5, val);
            document.getElementById('bet-amount').value = betAmount;
            updateActionBtnLabel();
        }
        function multiplyBet(factor) {
            betAmount = Math.max(5, Math.round(betAmount * factor));
            document.getElementById('bet-amount').value = betAmount;
            updateActionBtnLabel();
        }
        function adjustAuto(delta) {
            const el = document.getElementById('auto-cashout');
            let val = parseFloat(el.value) || 2.0;
            val = Math.max(1.1, val + delta);
            el.value = val.toFixed(2);
        }

        window.onload = fetchUserData;
    </script>
</body>
</html>
