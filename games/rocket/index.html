<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 لعبة إطلاق الصاروخ التفاعلية | Crash Rocket NPS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050204;
            --bg-card: rgba(18, 6, 10, 0.95);
            --primary-red: #ff0033;
            --bright-red: #ff2a55;
            --dark-red: #7a0016;
            --gold: #ffcc00;
            --green-cashout: #00e676;
            --text-light: #ffffff;
            --text-dim: #a0a0ab;
            --border-red: rgba(255, 0, 51, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #260008 0%, var(--bg-dark) 85%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
        }

        /* Container الرئيسي ملء الشاشة */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* النصف الأعلى: شاشة العرض والصاروخ (55% من الارتفاع) */
        .game-display {
            position: relative;
            height: 55vh;
            width: 100%;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid var(--border-red);
        }

        canvas { width: 100%; height: 100%; display: block; }

        .canvas-overlay {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .multiplier-text {
            font-size: 3.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 25px var(--primary-red), 0 0 50px var(--bright-red);
            line-height: 1;
        }

        .status-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gold);
            margin-top: 8px;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .status-crashed { color: var(--primary-red) !important; text-shadow: 0 0 15px var(--primary-red); }
        .status-cashed { color: var(--green-cashout) !important; text-shadow: 0 0 15px var(--green-cashout); }

        /* النصف الأسفل: مقسم إلى قسمين (45% من الارتفاع) */
        .bottom-section {
            height: 45vh;
            width: 100%;
            display: flex;
            background: rgba(5, 2, 4, 0.98);
            padding: 8px;
            gap: 8px;
        }

        /* القسم الأيمن: التحكم بالرهانات (60% من العرض) */
        .betting-panel {
            flex: 6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-red);
            border-radius: 12px;
            padding: 8px;
        }

        /* عرض الرصيد المدمج */
        .balance-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 0, 51, 0.1);
            border: 1px solid rgba(255, 0, 51, 0.3);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .balance-val { color: var(--gold); font-weight: 900; font-size: 0.95rem; }

        .input-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .input-label { font-size: 0.65rem; color: var(--text-dim); font-weight: 700; }
        .input-controls { display: flex; align-items: center; justify-content: space-between; }

        .btn-step {
            width: 28px; height: 28px; border-radius: 6px;
            border: 1px solid var(--border-red);
            background: rgba(255, 0, 51, 0.2);
            color: #fff; font-size: 1rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-step:active { background: var(--primary-red); }

        .bet-num {
            font-size: 1rem; font-weight: 900; color: #fff;
            background: transparent; border: none; text-align: center; width: 100%; outline: none;
        }

        .preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .btn-preset {
            padding: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; color: var(--text-dim); font-size: 0.7rem; font-weight: 700; cursor: pointer; text-align: center;
        }
        .btn-preset:active { background: rgba(255, 0, 51, 0.3); color: #fff; }

        /* زر الأكشن الرئيسي */
        .btn-action {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 900; color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-launch {
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 50%, #ff5252 100%);
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.4);
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #007e33 0%, var(--green-cashout) 100%) !important;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.8) !important;
            animation: pulse-withdraw 0.8s infinite alternate;
        }

        @keyframes pulse-withdraw {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .btn-disabled { background: #222 !important; color: #666 !important; box-shadow: none !important; cursor: not-allowed; }

        /* القسم الأيسر: قائمة اللاعبين المباشرة (40% من العرض) */
        .players-panel {
            flex: 4;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .live-title {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .live-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            height: 100%;
        }

        .live-item {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.65rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        .live-item-row { display: flex; justify-content: space-between; align-items: center; }
        .live-item .p-name { color: #ddd; max-width: 65px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
        .live-item .p-win { color: var(--green-cashout); font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- النصف الأعلى: العرض الجرافيكي -->
        <div class="game-display" id="display-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div class="canvas-overlay">
                <div class="multiplier-text" id="mult-display">0.00x</div>
                <div class="status-text" id="status-display">استعداد للإطلاق...</div>
            </div>
        </div>

        <!-- النصف الأسفل: لوحة التحكم المزدوجة -->
        <div class="bottom-section">
            <!-- القسم الأيمن: الخيارات والرهان -->
            <div class="betting-panel">
                <div class="balance-strip">
                    <span>رصيدك الحالي:</span>
                    <div><span class="balance-val" id="u-balance">0.00</span> <span style="color:var(--gold); font-size:0.75rem;">NPS</span></div>
                </div>

                <div class="input-box">
                    <span class="input-label">مبلغ الرهان (NPS)</span>
                    <div class="input-controls">
                        <button class="btn-step" onclick="adjustBet(-5)">-</button>
                        <input type="number" id="bet-amount" class="bet-num" value="5" min="5" step="5">
                        <button class="btn-step" onclick="adjustBet(5)">+</button>
                    </div>
                </div>

                <div class="preset-row">
                    <button class="btn-preset" onclick="setBet(5)">5 NPS</button>
                    <button class="btn-preset" onclick="adjustBet(5)">+5</button>
                    <button class="btn-preset" onclick="adjustBet(10)">+10</button>
                    <button class="btn-preset" onclick="multiplyBet(2)">X2</button>
                    <button class="btn-preset" onclick="multiplyBet(0.5)">1/2</button>
                    <button class="btn-preset" onclick="setBet(100)">100</button>
                </div>

                <button id="action-btn" class="btn-action btn-launch" onclick="handleMainAction()">
                    <i class="fa-solid fa-paper-plane"></i> <span id="action-btn-text">تأكيد الرهان (5 NPS)</span>
                </button>
            </div>

            <!-- القسم الأيسر: أسماء اللاعبين المباشرة -->
            <div class="players-panel">
                <div class="live-title"><i class="fa-solid fa-users"></i> المراهنون الان</div>
                <div class="live-list" id="live-list"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const urlParams = new URLSearchParams(window.location.search);
        const userId = tg?.initDataUnsafe?.user?.id || urlParams.get('user_id') || urlParams.get('telegram_id') || "123456789";

        let userBalance = 0.0;
        let gameState = 'COUNTDOWN'; // COUNTDOWN, RUNNING, CRASHED
        let currentMult = 0.00;      // تبدأ من 0.00x
        let targetCrashMult = 1.00;
        let betAmount = 5.0;
        let animProgress = 0;
        let particles = [];
        let stars = [];
        let shakeTime = 0;
        
        let hasBetInCurrentRound = false;
        let hasCashedOutCurrentRound = false;
        let countdownTimer = 5;
        let countdownInterval = null;

        // Sound System
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'launch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 1.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.1);
                    osc.frequency.setValueAtTime(783, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                } else if (type === 'boom') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(25, now + 0.5);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                }
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.5);
            } catch(e) {}
        }

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?telegram_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    userBalance = parseFloat(data.balance);
                    document.getElementById('u-balance').innerText = userBalance.toFixed(2);
                }
            } catch (err) {}
        }

        /* Fake Live Players Feed */
        const fakeNames = ["أحمد_VIP", "Samer_Sy", "محمود_x", "King_Crash", "عمر_99", "Ali_Pro", "سارة_K", "Mo_Gamer", "الأسد_77"];
        function updateLiveFeed() {
            const container = document.getElementById('live-list');
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                const bet = (Math.floor(Math.random() * 8) + 1) * 5;
                const mult = (Math.random() * 2.5 + 0.2).toFixed(2);
                const win = (bet * (1 + parseFloat(mult))).toFixed(1);
                
                const item = document.createElement('div');
                item.className = 'live-item';
                item.innerHTML = `
                    <div class="live-item-row">
                        <span class="p-name">${name}</span>
                        <span style="color:var(--text-dim)">${bet} NPS</span>
                    </div>
                    <div class="live-item-row" style="margin-top:2px;">
                        <span class="p-win">+${win} NPS</span>
                        <span style="color:var(--gold); font-size:0.6rem;">${mult}x</span>
                    </div>
                `;
                container.appendChild(item);
            }
        }
        setInterval(updateLiveFeed, 4000);
        updateLiveFeed();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2,
                speed: Math.random() * 2 + 0.5
            });
        }

        /* رسم الصاروخ */
        function drawRealisticRocket(x, y, scaleMult) {
            ctx.save();
            ctx.translate(x, y);

            if (gameState === 'RUNNING' && currentMult > 1.0) {
                const shake = Math.random() * 2 - 1;
                ctx.translate(shake, shake);
            }

            const baseScale = Math.min(1.5, 0.85 + scaleMult * 0.08);
            ctx.scale(baseScale, baseScale);
            ctx.rotate(Math.PI / 3.8);

            // لهب المحرك
            if (gameState === 'RUNNING') {
                const flameLength = 25 + Math.random() * 15;
                
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 15;

                const outerFlame = ctx.createLinearGradient(0, 18, 0, 18 + flameLength * 1.2);
                outerFlame.addColorStop(0, 'rgba(255, 42, 85, 0.8)');
                outerFlame.addColorStop(0.5, 'rgba(255, 204, 0, 0.5)');
                outerFlame.addColorStop(1, 'transparent');

                ctx.fillStyle = outerFlame;
                ctx.beginPath();
                ctx.moveTo(-10, 18); ctx.lineTo(10, 18); ctx.lineTo(0, 18 + flameLength * 1.2);
                ctx.closePath(); ctx.fill();

                const innerFlame = ctx.createLinearGradient(0, 18, 0, 18 + flameLength);
                innerFlame.addColorStop(0, '#ffffff');
                innerFlame.addColorStop(0.3, '#ffcc00');
                innerFlame.addColorStop(0.8, '#ff0033');
                innerFlame.addColorStop(1, 'transparent');

                ctx.fillStyle = innerFlame;
                ctx.beginPath();
                ctx.moveTo(-5, 18); ctx.lineTo(5, 18); ctx.lineTo(0, 18 + flameLength);
                ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 0;
            }

            // هيكل الصاروخ
            const bodyGrad = ctx.createLinearGradient(-12, 0, 12, 0);
            bodyGrad.addColorStop(0, '#d1d5db');
            bodyGrad.addColorStop(0.4, '#ffffff');
            bodyGrad.addColorStop(0.8, '#9ca3af');
            bodyGrad.addColorStop(1, '#4b5563');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -32);
            ctx.quadraticCurveTo(12, -8, 10, 18);
            ctx.lineTo(-10, 18);
            ctx.quadraticCurveTo(-12, -8, 0, -32);
            ctx.closePath(); ctx.fill();

            // أجنحة
            const wingGrad = ctx.createLinearGradient(-18, 0, 18, 0);
            wingGrad.addColorStop(0, '#ff0033');
            wingGrad.addColorStop(0.5, '#7a0016');
            wingGrad.addColorStop(1, '#ff0033');

            ctx.fillStyle = wingGrad;
            ctx.beginPath();
            ctx.moveTo(9, 4); ctx.lineTo(20, 20); ctx.lineTo(9, 17);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-9, 4); ctx.lineTo(-20, 20); ctx.lineTo(-9, 17);
            ctx.closePath(); ctx.fill();

            // قمة
            ctx.beginPath();
            ctx.moveTo(0, -32);
            ctx.quadraticCurveTo(7, -20, 7, -14);
            ctx.lineTo(-7, -14);
            ctx.quadraticCurveTo(-7, -20, 0, -32);
            ctx.fillStyle = '#ff0033';
            ctx.fill();

            // نافذة
            ctx.fillStyle = '#00e676';
            ctx.shadowColor = '#00e676';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, -6, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawExplosion(x, y) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, (1 - shakeTime) * 70, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 51, 0.4)';
            ctx.fill();
            ctx.restore();
        }

        function renderLoop() {
            ctx.fillStyle = '#050204';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // النجوم
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                if (gameState === 'RUNNING') {
                    s.y += s.speed * (1 + currentMult * 0.5);
                    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                }
            });

            const startX = 40;
            const startY = canvas.height - 30;
            const targetX = canvas.width - 50;
            const targetY = 50;

            if (gameState === 'RUNNING') {
                animProgress += 0.006 * (1 + currentMult * 0.05);
                if (animProgress > 1) animProgress = 1;

                const curX = startX + (targetX - startX) * Math.min(animProgress, 0.88);
                const curY = startY - (startY - targetY) * Math.min(animProgress, 0.88);

                // خط المسار
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(canvas.width * 0.3, canvas.height - 20, curX, curY);
                ctx.strokeStyle = '#ff0033';
                ctx.lineWidth = 3.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff0033';
                ctx.stroke();
                ctx.shadowBlur = 0;

                // لهب الجسيمات
                for (let i = 0; i < 2; i++) {
                    particles.push({
                        x: curX - 8, y: curY + 8,
                        vx: -Math.random() * 3, vy: Math.random() * 3 + 2,
                        size: Math.random() * 4 + 2,
                        color: Math.random() > 0.5 ? '#ffcc00' : '#ff0033',
                        life: 1.0
                    });
                }

                drawRealisticRocket(curX, curY, currentMult);

                // النسبة تبدأ من 0.00x وتزداد تدريجياً
                currentMult += 0.007 * Math.pow(currentMult + 1, 1.05);
                document.getElementById('mult-display').innerText = currentMult.toFixed(2) + 'x';

                updateUIState();

                // فحص الانفجار المباشر عند الوصول للهدف المحدد من السيرفر
                if (currentMult >= targetCrashMult) {
                    triggerCrash(curX, curY);
                }

            } else if (gameState === 'CRASHED') {
                if (shakeTime > 0) {
                    shakeTime -= 0.03;
                    drawExplosion(targetX, targetY);
                }
                drawParticles();
            } else {
                // حالة COUNTDOWN
                drawRealisticRocket(startX, startY, 0.0);
            }

            requestAnimationFrame(renderLoop);
        }

        function triggerCrash(x, y) {
            gameState = 'CRASHED';
            playSound('boom');
            shakeTime = 1.0;
            createExplosionParticles(x, y);

            document.getElementById('status-display').innerText = `💥 انفجر الصاروخ عند ${targetCrashMult.toFixed(2)}x!`;
            document.getElementById('status-display').className = 'status-text status-crashed';
            document.getElementById('mult-display').style.color = '#ff0033';

            updateUIState();
            fetchUserData();

            // الانتظار 5 ثواني بعد الانفجار لبدء جولة جديدة تلقائياً
            setTimeout(startCountdown, 2500);
        }

        function createExplosionParticles(x, y) {
            particles = [];
            for (let i = 0; i < 70; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 2,
                    color: ['#ff0033', '#ffcc00', '#ffffff', '#ff2a55'][Math.floor(Math.random() * 4)],
                    life: 1.0
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                p.x += p.vx; p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        requestAnimationFrame(renderLoop);

        /* إدارة دورة اللعبة والتوقيت التلقائي */
        function startCountdown() {
            gameState = 'COUNTDOWN';
            currentMult = 0.00;
            hasBetInCurrentRound = false;
            hasCashedOutCurrentRound = false;
            countdownTimer = 5;

            document.getElementById('mult-display').innerText = '0.00x';
            document.getElementById('mult-display').style.color = '#ffffff';
            document.getElementById('status-display').className = 'status-text';
            
            updateUIState();

            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                document.getElementById('status-display').innerText = `🚀 الجولة القادمة خلال (${countdownTimer}) ثوانٍ...`;
                countdownTimer--;

                if (countdownTimer < 0) {
                    clearInterval(countdownInterval);
                    launchRocketRound();
                }
            }, 1000);
        }

        async function launchRocketRound() {
            // توليد مضاعف حقيقي عشوائي للصاروخ للجولة الحالية
            targetCrashMult = parseFloat((Math.random() * 4 + 0.1).toFixed(2));
            
            gameState = 'RUNNING';
            animProgress = 0;
            document.getElementById('status-display').innerText = '🚀 الصاروخ يحلق الآن!';
            playSound('launch');
            updateUIState();
        }

        /* تحديث الواجهة حسب حالة اللعب */
        function updateUIState() {
            const btn = document.getElementById('action-btn');
            const btnText = document.getElementById('action-btn-text');

            if (gameState === 'COUNTDOWN') {
                if (hasBetInCurrentRound) {
                    btn.className = 'btn-action btn-disabled';
                    btnText.innerText = 'تم تمويل الرهان (انتظر الإطلاق)';
                } else {
                    btn.className = 'btn-action btn-launch';
                    btnText.innerText = `تأكيد الرهان (${betAmount.toFixed(2)} NPS)`;
                }
            } else if (gameState === 'RUNNING') {
                if (hasBetInCurrentRound && !hasCashedOutCurrentRound) {
                    // حساب المبلغ المسترد: الرهان + الرهان * المضاعف الحالي (عند 1.00x يصبح الضعف تماماً)
                    const currentReturn = (betAmount * (1 + currentMult)).toFixed(2);
                    btn.className = 'btn-action btn-withdraw';
                    btnText.innerText = `انسحاب الان (${currentReturn} NPS)`;
                } else if (hasCashedOutCurrentRound) {
                    btn.className = 'btn-action btn-disabled';
                    btnText.innerText = 'تم السحب بنجاح ✓';
                } else {
                    btn.className = 'btn-action btn-disabled';
                    btnText.innerText = 'انتظر الجولة القادمة...';
                }
            } else if (gameState === 'CRASHED') {
                btn.className = 'btn-action btn-disabled';
                btnText.innerText = 'انفجر الصاروخ!';
            }
        }

        async function handleMainAction() {
            if (gameState === 'COUNTDOWN' && !hasBetInCurrentRound) {
                await placeBet();
            } else if (gameState === 'RUNNING' && hasBetInCurrentRound && !hasCashedOutCurrentRound) {
                executeCashout();
            }
        }

        async function placeBet() {
            if (userBalance < betAmount) {
                alert("رصيدك غير كافٍ للرهان!");
                return;
            }

            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: "rocket", bet_amount: betAmount })
                });

                const data = await res.json();
                if (!data.success) {
                    alert(data.message || "خطأ في السيرفر!");
                    fetchUserData(); return;
                }

                userBalance = data.new_balance;
                document.getElementById('u-balance').innerText = userBalance.toFixed(2);

                // ربط النتيجة ببيانات السيرفر
                if (data.multiplier && data.multiplier > 0) {
                    targetCrashMult = data.multiplier;
                }

                hasBetInCurrentRound = true;
                updateUIState();
            } catch (e) {
                alert("تعذر الاتصال بالسيرفر!");
                fetchUserData();
            }
        }

        function executeCashout() {
            if (gameState !== 'RUNNING' || hasCashedOutCurrentRound) return;

            hasCashedOutCurrentRound = true;
            const winMult = currentMult.toFixed(2);
            const totalWin = (betAmount * (1 + currentMult)).toFixed(2);

            playSound('win');

            document.getElementById('status-display').innerText = `🎉 تم الانسحاب عند ${winMult}x (+${totalWin} NPS)!`;
            document.getElementById('status-display').className = 'status-text status-cashed';
            document.getElementById('mult-display').style.color = '#00e676';

            updateUIState();
            fetchUserData();
        }

        function adjustBet(delta) {
            betAmount = Math.max(5, betAmount + delta);
            document.getElementById('bet-amount').value = betAmount;
            updateUIState();
        }
        function setBet(val) {
            betAmount = Math.max(5, val);
            document.getElementById('bet-amount').value = betAmount;
            updateUIState();
        }
        function multiplyBet(factor) {
            betAmount = Math.max(5, Math.round(betAmount * factor));
            document.getElementById('bet-amount').value = betAmount;
            updateUIState();
        }

        window.onload = () => {
            fetchUserData();
            startCountdown();
        };
    </script>
</body>
</html>
