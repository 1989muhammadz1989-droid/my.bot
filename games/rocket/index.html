<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 لعبة إطلاق الصاروخ التفاعلية | Live Crash Rocket</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050204;
            --bg-card: rgba(18, 6, 10, 0.92);
            --primary-red: #ff0033;
            --bright-red: #ff2a55;
            --dark-red: #7a0016;
            --gold: #ffcc00;
            --green-cashout: #00e676;
            --text-light: #ffffff;
            --text-dim: #a0a0ab;
            --border-red: rgba(255, 0, 51, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #260008 0%, var(--bg-dark) 85%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .header {
            background: rgba(8, 3, 5, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-red);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.25);
            z-index: 50;
            height: 54px;
            flex-shrink: 0;
        }

        .user-box { display: flex; align-items: center; gap: 8px; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; box-shadow: 0 0 10px rgba(255, 0, 51, 0.6);
        }

        .user-name { font-size: 0.85rem; font-weight: 700; }
        .user-id { font-size: 0.7rem; color: var(--text-dim); }

        .balance-card {
            background: linear-gradient(135deg, rgba(122, 0, 22, 0.6), rgba(8, 0, 3, 0.95));
            border: 1px solid var(--primary-red);
            padding: 4px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 0 12px rgba(255, 0, 51, 0.35);
        }
        .balance-val { font-weight: 900; color: var(--gold); font-size: 1rem; }

        /* Main Game Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        /* Canvas Display Area */
        .game-display {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid var(--border-red);
            min-height: 0;
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* Multiplier Overlay */
        .canvas-overlay {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .multiplier-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 25px var(--primary-red), 0 0 50px var(--bright-red);
            line-height: 1;
        }

        .status-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .status-crashed { color: var(--primary-red) !important; text-shadow: 0 0 15px var(--primary-red); }
        .status-cashed { color: var(--green-cashout) !important; text-shadow: 0 0 15px var(--green-cashout); }

        /* Live Players Sidebar Overlay */
        .live-players-panel {
            position: absolute;
            top: 10px; right: 10px;
            width: 170px;
            max-height: 140px;
            background: rgba(10, 3, 6, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 0, 51, 0.3);
            border-radius: 10px;
            padding: 6px 8px;
            z-index: 15;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .live-title {
            font-size: 0.68rem;
            font-weight: 900;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 3px;
        }

        .live-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: hidden;
        }

        .live-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        .live-item .p-name { color: #ddd; max-width: 75px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .live-item .p-win { color: var(--green-cashout); font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Controls Panel */
        .controls-container {
            padding: 10px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            background: rgba(5, 2, 4, 0.98);
            flex-shrink: 0;
        }

        .control-row { display: flex; gap: 8px; }

        .input-box {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-red);
            border-radius: 12px;
            padding: 6px 10px;
            display: flex; flex-direction: column; gap: 2px;
        }

        .input-label { font-size: 0.7rem; color: var(--text-dim); font-weight: 700; }
        .input-controls { display: flex; align-items: center; justify-content: space-between; }

        .btn-step {
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid var(--border-red);
            background: rgba(255, 0, 51, 0.15);
            color: #fff; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-step:active { transform: scale(0.92); background: var(--primary-red); }

        .bet-num {
            font-size: 1.15rem; font-weight: 900; color: #fff;
            background: transparent; border: none; text-align: center; width: 100%; outline: none;
        }

        /* Preset Row */
        .preset-row { display: flex; gap: 6px; }
        .btn-preset {
            flex: 1; padding: 6px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: var(--text-dim); font-size: 0.75rem; font-weight: 700; cursor: pointer;
        }
        .btn-preset:active { background: rgba(255, 0, 51, 0.3); color: #fff; }

        /* Main Action Button */
        .btn-action {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            font-size: 1.2rem; font-weight: 900; color: #fff; cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 51, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-launch {
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 50%, #ff5252 100%);
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #007e33 0%, var(--green-cashout) 100%) !important;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.8) !important;
            animation: pulse-withdraw 0.8s infinite alternate;
        }

        @keyframes pulse-withdraw {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 230, 118, 0.6); }
            100% { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 230, 118, 1); }
        }

        .btn-disabled { background: #333 !important; color: #666 !important; box-shadow: none !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="header">
        <div class="user-box">
            <div class="avatar"><i class="fa-solid fa-rocket"></i></div>
            <div>
                <div class="user-name" id="u-name">جاري التحميل...</div>
                <div class="user-id">ID: <span id="u-id">--</span></div>
            </div>
        </div>
        <div class="balance-card">
            <i class="fa-solid fa-coins" style="color: var(--gold);"></i>
            <span class="balance-val" id="u-balance">0.00</span>
            <span style="font-size: 0.8rem;">$</span>
        </div>
    </header>

    <div class="main-container">
        <div class="game-display" id="display-wrapper">
            <!-- Live Players Box -->
            <div class="live-players-panel">
                <div class="live-title"><i class="fa-solid fa-users"></i> يلعبون الآن (مباشر)</div>
                <div class="live-list" id="live-list"></div>
            </div>

            <canvas id="gameCanvas"></canvas>
            <div class="canvas-overlay">
                <div class="multiplier-text" id="mult-display">1.00x</div>
                <div class="status-text" id="status-display">جاهز للإطلاق</div>
            </div>
        </div>

        <div class="controls-container">
            <div class="control-row">
                <div class="input-box">
                    <span class="input-label">مبلغ الرهان (يبدأ من 5$)</span>
                    <div class="input-controls">
                        <button class="btn-step" onclick="adjustBet(-5)">-</button>
                        <input type="number" id="bet-amount" class="bet-num" value="5" min="5" step="5">
                        <button class="btn-step" onclick="adjustBet(5)">+</button>
                    </div>
                </div>
            </div>

            <div class="preset-row">
                <button class="btn-preset" onclick="setBet(5)">5$</button>
                <button class="btn-preset" onclick="adjustBet(5)">+5</button>
                <button class="btn-preset" onclick="adjustBet(10)">+10</button>
                <button class="btn-preset" onclick="multiplyBet(2)">X2</button>
                <button class="btn-preset" onclick="multiplyBet(0.5)">1/2</button>
            </div>

            <button id="action-btn" class="btn-action btn-launch" onclick="handleMainAction()">
                <i class="fa-solid fa-paper-plane"></i> <span>إطلاق الصاروخ (5.00 $)</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const urlParams = new URLSearchParams(window.location.search);
        const userId = tg?.initDataUnsafe?.user?.id || urlParams.get('user_id') || urlParams.get('telegram_id') || "123456789";

        let userBalance = 0.0;
        let gameState = 'IDLE'; // IDLE, RUNNING, CRASHED, CASHED_OUT
        let currentMult = 1.00;
        let targetCrashMult = 1.00;
        let visualMaxMult = 1.00; // للمحاكاة البصرية عند الانسحاب المبكر
        let betAmount = 5.0;
        let animProgress = 0;
        let particles = [];
        let stars = [];
        let shakeTime = 0;
        let playerCashedOutEarly = false;

        // Sound System
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'launch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 1.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.1);
                    osc.frequency.setValueAtTime(783, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                } else if (type === 'boom') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(25, now + 0.5);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                }
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.5);
            } catch(e) {}
        }

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?telegram_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    userBalance = data.balance;
                    document.getElementById('u-name').innerText = data.full_name || 'مستخدم تلجرام';
                    document.getElementById('u-id').innerText = data.user_id;
                    document.getElementById('u-balance').innerText = parseFloat(data.balance).toFixed(2);
                    updateActionBtnLabel();
                }
            } catch (err) {}
        }

        /* Fake Live Players Feed */
        const fakeNames = ["أحمد_VIP", "Samer_Sy", "محمود_x", "King_Crash", "عمر_99", "Ali_Pro", "سارة_K", "Mo_Gamer", "الأسد_77"];
        function updateLiveFeed() {
            const container = document.getElementById('live-list');
            container.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                const bet = (Math.floor(Math.random() * 8) + 1) * 5;
                const mult = (Math.random() * 3 + 1.2).toFixed(2);
                const win = (bet * mult).toFixed(1);
                
                const item = document.createElement('div');
                item.className = 'live-item';
                item.innerHTML = `
                    <span class="p-name">${name}</span>
                    <span style="color:var(--text-dim)">$${bet}</span>
                    <span class="p-win">+${win}$ (${mult}x)</span>
                `;
                container.appendChild(item);
            }
        }
        setInterval(updateLiveFeed, 3500);
        updateLiveFeed();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2,
                speed: Math.random() * 2 + 0.5
            });
        }

        /* رسم الصاروخ الجمالي المطور بالكامل */
        function drawRealisticRocket(x, y, scaleMult) {
            ctx.save();
            ctx.translate(x, y);

            if ((gameState === 'RUNNING' || gameState === 'CASHED_OUT') && currentMult > 2.0) {
                const shake = Math.random() * 2 - 1;
                ctx.translate(shake, shake);
            }

            const baseScale = Math.min(1.6, 0.85 + (scaleMult - 1) * 0.08);
            ctx.scale(baseScale, baseScale);
            ctx.rotate(Math.PI / 3.8);

            // 1. لهب المحرك النيون المتعدد الطبقات
            if (gameState === 'RUNNING' || gameState === 'CASHED_OUT') {
                const flameLength = 28 + Math.random() * 18;
                
                // التوهج الخارجي
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 15;

                // لهب خفيف واسع
                const outerFlame = ctx.createLinearGradient(0, 18, 0, 18 + flameLength * 1.2);
                outerFlame.addColorStop(0, 'rgba(255, 42, 85, 0.8)');
                outerFlame.addColorStop(0.5, 'rgba(255, 204, 0, 0.5)');
                outerFlame.addColorStop(1, 'transparent');

                ctx.fillStyle = outerFlame;
                ctx.beginPath();
                ctx.moveTo(-10, 18); ctx.lineTo(10, 18); ctx.lineTo(0, 18 + flameLength * 1.2);
                ctx.closePath(); ctx.fill();

                // لهب محرك داخلي حاد
                const innerFlame = ctx.createLinearGradient(0, 18, 0, 18 + flameLength);
                innerFlame.addColorStop(0, '#ffffff');
                innerFlame.addColorStop(0.3, '#ffcc00');
                innerFlame.addColorStop(0.8, '#ff0033');
                innerFlame.addColorStop(1, 'transparent');

                ctx.fillStyle = innerFlame;
                ctx.beginPath();
                ctx.moveTo(-5, 18); ctx.lineTo(5, 18); ctx.lineTo(0, 18 + flameLength);
                ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 0;
            }

            // 2. الهيكل المعدني المطور (Futuristic Metallic Body)
            const bodyGrad = ctx.createLinearGradient(-12, 0, 12, 0);
            bodyGrad.addColorStop(0, '#d1d5db');
            bodyGrad.addColorStop(0.4, '#ffffff');
            bodyGrad.addColorStop(0.8, '#9ca3af');
            bodyGrad.addColorStop(1, '#4b5563');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -32);
            ctx.quadraticCurveTo(12, -8, 10, 18);
            ctx.lineTo(-10, 18);
            ctx.quadraticCurveTo(-12, -8, 0, -32);
            ctx.closePath(); ctx.fill();

            // 3. أجنحة نيون حمراء رياضية
            const wingGrad = ctx.createLinearGradient(-18, 0, 18, 0);
            wingGrad.addColorStop(0, '#ff0033');
            wingGrad.addColorStop(0.5, '#7a0016');
            wingGrad.addColorStop(1, '#ff0033');

            ctx.fillStyle = wingGrad;
            // جناح أيمن
            ctx.beginPath();
            ctx.moveTo(9, 4); ctx.lineTo(20, 20); ctx.lineTo(9, 17);
            ctx.closePath(); ctx.fill();
            // جناح أيسر
            ctx.beginPath();
            ctx.moveTo(-9, 4); ctx.lineTo(-20, 20); ctx.lineTo(-9, 17);
            ctx.closePath(); ctx.fill();

            // 4. قمة الصاروخ المصقولة (Red Nose)
            ctx.beginPath();
            ctx.moveTo(0, -32);
            ctx.quadraticCurveTo(7, -20, 7, -14);
            ctx.lineTo(-7, -14);
            ctx.quadraticCurveTo(-7, -20, 0, -32);
            ctx.fillStyle = '#ff0033';
            ctx.fill();

            // 5. نافذة القيادة الزجاجية مع التوهج (Cockpit Window)
            ctx.fillStyle = '#00e676';
            ctx.shadowColor = '#00e676';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, -6, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // انعكاس زجاجي
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(-1.5, -7.5, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawExplosion(x, y) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, (1 - shakeTime) * 70, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 51, 0.4)';
            ctx.fill();
            ctx.restore();
        }

        function renderLoop() {
            ctx.fillStyle = '#050204';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // تحريك النجوم
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                if (gameState === 'RUNNING' || gameState === 'CASHED_OUT') {
                    s.y += s.speed * (currentMult * 0.35);
                    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                }
            });

            const startX = 40;
            const startY = canvas.height - 40;
            const targetX = canvas.width - 60;
            const targetY = 60;

            if (gameState === 'RUNNING' || gameState === 'CASHED_OUT') {
                animProgress += 0.005 * (1 + currentMult * 0.04);
                if (animProgress > 1) animProgress = 1;

                const curX = startX + (targetX - startX) * Math.min(animProgress, 0.88);
                const curY = startY - (startY - targetY) * Math.min(animProgress, 0.88);

                // مسار Glow التفاعلي
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(canvas.width * 0.3, canvas.height - 30, curX, curY);
                ctx.strokeStyle = '#ff0033';
                ctx.lineWidth = 3.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff0033';
                ctx.stroke();
                ctx.shadowBlur = 0;

                // جسيمات اللهب خلف الصاروخ
                for (let i = 0; i < 2; i++) {
                    particles.push({
                        x: curX - 8, y: curY + 8,
                        vx: -Math.random() * 3, vy: Math.random() * 3 + 2,
                        size: Math.random() * 4 + 2,
                        color: Math.random() > 0.5 ? '#ffcc00' : '#ff0033',
                        life: 1.0
                    });
                }

                drawRealisticRocket(curX, curY, currentMult);

                // تسارع بطيء للمضاعف (تدرج سلِس)
                currentMult += 0.008 * Math.pow(currentMult, 1.02);
                document.getElementById('mult-display').innerText = currentMult.toFixed(2) + 'x';

                if (gameState === 'RUNNING') {
                    updateActionBtnLabel();
                    // فحص الانفجار في حالة الرهان الفعال
                    if (currentMult >= targetCrashMult) {
                        gameState = 'CRASHED';
                        playSound('boom');
                        shakeTime = 1.0;
                        createExplosionParticles(curX, curY);
                        onRocketCrashed();
                    }
                } else if (gameState === 'CASHED_OUT') {
                    // إذا كان انسحب مبكراً، الصاروخ يكمل الطيران لمضاعفات عالية (10x, 20x, 50x)
                    if (currentMult >= visualMaxMult) {
                        gameState = 'IDLE';
                        setTimeout(resetToIdle, 1000);
                    }
                }

            } else if (gameState === 'CRASHED') {
                if (shakeTime > 0) {
                    shakeTime -= 0.03;
                    drawExplosion(targetX, targetY);
                }
                drawParticles();
            } else {
                drawRealisticRocket(startX, startY, 1.0);
            }

            requestAnimationFrame(renderLoop);
        }

        function createExplosionParticles(x, y) {
            particles = [];
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 2,
                    color: ['#ff0033', '#ffcc00', '#ffffff', '#ff2a55'][Math.floor(Math.random() * 4)],
                    life: 1.0
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                p.x += p.vx; p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        requestAnimationFrame(renderLoop);

        // التحكم بالأزرار و "زر الانسحاب"
        function updateActionBtnLabel() {
            const btn = document.getElementById('action-btn');
            if (gameState === 'IDLE') {
                btn.className = 'btn-action btn-launch';
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>إطلاق الصاروخ (${betAmount.toFixed(2)} $)</span>`;
            } else if (gameState === 'RUNNING') {
                const currentProfit = (betAmount * currentMult).toFixed(2);
                btn.className = 'btn-action btn-withdraw';
                btn.innerHTML = `<i class="fa-solid fa-hand-holding-dollar"></i> <span>انسحاب الآن ($${currentProfit})</span>`;
            }
        }

        async function handleMainAction() {
            if (gameState === 'IDLE') {
                await startLaunch();
            } else if (gameState === 'RUNNING') {
                executeCashout();
            }
        }

        async function startLaunch() {
            if (userBalance < betAmount) {
                alert("رصيدك غير كافٍ للرهان!");
                return;
            }

            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = true;
            actionBtn.className = 'btn-action btn-disabled';

            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: "rocket", bet_amount: betAmount })
                });

                const data = await res.json();
                if (!data.success) {
                    alert(data.message || "خطأ في السيرفر!");
                    fetchUserData(); actionBtn.disabled = false; return;
                }

                userBalance = data.new_balance;
                document.getElementById('u-balance').innerText = userBalance.toFixed(2);
                
                // تحكم الخوارزمية: إذا لم يتم التحكم بها لاتتعدى 2x (إلا عند الانسحاب المبكر)
                let serverMult = data.multiplier === 0 ? (Math.random() * 0.8 + 1.1) : data.multiplier;
                targetCrashMult = serverMult;
                playerCashedOutEarly = false;

                gameState = 'RUNNING';
                currentMult = 1.00;
                animProgress = 0;
                document.getElementById('status-display').innerText = '🚀 الصاروخ يحلق بك... اضغط انسحاب قبل الانفجار!';
                document.getElementById('status-display').className = 'status-text';
                playSound('launch');

                actionBtn.disabled = false;
                updateActionBtnLabel();
            } catch (e) {
                alert("تعذر الاتصال بالسيرفر!");
                fetchUserData(); actionBtn.disabled = false;
            }
        }

        /* الانسحاب المباشر يضمن الربح + الصاروخ يكمل الطيران بجمالية لـ 10x-50x */
        function executeCashout() {
            if (gameState !== 'RUNNING') return;
            
            const winMult = currentMult.toFixed(2);
            playerCashedOutEarly = true;
            gameState = 'CASHED_OUT';
            playSound('win');

            // تحديد هدف بصري عالي للصاروخ (10x / 20x / 50x) لإعطاء جمالية وإثارة
            const visualTargets = [10.5, 22.0, 48.5, 65.0];
            visualMaxMult = visualTargets[Math.floor(Math.random() * visualTargets.length)];

            document.getElementById('status-display').innerText = `🎉 تم الانسحاب بنجاح عند ${winMult}x!`;
            document.getElementById('status-display').className = 'status-text status-cashed';
            document.getElementById('mult-display').style.color = '#00e676';

            const btn = document.getElementById('action-btn');
            btn.className = 'btn-action btn-disabled';
            btn.innerHTML = `<span>تم سحب الأرباح بنجاح ✓</span>`;

            fetchUserData();
        }

        function onRocketCrashed() {
            document.getElementById('status-display').innerText = `💥 انفجر الصاروخ عند ${targetCrashMult.toFixed(2)}x! (خسارة)`;
            document.getElementById('status-display').className = 'status-text status-crashed';
            document.getElementById('mult-display').style.color = '#ff0033';

            const btn = document.getElementById('action-btn');
            btn.className = 'btn-action btn-disabled';
            btn.innerHTML = `<span>انفجر الصاروخ!</span>`;

            fetchUserData();
            setTimeout(resetToIdle, 3000);
        }

        function resetToIdle() {
            gameState = 'IDLE';
            currentMult = 1.00;
            document.getElementById('mult-display').innerText = '1.00x';
            document.getElementById('mult-display').style.color = '#ffffff';
            document.getElementById('status-display').innerText = 'جاهز للإطلاق';
            document.getElementById('status-display').className = 'status-text';
            updateActionBtnLabel();
        }

        function adjustBet(delta) {
            betAmount = Math.max(5, betAmount + delta);
            document.getElementById('bet-amount').value = betAmount;
            updateActionBtnLabel();
        }
        function setBet(val) {
            betAmount = Math.max(5, val);
            document.getElementById('bet-amount').value = betAmount;
            updateActionBtnLabel();
        }
        function multiplyBet(factor) {
            betAmount = Math.max(5, Math.round(betAmount * factor));
            document.getElementById('bet-amount').value = betAmount;
            updateActionBtnLabel();
        }

        window.onload = fetchUserData;
    </script>
</body>
</html>
