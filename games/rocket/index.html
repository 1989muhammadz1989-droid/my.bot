<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 لعبة إطلاق الصاروخ التفاعلية | Crash Rocket NPS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #030108;
            --bg-card: rgba(15, 5, 12, 0.95);
            --primary-red: #ff0033;
            --bright-red: #ff2a55;
            --dark-red: #7a0016;
            --gold: #ffcc00;
            --green-cashout: #00e676;
            --text-light: #ffffff;
            --text-dim: #a0a0ab;
            --border-red: rgba(255, 0, 51, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #2a000a 0%, var(--bg-dark) 90%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .game-display {
            position: relative;
            height: 58vh;
            width: 100%;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid var(--border-red);
        }

        canvas { width: 100%; height: 100%; display: block; }

        .canvas-overlay {
            position: absolute;
            top: 38%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .multiplier-text {
            font-size: 4.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px var(--primary-red), 0 0 60px var(--bright-red);
            line-height: 1;
            font-family: monospace, 'Tajawal';
        }

        .status-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold);
            margin-top: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }
        .status-crashed { color: var(--primary-red) !important; text-shadow: 0 0 15px var(--primary-red); border-color: var(--primary-red); }
        .status-cashed { color: var(--green-cashout) !important; text-shadow: 0 0 15px var(--green-cashout); border-color: var(--green-cashout); }

        .bottom-section {
            height: 42vh;
            width: 100%;
            display: flex;
            background: rgba(3, 1, 8, 0.98);
            padding: 8px;
            gap: 8px;
        }

        .betting-panel {
            flex: 6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-red);
            border-radius: 12px;
            padding: 10px;
        }

        .balance-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 0, 51, 0.12);
            border: 1px solid rgba(255, 0, 51, 0.35);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .balance-val { color: var(--gold); font-weight: 900; font-size: 1rem; }

        .input-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .input-label { font-size: 0.7rem; color: var(--text-dim); font-weight: 700; }
        .input-controls { display: flex; align-items: center; justify-content: space-between; }

        .btn-step {
            width: 32px; height: 32px; border-radius: 6px;
            border: 1px solid var(--border-red);
            background: rgba(255, 0, 51, 0.25);
            color: #fff; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-step:active { background: var(--primary-red); }

        .bet-num {
            font-size: 1.1rem; font-weight: 900; color: #fff;
            background: transparent; border: none; text-align: center; width: 100%; outline: none;
        }

        .preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .btn-preset {
            padding: 6px 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px; color: var(--text-dim); font-size: 0.72rem; font-weight: 700; cursor: pointer; text-align: center;
        }
        .btn-preset:active { background: rgba(255, 0, 51, 0.4); color: #fff; }

        .btn-action {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 900; color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-launch {
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 50%, #ff5252 100%);
            box-shadow: 0 4px 18px rgba(255, 0, 51, 0.5);
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #007e33 0%, var(--green-cashout) 100%) !important;
            box-shadow: 0 0 22px rgba(0, 230, 118, 0.85) !important;
            animation: pulse-withdraw 0.7s infinite alternate;
        }

        @keyframes pulse-withdraw {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .btn-disabled { background: #222 !important; color: #666 !important; box-shadow: none !important; cursor: not-allowed; }

        .players-panel {
            flex: 4;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .live-title {
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .live-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            height: 100%;
        }

        .live-item {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.65rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        .live-item-row { display: flex; justify-content: space-between; align-items: center; }
        .live-item .p-name { color: #ddd; max-width: 65px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
        .live-item .p-win { color: var(--green-cashout); font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="game-display" id="display-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div class="canvas-overlay">
                <div class="multiplier-text" id="mult-display">1.00x</div>
                <div class="status-text" id="status-display">استعداد للإطلاق...</div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="betting-panel">
                <div class="balance-strip">
                    <span>رصيدك الحالي:</span>
                    <div><span class="balance-val" id="u-balance">0.00</span> <span style="color:var(--gold); font-size:0.75rem;">NPS</span></div>
                </div>

                <div class="input-box">
                    <span class="input-label">مبلغ الرهان (NPS)</span>
                    <div class="input-controls">
                        <button class="btn-step" onclick="adjustBet(-5)">-</button>
                        <input type="number" id="bet-amount" class="bet-num" value="5" min="5" step="5">
                        <button class="btn-step" onclick="adjustBet(5)">+</button>
                    </div>
                </div>

                <div class="preset-row">
                    <button class="btn-preset" onclick="setBet(5)">5 NPS</button>
                    <button class="btn-preset" onclick="adjustBet(5)">+5</button>
                    <button class="btn-preset" onclick="adjustBet(10)">+10</button>
                    <button class="btn-preset" onclick="multiplyBet(2)">X2</button>
                    <button class="btn-preset" onclick="multiplyBet(0.5)">1/2</button>
                    <button class="btn-preset" onclick="setBet(100)">100</button>
                </div>

                <button id="action-btn" class="btn-action btn-launch" onclick="handleMainAction()">
                    <i class="fa-solid fa-paper-plane"></i> <span id="action-btn-text">تأكيد الرهان (5 NPS)</span>
                </button>
            </div>

            <div class="players-panel">
                <div class="live-title"><i class="fa-solid fa-users"></i> المراهنون الان</div>
                <div class="live-list" id="live-list"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const urlParams = new URLSearchParams(window.location.search);
        const userId = tg?.initDataUnsafe?.user?.id || urlParams.get('user_id') || urlParams.get('telegram_id') || "123456789";

        // أرقام الحماس عند الانسحاب المبكر
        const HYPE_MULTIPLIERS = [15.0, 25.0, 40.0, 60.0, 85.0, 100.0];

        let userBalance = 0.0;
        let gameState = 'COUNTDOWN'; // COUNTDOWN, RUNNING, CRASHED
        let currentMult = 1.00;
        let targetCrashMult = 1.00;
        let betAmount = 5.0;
        let animProgress = 0;
        let particles = [];
        let stars = [];
        let shakeTime = 0;
        
        let hasBetInCurrentRound = false;
        let hasCashedOutCurrentRound = false;
        let serverCalculatedMult = 0.0;
        let countdownTimer = 5;
        let countdownInterval = null;

        /* Advanced Realistic Synthesizer Audio System */
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;

                if (type === 'launch') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(60, now);
                    osc.frequency.exponentialRampToValueAtTime(420, now + 1.8);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(200, now);
                    filter.frequency.exponentialRampToValueAtTime(1500, now + 1.8);

                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 2.0);

                    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 2.0);

                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);

                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.4);
                    });

                } else if (type === 'boom') {
                    const subOsc = audioCtx.createOscillator();
                    const subGain = audioCtx.createGain();
                    subOsc.type = 'square';
                    subOsc.frequency.setValueAtTime(150, now);
                    subOsc.frequency.exponentialRampToValueAtTime(20, now + 0.8);

                    subGain.gain.setValueAtTime(0.6, now);
                    subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

                    subOsc.connect(subGain); subGain.connect(audioCtx.destination);
                    subOsc.start(now); subOsc.stop(now + 0.8);
                }
            } catch(e) {}
        }

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?telegram_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    userBalance = parseFloat(data.balance);
                    document.getElementById('u-balance').innerText = userBalance.toFixed(2);
                }
            } catch (err) {}
        }

        /* Fake Live Players Feed */
        const fakeNames = ["أحمد_VIP", "Samer_Sy", "محمود_x", "King_Crash", "عمر_99", "Ali_Pro", "سارة_K", "Mo_Gamer", "الأسد_77"];
        function updateLiveFeed() {
            const container = document.getElementById('live-list');
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                const bet = (Math.floor(Math.random() * 8) + 1) * 5;
                const mult = (Math.random() * 2.5 + 1.1).toFixed(2);
                const win = (bet * parseFloat(mult)).toFixed(2);
                
                const item = document.createElement('div');
                item.className = 'live-item';
                item.innerHTML = `
                    <div class="live-item-row">
                        <span class="p-name">${name}</span>
                        <span style="color:var(--text-dim)">${bet} NPS</span>
                    </div>
                    <div class="live-item-row" style="margin-top:2px;">
                        <span class="p-win">+${win} NPS</span>
                        <span style="color:var(--gold); font-size:0.6rem;">${mult}x</span>
                    </div>
                `;
                container.appendChild(item);
            }
        }
        setInterval(updateLiveFeed, 4000);
        updateLiveFeed();

        // Canvas Setup & Space Background
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.5 + 0.5,
                speed: Math.random() * 2.5 + 0.5,
                alpha: Math.random()
            });
        }

        /* رسم الصاروخ */
        function drawRealisticRocket(x, y, scaleMult, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const baseScale = Math.min(1.7, 1.2 + scaleMult * 0.03);
            ctx.scale(baseScale, baseScale);

            if (gameState === 'RUNNING') {
                const flameLength = 35 + Math.random() * 20;
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 20;

                const outerFlame = ctx.createLinearGradient(0, 22, 0, 22 + flameLength * 1.2);
                outerFlame.addColorStop(0, 'rgba(255, 42, 85, 0.9)');
                outerFlame.addColorStop(0.4, 'rgba(255, 204, 0, 0.7)');
                outerFlame.addColorStop(1, 'transparent');

                ctx.fillStyle = outerFlame;
                ctx.beginPath();
                ctx.moveTo(-12, 22); ctx.lineTo(12, 22); ctx.lineTo(0, 22 + flameLength * 1.2);
                ctx.closePath(); ctx.fill();

                const innerFlame = ctx.createLinearGradient(0, 22, 0, 22 + flameLength);
                innerFlame.addColorStop(0, '#ffffff');
                innerFlame.addColorStop(0.3, '#ffcc00');
                innerFlame.addColorStop(0.8, '#ff0033');
                innerFlame.addColorStop(1, 'transparent');

                ctx.fillStyle = innerFlame;
                ctx.beginPath();
                ctx.moveTo(-6, 22); ctx.lineTo(6, 22); ctx.lineTo(0, 22 + flameLength);
                ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 0;
            }

            const bodyGrad = ctx.createLinearGradient(-15, 0, 15, 0);
            bodyGrad.addColorStop(0, '#9ca3af');
            bodyGrad.addColorStop(0.3, '#ffffff');
            bodyGrad.addColorStop(0.7, '#e5e7eb');
            bodyGrad.addColorStop(1, '#4b5563');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -42);
            ctx.quadraticCurveTo(15, -10, 12, 22);
            ctx.lineTo(-12, 22);
            ctx.quadraticCurveTo(-15, -10, 0, -42);
            ctx.closePath(); ctx.fill();

            const wingGrad = ctx.createLinearGradient(-24, 0, 24, 0);
            wingGrad.addColorStop(0, '#ff0033');
            wingGrad.addColorStop(0.5, '#7a0016');
            wingGrad.addColorStop(1, '#ff0033');

            ctx.fillStyle = wingGrad;
            ctx.beginPath();
            ctx.moveTo(11, 2); ctx.lineTo(26, 24); ctx.lineTo(11, 20);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-11, 2); ctx.lineTo(-26, 24); ctx.lineTo(-11, 20);
            ctx.closePath(); ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -42);
            ctx.quadraticCurveTo(9, -26, 9, -18);
            ctx.lineTo(-9, -18);
            ctx.quadraticCurveTo(-9, -26, 0, -42);
            ctx.fillStyle = '#ff0033';
            ctx.fill();

            ctx.fillStyle = '#00e676';
            ctx.shadowColor = '#00e676';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(0, -8, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawExplosion(x, y) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, (1 - shakeTime) * 90, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 51, 0.45)';
            ctx.fill();
            ctx.restore();
        }

        function renderLoop() {
            ctx.fillStyle = '#030108';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const nebulaGrad = ctx.createRadialGradient(canvas.width*0.5, canvas.height*0.5, 10, canvas.width*0.5, canvas.height*0.5, canvas.width*0.8);
            nebulaGrad.addColorStop(0, 'rgba(122, 0, 22, 0.15)');
            nebulaGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = nebulaGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (gameState === 'RUNNING') {
                    s.y += s.speed * (1 + (currentMult - 1) * 0.2);
                    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                }
            });

            const startX = 50;
            const startY = canvas.height - 50;
            const targetX = canvas.width - 60;
            const targetY = 70;

            if (gameState === 'RUNNING') {
                animProgress += 0.004 * (1 + (currentMult - 1) * 0.05);
                if (animProgress > 1) animProgress = 1;

                // مسار صعودي مستمر بدون أي نزول أو اهتزاز أسفل
                const curX = startX + (targetX - startX) * Math.min(animProgress, 1.0);
                const curY = startY - (startY - targetY) * Math.pow(Math.min(animProgress, 1.0), 0.85);

                // حساب اتجاه رأس الصاروخ بزاوية صعود ثابتة ونظيفة
                const nextP = Math.min(animProgress + 0.01, 1.0);
                const nextX = startX + (targetX - startX) * nextP;
                const nextY = startY - (startY - targetY) * Math.pow(nextP, 0.85);
                const flightAngle = Math.atan2(nextY - curY, nextX - curX) + Math.PI / 2;

                // رسم خط المسار المتوهج
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(curX, curY);
                ctx.strokeStyle = '#ff0033';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0033';
                ctx.stroke();
                ctx.shadowBlur = 0;

                for (let i = 0; i < 2; i++) {
                    particles.push({
                        x: curX, y: curY + 10,
                        vx: -Math.random() * 2, vy: Math.random() * 3 + 1,
                        size: Math.random() * 4 + 2,
                        color: Math.random() > 0.4 ? '#ffcc00' : '#ff0033',
                        life: 1.0
                    });
                }

                drawRealisticRocket(curX, curY, currentMult, flightAngle);

                // تسارع المضاعف
                currentMult += 0.008 * (1 + (currentMult - 1) * 0.12);
                document.getElementById('mult-display').innerText = currentMult.toFixed(2) + 'x';

                updateUIState();

                if (currentMult >= targetCrashMult) {
                    triggerCrash(curX, curY);
                }

            } else if (gameState === 'CRASHED') {
                if (shakeTime > 0) {
                    shakeTime -= 0.03;
                    drawExplosion(targetX, targetY);
                }
                drawParticles();
            } else {
                drawRealisticRocket(startX, startY, 1.0, Math.PI / 3.8);
            }

            requestAnimationFrame(renderLoop);
        }

        function triggerCrash(x, y) {
            gameState = 'CRASHED';
            playSound('boom');
            shakeTime = 1.0;
            createExplosionParticles(x, y);

            document.getElementById('status-display').innerText = `💥 انفجر الصاروخ عند ${targetCrashMult.toFixed(2)}x!`;
            document.getElementById('status-display').className = 'status-text status-crashed';
            document.getElementById('mult-display').style.color = '#ff0033';

            updateUIState();
            fetchUserData();

            setTimeout(startCountdown, 2800);
        }

        function createExplosionParticles(x, y) {
            particles = [];
            for (let i = 0; i < 85; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 7 + 2,
                    color: ['#ff0033', '#ffcc00', '#ffffff', '#ff2a55'][Math.floor(Math.random() * 4)],
                    life: 1.0
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                p.x += p.vx; p.y += p.vy;
                p.life -= 0.028;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        requestAnimationFrame(renderLoop);

        function startCountdown() {
            gameState = 'COUNTDOWN';
            currentMult = 1.00;
            hasBetInCurrentRound = false;
            hasCashedOutCurrentRound = false;
            serverCalculatedMult = 0.0;
            countdownTimer = 5;

            document.getElementById('mult-display').innerText = '1.00x';
            document.getElementById('mult-display').style.color = '#ffffff';
            document.getElementById('status-display').className = 'status-text';
            
            updateUIState();

            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                document.getElementById('status-display').innerText = `🚀 الجولة القادمة خلال (${countdownTimer}) ثوانٍ...`;
                countdownTimer--;

                if (countdownTimer < 0) {
                    clearInterval(countdownInterval);
                    launchRocketRound();
                }
            }, 1000);
        }

        function launchRocketRound() {
            // إن لم يراهن اللاعب، يتم توليد رقم عشوائي للجولة
            if (!hasBetInCurrentRound) {
                const r = Math.random();
                if (r < 0.2) targetCrashMult = 1.00; // انفجار فوري
                else if (r < 0.5) targetCrashMult = parseFloat((Math.random() * 0.9 + 1.1).toFixed(2)); // 1.1x - 2.0x
                else if (r < 0.8) targetCrashMult = parseFloat((Math.random() * 2.0 + 2.0).toFixed(2)); // 2.0x - 4.0x
                else targetCrashMult = parseFloat((Math.random() * 5.0 + 4.0).toFixed(2)); // حتى 9.0x
            }

            gameState = 'RUNNING';
            animProgress = 0;
            document.getElementById('status-display').innerText = '🚀 الصاروخ يحلق الآن!';
            playSound('launch');
            updateUIState();
        }

        function updateUIState() {
            const btn = document.getElementById('action-btn');
            const btnText = document.getElementById('action-btn-text');

            if (gameState === 'COUNTDOWN') {
                if (hasBetInCurrentRound) {
                    btn.className = 'btn-action btn-disabled';
                    btnText.innerText = 'تم تمويل الرهان (انتظر الإطلاق)';
                } else {
                    btn.className = 'btn-action btn-launch';
                    btnText.innerText = `تأكيد الرهان (${betAmount.toFixed(2)} NPS)`;
                }
            } else if (gameState === 'RUNNING') {
                if (hasBetInCurrentRound && !hasCashedOutCurrentRound) {
                    const currentReturn = (betAmount * currentMult).toFixed(2);
                    btn.className = 'btn-action btn-withdraw';
                    btnText.innerText = `انسحاب الان (${currentReturn} NPS)`;
                } else if (hasCashedOutCurrentRound) {
                    btn.className = 'btn-action btn-disabled';
                    btnText.innerText = 'تم السحب بنجاح ✓';
                } else {
                    btn.className = 'btn-action btn-disabled';
                    btnText.innerText = 'انتظر الجولة القادمة...';
                }
            } else if (gameState === 'CRASHED') {
                btn.className = 'btn-action btn-disabled';
                btnText.innerText = 'انفجر الصاروخ!';
            }
        }

        async function handleMainAction() {
            if (gameState === 'COUNTDOWN' && !hasBetInCurrentRound) {
                await placeBet();
            } else if (gameState === 'RUNNING' && hasBetInCurrentRound && !hasCashedOutCurrentRound) {
                executeCashout();
            }
        }

        /* الرهان والخصم المباشر من السيرفر */
        async function placeBet() {
            if (userBalance < betAmount) {
                alert("رصيدك غير كافٍ للرهان!");
                return;
            }

            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: "rocket", bet_amount: betAmount })
                });

                const data = await res.json();
                if (!data.success) {
                    alert(data.message || "خطأ في السيرفر!");
                    fetchUserData();
                    return;
                }

                serverCalculatedMult = parseFloat(data.multiplier || 0);

                // تحديد نقطة الانفجار استناداً لنتيجة الخوارزمية مع سقف 10.0x للرهان النشط
                if (serverCalculatedMult <= 0.0) {
                    targetCrashMult = 1.00; // انفجار فوري 0x/1.0x
                } else {
                    targetCrashMult = Math.min(10.0, serverCalculatedMult);
                }

                hasBetInCurrentRound = true;
                userBalance = parseFloat(data.new_balance);
                document.getElementById('u-balance').innerText = userBalance.toFixed(2);
                updateUIState();
            } catch (e) {
                alert("تعذر الاتصال بالسيرفر!");
            }
        }

        /* تنفيذ السحب وبدء ميزة الحماس العشوائية */
        function executeCashout() {
            if (gameState !== 'RUNNING' || hasCashedOutCurrentRound) return;

            hasCashedOutCurrentRound = true;
            const winMult = currentMult.toFixed(2);
            const totalWin = parseFloat((betAmount * currentMult).toFixed(2));

            playSound('win');

            document.getElementById('status-display').innerText = `🎉 تم الانسحاب عند ${winMult}x (+${totalWin} NPS)!`;
            document.getElementById('status-display').className = 'status-text status-cashed';
            document.getElementById('mult-display').style.color = '#00e676';

            // تفعيل ميزة "الحماس عند الانسحاب المبكر": الصاروخ يستمر بالتحليق بشكل عشوائي حتى 100x
            const isEarlyCashout = currentMult < 3.0;
            const shouldTriggerHype = isEarlyCashout && Math.random() < 0.35; // 35% احتمال تحليق حماسي بعد الانسحاب

            if (shouldTriggerHype) {
                const randomHype = HYPE_MULTIPLIERS[Math.floor(Math.random() * HYPE_MULTIPLIERS.length)];
                targetCrashMult = Math.max(targetCrashMult, randomHype);
            }

            updateUIState();
            fetchUserData();
        }

        function adjustBet(delta) {
            betAmount = Math.max(5, betAmount + delta);
            document.getElementById('bet-amount').value = betAmount;
            updateUIState();
        }
        function setBet(val) {
            betAmount = Math.max(5, val);
            document.getElementById('bet-amount').value = betAmount;
            updateUIState();
        }
        function multiplyBet(factor) {
            betAmount = Math.max(5, Math.round(betAmount * factor));
            document.getElementById('bet-amount').value = betAmount;
            updateUIState();
        }

        window.onload = () => {
            fetchUserData();
            startCountdown();
        };
    </script>
</body>
</html>
