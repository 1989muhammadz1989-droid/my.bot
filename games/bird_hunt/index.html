<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صيد الطيور - NPS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-header {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .user-card, .balance-card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold;
            font-size: 14px;
        }
        .balance-card {
            color: #2ecc71;
            font-size: 16px;
        }
        .ui-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        .bet-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .bet-btn:active { transform: scale(0.9); }
        .bet-display {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            min-width: 90px;
            text-align: center;
        }
        .shoot-btn {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }
        .shoot-btn:active { transform: scale(0.95); }
        .toast-message {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            padding: 15px 30px;
            border-radius: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 20;
            text-align: center;
        }
        .toast-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast-win { background: rgba(46, 204, 113, 0.95); border: 2px solid #fff; }
        .toast-loss { background: rgba(231, 76, 60, 0.95); border: 2px solid #fff; }
    </style>
</head>
<body>

    <div class="ui-header">
        <div class="user-card" id="userName">المستخدم...</div>
        <div class="balance-card">الرصيد: <span id="userBalance">0</span> NPS</div>
    </div>

    <div class="ui-controls">
        <button class="bet-btn" onclick="adjustBet(-5)">-</button>
        <div class="bet-display">الرهان: <span id="betAmount">5</span> NPS</div>
        <button class="bet-btn" onclick="adjustBet(5)">+</button>
        <button class="shoot-btn" id="shootBtn" onclick="shoot()">إطلاق 🔥</button>
    </div>

    <div id="toast" class="toast-message"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('user_id') || urlParams.get('telegram_id');
        if (!userId && tg?.initDataUnsafe?.user) {
            userId = tg.initDataUnsafe.user.id;
        }
        if (!userId) userId = "123456";

        let balance = 0;
        let betAmount = 5;
        let isPlaying = false;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const bird = {
            x: 100,
            y: canvas.height * 0.3,
            vx: 3,
            vy: 1,
            size: 25,
            state: 'flying',
            wingAngle: 0
        };

        const crosshair = { x: canvas.width / 2, y: canvas.height / 3 };

        window.addEventListener('mousemove', (e) => {
            crosshair.x = e.clientX;
            crosshair.y = e.clientY;
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                crosshair.x = e.touches[0].clientX;
                crosshair.y = e.touches[0].clientY;
            }
        });

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    balance = data.balance;
                    document.getElementById("userBalance").innerText = balance;
                    document.getElementById("userName").innerText = data.full_name;
                }
            } catch (e) {
                console.error(e);
            }
        }
        fetchUserData();

        function adjustBet(val) {
            if (isPlaying) return;
            betAmount += val;
            if (betAmount < 5) betAmount = 5;
            if (betAmount > 1000) betAmount = 1000;
            document.getElementById("betAmount").innerText = betAmount;
        }

        function drawBackground() {
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, "#87CEEB");
            skyGradient.addColorStop(0.6, "#E0F6FF");
            skyGradient.addColorStop(1, "#2E8B57");
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#6c7a89";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.6);
            ctx.lineTo(canvas.width * 0.25, canvas.height * 0.35);
            ctx.lineTo(canvas.width * 0.5, canvas.height * 0.6);
            ctx.lineTo(canvas.width * 0.75, canvas.height * 0.38);
            ctx.lineTo(canvas.width, canvas.height * 0.6);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            ctx.fillStyle = "#3498db";
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.45, canvas.height * 0.6);
            ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.75, canvas.width * 0.2, canvas.height);
            ctx.lineTo(canvas.width * 0.6, canvas.height);
            ctx.quadraticCurveTo(canvas.width * 0.65, canvas.height * 0.75, canvas.width * 0.55, canvas.height * 0.6);
            ctx.fill();

            ctx.fillStyle = "#27ae60";
            ctx.fillRect(0, canvas.height * 0.75, canvas.width, canvas.height * 0.25);
        }

        function updateBird() {
            if (bird.state === 'flying') {
                bird.x += bird.vx;
                bird.y += Math.sin(bird.x * 0.02) * bird.vy;
                bird.wingAngle += 0.15;
                if (bird.x > canvas.width - 50 || bird.x < 50) bird.vx *= -1;
            } else if (bird.state === 'falling') {
                bird.y += 8;
                if (bird.y >= canvas.height * 0.78) {
                    bird.state = 'dead';
                    setTimeout(respawnBird, 1200);
                }
            }
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            if (bird.vx < 0 && bird.state === 'flying') ctx.scale(-1, 1);
            if (bird.state === 'falling') ctx.rotate(Math.PI / 2);

            ctx.fillStyle = "#d35400";
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.size, bird.size / 1.8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.moveTo(bird.size * 0.7, -5);
            ctx.lineTo(bird.size * 0.7 + 12, 0);
            ctx.lineTo(bird.size * 0.7, 5);
            ctx.fill();

            ctx.restore();
        }

        function respawnBird() {
            bird.x = Math.random() * (canvas.width - 200) + 100;
            bird.y = canvas.height * (0.2 + Math.random() * 0.25);
            bird.state = 'flying';
            bird.vx = Math.random() > 0.5 ? 3 : -3;
        }

        function drawCrosshair() {
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(crosshair.x, crosshair.y, 16, 0, Math.PI * 2);
            ctx.moveTo(crosshair.x - 22, crosshair.y);
            ctx.lineTo(crosshair.x + 22, crosshair.y);
            ctx.moveTo(crosshair.x, crosshair.y - 22);
            ctx.lineTo(crosshair.x, crosshair.y + 22);
            ctx.stroke();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            updateBird();
            drawBird();
            drawCrosshair();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        async function shoot() {
            if (isPlaying) return;
            if (balance < betAmount) {
                showToast("رصيدك غير كافٍ للرهان!", "loss");
                return;
            }

            isPlaying = true;
            document.getElementById("shootBtn").disabled = true;

            try {
                const res = await fetch("/api/play", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: "bird_hunt",
                        bet_amount: betAmount
                    })
                });

                const data = await res.json();
                if (!data.success) {
                    showToast(data.message || "حدث خطأ!", "loss");
                    isPlaying = false;
                    document.getElementById("shootBtn").disabled = false;
                    return;
                }

                balance = data.new_balance;
                document.getElementById("userBalance").innerText = balance;

                if (data.multiplier > 0) {
                    bird.state = 'falling';
                    showToast(`اصابة! ربحت ${data.win_amount} NPS`, "win");
                } else {
                    showToast(`خسارة! فقدت ${betAmount} NPS`, "loss");
                }
            } catch (e) {
                showToast("خطأ في الاتصال بالسيرفر!", "loss");
            }

            setTimeout(() => {
                isPlaying = false;
                document.getElementById("shootBtn").disabled = false;
            }, 1000);
        }

        function showToast(msg, type) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = `toast-message show toast-${type}`;
            setTimeout(() => { toast.className = "toast-message"; }, 2000);
        }
    </script>
</body>
</html>
