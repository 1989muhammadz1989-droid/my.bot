<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صيد الطيور الاحترافية - المطورة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03070d;
        }
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        /* Top Bar / HUD */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        .exit-btn {
            pointer-events: auto;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: transform 0.15s ease, background 0.2s;
        }
        .exit-btn:active { transform: scale(0.9); background: rgba(231, 76, 60, 0.7); }
        
        .balance-badge {
            pointer-events: auto;
            background: rgba(8, 20, 38, 0.85);
            backdrop-filter: blur(14px);
            padding: 10px 22px;
            border-radius: 30px;
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.5);
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .balance-badge span { color: #f1c40f; font-size: 18px; }

        /* Controls & Difficulty Panel */
        .controls-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 20;
            width: calc(100% - 30px);
            max-width: 500px;
        }

        .difficulty-bar {
            display: flex;
            gap: 8px;
            background: rgba(5, 12, 22, 0.85);
            backdrop-filter: blur(16px);
            padding: 5px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            justify-content: space-between;
        }
        .diff-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: #a0aec0;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .diff-btn.active[data-diff="easy"] {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: #fff;
            box-shadow: 0 3px 12px rgba(46, 204, 113, 0.4);
        }
        .diff-btn.active[data-diff="medium"] {
            background: linear-gradient(135deg, #d35400, #e67e22);
            color: #fff;
            box-shadow: 0 3px 12px rgba(230, 126, 34, 0.4);
        }
        .diff-btn.active[data-diff="hard"] {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: #fff;
            box-shadow: 0 3px 12px rgba(231, 76, 60, 0.4);
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(10, 22, 38, 0.90);
            backdrop-filter: blur(20px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
        }

        .bet-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bet-btn {
            background: rgba(231, 76, 60, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, background 0.2s;
        }
        .bet-btn:active { transform: scale(0.88); background: #c0392b; }

        .bet-display {
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .bet-value {
            color: #f1c40f;
            font-size: 16px;
            display: block;
        }

        .shoot-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.5);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            transition: transform 0.1s ease, filter 0.2s;
        }
        .shoot-btn:active { transform: scale(0.93); filter: brightness(1.25); }
        .shoot-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        /* Toast Notifications */
        .toast-message {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            padding: 16px 36px;
            border-radius: 24px;
            color: white;
            font-size: 20px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }
        .toast-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast-win { 
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.95), rgba(39, 174, 96, 0.95)); 
            border: 2px solid #55efc4; 
        }
        .toast-loss { 
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.95), rgba(192, 57, 43, 0.95)); 
            border: 2px solid #ff7675; 
        }
    </style>
</head>
<body>

    <!-- HUD Overlay -->
    <div class="top-bar">
        <button class="exit-btn" onclick="exitGame()" title="خروج">✕</button>
        <div class="balance-badge">الرصيد: <span id="userBalance">0</span> NPS</div>
    </div>

    <!-- Controls Container -->
    <div class="controls-container">
        <!-- Difficulty Bar -->
        <div class="difficulty-bar">
            <button class="diff-btn active" data-diff="easy" onclick="setDifficulty('easy')">سهل (ربح 2x)</button>
            <button class="diff-btn" data-diff="medium" onclick="setDifficulty('medium')">متوسط (ربح 3x)</button>
            <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard')">صعب (ربح 5x)</button>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="bet-controls">
                <button class="bet-btn" onclick="adjustBet(-5)">-</button>
                <div class="bet-display">الرهان<span class="bet-value" id="betAmount">5 NPS</span></div>
                <button class="bet-btn" onclick="adjustBet(5)">+</button>
            </div>
            <button class="shoot-btn" id="shootBtn" onclick="shoot()">إطلاق 🔥</button>
        </div>
    </div>

    <div id="toast" class="toast-message"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // Telegram WebApp Integration
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.enableClosingConfirmation();
        }

        function exitGame() {
            if (tg) tg.close();
            else alert("تم الخروج من اللعبة");
        }

        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('user_id') || urlParams.get('telegram_id');
        if (!userId && tg?.initDataUnsafe?.user) {
            userId = tg.initDataUnsafe.user.id;
        }
        if (!userId) userId = "123456";

        let balance = 0;
        let betAmount = 5;
        let difficulty = 'easy'; // 'easy', 'medium', 'hard'
        let isPlaying = false;
        let screenShake = 0;
        let waterOffset = 0;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Audio Engine (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startNatureAmbience();
            }
        }

        function playGunshotSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const bufferSize = audioCtx.sampleRate * 0.35;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(60, now + 0.3);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);

            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.25);
            oscGain.gain.setValueAtTime(0.9, now);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.28);
        }

        function playHitSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.18);
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
        }

        function startNatureAmbience() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 350;
            filter.Q.value = 4.0;

            const gain = audioCtx.createGain();
            gain.gain.value = 0.03;

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        // Realistic Small Bird Object
        const bird = {
            x: 100,
            y: canvas.height * 0.3,
            vx: 3,
            vy: 1,
            size: 14, // Smaller, realistic bird size
            state: 'flying',
            wingAngle: 0,
            wingSpeed: 0.25,
            targetY: canvas.height * 0.3,
            directionChangeTimer: 0
        };

        const crosshair = { x: canvas.width / 2, y: canvas.height / 3 };
        const particles = [];
        const floatingTexts = [];
        let muzzleFlashTime = 0;

        window.addEventListener('pointermove', (e) => {
            crosshair.x = e.clientX;
            crosshair.y = e.clientY;
        });

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    balance = data.balance;
                    document.getElementById("userBalance").innerText = balance;
                }
            } catch (e) {
                console.error(e);
            }
        }
        fetchUserData();

        function setDifficulty(diff) {
            if (isPlaying) return;
            difficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === diff);
            });
            respawnBird();
        }

        function adjustBet(val) {
            if (isPlaying) return;
            betAmount += val;
            if (betAmount < 5) betAmount = 5;
            if (betAmount > 1000) betAmount = 1000;
            document.getElementById("betAmount").innerText = betAmount + " NPS";
        }

        // Render Highly Realistic Sunset & Wilderness Landscape
        function drawRealisticBackground() {
            // Atmospheric Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.75);
            skyGrad.addColorStop(0, "#08101e");
            skyGrad.addColorStop(0.35, "#18324a");
            skyGrad.addColorStop(0.65, "#43657d");
            skyGrad.addColorStop(0.88, "#d1a075");
            skyGrad.addColorStop(1, "#f3c193");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun & Volumetric Light Rays
            const sunX = canvas.width * 0.5;
            const sunY = canvas.height * 0.48;

            let sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 300);
            sunGlow.addColorStop(0, "rgba(255, 240, 200, 0.9)");
            sunGlow.addColorStop(0.2, "rgba(255, 180, 120, 0.5)");
            sunGlow.addColorStop(1, "rgba(255, 180, 120, 0)");
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 300, 0, Math.PI * 2);
            ctx.fill();

            // Distant Foggy Mountains
            ctx.fillStyle = "rgba(28, 48, 64, 0.9)";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.55);
            ctx.lineTo(canvas.width * 0.18, canvas.height * 0.40);
            ctx.lineTo(canvas.width * 0.38, canvas.height * 0.55);
            ctx.lineTo(canvas.width * 0.62, canvas.height * 0.36);
            ctx.lineTo(canvas.width * 0.85, canvas.height * 0.55);
            ctx.lineTo(canvas.width, canvas.height * 0.42);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Midground Forest Mountain
            ctx.fillStyle = "#122533";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.62);
            ctx.lineTo(canvas.width * 0.28, canvas.height * 0.46);
            ctx.lineTo(canvas.width * 0.52, canvas.height * 0.62);
            ctx.lineTo(canvas.width * 0.78, canvas.height * 0.48);
            ctx.lineTo(canvas.width, canvas.height * 0.60);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Water River & Dynamic Reflections
            waterOffset += 0.025;
            let riverGrad = ctx.createLinearGradient(0, canvas.height * 0.60, 0, canvas.height);
            riverGrad.addColorStop(0, "#193c4d");
            riverGrad.addColorStop(0.5, "#0d2532");
            riverGrad.addColorStop(1, "#05131c");

            ctx.fillStyle = riverGrad;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.35, canvas.height * 0.60);
            ctx.quadraticCurveTo(canvas.width * 0.45, canvas.height * 0.78, canvas.width * 0.05, canvas.height);
            ctx.lineTo(canvas.width * 0.85, canvas.height);
            ctx.quadraticCurveTo(canvas.width * 0.60, canvas.height * 0.78, canvas.width * 0.55, canvas.height * 0.60);
            ctx.fill();

            // Water Specular Light Waves
            ctx.strokeStyle = "rgba(255, 220, 180, 0.22)";
            ctx.lineWidth = 1.8;
            for (let i = 0; i < 7; i++) {
                let y = canvas.height * (0.65 + i * 0.05);
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.28, y);
                ctx.quadraticCurveTo(
                    canvas.width * 0.45 + Math.sin(waterOffset + i * 1.5) * 20,
                    y + Math.cos(waterOffset + i) * 4,
                    canvas.width * 0.68,
                    y
                );
                ctx.stroke();
            }

            // Foreground Trees & Bank Silhouettes
            ctx.fillStyle = "#07130c";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.68);
            ctx.lineTo(canvas.width * 0.36, canvas.height * 0.72);
            ctx.lineTo(0, canvas.height * 0.98);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(canvas.width, canvas.height * 0.70);
            ctx.lineTo(canvas.width * 0.54, canvas.height * 0.74);
            ctx.lineTo(canvas.width, canvas.height * 0.99);
            ctx.fill();
        }

        // Dynamic Bird Mechanics Based on Difficulty
        function updateBird() {
            if (bird.state === 'flying') {
                bird.x += bird.vx;
                bird.wingAngle += bird.wingSpeed;

                // Difficulty movement behaviors
                if (difficulty === 'easy') {
                    bird.y += Math.sin(bird.x * 0.012) * 1.2;
                } else if (difficulty === 'medium') {
                    bird.y += Math.sin(bird.x * 0.025) * 2.8;
                } else if (difficulty === 'hard') {
                    bird.directionChangeTimer++;
                    if (bird.directionChangeTimer % 20 === 0) {
                        bird.targetY = canvas.height * (0.12 + Math.random() * 0.35);
                    }
                    bird.y += (bird.targetY - bird.y) * 0.08 + (Math.random() - 0.5) * 5;
                }

                if (bird.x > canvas.width + 50) {
                    bird.x = -50;
                    resetBirdPos();
                } else if (bird.x < -50) {
                    bird.x = canvas.width + 50;
                    resetBirdPos();
                }
            } else if (bird.state === 'falling') {
                bird.y += 10.5;
                bird.x += bird.vx * 0.25;
                bird.wingAngle += 0.5;
                if (bird.y >= canvas.height * 0.75) {
                    bird.state = 'dead';
                    createFeatherExplosion(bird.x, bird.y, 20);
                    setTimeout(respawnBird, 1000);
                }
            }
        }

        function resetBirdPos() {
            bird.y = canvas.height * (0.15 + Math.random() * 0.3);
            bird.targetY = bird.y;
        }

        function respawnBird() {
            bird.x = Math.random() > 0.5 ? -40 : canvas.width + 40;
            
            let baseSpeed = 3;
            if (difficulty === 'medium') baseSpeed = 6.5;
            if (difficulty === 'hard') baseSpeed = 10.5;

            bird.vx = bird.x < 0 ? (baseSpeed + Math.random() * 1.5) : -(baseSpeed + Math.random() * 1.5);
            bird.wingSpeed = 0.2 + (baseSpeed * 0.03);
            resetBirdPos();
            bird.state = 'flying';
        }

        // Draw Highly Detailed, Small Realistic Bird
        function drawRealisticBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);

            if (bird.vx < 0 && bird.state === 'flying') ctx.scale(-1, 1);
            if (bird.state === 'falling') ctx.rotate(Math.PI / 2.2);

            const s = bird.size;
            const wingY = Math.sin(bird.wingAngle) * (s * 0.95);

            // Tail Feathers
            ctx.fillStyle = "#3d1e0b";
            ctx.beginPath();
            ctx.moveTo(-s * 0.9, 0);
            ctx.lineTo(-s * 1.6, -s * 0.35);
            ctx.lineTo(-s * 1.4, 0);
            ctx.lineTo(-s * 1.6, s * 0.35);
            ctx.fill();

            // Main Body
            let bodyGrad = ctx.createLinearGradient(-s, -s, s, s);
            bodyGrad.addColorStop(0, "#4a250d");
            bodyGrad.addColorStop(0.5, "#a0522d");
            bodyGrad.addColorStop(1, "#cd853f");
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, s, s * 0.52, 0, 0, Math.PI * 2);
            ctx.fill();

            // Mallard Green Head Gloss
            let headGrad = ctx.createRadialGradient(s * 0.7, -s * 0.2, 1, s * 0.7, -s * 0.2, s * 0.4);
            headGrad.addColorStop(0, "#00b894");
            headGrad.addColorStop(0.8, "#006266");
            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(s * 0.7, -s * 0.2, s * 0.36, 0, Math.PI * 2);
            ctx.fill();

            // Tiny Eye
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(s * 0.8, -s * 0.28, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(s * 0.82, -s * 0.28, 1, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.moveTo(s * 0.98, -s * 0.28);
            ctx.lineTo(s * 1.45, -s * 0.12);
            ctx.lineTo(s * 0.98, 0);
            ctx.fill();

            // Wings Layering
            ctx.fillStyle = "#3a1c09";
            ctx.beginPath();
            ctx.moveTo(-s * 0.2, -s * 0.1);
            ctx.quadraticCurveTo(0, -s * 1.4 - wingY, s * 0.35, -s * 0.2);
            ctx.fill();

            ctx.fillStyle = "#8b4513";
            ctx.beginPath();
            ctx.moveTo(-s * 0.3, 0);
            ctx.quadraticCurveTo(0, -s * 1.6 - wingY, s * 0.45, -s * 0.1);
            ctx.fill();

            ctx.restore();
        }

        // Particle System (Feathers & Win Popup Text)
        function createFeatherExplosion(x, y, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.7) * 9,
                    size: Math.random() * 5 + 2,
                    color: Math.random() > 0.4 ? "#a0522d" : (Math.random() > 0.5 ? "#ffffff" : "#f39c12"),
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.25,
                    life: 1.0
                });
            }
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                opacity: 1.0,
                vy: -2
            });
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.18;
                p.rotation += p.rotSpeed;
                p.life -= 0.022;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.opacity -= 0.02;

                if (ft.opacity <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.font = "900 22px Arial";
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.opacity;
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 6;
                ctx.fillText(ft.text, ft.x - 20, ft.y);
                ctx.restore();
            }
        }

        // Dynamic Crosshair HUD
        function drawCrosshair() {
            ctx.save();
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2.2;
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            ctx.shadowBlur = 5;

            ctx.beginPath();
            ctx.arc(crosshair.x, crosshair.y, 16, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(crosshair.x, crosshair.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#e74c3c";
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(crosshair.x - 24, crosshair.y);
            ctx.lineTo(crosshair.x - 8, crosshair.y);
            ctx.moveTo(crosshair.x + 8, crosshair.y);
            ctx.lineTo(crosshair.x + 24, crosshair.y);

            ctx.moveTo(crosshair.x, crosshair.y - 24);
            ctx.lineTo(crosshair.x, crosshair.y - 8);
            ctx.moveTo(crosshair.x, crosshair.y + 8);
            ctx.lineTo(crosshair.x, crosshair.y + 24);
            ctx.stroke();

            ctx.restore();
        }

        // Muzzle Flash
        function drawMuzzleFlash() {
            if (muzzleFlashTime > 0) {
                muzzleFlashTime--;
                ctx.save();
                let flashGrad = ctx.createRadialGradient(crosshair.x, crosshair.y, 4, crosshair.x, crosshair.y, 70);
                flashGrad.addColorStop(0, "rgba(255, 255, 220, 0.95)");
                flashGrad.addColorStop(0.3, "rgba(255, 120, 0, 0.7)");
                flashGrad.addColorStop(1, "rgba(255, 0, 0, 0)");

                ctx.fillStyle = flashGrad;
                ctx.beginPath();
                ctx.arc(crosshair.x, crosshair.y, 70, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Render Game Loop
        function gameLoop() {
            ctx.save();

            if (screenShake > 0) {
                let dx = (Math.random() - 0.5) * screenShake;
                let dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
                screenShake *= 0.82;
                if (screenShake < 0.4) screenShake = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRealisticBackground();
            updateBird();
            drawRealisticBird();
            updateAndDrawParticles();
            drawMuzzleFlash();
            drawCrosshair();

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Independent Shoot Round API Handler
        async function shoot() {
            initAudio();
            if (isPlaying) return;

            if (balance < betAmount) {
                showToast("رصيدك غير كافٍ للرهان!", "loss");
                return;
            }

            isPlaying = true;
            document.getElementById("shootBtn").disabled = true;

            playGunshotSound();
            screenShake = 14;
            muzzleFlashTime = 4;

            try {
                // Send round bet & selected difficulty to Backend
                const res = await fetch("/api/play", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: "bird_hunt",
                        bet_amount: betAmount,
                        difficulty: difficulty
                    })
                });

                const data = await res.json();
                if (!data.success) {
                    showToast(data.message || "حدث خطأ في العملية!", "loss");
                    isPlaying = false;
                    document.getElementById("shootBtn").disabled = false;
                    return;
                }

                // Balance update from backend database
                balance = data.new_balance;
                document.getElementById("userBalance").innerText = balance;

                // Win Multipliers: Easy (2x), Medium (3x), Hard (5x)
                let multi = 0;
                if (difficulty === 'easy') multi = 2;
                if (difficulty === 'medium') multi = 3;
                if (difficulty === 'hard') multi = 5;

                if (data.win || data.multiplier > 0) {
                    bird.state = 'falling';
                    playHitSound();
                    createFeatherExplosion(crosshair.x, crosshair.y, 30);
                    
                    let winAmount = data.win_amount || (betAmount * multi);
                    addFloatingText(crosshair.x, crosshair.y - 20, `+${winAmount} NPS`, "#2ecc71");
                    showToast(`إصابة دقيقة! ربحت ${winAmount} NPS 🎯`, "win");
                } else {
                    addFloatingText(crosshair.x, crosshair.y - 20, `-${betAmount} NPS`, "#e74c3c");
                    showToast(`خسارة! فقدت ${betAmount} NPS 💥`, "loss");
                }
            } catch (e) {
                showToast("خطأ في الاتصال بالسيرفر!", "loss");
            }

            setTimeout(() => {
                isPlaying = false;
                document.getElementById("shootBtn").disabled = false;
            }, 850);
        }

        function showToast(msg, type) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = `toast-message show toast-${type}`;
            setTimeout(() => { toast.className = "toast-message"; }, 2000);
        }
    </script>
</body>
