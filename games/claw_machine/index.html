<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة الرافعة الكبرى - Neo Claw Machine 3D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-neon: #ff007f;
            --secondary-neon: #00f2fe;
            --gold-accent: #ffd700;
            --bg-dark: #090414;
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b0c36 0%, var(--bg-dark) 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        /* خلفية جزئيات متحركة Canvas */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* شريط معلومات المستخدم علوي high-tech */
        .top-bar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 10, 38, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-bottom: 2px solid var(--secondary-neon);
            padding: 10px 18px;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 242, 254, 0.1);
            z-index: 10;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .currency-badge {
            font-size: 10px;
            color: var(--secondary-neon);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 17px;
            font-weight: 800;
            color: var(--gold-accent);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        /* الهيكل الخارجي للكابينة (Arcade Frame) */
        .machine-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 440px;
            background: linear-gradient(180deg, #2a1147 0%, #110724 100%);
            border-radius: 24px;
            border: 3px solid #3d1c68;
            box-shadow: 
                0 0 0 2px var(--primary-neon),
                0 0 30px rgba(255, 0, 127, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        /* زجاج الكابينة والإضاءة الداخلية */
        .glass-window {
            position: relative;
            width: 100%;
            height: 350px;
            background: 
                radial-gradient(ellipse at 50% 10%, rgba(0, 242, 254, 0.15) 0%, rgba(10, 3, 25, 0.85) 80%),
                linear-gradient(180deg, rgba(255,0,127,0.05) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 3px solid var(--secondary-neon);
            overflow: hidden;
        }

        /* انعكاس زجاجي realism overlay */
        .glass-glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0.03) 100%);
            pointer-events: none;
            z-index: 12;
        }

        /* سكة الحركة العلوية */
        .rail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 18px;
            background: linear-gradient(180deg, #555 0%, #222 100%);
            border-bottom: 2px solid #777;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            z-index: 8;
        }

        /* عربة الحركة الأفقية */
        .trolley {
            position: absolute;
            top: 8px;
            left: 50%;
            width: 54px;
            height: 16px;
            background: linear-gradient(180deg, #ffd700, #996515);
            border-radius: 4px;
            transform: translateX(-50%);
            transition: left 0.05s linear;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            z-index: 9;
        }

        /* حبل الصلب للرافعة */
        .cable {
            position: absolute;
            top: 22px;
            left: 50%;
            width: 3px;
            height: 35px;
            background: linear-gradient(90deg, #aaa, #fff, #666);
            transform: translateX(-50%);
            z-index: 7;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        /* رأس الرافعة والمخالب */
        .claw-assembly {
            position: absolute;
            top: 57px;
            left: 50%;
            width: 60px;
            height: 55px;
            transform: translateX(-50%);
            z-index: 10;
            transition: top 0.05s linear, left 0.05s linear;
        }

        .claw-base {
            width: 34px;
            height: 18px;
            background: linear-gradient(180deg, #ff007f, #800040);
            margin: 0 auto;
            border-radius: 6px;
            border: 1px solid #ff99cc;
            box-shadow: 0 0 12px var(--primary-neon);
            position: relative;
        }

        .claw-base::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--secondary-neon);
            border-radius: 50%;
            top: 5px;
            left: 13px;
            box-shadow: 0 0 8px var(--secondary-neon);
        }

        .claw-arms {
            position: relative;
            width: 100%;
            height: 36px;
        }

        .claw-arm {
            position: absolute;
            top: -2px;
            width: 10px;
            height: 36px;
            background: linear-gradient(180deg, #e0e0e0 0%, #666 100%);
            border-radius: 4px;
            border: 1px solid #fff;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .claw-arm.left {
            left: 10px;
            transform-origin: top center;
            transform: rotate(-30deg);
        }

        .claw-arm.right {
            right: 10px;
            transform-origin: top center;
            transform: rotate(30deg);
        }

        .claw-arm::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
        }

        /* إغلاق المخالب عند الالتقاط */
        .claw-assembly.closed .claw-arm.left {
            transform: rotate(8deg);
        }
        .claw-assembly.closed .claw-arm.right {
            transform: rotate(-8deg);
        }

        /* أحواض الصناديق الكنز */
        .chest-pit {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 85px;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 6;
        }

        .treasure-chest {
            position: absolute;
            bottom: 12px;
            width: 48px;
            height: 40px;
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            border: 2px solid #fff8dc;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.8), 0 0 12px rgba(255, 215, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.3s ease;
        }

        .treasure-chest::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 8px;
            background: #4a2c00;
            top: 14px;
            border-top: 1px solid #ffd700;
            border-bottom: 1px solid #ffd700;
        }

        .treasure-chest::after {
            content: '💎';
            font-size: 16px;
            z-index: 2;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        /* الصندوق الملتصق بالرافعة */
        .grabbed-chest {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 9;
        }

        /* فتحة إلقاء الجوائز (Chute) */
        .chute {
            position: absolute;
            bottom: 0;
            right: 12px;
            width: 75px;
            height: 60px;
            background: radial-gradient(circle, #151515 0%, #050505 100%);
            border: 2px dashed var(--secondary-neon);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.3);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chute-label {
            font-size: 10px;
            color: var(--secondary-neon);
            font-weight: bold;
            text-shadow: 0 0 5px var(--secondary-neon);
        }

        /* لوحة التحكم السفلية modern controls */
        .control-panel {
            width: 100%;
            max-width: 430px;
            background: rgba(18, 9, 36, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-top: 2px solid var(--primary-neon);
            border-radius: 20px;
            padding: 14px 16px;
            margin-top: 10px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .bet-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bet-btn-adjust {
            width: 42px;
            height: 42px;
            background: linear-gradient(180deg, #333852 0%, #1a1d2e 100%);
            border: 1px solid #525a80;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
        }

        .bet-btn-adjust:active {
            transform: scale(0.92);
            background: var(--primary-neon);
        }

        .bet-info-display {
            text-align: center;
        }

        .bet-title {
            font-size: 11px;
            color: #a0aec0;
            font-weight: 500;
        }

        .bet-value-text {
            font-size: 22px;
            font-weight: 900;
            color: var(--secondary-neon);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        .preset-bets {
            display: flex;
            gap: 6px;
        }

        .btn-preset {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-preset:active {
            background: var(--gold-accent);
            color: #000;
        }

        /* زر التشغيل الكبير المغري */
        .btn-action-play {
            width: 100%;
            height: 56px;
            background: linear-gradient(180deg, #ff007f 0%, #99004d 100%);
            border: 1px solid #ff66b2;
            border-radius: 16px;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: all 0.15s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action-play:disabled {
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border-color: #555;
            box-shadow: none;
            cursor: not-allowed;
            color: #777;
        }

        .btn-action-play:not(:disabled):active {
            transform: translateY(3px);
            box-shadow: 0 3px 12px rgba(255, 0, 127, 0.4);
        }

        /* شاشة إعلان النتيجة والجوائز */
        .status-modal {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(10, 5, 20, 0.95);
            border: 2px solid var(--gold-accent);
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.2);
            width: 80%;
            max-width: 320px;
        }

        .status-modal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .status-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .status-win { color: #00ff88; text-shadow: 0 0 15px #00ff88; }
        .status-loss { color: #ff3366; text-shadow: 0 0 15px #ff3366; }

        .status-msg {
            font-size: 15px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .status-payout {
            margin-top: 8px;
            font-size: 18px;
            font-weight: bold;
            color: var(--gold-accent);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- شريط معلومات الرصيد والمستخدم -->
    <div class="top-bar">
        <div class="user-info">
            <span class="user-name" id="userName">لاعب متخفي</span>
            <span class="currency-badge">العملة: NPS</span>
        </div>
        <div class="balance-box">
            <span id="userBalance">0.00</span>
            <span style="font-size:12px;">NPS</span>
        </div>
    </div>

    <!-- كابينة آلة الرافعة -->
    <div class="machine-container">
        <div class="glass-window" id="glassWindow">
            <div class="glass-glare"></div>
            <div class="rail"></div>
            
            <!-- عربة الحركة الأفقية -->
            <div class="trolley" id="trolley"></div>
            
            <!-- حبل الرافعة الصلب -->
            <div class="cable" id="cable"></div>
            
            <!-- رأس الرافعة والمخالب -->
            <div class="claw-assembly" id="clawAssembly">
                <div class="claw-base"></div>
                <div class="claw-arms">
                    <div class="claw-arm left"></div>
                    <div class="claw-arm right"></div>
                </div>
                <!-- الصندوق الملتصق بالرافعة أثناء الرفع -->
                <div class="treasure-chest grabbed-chest" id="grabbedChest"></div>
            </div>

            <!-- فتحة إلقاء الجوائز -->
            <div class="chute">
                <span class="chute-label">فتحة الجوائز</span>
            </div>

            <!-- حوض الصناديق السفلية -->
            <div class="chest-pit" id="chestPit">
                <div class="treasure-chest" style="left: 10%;" data-x="10"></div>
                <div class="treasure-chest" style="left: 32%;" data-x="32"></div>
                <div class="treasure-chest" style="left: 55%;" data-x="55"></div>
                <div class="treasure-chest" style="left: 76%;" data-x="76"></div>
            </div>

            <!-- نافذة عرض النتيجة -->
            <div class="status-modal" id="statusModal">
                <div class="status-title" id="statusTitle">مبروك!</div>
                <div class="status-msg" id="statusMsg">نجحت الرافعة في التقاط الصندوق</div>
                <div class="status-payout" id="statusPayout"></div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم والرهان -->
    <div class="control-panel">
        <div class="bet-row">
            <button class="bet-btn-adjust" id="btnMinus">-</button>
            <div class="bet-info-display">
                <div class="bet-title">مبلغ الرهان (مضاعفة 2X)</div>
                <div class="bet-value-text"><span id="betAmount">5</span> NPS</div>
            </div>
            <button class="bet-btn-adjust" id="btnPlus">+</button>

            <div class="preset-bets">
                <button class="btn-preset" id="btnMin">الأدنى</button>
                <button class="btn-preset" id="btnMax">الأقصى</button>
            </div>
        </div>

        <button class="btn-action-play" id="btnPlay">
            <span>إنزال الرافعة</span> 🏗️
        </button>
    </div>

    <script>
        // --- 1. تهيئة تليجرام وبنية البيانات الأساسية ---
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('user_id') || urlParams.get('telegram_id');
        if (!userId && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }
        if (!userId) {
            userId = "10001"; // معرف افتراضي للتجربة
        }

        // متغيرات الرهان والرصيد
        let currentBet = 5;
        const MIN_BET = 5;
        const MAX_BET = 1000;
        const BET_STEP = 5;
        let isPlaying = false;
        let userBalance = 0.0;

        // عناصر الواجهة DOM
        const elBalance = document.getElementById('userBalance');
        const elUserName = document.getElementById('userName');
        const elBetAmount = document.getElementById('betAmount');
        const btnMinus = document.getElementById('btnMinus');
        const btnPlus = document.getElementById('btnPlus');
        const btnMin = document.getElementById('btnMin');
        const btnMax = document.getElementById('btnMax');
        const btnPlay = document.getElementById('btnPlay');
        
        const trolley = document.getElementById('trolley');
        const cable = document.getElementById('cable');
        const clawAssembly = document.getElementById('clawAssembly');
        const grabbedChest = document.getElementById('grabbedChest');
        const statusModal = document.getElementById('statusModal');
        const statusTitle = document.getElementById('statusTitle');
        const statusMsg = document.getElementById('statusMsg');
        const statusPayout = document.getElementById('statusPayout');

        // --- 2. المؤثرات الصوتية الصوتية الفائقة (Web Audio API) ---
        function createAudioContext() {
            return new (window.AudioContext || window.webkitAudioContext)();
        }
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = createAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'move') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'grab') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(400, now + 0.1);
                    osc.frequency.setValueAtTime(523.25, now + 0.2);
                    osc.frequency.setValueAtTime(659.25, now + 0.3);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'drop') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {}
        }

        // --- 3. خلفية الجسيمات المضيئة (Particle Canvas) ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedY = -(Math.random() * 0.8 + 0.2);
                this.opacity = Math.random() * 0.5 + 0.2;
                this.color = Math.random() > 0.5 ? '#ff007f' : '#00f2fe';
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 35; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- 4. جلب بيانات المستخدم وتحديث الواجهة ---
        async function fetchUserData() {
            try {
                const response = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await response.json();
                if (data.success) {
                    userBalance = data.balance;
                    elBalance.innerText = userBalance.toFixed(2);
                    if (data.full_name) {
                        elUserName.innerText = data.full_name;
                    }
                }
            } catch (err) {
                console.error("خطأ جلب البيانات:", err);
            }
        }
        fetchUserData();

        function updateBet(amount) {
            if (isPlaying) return;
            currentBet = Math.max(MIN_BET, Math.min(MAX_BET, amount));
            elBetAmount.innerText = currentBet;
        }

        btnMinus.addEventListener('click', () => updateBet(currentBet - BET_STEP));
        btnPlus.addEventListener('click', () => updateBet(currentBet + BET_STEP));
        btnMin.addEventListener('click', () => updateBet(MIN_BET));
        btnMax.addEventListener('click', () => updateBet(MAX_BET));

        function hideStatus() {
            statusModal.classList.remove('show');
        }

        function showStatus(isWin, winAmount) {
            if (isWin) {
                statusTitle.innerText = "مبروك! 🪙";
                statusTitle.className = "status-title status-win";
                statusMsg.innerText = "نجحت الرافعة في إيصال الكنز!";
                statusPayout.innerText = `الأرباح (2X): +${winAmount.toFixed(2)} NPS`;
                playSound('win');
            } else {
                statusTitle.innerText = "للأسف! 💥";
                statusTitle.className = "status-title status-loss";
                statusMsg.innerText = "انزلقت القبضة وسقط الصندوق!";
                statusPayout.innerText = "";
                playSound('drop');
            }
            statusModal.classList.add('show');
        }

        // --- 5. أنيميشن الرافعة والربط بالسيرفر (Game Engine) ---
        async function startClawGame() {
            if (isPlaying) return;

            if (userBalance < currentBet) {
                alert("رصيدك غير كافٍ لإجراء الرهان!");
                return;
            }

            isPlaying = true;
            btnPlay.disabled = true;
            btnMinus.disabled = true;
            btnPlus.disabled = true;
            btnMin.disabled = true;
            btnMax.disabled = true;
            hideStatus();

            // خصم رصيد الرهان فوراً محلياً لإشعار اللاعب بالاستجابة
            userBalance -= currentBet;
            elBalance.innerText = userBalance.toFixed(2);

            let playResult = null;

            // طلب النتيجة من السيرفر
            try {
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: 'claw_machine',
                        bet_amount: currentBet
                    })
                });
                playResult = await response.json();
            } catch (err) {
                console.error("خطأ الاتصال بالسيرفر:", err);
            }

            // إذا فشل الاتصال، استبدله بحدث محلي للتجربة وعدم تعليق اللعبة
            if (!playResult || !playResult.success) {
                const isWinSim = Math.random() < 0.45; // نسبة فوز تجريبية
                playResult = {
                    success: true,
                    is_win: isWinSim,
                    win_amount: isWinSim ? currentBet * 2 : 0,
                    new_balance: userBalance + (isWinSim ? currentBet * 2 : 0)
                };
            }

            // اختيار صندوق عشوائي مستهدف
            const chests = document.querySelectorAll('#chestPit .treasure-chest');
            const targetIndex = Math.floor(Math.random() * chests.length);
            const targetChest = chests[targetIndex];
            const targetX = parseFloat(targetChest.getAttribute('data-x'));

            // مرحلة 1: تحريك الرافعة أفقياً فوق الصندوق
            await animateHorizontal(targetX);

            // مرحلة 2: نزول الرافعة إلى القاع
            await animateCableDown(230);

            // مرحلة 3: إغلاق المخالب والتقاط الصندوق
            playSound('grab');
            clawAssembly.classList.add('closed');
            await sleep(300);

            targetChest.style.opacity = '0'; // إخفاء الصندوق السفي
            grabbedChest.style.display = 'block'; // إظهار الصندوق الممسوك

            if (playResult.is_win) {
                // --- سيناريو الفوز ---
                // 1. صعود بالصندوق للقمة
                await animateCableUp(35);
                
                // 2. تحريك الرافعة أفقياً باتجاه فتحة الجوائز (أقصى اليمين)
                await animateHorizontal(82);

                // 3. فتح الرافعة وإسقاط الصندوق في الفتحة
                clawAssembly.classList.remove('closed');
                grabbedChest.style.display = 'none';
                playSound('drop');
                await sleep(300);

                // 4. تحديث الرصيد النهائي
                userBalance = playResult.new_balance;
                elBalance.innerText = userBalance.toFixed(2);
                showStatus(true, playResult.win_amount);

            } else {
                // --- سيناريو الخسارة ---
                // 1. صعود جزئي ثم الانزلاق والسقوط
                await animateCableUp(120);
                
                // انزلاق الصندوق
                clawAssembly.classList.remove('closed');
                grabbedChest.style.display = 'none';
                targetChest.style.opacity = '1';
                playSound('drop');

                // تأثير اهتزاز بسيط
                targetChest.style.transform = 'translateY(-10px)';
                setTimeout(() => { targetChest.style.transform = 'translateY(0)'; }, 150);

                // صعود الرافعة فارغة للقمة
                await animateCableUp(35);

                // تحديث الرصيد
                userBalance = playResult.new_balance;
                elBalance.innerText = userBalance.toFixed(2);
                showStatus(false, 0);
            }

            // إعادة الرافعة للمنتصف
            await animateHorizontal(50);
            targetChest.style.opacity = '1';

            // إعادة تفعيل الأزرار
            isPlaying = false;
            btnPlay.disabled = false;
            btnMinus.disabled = false;
            btnPlus.disabled = false;
            btnMin.disabled = false;
            btnMax.disabled = false;
        }

        // --- 6. دال المساعدة للحركة والتوقيت (Animation Helpers) ---
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function animateHorizontal(targetPercent) {
            return new Promise(resolve => {
                let currentPos = parseFloat(trolley.style.left) || 50;
                const step = targetPercent > currentPos ? 1.5 : -1.5;

                const interval = setInterval(() => {
                    currentPos += step;
                    if ((step > 0 && currentPos >= targetPercent) || (step < 0 && currentPos <= targetPercent)) {
                        currentPos = targetPercent;
                        clearInterval(interval);
                        resolve();
                    }
                    trolley.style.left = `${currentPos}%`;
                    cable.style.left = `${currentPos}%`;
                    clawAssembly.style.left = `${currentPos}%`;
                    playSound('move');
                }, 15);
            });
        }

        function animateCableDown(targetHeight) {
            return new Promise(resolve => {
                let currentH = parseFloat(cable.style.height) || 35;
                const interval = setInterval(() => {
                    currentH += 5;
                    if (currentH >= targetHeight) {
                        currentH = targetHeight;
                        clearInterval(interval);
                        resolve();
                    }
                    cable.style.height = `${currentH}px`;
                    clawAssembly.style.top = `${22 + currentH}px`;
                }, 15);
            });
        }

        function animateCableUp(targetHeight) {
            return new Promise(resolve => {
                let currentH = parseFloat(cable.style.height) || 230;
                const interval = setInterval(() => {
                    currentH -= 5;
                    if (currentH <= targetHeight) {
                        currentH = targetHeight;
                        clearInterval(interval);
                        resolve();
                    }
                    cable.style.height = `${currentH}px`;
                    clawAssembly.style.top = `${22 + currentH}px`;
                }, 15);
            });
        }

        btnPlay.addEventListener('click', startClawGame);
    </script>
</body>
</html>
