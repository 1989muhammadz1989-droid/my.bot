<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة الرافعة الكبرى - Claw Machine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a0f2e 0%, #080314 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            overflow: hidden;
        }

        /* شريط معلومات المستخدم */
        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            color: #aaa;
        }

        .balance-box {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        /* كابينة اللعبة الرئيسية */
        .machine-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 430px;
            background: linear-gradient(180deg, #2c1654 0%, #120924 100%);
            border-radius: 20px;
            border: 4px solid #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* إطار الزجاج والمعاينة */
        .glass-window {
            position: relative;
            width: 100%;
            height: 330px;
            background: radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.1) 0%, rgba(0, 0, 0, 0.6) 100%);
            border-bottom: 3px solid #00f2fe;
            overflow: hidden;
        }

        /* سكة الرافعة العلوية */
        .rail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 16px;
            background: linear-gradient(90deg, #444, #888, #444);
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* عربة الرافعة الأفقیة */
        .trolley {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 50px;
            height: 15px;
            background: linear-gradient(180deg, #ffd700, #b8860b);
            border-radius: 4px;
            transform: translateX(-50%);
            transition: left 0.1s linear;
            z-index: 9;
        }

        /* حبل الرافعة */
        .cable {
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 30px;
            background: linear-gradient(90deg, #ccc, #fff, #888);
            transform: translateX(-50%);
            z-index: 8;
        }

        /* تجميعة الرافعة والمخالب */
        .claw-assembly {
            position: absolute;
            top: 55px;
            left: 50%;
            width: 60px;
            height: 50px;
            transform: translateX(-50%);
            z-index: 8;
        }

        .claw-base {
            width: 30px;
            height: 16px;
            background: linear-gradient(180deg, #ff007f, #99004d);
            margin: 0 auto;
            border-radius: 5px;
            box-shadow: 0 0 8px #ff007f;
        }

        .claw-arms {
            position: relative;
            width: 100%;
            height: 34px;
        }

        .claw-arm {
            position: absolute;
            top: 0;
            width: 8px;
            height: 32px;
            background: linear-gradient(180deg, #e0e0e0, #888);
            border-radius: 4px;
            transition: transform 0.3s ease;
        }

        .claw-arm.left {
            left: 12px;
            transform-origin: top center;
            transform: rotate(-25deg);
        }

        .claw-arm.right {
            right: 12px;
            transform-origin: top center;
            transform: rotate(25deg);
        }

        /* حالة إغلاق الرافعة */
        .claw-assembly.closed .claw-arm.left {
            transform: rotate(5deg);
        }
        .claw-assembly.closed .claw-arm.right {
            transform: rotate(-5deg);
        }

        /* صناديق الكنز في قاع الآلة */
        .chest-pit {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 5px;
        }

        .treasure-chest {
            position: absolute;
            width: 44px;
            height: 36px;
            background: linear-gradient(180deg, #d4af37 0%, #8a6d1c 100%);
            border: 2px solid #fff8dc;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7), 0 0 10px rgba(212, 175, 55, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .treasure-chest::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 6px;
            background: #5c4033;
            top: 12px;
        }

        .treasure-chest::after {
            content: '🪙';
            font-size: 14px;
            z-index: 2;
        }

        /* الصندوق المحمول بالرافعة */
        .grabbed-chest {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 7;
        }

        /* فتحة التفريغ/الأرباح */
        .chute {
            position: absolute;
            bottom: 0;
            right: 10px;
            width: 70px;
            height: 50px;
            background: #111;
            border: 2px dashed #00f2fe;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }

        /* لوحة التحكم والرهان */
        .control-panel {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 8, 33, 0.95);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-bet-adjust {
            width: 45px;
            height: 45px;
            background: linear-gradient(180deg, #3a3f58, #1e2235);
            border: 1px solid #5a6082;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }

        .btn-bet-adjust:active {
            transform: scale(0.95);
            background: #2a2e42;
        }

        .bet-display {
            text-align: center;
        }

        .bet-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 2px;
        }

        .bet-amount-text {
            font-size: 20px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .btn-max {
            padding: 8px 12px;
            background: linear-gradient(180deg, #ff9900, #cc7a00);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-play {
            width: 100%;
            height: 52px;
            background: linear-gradient(180deg, #ff007f 0%, #a60053 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
            transition: all 0.15s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .btn-play:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            color: #888;
        }

        .btn-play:not(:disabled):active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(255, 0, 127, 0.3);
        }

        /* تنبيه النتائج والأرباح */
        .status-banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            padding: 15px 25px;
            border-radius: 15px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }

        .status-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .status-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .status-win { color: #00ff88; text-shadow: 0 0 10px #00ff88; }
        .status-loss { color: #ff3366; text-shadow: 0 0 10px #ff3366; }

        .status-msg {
            font-size: 14px;
            color: #eee;
        }
    </style>
</head>
<body>

    <!-- شريط معلومات الرصيد والمستخدم -->
    <div class="top-bar">
        <div class="user-info">
            <span class="user-name" id="userName">لاعب متخفي</span>
            <span style="font-size: 10px; color: #00f2fe;">العملة الرسمية: NPS</span>
        </div>
        <div class="balance-box">
            <span id="userBalance">0.00</span> NPS
        </div>
    </div>

    <!-- كابينة آلة الرافعة -->
    <div class="machine-container">
        <div class="glass-window" id="glassWindow">
            <div class="rail"></div>
            
            <!-- عربة الحركة الأفقیة -->
            <div class="trolley" id="trolley"></div>
            
            <!-- حبل الرافعة -->
            <div class="cable" id="cable"></div>
            
            <!-- رأس الرافعة والمخالب -->
            <div class="claw-assembly" id="clawAssembly">
                <div class="claw-base"></div>
                <div class="claw-arms">
                    <div class="claw-arm left"></div>
                    <div class="claw-arm right"></div>
                </div>
                <!-- الصندوق أثناء الالتقاط -->
                <div class="treasure-chest grabbed-chest" id="grabbedChest"></div>
            </div>

            <!-- فتحة تفريغ الجوائز -->
            <div class="chute"></div>

            <!-- حوض الصناديق السفلية -->
            <div class="chest-pit">
                <div class="treasure-chest" style="left: 15%;"></div>
                <div class="treasure-chest" style="left: 38%;"></div>
                <div class="treasure-chest" style="left: 62%;"></div>
                <div class="treasure-chest" style="left: 82%;"></div>
            </div>

            <!-- نافذة عرض النتيجة -->
            <div class="status-banner" id="statusBanner">
                <div class="status-title" id="statusTitle">مبروك!</div>
                <div class="status-msg" id="statusMsg">ربحت 0.00 NPS</div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم والرهان -->
    <div class="control-panel">
        <div class="bet-controls-row">
            <button class="btn-bet-adjust" id="btnMinus">-</button>
            <div class="bet-display">
                <div class="bet-label">مبلغ الرهان</div>
                <div class="bet-amount-text"><span id="betAmount">5</span> NPS</div>
            </div>
            <button class="btn-bet-adjust" id="btnPlus">+</button>
            <button class="btn-max" id="btnMax">الحد الأقصى</button>
        </div>

        <button class="btn-play" id="btnPlay">إنزال الرافعة 🏗️</button>
    </div>

    <script>
        // تهيئة تطبيق تليجرام
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // استخراج user_id من رابط الصفحة أو تليجرام
        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('user_id') || urlParams.get('telegram_id');
        
        if (!userId && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }
        if (!userId) {
            userId = "10001"; // افتراضي للتجربة
        }

        // متغيرات اللعبة
        let currentBet = 5;
        const MIN_BET = 5;
        const MAX_BET = 1000;
        const BET_STEP = 5;
        let isPlaying = false;
        let userBalance = 0.0;

        // عناصر الواجهة
        const elBalance = document.getElementById('userBalance');
        const elUserName = document.getElementById('userName');
        const elBetAmount = document.getElementById('betAmount');
        const btnMinus = document.getElementById('btnMinus');
        const btnPlus = document.getElementById('btnPlus');
        const btnMax = document.getElementById('btnMax');
        const btnPlay = document.getElementById('btnPlay');
        
        const trolley = document.getElementById('trolley');
        const cable = document.getElementById('cable');
        const clawAssembly = document.getElementById('clawAssembly');
        const grabbedChest = document.getElementById('grabbedChest');
        const statusBanner = document.getElementById('statusBanner');
        const statusTitle = document.getElementById('statusTitle');
        const statusMsg = document.getElementById('statusMsg');

        // جلب بيانات المستخدم من السيرفر
        async function fetchUserData() {
            try {
                const response = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await response.json();
                if (data.success) {
                    userBalance = data.balance;
                    elBalance.innerText = userBalance.toFixed(2);
                    if (data.full_name) {
                        elUserName.innerText = data.full_name;
                    }
                }
            } catch (err) {
                console.error("خطأ في جلب بيانات المستخدم:", err);
            }
        }

        // تحديث إعدادات الرهان
        function updateBet(amount) {
            if (isPlaying) return;
            currentBet = Math.max(MIN_BET, Math.min(MAX_BET, amount));
            elBetAmount.innerText = currentBet;
        }

        btnMinus.addEventListener('click', () => updateBet(currentBet - BET_STEP));
        btnPlus.addEventListener('click', () => updateBet(currentBet + BET_STEP));
        btnMax.addEventListener('click', () => updateBet(MAX_BET));

        // تأثيرات صوتية بسيطة عبر Web Audio API (تزيد الواقعية)
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'move') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'drop') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch(e) {}
        }

        // إخفاء تنبيه النتيجة
        function hideStatus() {
            statusBanner.classList.remove('show');
        }

        // إظهار النتيجة
        function showStatus(isWin, winAmount) {
            if (isWin) {
                statusTitle.innerText = "مبروك! 🪙";
                statusTitle.className = "status-title status-win";
                statusMsg.innerText = `نجحت الرافعة! الأرباح: +${winAmount.toFixed(2)} NPS`;
                playSound('win');
            } else {
                statusTitle.innerText = "خسارة! 💥";
                statusTitle.className = "status-title status-loss";
                statusMsg.innerText = "سقط الصندوق أثناء الصعود!";
                playSound('drop');
            }
            statusBanner.classList.add('show');
        }

        // تشغيل أنيميشن تحريك الرافعة وحساب النتيجة
        async function startClawGame() {
            if (isPlaying) return;
            if (userBalance < currentBet) {
                alert("رصيدك غير كافٍ لإجراء الرهان!");
                return;
            }

            isPlaying = true;
            btnPlay.disabled = true;
            btnMinus.disabled = true;
            btnPlus.disabled = true;
            btnMax.disabled = true;
            hideStatus();

            // 1. طلب النتيجة من خادم Flask
            let playResult = null;
            try {
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: 'claw_machine',
                        bet_amount: currentBet
                    })
                });

                const data = await response.json();
                if (!data.success) {
                    alert(data.message || "حدث خطأ أثناء اللعب");
                    isPlaying = false;
                    btnPlay.disabled = false;
                    btnMinus.disabled = false;
                    btnPlus.disabled = false;
                    btnMax.disabled = false;
                    return;
                }
                playResult = data;
            } catch (err) {
                console.error("خطأ في الاتصال بالسيرفر:", err);
                alert("فشل الاتصال بالسيرفر!");
                isPlaying = false;
                btnPlay.disabled = false;
                btnMinus.disabled = false;
                btnPlus.disabled = false;
                btnMax.disabled = false;
                return;
            }

            // تحديث الرصيد مبدئياً
            userBalance = playResult.new_balance;
            elBalance.innerText = userBalance.toFixed(2);

            // 2. أنيميشن تحريك الرافعة أفقياً إلى منتصف المستهدف
            const targetX = Math.random() * 60 + 20; // نسبة مئوية
            trolley.style.left = `${targetX}%`;
            cable.style.left = `${targetX}%`;
            clawAssembly.style.left = `${targetX}%`;
            playSound('move');

            await new Promise(r => setTimeout(r, 1000));

            // 3. إنزال الرافعة للأسفل
            const maxDrop = 210; // بكسل
            cable.style.height = `${maxDrop}px`;
            clawAssembly.style.top = `${25 + maxDrop}px`;
            playSound('move');

            await new Promise(r => setTimeout(r, 1200));

            // 4. إغلاق الرافعة والتقاط الصندوق
            clawAssembly.classList.add('closed');
            grabbedChest.style.display = 'block';

            await new Promise(r => setTimeout(r, 500));

            // 5. بدء رفع الرافعة لأعلى
            const isWin = playResult.win_amount > 0;

            if (isWin) {
                // حالة الربح: صعود كامل وتفريغ الصندوق في فتحة الأرباح
                cable.style.height = `30px`;
                clawAssembly.style.top = `55px`;
                await new Promise(r => setTimeout(r, 1200));

                // التحرك لفتحة الجوائز (اليمين)
                trolley.style.left = `85%`;
                cable.style.left = `85%`;
                clawAssembly.style.left = `85%`;
                await new Promise(r => setTimeout(r, 800));

                // فتح الرافعة وإسقاط الصندوق في الفتحة
                clawAssembly.classList.remove('closed');
                grabbedChest.style.display = 'none';

                showStatus(true, playResult.win_amount);
            } else {
                // حالة الخسارة: صعود منتصف الطريق ثم سلب/إسقاط الصندوق
                cable.style.height = `120px`;
                clawAssembly.style.top = `145px`;
                await new Promise(r => setTimeout(r, 600));

                // فتح الرافعة فجأة وسقوط الصندوق
                clawAssembly.classList.remove('closed');
                grabbedChest.style.display = 'none';

                // إكمال صعود الرافعة فارغة
                cable.style.height = `30px`;
                clawAssembly.style.top = `55px`;

                showStatus(false, 0);
            }

            await new Promise(r => setTimeout(r, 1000));

            // إعادة الرافعة للمنتصف
            trolley.style.left = `50%`;
            cable.style.left = `50%`;
            clawAssembly.style.left = `50%`;

            isPlaying = false;
            btnPlay.disabled = false;
            btnMinus.disabled = false;
            btnPlus.disabled = false;
            btnMax.disabled = false;
        }

        btnPlay.addEventListener('click', startClawGame);

        // تحميل بيانات المستخدم فور فتح الصفحة
        fetchUserData();
    </script>
</body>
</html>
