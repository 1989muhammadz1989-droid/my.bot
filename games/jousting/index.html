<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مبارزة الفرسان - Jousting Knight</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0907;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            max-width: 600px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(20, 15, 10, 0.95) 0%, rgba(10, 8, 5, 0.8) 100%);
            border-bottom: 2px solid #b8860b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #e2b13c;
            background: #2a1f18;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .user-name {
            font-size: 14px;
            font-weight: 800;
            color: #e2b13c;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .balance-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid #d4af37;
            border-radius: 20px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.3);
        }
        .balance-label {
            font-size: 11px;
            color: #aaa;
        }
        .balance-val {
            font-size: 16px;
            font-weight: 900;
            color: #4ef037;
            font-family: 'Cinzel', monospace;
        }
        .currency {
            color: #ffd700;
            font-size: 13px;
            font-weight: 800;
        }

        /* Canvas Stage */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #110e0c;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Alerts */
        .result-overlay {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            z-index: 20;
        }
        .result-overlay.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .result-title {
            font-size: 38px;
            font-weight: 900;
            text-shadow: 0 0 20px #000, 0 0 10px #000;
            margin-bottom: 5px;
        }
        .result-win {
            color: #4ef037;
            text-shadow: 0 0 25px rgba(78, 240, 55, 0.8);
        }
        .result-loss {
            color: #ff3333;
            text-shadow: 0 0 25px rgba(255, 51, 51, 0.8);
        }
        .result-sub {
            font-size: 22px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 4px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-block;
        }

        /* Control Panel */
        .control-panel {
            width: 100%;
            max-width: 600px;
            background: linear-gradient(0deg, rgba(15,11,8,0.98) 0%, rgba(30,22,15,0.9) 100%);
            border-top: 2px solid #b8860b;
            padding: 15px 20px 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.9);
            z-index: 10;
        }
        .bet-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            border: 1px solid #554125;
            border-radius: 14px;
            padding: 6px 10px;
        }
        .bet-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            background: linear-gradient(180deg, #4a381f 0%, #241a0d 100%);
            color: #ffd700;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }
        .bet-btn:active {
            transform: scale(0.92);
            background: #241a0d;
        }
        .bet-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bet-label {
            font-size: 11px;
            color: #aaa;
        }
        .bet-value-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bet-amount {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Cinzel', monospace;
        }
        .quick-bets {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        .q-btn {
            flex: 1;
            padding: 6px 0;
            background: rgba(45, 33, 20, 0.8);
            border: 1px solid #775a2f;
            border-radius: 8px;
            color: #ddd;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .q-btn:active, .q-btn.active {
            background: #d4af37;
            color: #000;
            border-color: #fff;
        }

        /* Play Button */
        .action-btn {
            width: 100%;
            height: 54px;
            border-radius: 14px;
            border: 2px solid #ffe89c;
            background: linear-gradient(180deg, #d4af37 0%, #8a640f 100%);
            color: #1a0f00;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4), inset 0 2px 4px rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }
        .action-btn:disabled {
            background: #443c32;
            border-color: #665c50;
            color: #887d70;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <!-- Upper Stats Bar -->
    <div class="top-bar">
        <div class="user-info">
            <div class="user-avatar">🛡️</div>
            <div class="user-name" id="userName">الفارس</div>
        </div>
        <div class="balance-box">
            <span class="balance-label">الرصيد:</span>
            <span class="balance-val" id="userBalance">0.00</span>
            <span class="currency">NPS</span>
        </div>
    </div>

    <!-- Animation Stage -->
    <div class="stage-container">
        <canvas id="gameCanvas"></canvas>
        <div class="result-overlay" id="resultOverlay">
            <div class="result-title" id="resultTitle">فوز ساحق!</div>
            <div class="result-sub" id="resultSub">+200 NPS</div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="bet-control-row">
            <button class="bet-btn" onclick="changeBet(-5)">-</button>
            <div class="bet-display">
                <span class="bet-label">قيمة الرهان</span>
                <div class="bet-value-box">
                    <span class="bet-amount" id="betAmount">10</span>
                    <span class="currency">NPS</span>
                </div>
            </div>
            <button class="bet-btn" onclick="changeBet(5)">+</button>
        </div>

        <div class="quick-bets">
            <button class="q-btn" onclick="setBet(5)">5</button>
            <button class="q-btn" onclick="setBet(20)">20</button>
            <button class="q-btn" onclick="setBet(50)">50</button>
            <button class="q-btn" onclick="setBet(100)">100</button>
            <button class="q-btn" onclick="setBet(500)">500</button>
            <button class="q-btn" onclick="setBet(1000)">1000</button>
        </div>

        <button class="action-btn" id="playBtn" onclick="startJoust()">
            <span>انطلاق المبارزة</span> ⚔️
        </button>
    </div>

<script>
    // URL Params & User Setup
    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('user_id') || urlParams.get('telegram_id');
    
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        userId = userId || window.Telegram.WebApp.initDataUnsafe.user.id;
    }
    if (!userId) userId = "1000"; // المعرف الافتراضي للتجربة

    let currentBalance = 0.00;
    let betAmount = 10;
    const minBet = 5;
    const maxBet = 1000;
    let isPlaying = false;

    // Canvas Engine Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        width = canvas.width;
        height = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Sound Generator (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playGallopSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playImpactSound(isWin) {
        if (!audioCtx) return;
        // Crash Noise
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    // Game Animation Logic
    let gameState = 'IDLE'; // IDLE, CHARGING, IMPACT, RESULT
    let progress = 0;
    let particles = [];
    let isWinRound = false;

    // Knight Positions & Properties
    let playerKnight = { x: 0, y: 0, color: '#3b82f6', lanceAngle: 0, fallen: false, fallAngle: 0 };
    let enemyKnight = { x: 0, y: 0, color: '#ef4444', lanceAngle: 0, fallen: false, fallAngle: 0 };

    function fetchUserData() {
        fetch(`/api/user/get?user_id=${userId}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentBalance = data.balance;
                    document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
                    document.getElementById('userName').innerText = data.full_name || `فارس_${userId}`;
                }
            }).catch(e => console.log('User fetch error:', e));
    }

    function changeBet(delta) {
        if (isPlaying) return;
        betAmount = Math.max(minBet, Math.min(maxBet, betAmount + delta));
        document.getElementById('betAmount').innerText = betAmount;
    }

    function setBet(val) {
        if (isPlaying) return;
        betAmount = Math.max(minBet, Math.min(maxBet, val));
        document.getElementById('betAmount').innerText = betAmount;
    }

    // Particle Effect Engine
    function createDust(x, y) {
        for (let i = 0; i < 4; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: -Math.random() * 3,
                size: Math.random() * 8 + 4,
                color: 'rgba(180, 150, 100, ' + (Math.random() * 0.5 + 0.3) + ')',
                life: 1
            });
        }
    }

    function createSparks(x, y) {
        for (let i = 0; i < 30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 12 + 4;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: Math.random() * 4 + 2,
                color: Math.random() > 0.3 ? '#ffd700' : '#ffffff',
                life: 1
            });
        }
    }

    // Draw Medieval Background
    function drawBackground() {
        // Sky Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.65);
        skyGrad.addColorStop(0, '#1c130c');
        skyGrad.addColorStop(0.5, '#4a2c11');
        skyGrad.addColorStop(1, '#8c501c');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height * 0.65);

        // Sun / Light
        let sunGrad = ctx.createRadialGradient(width * 0.5, height * 0.3, 10, width * 0.5, height * 0.3, 120);
        sunGrad.addColorStop(0, 'rgba(255, 220, 150, 0.4)');
        sunGrad.addColorStop(1, 'rgba(255, 220, 150, 0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, width, height);

        // Castle Silhouette
        ctx.fillStyle = '#170f08';
        ctx.beginPath();
        ctx.rect(width * 0.1, height * 0.45, 80, 80);
        ctx.rect(width * 0.12, height * 0.40, 20, 20);
        ctx.rect(width * 0.16, height * 0.40, 20, 20);
        ctx.rect(width * 0.7, height * 0.42, 110, 100);
        ctx.rect(width * 0.72, height * 0.36, 25, 25);
        ctx.rect(width * 0.8, height * 0.36, 25, 25);
        ctx.fill();

        // Arena Ground
        let groundGrad = ctx.createLinearGradient(0, height * 0.65, 0, height);
        groundGrad.addColorStop(0, '#3a2512');
        groundGrad.addColorStop(0.2, '#5c3a1d');
        groundGrad.addColorStop(1, '#221408');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, height * 0.65, width, height * 0.35);

        // Fence / Banner Line
        ctx.strokeStyle = '#2b1a0d';
        ctx.lineWidth = 6 * window.devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.66);
        ctx.lineTo(width, height * 0.66);
        ctx.stroke();

        // Medieval Flags
        for (let i = 40; i < width; i += 120) {
            ctx.fillStyle = (i / 120) % 2 === 0 ? '#b81d1d' : '#1d52b8';
            ctx.beginPath();
            ctx.moveTo(i, height * 0.66);
            ctx.lineTo(i + 25, height * 0.66);
            ctx.lineTo(i + 12.5, height * 0.71);
            ctx.closePath();
            ctx.fill();
        }
    }

    // Render Knight Character
    function drawKnight(k, isPlayer) {
        ctx.save();
        ctx.translate(k.x, k.y);

        if (k.fallen) {
            ctx.rotate(k.fallAngle);
        }

        const scale = (height / 500) * 0.8;
        ctx.scale(isPlayer ? scale : -scale, scale);

        const bob = (gameState === 'CHARGING' && !k.fallen) ? Math.sin(Date.now() * 0.03) * 6 : 0;

        // Horse Body
        ctx.fillStyle = isPlayer ? '#2b1b17' : '#4a4441';
        ctx.beginPath();
        ctx.ellipse(0, 0 + bob, 45, 25, 0, 0, Math.PI * 2);
        ctx.fill();

        // Horse Head & Neck
        ctx.beginPath();
        ctx.moveTo(25, -10 + bob);
        ctx.lineTo(40, -35 + bob);
        ctx.lineTo(50, -25 + bob);
        ctx.lineTo(35, 5 + bob);
        ctx.closePath();
        ctx.fill();

        // Horse Legs
        ctx.strokeStyle = isPlayer ? '#1c110e' : '#2d2928';
        ctx.lineWidth = 7;
        const legAnim = (gameState === 'CHARGING' && !k.fallen) ? Math.sin(Date.now() * 0.04) * 20 : 0;
        
        ctx.beginPath();
        ctx.moveTo(-25, 15); ctx.lineTo(-30 + legAnim, 45);
        ctx.moveTo(-10, 15); ctx.lineTo(-5 - legAnim, 45);
        ctx.moveTo(15, 15);  ctx.lineTo(20 + legAnim, 45);
        ctx.moveTo(30, 15);  ctx.lineTo(25 - legAnim, 45);
        ctx.stroke();

        // Rider / Knight Armor
        ctx.fillStyle = '#a8b2b9'; // Metallic Armor
        ctx.fillRect(-10, -45 + bob, 22, 30); // Torso

        // Helmet
        ctx.fillStyle = '#d1d5db';
        ctx.beginPath();
        ctx.arc(0, -52 + bob, 12, 0, Math.PI * 2);
        ctx.fill();

        // Helmet Plume/Feather
        ctx.fillStyle = k.color;
        ctx.beginPath();
        ctx.moveTo(-4, -64 + bob);
        ctx.quadraticCurveTo(-15, -75 + bob, -25, -60 + bob);
        ctx.quadraticCurveTo(-10, -60 + bob, 0, -62 + bob);
        ctx.fill();

        // Shield
        ctx.fillStyle = k.color;
        ctx.beginPath();
        ctx.moveTo(5, -42 + bob);
        ctx.lineTo(20, -42 + bob);
        ctx.lineTo(12, -22 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Jousting Lance (Richer Metallic Lance)
        ctx.save();
        ctx.translate(5, -35 + bob);
        ctx.rotate(k.lanceAngle);
        ctx.fillStyle = '#855829';
        ctx.fillRect(-15, -4, 110, 6);
        ctx.fillStyle = '#d1d5db';
        ctx.beginPath();
        ctx.moveTo(95, -6);
        ctx.lineTo(120, -1);
        ctx.lineTo(95, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.restore();
    }

    // Main Game Loop
    function render() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        const groundY = height * 0.78;

        if (gameState === 'IDLE') {
            playerKnight.x = width * 0.18;
            playerKnight.y = groundY;
            playerKnight.lanceAngle = 0;
            playerKnight.fallen = false;

            enemyKnight.x = width * 0.82;
            enemyKnight.y = groundY;
            enemyKnight.lanceAngle = 0;
            enemyKnight.fallen = false;
        } 
        else if (gameState === 'CHARGING') {
            progress += 0.012;

            playerKnight.x = width * 0.18 + (width * 0.27) * progress;
            enemyKnight.x = width * 0.82 - (width * 0.27) * progress;

            // Lance Aiming Motion
            playerKnight.lanceAngle = Math.sin(progress * Math.PI) * -0.12;
            enemyKnight.lanceAngle = Math.sin(progress * Math.PI) * -0.12;

            if (Math.random() > 0.4) {
                createDust(playerKnight.x, groundY + 20);
                createDust(enemyKnight.x, groundY + 20);
                if (Math.random() > 0.7) playGallopSound();
            }

            if (progress >= 1) {
                gameState = 'IMPACT';
                createSparks(width * 0.5, groundY - 30);
                playImpactSound(isWinRound);

                if (isWinRound) {
                    enemyKnight.fallen = true;
                } else {
                    playerKnight.fallen = true;
                }
            }
        } 
        else if (gameState === 'IMPACT' || gameState === 'RESULT') {
            if (playerKnight.fallen && playerKnight.fallAngle < Math.PI / 2) {
                playerKnight.fallAngle += 0.1;
                playerKnight.x -= 2;
            }
            if (enemyKnight.fallen && enemyKnight.fallAngle > -Math.PI / 2) {
                enemyKnight.fallAngle -= 0.1;
                enemyKnight.x += 2;
            }
        }

        // Render Knights
        drawKnight(playerKnight, true);
        drawKnight(enemyKnight, false);

        // Render Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.025;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(render);
    }

    // Trigger Game Round
    function startJoust() {
        initAudio();
        if (isPlaying) return;

        if (currentBalance < betAmount) {
            alert('رصيدك غير كافٍ لإجراء المبارزة!');
            return;
        }

        isPlaying = true;
        document.getElementById('playBtn').disabled = true;
        document.getElementById('resultOverlay').classList.remove('active');

        // Connect directly to app-٩.py play endpoint
        fetch('/api/play', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: userId,
                game_id: 'jousting',
                bet_amount: betAmount
            })
        })
        .then(res => res.json())
        .then(data => {
            if (!data.success) {
                alert(data.message || 'حدث خطأ أثناء الاتصال بالسيرفر');
                isPlaying = false;
                document.getElementById('playBtn').disabled = false;
                return;
            }

            // Sync result
            isWinRound = (data.win_amount > 0);
            currentBalance = data.new_balance;

            // Start charging animation
            progress = 0;
            gameState = 'CHARGING';

            // Show result after impact animation
            setTimeout(() => {
                gameState = 'RESULT';
                showResult(isWinRound, data.win_amount);
                document.getElementById('userBalance').innerText = currentBalance.toFixed(2);

                setTimeout(() => {
                    gameState = 'IDLE';
                    isPlaying = false;
                    document.getElementById('playBtn').disabled = false;
                }, 2500);

            }, 1800);

        })
        .catch(err => {
            console.error(err);
            alert('تعذر الارتباط بالنظام. تحقق من اتصالك.');
            isPlaying = false;
            document.getElementById('playBtn').disabled = false;
        });
    }

    function showResult(win, winAmt) {
        const overlay = document.getElementById('resultOverlay');
        const title = document.getElementById('resultTitle');
        const sub = document.getElementById('resultSub');

        if (win) {
            title.innerText = "انتصار ملحمي! ⚔️";
            title.className = "result-title result-win";
            sub.innerText = `+${winAmt.toFixed(2)} NPS`;
        } else {
            title.innerText = "سقوط الفارس! 🛡️";
            title.className = "result-title result-loss";
            sub.innerText = `-${betAmount.toFixed(2)} NPS`;
        }
        overlay.classList.add('active');
    }

    // Initialize Page
    fetchUserData();
    requestAnimationFrame(render);
</script>
</body>
</html>
