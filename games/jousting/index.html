<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مبارزة الفرسان الملحمية - Jousting Knight Live 2X</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050302;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
        }

        /* Top Bar Header */
        .top-bar {
            width: 100%;
            max-width: 650px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(25, 16, 9, 0.98) 0%, rgba(10, 6, 3, 0.95) 100%);
            border-bottom: 2px solid #d4af37;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
            z-index: 20;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            background: radial-gradient(circle, #4a321a 0%, #1a0f08 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .user-name {
            font-size: 15px;
            font-weight: 800;
            color: #f3cf7a;
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .balance-box {
            background: rgba(0, 0, 0, 0.85);
            border: 1.5px solid #d4af37;
            border-radius: 20px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.3), 0 0 12px rgba(0,0,0,0.8);
        }
        .balance-label {
            font-size: 12px;
            color: #bbb;
        }
        .balance-val {
            font-size: 18px;
            font-weight: 900;
            color: #4ef037;
            font-family: 'Cinzel', monospace;
        }
        .currency {
            color: #ffd700;
            font-size: 13px;
            font-weight: 800;
        }

        /* Live Round Status & Combat Timer Bar */
        .live-status-bar {
            position: absolute;
            top: 72px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(15, 9, 4, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.8);
            padding: 8px 22px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff3333;
            box-shadow: 0 0 10px #ff3333;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 1; }
        }
        .live-text {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
        }
        .timer-val {
            font-family: 'Cinzel', monospace;
            color: #ffd700;
            font-size: 17px;
            font-weight: 900;
        }
        .combat-progress-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
            display: none;
            margin-top: 4px;
        }
        .combat-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff3333, #ffd700);
            transition: width 0.1s linear;
        }

        /* Canvas Arena Stage */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Result Card */
        .result-overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            z-index: 30;
            width: 88%;
            max-width: 380px;
            padding: 24px 20px;
            border-radius: 24px;
            background: rgba(12, 7, 4, 0.95);
            border: 2px solid #ffd700;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.95), inset 0 0 20px rgba(255, 215, 0, 0.25);
        }
        .result-overlay.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .result-title {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .result-win {
            color: #4ef037;
            text-shadow: 0 0 25px rgba(78, 240, 55, 0.9);
        }
        .result-loss {
            color: #ff3333;
            text-shadow: 0 0 25px rgba(255, 51, 51, 0.9);
        }
        .result-sub {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            font-family: 'Cinzel', monospace;
            margin-top: 8px;
        }
        .result-desc {
            font-size: 13px;
            color: #aaa;
            margin-top: 6px;
        }

        /* Control Panel */
        .control-panel {
            width: 100%;
            max-width: 650px;
            background: linear-gradient(0deg, rgba(10, 6, 3, 0.99) 0%, rgba(26, 16, 9, 0.95) 100%);
            border-top: 2px solid #d4af37;
            padding: 14px 20px 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -8px 35px rgba(0,0,0,0.95);
            z-index: 20;
        }
        .bet-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.65);
            border: 1px solid #7a5c2d;
            border-radius: 16px;
            padding: 6px 12px;
        }
        .bet-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            background: linear-gradient(180deg, #5e4827 0%, #2e200f 100%);
            color: #ffd700;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .bet-btn:active {
            transform: scale(0.92);
            background: #2e200f;
        }
        .bet-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bet-label {
            font-size: 11px;
            color: #bbb;
        }
        .bet-value-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bet-amount {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Cinzel', monospace;
        }
        .quick-bets {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        .q-btn {
            flex: 1;
            padding: 8px 0;
            background: rgba(48, 34, 18, 0.85);
            border: 1px solid #826233;
            border-radius: 10px;
            color: #eee;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
        }
        .q-btn:active, .q-btn.active {
            background: #d4af37;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Action / Bet Button */
        .action-btn {
            width: 100%;
            height: 56px;
            border-radius: 16px;
            border: 2px solid #ffea9f;
            background: linear-gradient(180deg, #eec34b 0%, #986a0e 100%);
            color: #120800;
            font-size: 21px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.45), inset 0 2px 5px rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
        }
        .action-btn.joined {
            background: linear-gradient(180deg, #32e173 0%, #0d837a 100%);
            color: #021a08;
            border-color: #a3ffb0;
            box-shadow: 0 6px 25px rgba(50, 225, 115, 0.45);
        }
        .action-btn:disabled {
            background: #362e26;
            border-color: #52473c;
            color: #786c5f;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <!-- Upper Stats Bar -->
    <div class="top-bar">
        <div class="user-info">
            <div class="user-avatar">🛡️</div>
            <div class="user-name" id="userName">الفارس</div>
        </div>
        <div class="balance-box">
            <span class="balance-label">الرصيد:</span>
            <span class="balance-val" id="userBalance">0.00</span>
            <span class="currency">NPS</span>
        </div>
    </div>

    <!-- Live Timer & Combat Status Bar -->
    <div class="live-status-bar">
        <div class="status-header">
            <div class="live-dot" id="liveDot"></div>
            <span class="live-text" id="liveStatusText">تجهيز المعركة القادمة:</span>
            <span class="timer-val" id="timerVal">5ث</span>
        </div>
        <div class="combat-progress-bg" id="combatProgressBg">
            <div class="combat-progress-fill" id="combatProgressFill"></div>
        </div>
    </div>

    <!-- Animation Canvas Arena -->
    <div class="stage-container">
        <canvas id="gameCanvas"></canvas>
        <div class="result-overlay" id="resultOverlay">
            <div class="result-title" id="resultTitle">انتصار ملحمي!</div>
            <div class="result-sub" id="resultSub">+20.00 NPS</div>
            <div class="result-desc" id="resultDesc">مضاعف الربح الثابت 2X</div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="bet-control-row">
            <button class="bet-btn" onclick="changeBet(-5)">-</button>
            <div class="bet-display">
                <span class="bet-label">قيمة الرهان (العائد عند الفوز 2X: <span id="winEst" style="color:#4ef037">20.00</span> NPS)</span>
                <div class="bet-value-box">
                    <span class="bet-amount" id="betAmount">10</span>
                    <span class="currency">NPS</span>
                </div>
            </div>
            <button class="bet-btn" onclick="changeBet(5)">+</button>
        </div>

        <div class="quick-bets">
            <button class="q-btn" onclick="setBet(5)">5</button>
            <button class="q-btn" onclick="setBet(20)">20</button>
            <button class="q-btn" onclick="setBet(50)">50</button>
            <button class="q-btn" onclick="setBet(100)">100</button>
            <button class="q-btn" onclick="setBet(500)">500</button>
            <button class="q-btn" onclick="setBet(1000)">1000</button>
        </div>

        <button class="action-btn" id="playBtn" onclick="toggleBetInRound()">
            <span>تأكيد الرهان للجولة ⚔️</span>
        </button>
    </div>

<script>
    // URL Params & Telegram User Initialization
    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('user_id') || urlParams.get('telegram_id');
    
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        userId = userId || window.Telegram.WebApp.initDataUnsafe.user.id;
    }
    if (!userId) userId = "1000";

    let currentBalance = 100.00; // Default fallback balance
    let betAmount = 10;
    const minBet = 5;
    const maxBet = 1000;
    const WIN_MULTIPLIER = 2.0; // STRICT 2X MULTIPLIER RULE
    
    // Round States: 'COUNTDOWN', 'CHARGING', 'MELEE_COMBAT', 'FINAL_STRIKE', 'RESULT'
    let roundState = 'COUNTDOWN';
    let countdownTime = 5; // 5-second countdown between rounds
    let combatTimer = 0; // 15-second total combat duration
    const TOTAL_COMBAT_DURATION = 15; // Exact 15 seconds real combat duration
    let countdownInterval = null;
    let combatInterval = null;
    
    let isBetPlacedForNextRound = false;
    let isPlayerWinner = false;

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * (window.devicePixelRatio || 1);
        canvas.height = rect.height * (window.devicePixelRatio || 1);
        width = canvas.width;
        height = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Procedural Audio Engine
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playGallopSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function playClashSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        } catch(e) {}
    }

    function playImpactSound() {
        if (!audioCtx) return;
        try {
            const bufferSize = audioCtx.sampleRate * 0.45;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        } catch(e) {}
    }

    // Animation & Physics Objects
    let particles = [];
    let cameraShake = { x: 0, y: 0, intensity: 0 };

    let playerKnight = {
        x: 0, y: 0,
        hp: 100,
        color: '#2563eb',
        banner: '#3b82f6',
        swordAngle: 0,
        fallen: false,
        fallAngle: 0
    };

    let enemyKnight = {
        x: 0, y: 0,
        hp: 100,
        color: '#dc2626',
        banner: '#ef4444',
        swordAngle: 0,
        fallen: false,
        fallAngle: 0
    };

    function fetchUserData() {
        fetch(`/api/user/get?user_id=${userId}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.success) {
                    currentBalance = data.balance;
                    document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
                    document.getElementById('userName').innerText = data.full_name || `فارس_${userId}`;
                }
            }).catch(e => {
                document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
            });
    }

    function changeBet(delta) {
        if (isBetPlacedForNextRound && roundState === 'COUNTDOWN') return;
        betAmount = Math.max(minBet, Math.min(maxBet, betAmount + delta));
        updateBetUI();
    }

    function setBet(val) {
        if (isBetPlacedForNextRound && roundState === 'COUNTDOWN') return;
        betAmount = Math.max(minBet, Math.min(maxBet, val));
        updateBetUI();
    }

    function updateBetUI() {
        document.getElementById('betAmount').innerText = betAmount;
        document.getElementById('winEst').innerText = (betAmount * WIN_MULTIPLIER).toFixed(2);
    }

    function toggleBetInRound() {
        initAudio();
        if (roundState !== 'COUNTDOWN') return;

        if (!isBetPlacedForNextRound) {
            if (currentBalance < betAmount) {
                alert('رصيدك غير كافٍ لإجراء هذا الرهان!');
                return;
            }
            isBetPlacedForNextRound = true;
            const btn = document.getElementById('playBtn');
            btn.classList.add('joined');
            btn.innerHTML = `<span>تم تأكيد الرهان (${betAmount} NPS) ✔️</span>`;
        } else {
            isBetPlacedForNextRound = false;
            const btn = document.getElementById('playBtn');
            btn.classList.remove('joined');
            btn.innerHTML = `<span>تأكيد الرهان للجولة ⚔️</span>`;
        }
    }

    // Particle FX Engine
    function createDust(x, y) {
        for (let i = 0; i < 3; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * 15,
                y: y,
                vx: (Math.random() - 0.5) * 3,
                vy: -Math.random() * 2 - 1,
                size: Math.random() * 8 + 4,
                color: `rgba(${160 + Math.random()*40}, ${120 + Math.random()*30}, 80, ${Math.random() * 0.4 + 0.2})`,
                life: 1,
                type: 'DUST'
            });
        }
    }

    function createSparks(x, y) {
        for (let i = 0; i < 25; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 14 + 4;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                size: Math.random() * 4 + 2,
                color: Math.random() > 0.3 ? '#ffd700' : '#ffffff',
                life: 1,
                type: 'SPARK'
            });
        }
    }

    function createBloodSplatter(x, y, dir) {
        for (let i = 0; i < 35; i++) {
            const angle = Math.random() * Math.PI - (dir > 0 ? 0 : Math.PI);
            const speed = Math.random() * 12 + 3;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed * dir,
                vy: Math.sin(angle) * speed - 3,
                size: Math.random() * 6 + 3,
                color: Math.random() > 0.2 ? '#cc0000' : '#880000',
                life: 1,
                type: 'BLOOD'
            });
        }
    }

    // Graphic Background Renderer
    function drawBackground() {
        // Sky Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.65);
        skyGrad.addColorStop(0, '#060305');
        skyGrad.addColorStop(0.4, '#240d06');
        skyGrad.addColorStop(0.8, '#63250a');
        skyGrad.addColorStop(1, '#be571d');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height * 0.65);

        // Sun & Volumetric Light
        let sunX = width * 0.5;
        let sunY = height * 0.38;
        let sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, width * 0.55);
        sunGrad.addColorStop(0, 'rgba(255, 220, 140, 0.5)');
        sunGrad.addColorStop(0.5, 'rgba(210, 90, 20, 0.2)');
        sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, width, height * 0.65);

        // Castle Silhouettes in Horizon
        ctx.fillStyle = '#120703';
        ctx.beginPath();
        ctx.moveTo(0, height * 0.65);
        ctx.lineTo(width * 0.15, height * 0.58);
        ctx.lineTo(width * 0.2, height * 0.61);
        ctx.lineTo(width * 0.3, height * 0.54);
        ctx.lineTo(width * 0.35, height * 0.65);
        ctx.lineTo(width * 0.65, height * 0.65);
        ctx.lineTo(width * 0.72, height * 0.52);
        ctx.lineTo(width * 0.8, height * 0.65);
        ctx.lineTo(width, height * 0.65);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Arena Dirt Ground
        let groundGrad = ctx.createLinearGradient(0, height * 0.65, 0, height);
        groundGrad.addColorStop(0, '#3a2211');
        groundGrad.addColorStop(0.3, '#241409');
        groundGrad.addColorStop(1, '#0e0703');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, height * 0.65, width, height * 0.35);

        // Fence / Barrier
        ctx.strokeStyle = '#5a3d1f';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.67);
        ctx.lineTo(width, height * 0.67);
        ctx.stroke();
    }

    // Knight Render Engine
    function drawKnight(knight, isPlayer) {
        ctx.save();
        ctx.translate(knight.x, knight.y);

        if (knight.fallen) {
            ctx.rotate(knight.fallAngle);
        }

        const dir = isPlayer ? 1 : -1;
        const scale = height * 0.0018;
        ctx.scale(scale * dir, scale);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 35, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Armor Legs & Feet
        ctx.fillStyle = '#64748b';
        ctx.fillRect(-15, -25, 10, 25);
        ctx.fillRect(5, -25, 10, 25);

        // Torso / Plate Armor
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.moveTo(-20, -60);
        ctx.lineTo(20, -60);
        ctx.lineTo(15, -25);
        ctx.lineTo(-15, -25);
        ctx.closePath();
        ctx.fill();

        // Tabard / Colored Banner
        ctx.fillStyle = knight.color;
        ctx.fillRect(-12, -58, 24, 30);

        // Helmet & Visor
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.arc(0, -75, 16, 0, Math.PI * 2);
        ctx.fill();

        // Visor Slot
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(isPlayer ? 2 : -10, -78, 10, 4);

        // Plume / Feather
        ctx.fillStyle = knight.banner;
        ctx.beginPath();
        ctx.moveTo(0, -90);
        ctx.quadraticCurveTo(isPlayer ? -15 : 15, -105, isPlayer ? -25 : 25, -95);
        ctx.lineTo(0, -85);
        ctx.fill();

        // Sword & Shield
        ctx.save();
        ctx.translate(isPlayer ? 10 : -10, -45);
        ctx.rotate(knight.swordAngle);

        // Sword Blade
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(-3, -50, 6, 50);
        // Hilt
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(-10, -5, 20, 5);
        ctx.restore();

        // Health Bar Above Head
        if (roundState === 'MELEE_COMBAT' || roundState === 'FINAL_STRIKE') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(-30, -110, 60, 8);
            ctx.fillStyle = knight.hp > 30 ? '#22c55e' : '#ef4444';
            ctx.fillRect(-28, -108, (knight.hp / 100) * 56, 4);
        }

        ctx.restore();
    }

    // Update Particles
    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.025;

            if (p.type === 'SPARK' || p.type === 'BLOOD') {
                p.vy += 0.4; // Gravity
            }

            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // Main 15-Second Combat Controller
    function start15SecBattle() {
        roundState = 'CHARGING';
        combatTimer = 0;
        document.getElementById('liveStatusText').innerText = "المعركة ملحمة جارية!";
        document.getElementById('combatProgressBg').style.display = 'block';

        // Pre-determine outcome for smooth cinematic sync
        // Independent mathematical calculation: 50% chance win
        isPlayerWinner = Math.random() >= 0.5;

        // Reset Knights
        playerKnight.hp = 100;
        enemyKnight.hp = 100;
        playerKnight.fallen = false;
        enemyKnight.fallen = false;
        playerKnight.fallAngle = 0;
        enemyKnight.fallAngle = 0;

        playerKnight.x = width * 0.15;
        playerKnight.y = height * 0.72;
        enemyKnight.x = width * 0.85;
        enemyKnight.y = height * 0.72;

        if (combatInterval) clearInterval(combatInterval);

        const startTime = Date.now();

        combatInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            combatTimer = elapsed;

            const progressPct = Math.min(100, (combatTimer / TOTAL_COMBAT_DURATION) * 100);
            document.getElementById('combatProgressFill').style.width = `${progressPct}%`;
            document.getElementById('timerVal').innerText = `${Math.ceil(TOTAL_COMBAT_DURATION - combatTimer)}ث`;

            // PHASE 1: CHARGING (0s - 3.5s)
            if (combatTimer < 3.5) {
                roundState = 'CHARGING';
                playerKnight.x += (width * 0.35 - playerKnight.x) * 0.05;
                enemyKnight.x -= (enemyKnight.x - width * 0.65) * 0.05;
                createDust(playerKnight.x, playerKnight.y);
                createDust(enemyKnight.x, enemyKnight.y);
                if (Math.random() < 0.3) playGallopSound();
            }
            // PHASE 2: MELEE DUEL COMBAT (3.5s - 12s)
            else if (combatTimer >= 3.5 && combatTimer < 12) {
                roundState = 'MELEE_COMBAT';

                // Sword swing dynamics
                playerKnight.swordAngle = Math.sin(combatTimer * 8) * 1.2;
                enemyKnight.swordAngle = -Math.sin(combatTimer * 8) * 1.2;

                // Clash moments
                if (Math.floor(combatTimer * 10) % 6 === 0) {
                    const clashX = (playerKnight.x + enemyKnight.x) / 2;
                    const clashY = playerKnight.y - 40;
                    createSparks(clashX, clashY);
                    playClashSound();
                    cameraShake.intensity = 6;

                    // Random back and forth damage feel
                    if (Math.random() > 0.5) {
                        playerKnight.hp = Math.max(20, playerKnight.hp - 4);
                        createBloodSplatter(playerKnight.x, playerKnight.y - 40, -1);
                    } else {
                        enemyKnight.hp = Math.max(20, enemyKnight.hp - 4);
                        createBloodSplatter(enemyKnight.x, enemyKnight.y - 40, 1);
                    }
                }
            }
            // PHASE 3: FINAL DECISIVE STRIKE (12s - 15s)
            else if (combatTimer >= 12 && combatTimer < TOTAL_COMBAT_DURATION) {
                roundState = 'FINAL_STRIKE';

                if (isPlayerWinner) {
                    enemyKnight.hp = Math.max(0, enemyKnight.hp - 8);
                    enemyKnight.fallen = true;
                    enemyKnight.fallAngle = Math.min(Math.PI / 2, enemyKnight.fallAngle + 0.1);
                    createBloodSplatter(enemyKnight.x, enemyKnight.y - 30, 1);
                } else {
                    playerKnight.hp = Math.max(0, playerKnight.hp - 8);
                    playerKnight.fallen = true;
                    playerKnight.fallAngle = Math.min(-Math.PI / 2, playerKnight.fallAngle - 0.1);
                    createBloodSplatter(playerKnight.x, playerKnight.y - 30, -1);
                }

                if (Math.floor(combatTimer * 10) % 10 === 0) {
                    playImpactSound();
                    cameraShake.intensity = 15;
                }
            }
            // COMBAT END -> SETTLE ROUND
            else {
                clearInterval(combatInterval);
                finishRound();
            }

        }, 50);
    }

    // Final Round Settle
    function finishRound() {
        roundState = 'RESULT';
        document.getElementById('combatProgressBg').style.display = 'none';

        const overlay = document.getElementById('resultOverlay');
        const title = document.getElementById('resultTitle');
        const sub = document.getElementById('resultSub');

        if (isBetPlacedForNextRound) {
            if (isPlayerWinner) {
                const winPayout = betAmount * WIN_MULTIPLIER; // STRICT 2X RETURN
                currentBalance += winPayout;
                title.innerText = 'انتصار ملحمي! ⚔️';
                title.className = 'result-title result-win';
                sub.innerText = `+${winPayout.toFixed(2)} NPS`;
                sub.style.color = '#4ef037';
            } else {
                currentBalance -= betAmount; // LOSS DEDUCTION
                title.innerText = 'هزيمة في المعركة! 🛡️';
                title.className = 'result-title result-loss';
                sub.innerText = `-${betAmount.toFixed(2)} NPS`;
                sub.style.color = '#ff3333';
            }
            document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
        } else {
            title.innerText = isPlayerWinner ? 'فاز الفارس الأزرق!' : 'فاز الفارس الأحمر!';
            title.className = 'result-title';
            sub.innerText = 'لم تشارك برهان';
            sub.style.color = '#fff';
        }

        overlay.classList.add('active');

        // Reset bet status button
        isBetPlacedForNextRound = false;
        const btn = document.getElementById('playBtn');
        btn.classList.remove('joined');
        btn.innerHTML = `<span>تأكيد الرهان للجولة ⚔️</span>`;

        // Wait 4 seconds then restart loop
        setTimeout(() => {
            overlay.classList.remove('active');
            startCountdown();
        }, 4000);
    }

    // Countdown Manager
    function startCountdown() {
        roundState = 'COUNTDOWN';
        countdownTime = 5;
        document.getElementById('liveStatusText').innerText = "تجهيز المعركة القادمة:";
        document.getElementById('timerVal').innerText = `${countdownTime}ث`;

        if (countdownInterval) clearInterval(countdownInterval);

        countdownInterval = setInterval(() => {
            countdownTime--;
            document.getElementById('timerVal').innerText = `${countdownTime}ث`;

            if (countdownTime <= 0) {
                clearInterval(countdownInterval);
                start15SecBattle();
            }
        }, 1000);
    }

    // Main Render Loop
    function render() {
        ctx.clearRect(0, 0, width, height);

        // Camera Shake Effect
        ctx.save();
        if (cameraShake.intensity > 0) {
            cameraShake.x = (Math.random() - 0.5) * cameraShake.intensity;
            cameraShake.y = (Math.random() - 0.5) * cameraShake.intensity;
            cameraShake.intensity *= 0.85;
            ctx.translate(cameraShake.x, cameraShake.y);
        }

        drawBackground();
        drawKnight(playerKnight, true);
        drawKnight(enemyKnight, false);
        updateParticles();

        ctx.restore();
        requestAnimationFrame(render);
    }

    // Start App
    fetchUserData();
    updateBetUI();
    startCountdown();
    requestAnimationFrame(render);

</script>
