<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مبارزة الفرسان الملحمية - Jousting Knights Live 2X</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030202;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
        }

        /* Top Bar Header */
        .top-bar {
            width: 100%;
            max-width: 650px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(20, 12, 6, 0.98) 0%, rgba(8, 4, 2, 0.95) 100%);
            border-bottom: 2px solid #d4af37;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
            z-index: 20;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            background: radial-gradient(circle, #5a3c1e 0%, #1a0f08 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }
        .user-name {
            font-size: 14px;
            font-weight: 800;
            color: #f3cf7a;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .balance-box {
            background: rgba(0, 0, 0, 0.85);
            border: 1.5px solid #d4af37;
            border-radius: 20px;
            padding: 5px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .balance-label {
            font-size: 11px;
            color: #bbb;
        }
        .balance-val {
            font-size: 17px;
            font-weight: 900;
            color: #4ef037;
            font-family: 'Cinzel', monospace;
        }
        .currency {
            color: #ffd700;
            font-size: 12px;
            font-weight: 800;
        }

        /* Live Round Status Bar */
        .live-status-bar {
            position: absolute;
            top: 68px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: rgba(12, 7, 3, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.8);
            padding: 6px 20px;
            border-radius: 22px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.85);
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff3333;
            box-shadow: 0 0 10px #ff3333;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 1; }
        }
        .live-text {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
        }
        .timer-val {
            font-family: 'Cinzel', monospace;
            color: #ffd700;
            font-size: 16px;
            font-weight: 900;
        }
        .combat-progress-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
            display: none;
            margin-top: 2px;
        }
        .combat-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff3333, #ffd700, #3b82f6);
            transition: width 0.1s linear;
        }

        /* Canvas Stage Container */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Result Card */
        .result-overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            z-index: 30;
            width: 85%;
            max-width: 360px;
            padding: 22px 18px;
            border-radius: 24px;
            background: rgba(10, 6, 3, 0.96);
            border: 2px solid #ffd700;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.95), inset 0 0 20px rgba(255, 215, 0, 0.25);
        }
        .result-overlay.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .result-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .result-win {
            color: #4ef037;
            text-shadow: 0 0 20px rgba(78, 240, 55, 0.8);
        }
        .result-loss {
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.8);
        }
        .result-sub {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            font-family: 'Cinzel', monospace;
            margin-top: 6px;
        }
        .result-desc {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Control Panel */
        .control-panel {
            width: 100%;
            max-width: 650px;
            background: linear-gradient(0deg, rgba(8, 5, 2, 0.99) 0%, rgba(22, 13, 7, 0.95) 100%);
            border-top: 2px solid #d4af37;
            padding: 12px 16px 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.95);
            z-index: 20;
        }

        /* Bet Amount Row */
        .bet-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.65);
            border: 1px solid #7a5c2d;
            border-radius: 14px;
            padding: 4px 10px;
        }
        .bet-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            background: linear-gradient(180deg, #5e4827 0%, #2e200f 100%);
            color: #ffd700;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bet-btn:active {
            transform: scale(0.92);
        }
        .bet-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bet-label {
            font-size: 11px;
            color: #bbb;
        }
        .bet-value-box {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .bet-amount {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Cinzel', monospace;
        }
        .quick-bets {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        .q-btn {
            flex: 1;
            padding: 6px 0;
            background: rgba(45, 30, 15, 0.85);
            border: 1px solid #7a5a29;
            border-radius: 8px;
            color: #eee;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }
        .q-btn:active {
            background: #d4af37;
            color: #000;
        }

        /* Blue vs Red Knight Bet Selector Grid */
        .knight-bet-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 2px;
        }
        .knight-card-btn {
            position: relative;
            padding: 10px;
            border-radius: 14px;
            border: 2px solid #444;
            background: rgba(15, 10, 5, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .knight-card-btn.blue-side {
            border-color: #2563eb;
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.25) 0%, rgba(15, 23, 42, 0.9) 100%);
        }
        .knight-card-btn.red-side {
            border-color: #dc2626;
            background: linear-gradient(180deg, rgba(220, 38, 38, 0.25) 0%, rgba(24, 9, 9, 0.9) 100%);
        }
        .knight-card-btn.selected {
            box-shadow: 0 0 18px currentColor;
            transform: scale(1.02);
            border-width: 2.5px;
        }
        .knight-card-btn.blue-side.selected {
            border-color: #60a5fa;
            color: #60a5fa;
        }
        .knight-card-btn.red-side.selected {
            border-color: #f87171;
            color: #f87171;
        }
        .knight-title {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
        }
        .multiplier-badge {
            font-size: 11px;
            font-weight: 900;
            background: rgba(0,0,0,0.6);
            padding: 2px 8px;
            border-radius: 10px;
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.4);
        }
        .bet-status-indicator {
            font-size: 11px;
            font-weight: 800;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Upper Stats Bar -->
    <div class="top-bar">
        <div class="user-info">
            <div class="user-avatar">🐎</div>
            <div class="user-name" id="userName">الفارس</div>
        </div>
        <div class="balance-box">
            <span class="balance-label">الرصيد:</span>
            <span class="balance-val" id="userBalance">0.00</span>
            <span class="currency">NPS</span>
        </div>
    </div>

    <!-- Live Timer & Combat Status Bar -->
    <div class="live-status-bar">
        <div class="status-header">
            <div class="live-dot" id="liveDot"></div>
            <span class="live-text" id="liveStatusText">تجهيز المعركة القادمة:</span>
            <span class="timer-val" id="timerVal">5ث</span>
        </div>
        <div class="combat-progress-bg" id="combatProgressBg">
            <div class="combat-progress-fill" id="combatProgressFill"></div>
        </div>
    </div>

    <!-- Animation Canvas Arena Stage -->
    <div class="stage-container">
        <canvas id="gameCanvas"></canvas>
        <div class="result-overlay" id="resultOverlay">
            <div class="result-title" id="resultTitle">انتصار ملحمي!</div>
            <div class="result-sub" id="resultSub">+20.00 NPS</div>
            <div class="result-desc" id="resultDesc">مضاعف الربح الثابت 2X</div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="bet-control-row">
            <button class="bet-btn" onclick="changeBet(-5)">-</button>
            <div class="bet-display">
                <span class="bet-label">قيمة الرهان (العائد عند الفوز 2X: <span id="winEst" style="color:#4ef037">20.00</span> NPS)</span>
                <div class="bet-value-box">
                    <span class="bet-amount" id="betAmount">10</span>
                    <span class="currency">NPS</span>
                </div>
            </div>
            <button class="bet-btn" onclick="changeBet(5)">+</button>
        </div>

        <div class="quick-bets">
            <button class="q-btn" onclick="setBet(5)">5</button>
            <button class="q-btn" onclick="setBet(20)">20</button>
            <button class="q-btn" onclick="setBet(50)">50</button>
            <button class="q-btn" onclick="setBet(100)">100</button>
            <button class="q-btn" onclick="setBet(500)">500</button>
            <button class="q-btn" onclick="setBet(1000)">1000</button>
        </div>

        <!-- Blue / Red Knight Side Betting Selector -->
        <div class="knight-bet-selector">
            <button class="knight-card-btn blue-side" id="btnBetBlue" onclick="placeBetOnSide('BLUE')">
                <span class="knight-title">🟦 الفارس الأزرق</span>
                <span class="multiplier-badge">ربح 2.0X</span>
                <span class="bet-status-indicator" id="statusBlue">اضغط للرهان ⚔️</span>
            </button>

            <button class="knight-card-btn red-side" id="btnBetRed" onclick="placeBetOnSide('RED')">
                <span class="knight-title">🟥 الفارس الأحمر</span>
                <span class="multiplier-badge">ربح 2.0X</span>
                <span class="bet-status-indicator" id="statusRed">اضغط للرهان ⚔️</span>
            </button>
        </div>
    </div>

<script>
    // Telegram User & API Integration
    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('user_id') || urlParams.get('telegram_id');
    
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        userId = userId || window.Telegram.WebApp.initDataUnsafe.user.id;
    }
    if (!userId) userId = "1000";

    let currentBalance = 100.00; // Default fallback balance
    let betAmount = 10;
    const minBet = 5;
    const maxBet = 1000;
    const WIN_MULTIPLIER = 2.0; // STRICT 2X MULTIPLIER RULE
    
    // Betting Side States: null, 'BLUE', 'RED'
    let chosenSideForBet = null;

    // Round States: 'COUNTDOWN', 'CHARGING', 'MELEE_COMBAT', 'FINAL_STRIKE', 'RESULT'
    let roundState = 'COUNTDOWN';
    let countdownTime = 5;
    let combatTimer = 0;
    const TOTAL_COMBAT_DURATION = 15;
    let countdownInterval = null;
    let combatInterval = null;
    let winnerSide = 'BLUE'; // 'BLUE' or 'RED'

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * (window.devicePixelRatio || 1);
        canvas.height = rect.height * (window.devicePixelRatio || 1);
        width = canvas.width;
        height = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Procedural Sound Effects Engine
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playGallopSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(60 + Math.random()*20, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(15, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }

    function playClashSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch(e) {}
    }

    function playImpactSound() {
        if (!audioCtx) return;
        try {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.45);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        } catch(e) {}
    }

    // Objects & Physics Setup
    let particles = [];
    let cameraShake = { x: 0, y: 0, intensity: 0 };

    let blueKnight = {
        x: 0, y: 0,
        hp: 100,
        color: '#2563eb',
        banner: '#60a5fa',
        horseColor: '#332211',
        lanceAngle: 0,
        fallen: false,
        fallAngle: 0,
        unhorsedX: 0, unhorsedY: 0
    };

    let redKnight = {
        x: 0, y: 0,
        hp: 100,
        color: '#dc2626',
        banner: '#f87171',
        horseColor: '#1a1a1a',
        lanceAngle: 0,
        fallen: false,
        fallAngle: 0,
        unhorsedX: 0, unhorsedY: 0
    };

    // User Data API Integration
    function fetchUserData() {
        fetch(`/api/user/get?user_id=${userId}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.success) {
                    currentBalance = data.balance;
                    document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
                    document.getElementById('userName').innerText = data.full_name || `فارس_${userId}`;
                }
            }).catch(e => {
                document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
            });
    }

    function changeBet(delta) {
        if (roundState !== 'COUNTDOWN') return;
        betAmount = Math.max(minBet, Math.min(maxBet, betAmount + delta));
        updateBetUI();
    }

    function setBet(val) {
        if (roundState !== 'COUNTDOWN') return;
        betAmount = Math.max(minBet, Math.min(maxBet, val));
        updateBetUI();
    }

    function updateBetUI() {
        document.getElementById('betAmount').innerText = betAmount;
        document.getElementById('winEst').innerText = (betAmount * WIN_MULTIPLIER).toFixed(2);
    }

    // Bet Side Selection Mechanics
    function placeBetOnSide(side) {
        initAudio();
        if (roundState !== 'COUNTDOWN') return;

        if (currentBalance < betAmount) {
            alert('رصيدك غير كافٍ لإجراء هذا الرهان!');
            return;
        }

        if (chosenSideForBet === side) {
            // Cancel bet
            chosenSideForBet = null;
        } else {
            chosenSideForBet = side;
        }

        updateSideSelectorUI();
    }

    function updateSideSelectorUI() {
        const btnBlue = document.getElementById('btnBetBlue');
        const btnRed = document.getElementById('btnBetRed');
        const statusBlue = document.getElementById('statusBlue');
        const statusRed = document.getElementById('statusRed');

        btnBlue.classList.remove('selected');
        btnRed.classList.remove('selected');

        if (chosenSideForBet === 'BLUE') {
            btnBlue.classList.add('selected');
            statusBlue.innerText = `تم الرهان (${betAmount} NPS) ✔️`;
            statusRed.innerText = `اضغط للرهان ⚔️`;
        } else if (chosenSideForBet === 'RED') {
            btnRed.classList.add('selected');
            statusRed.innerText = `تم الرهان (${betAmount} NPS) ✔️`;
            statusBlue.innerText = `اضغط للرهان ⚔️`;
        } else {
            statusBlue.innerText = `اضغط للرهان ⚔️`;
            statusRed.innerText = `اضغط للرهان ⚔️`;
        }
    }

    // Advanced Particle Engine
    function createDust(x, y) {
        for (let i = 0; i < 4; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * 20,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: -Math.random() * 3 - 1,
                size: Math.random() * 10 + 4,
                color: `rgba(${160 + Math.random()*50}, ${120 + Math.random()*30}, 70, ${Math.random() * 0.4 + 0.2})`,
                life: 1,
                type: 'DUST'
            });
        }
    }

    function createSparks(x, y) {
        for (let i = 0; i < 30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 16 + 5;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                size: Math.random() * 5 + 2,
                color: Math.random() > 0.3 ? '#ffd700' : '#ffffff',
                life: 1,
                type: 'SPARK'
            });
        }
    }

    function createLanceShatter(x, y, dir) {
        for (let i = 0; i < 25; i++) {
            const angle = (Math.random() - 0.5) * 1.5 + (dir > 0 ? 0 : Math.PI);
            const speed = Math.random() * 12 + 4;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                size: Math.random() * 6 + 2,
                color: Math.random() > 0.5 ? '#d4af37' : '#8a5a22',
                life: 1,
                type: 'WOOD'
            });
        }
    }

    function createBloodSplatter(x, y, dir) {
        for (let i = 0; i < 35; i++) {
            const angle = Math.random() * Math.PI - (dir > 0 ? 0 : Math.PI);
            const speed = Math.random() * 12 + 3;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed * dir,
                vy: Math.sin(angle) * speed - 3,
                size: Math.random() * 6 + 3,
                color: Math.random() > 0.2 ? '#cc0000' : '#880000',
                life: 1,
                type: 'BLOOD'
            });
        }
    }

    // High Quality Cinematic Visual Renderer
    function drawBackground() {
        // Sunset Cinematic Sky
        let skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.65);
        skyGrad.addColorStop(0, '#040205');
        skyGrad.addColorStop(0.35, '#220a06');
        skyGrad.addColorStop(0.7, '#6e270a');
        skyGrad.addColorStop(1, '#d4651d');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height * 0.65);

        // Volumetric Sun Rays
        let sunX = width * 0.5;
        let sunY = height * 0.38;
        let sunGrad = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, width * 0.6);
        sunGrad.addColorStop(0, 'rgba(255, 230, 150, 0.65)');
        sunGrad.addColorStop(0.4, 'rgba(230, 90, 20, 0.25)');
        sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, width, height * 0.65);

        // Parallax Mountain Silhouettes
        ctx.fillStyle = '#140804';
        ctx.beginPath();
        ctx.moveTo(0, height * 0.65);
        ctx.lineTo(width * 0.12, height * 0.55);
        ctx.lineTo(width * 0.22, height * 0.60);
        ctx.lineTo(width * 0.38, height * 0.50);
        ctx.lineTo(width * 0.48, height * 0.62);
        ctx.lineTo(width * 0.65, height * 0.52);
        ctx.lineTo(width * 0.78, height * 0.63);
        ctx.lineTo(width, height * 0.54);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Arena Dirt Ground Gradient
        let groundGrad = ctx.createLinearGradient(0, height * 0.65, 0, height);
        groundGrad.addColorStop(0, '#422713');
        groundGrad.addColorStop(0.3, '#2a170a');
        groundGrad.addColorStop(1, '#0e0602');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, height * 0.65, width, height * 0.35);

        // Arena Wooden Railings / Fence
        ctx.strokeStyle = '#614022';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.68);
        ctx.lineTo(width, height * 0.68);
        ctx.stroke();

        // Fence Pillars
        for (let x = 0; x <= width; x += width * 0.15) {
            ctx.fillStyle = '#422b16';
            ctx.fillRect(x - 4, height * 0.65, 8, height * 0.08);
        }
    }

    // Ultra Realistic Mounted Knight & Horse Renderer
    function drawMountedKnight(knight, isBlue) {
        ctx.save();
        
        const dir = isBlue ? 1 : -1;
        const scale = height * 0.0019;
        
        ctx.translate(knight.x, knight.y);

        // Gallop Sine Motion
        const gallopPhase = combatTimer * 18;
        const bounceY = (roundState === 'CHARGING' || roundState === 'MELEE_COMBAT') ? Math.abs(Math.sin(gallopPhase)) * 8 : 0;
        
        ctx.translate(0, -bounceY);
        ctx.scale(scale * dir, scale);

        // Dynamic Horse Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath();
        ctx.ellipse(0, 10, 50, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // 1. HORSE LEGS (Galloping Animation)
        ctx.strokeStyle = knight.horseColor;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';

        const legSwing = Math.sin(gallopPhase) * 0.6;

        // Back Legs
        ctx.beginPath();
        ctx.moveTo(-30, -20);
        ctx.lineTo(-30 - legSwing * 30, 10);
        ctx.stroke();

        // Front Legs
        ctx.beginPath();
        ctx.moveTo(30, -20);
        ctx.lineTo(30 + legSwing * 30, 10);
        ctx.stroke();

        // 2. HORSE BODY & MUSCLES
        ctx.fillStyle = knight.horseColor;
        ctx.beginPath();
        ctx.ellipse(0, -25, 45, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        // Horse Neck & Head
        ctx.beginPath();
        ctx.moveTo(25, -35);
        ctx.lineTo(45, -65);
        ctx.lineTo(55, -60);
        ctx.lineTo(40, -25);
        ctx.closePath();
        ctx.fill();

        // Horse Head Snout
        ctx.beginPath();
        ctx.arc(52, -62, 8, 0, Math.PI * 2);
        ctx.fill();

        // Horse Mane & Tail
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-42, -25);
        ctx.quadraticCurveTo(-60, -10, -55, 10);
        ctx.stroke();

        // Horse Caparison / Decorative Banner Cloth
        ctx.fillStyle = knight.color;
        ctx.fillRect(-25, -35, 50, 25);

        // 3. KNIGHT RIDER (Plate Armor)
        if (!knight.fallen) {
            ctx.save();
            ctx.translate(0, -42);

            // Legs on Saddle
            ctx.fillStyle = '#64748b';
            ctx.fillRect(-10, 0, 12, 22);

            // Torso Plate Armor
            let armorGrad = ctx.createLinearGradient(-15, -40, 15, 0);
            armorGrad.addColorStop(0, '#cbd5e1');
            armorGrad.addColorStop(0.5, '#64748b');
            armorGrad.addColorStop(1, '#334155');
            ctx.fillStyle = armorGrad;
            
            ctx.beginPath();
            ctx.moveTo(-16, -38);
            ctx.lineTo(16, -38);
            ctx.lineTo(12, 0);
            ctx.lineTo(-12, 0);
            ctx.closePath();
            ctx.fill();

            // Colored Surcoat / Tabard
            ctx.fillStyle = knight.color;
            ctx.fillRect(-10, -36, 20, 26);

            // Helmet & Metallic Visor
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.arc(0, -48, 13, 0, Math.PI * 2);
            ctx.fill();

            // Visor Eye Slot
            ctx.fillStyle = '#020617';
            ctx.fillRect(2, -50, 10, 3);

            // Plume Feather
            ctx.fillStyle = knight.banner;
            ctx.beginPath();
            ctx.moveTo(0, -60);
            ctx.quadraticCurveTo(-15, -75, -25, -65);
            ctx.lineTo(-2, -56);
            ctx.fill();

            // Jousting Shield
            ctx.fillStyle = knight.color;
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, -35);
            ctx.lineTo(25, -35);
            ctx.lineTo(22, -10);
            ctx.lineTo(10, -18);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Epic Jousting Lance
            ctx.save();
            ctx.translate(5, -25);
            ctx.rotate(knight.lanceAngle);

            // Long Shaft Gradient
            let lanceGrad = ctx.createLinearGradient(0, -6, 90, 0);
            lanceGrad.addColorStop(0, '#854d0e');
            lanceGrad.addColorStop(0.8, '#fef08a');
            lanceGrad.addColorStop(1, '#e2e8f0');

            ctx.fillStyle = lanceGrad;
            ctx.beginPath();
            ctx.moveTo(-10, -4);
            ctx.lineTo(100, -1);
            ctx.lineTo(100, 1);
            ctx.lineTo(-10, 4);
            ctx.closePath();
            ctx.fill();

            // Lance Guard Shield
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI*2);
            ctx.fill();

            ctx.restore(); // Restore Lance
            ctx.restore(); // Restore Rider
        } else {
            // UNHORSED KNIGHT FALLEN ON GROUND
            ctx.save();
            ctx.translate(isBlue ? -30 : 30, 0);
            ctx.rotate(knight.fallAngle);

            ctx.fillStyle = '#64748b';
            ctx.fillRect(-15, -10, 30, 12);
            ctx.fillStyle = knight.color;
            ctx.fillRect(-10, -10, 20, 12);

            // Fallen Helmet
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.arc(15, -5, 10, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        // Health Bar Indicator
        if (roundState === 'MELEE_COMBAT' || roundState === 'FINAL_STRIKE') {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(-30, -95, 60, 7);
            ctx.fillStyle = knight.hp > 30 ? '#22c55e' : '#ef4444';
            ctx.fillRect(-28, -93, (knight.hp / 100) * 56, 3);
        }

        ctx.restore();
    }

    // Particle FX Rendering
    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.025;

            if (p.type === 'SPARK' || p.type === 'BLOOD' || p.type === 'WOOD') {
                p.vy += 0.35; // Gravity
            }

            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(1, p.size * p.life), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // Main 15-Second Combat Simulation
    function start15SecBattle() {
        roundState = 'CHARGING';
        combatTimer = 0;
        document.getElementById('liveStatusText').innerText = "المعركة جارية والفرسان ينطلقون!";
        document.getElementById('combatProgressBg').style.display = 'block';

        // Strict 50/50 Chance Outcome
        winnerSide = Math.random() >= 0.5 ? 'BLUE' : 'RED';

        // Reset Knights Physics
        blueKnight.hp = 100;
        redKnight.hp = 100;
        blueKnight.fallen = false;
        redKnight.fallen = false;
        blueKnight.fallAngle = 0;
        redKnight.fallAngle = 0;
        blueKnight.lanceAngle = 0.1;
        redKnight.lanceAngle = -0.1;

        blueKnight.x = width * 0.12;
        blueKnight.y = height * 0.74;
        redKnight.x = width * 0.88;
        redKnight.y = height * 0.74;

        if (combatInterval) clearInterval(combatInterval);

        const startTime = Date.now();

        combatInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            combatTimer = elapsed;

            const progressPct = Math.min(100, (combatTimer / TOTAL_COMBAT_DURATION) * 100);
            document.getElementById('combatProgressFill').style.width = `${progressPct}%`;
            document.getElementById('timerVal').innerText = `${Math.ceil(TOTAL_COMBAT_DURATION - combatTimer)}ث`;

            // PHASE 1: JOUST CHARGING (0s - 4.5s)
            if (combatTimer < 4.5) {
                roundState = 'CHARGING';
                blueKnight.x += (width * 0.42 - blueKnight.x) * 0.04;
                redKnight.x -= (redKnight.x - width * 0.58) * 0.04;

                createDust(blueKnight.x, blueKnight.y);
                createDust(redKnight.x, redKnight.y);

                if (Math.random() < 0.35) playGallopSound();
            }
            // PHASE 2: JOUST IMPACT & MELEE DUEL (4.5s - 12s)
            else if (combatTimer >= 4.5 && combatTimer < 12) {
                roundState = 'MELEE_COMBAT';

                // Initial Joust Impact Shatter
                if (combatTimer < 4.8) {
                    const clashX = (blueKnight.x + redKnight.x) / 2;
                    const clashY = blueKnight.y - 40;
                    createSparks(clashX, clashY);
                    createLanceShatter(clashX, clashY, 1);
                    createLanceShatter(clashX, clashY, -1);
                    playClashSound();
                    cameraShake.intensity = 10;
                }

                // Dynamic Sword / Lance Angle Swing
                blueKnight.lanceAngle = Math.sin(combatTimer * 7) * 0.4;
                redKnight.lanceAngle = -Math.sin(combatTimer * 7) * 0.4;

                if (Math.floor(combatTimer * 10) % 7 === 0) {
                    const impactX = (blueKnight.x + redKnight.x) / 2;
                    createSparks(impactX, blueKnight.y - 35);
                    playClashSound();

                    if (Math.random() > 0.5) {
                        blueKnight.hp = Math.max(15, blueKnight.hp - 5);
                        createBloodSplatter(blueKnight.x, blueKnight.y - 40, -1);
                    } else {
                        redKnight.hp = Math.max(15, redKnight.hp - 5);
                        createBloodSplatter(redKnight.x, redKnight.y - 40, 1);
                    }
                }
            }
            // PHASE 3: UNHORSING DECISIVE STRIKE (12s - 15s)
            else if (combatTimer >= 12 && combatTimer < TOTAL_COMBAT_DURATION) {
                roundState = 'FINAL_STRIKE';

                if (winnerSide === 'BLUE') {
                    redKnight.hp = Math.max(0, redKnight.hp - 10);
                    redKnight.fallen = true;
                    redKnight.fallAngle = Math.min(Math.PI / 2, redKnight.fallAngle + 0.12);
                    createBloodSplatter(redKnight.x, redKnight.y - 30, 1);
                } else {
                    blueKnight.hp = Math.max(0, blueKnight.hp - 10);
                    blueKnight.fallen = true;
                    blueKnight.fallAngle = Math.min(-Math.PI / 2, blueKnight.fallAngle - 0.12);
                    createBloodSplatter(blueKnight.x, blueKnight.y - 30, -1);
                }

                if (Math.floor(combatTimer * 10) % 10 === 0) {
                    playImpactSound();
                    cameraShake.intensity = 16;
                }
            }
            // COMBAT COMPLETE -> SETTLE
            else {
                clearInterval(combatInterval);
                finishRound();
            }

        }, 50);
    }

    // Round Settle & Balance Math
    function finishRound() {
        roundState = 'RESULT';
        document.getElementById('combatProgressBg').style.display = 'none';

        const overlay = document.getElementById('resultOverlay');
        const title = document.getElementById('resultTitle');
        const sub = document.getElementById('resultSub');

        if (chosenSideForBet !== null) {
            if (chosenSideForBet === winnerSide) {
                const winPayout = betAmount * WIN_MULTIPLIER; // STRICT 2X WIN
                currentBalance += winPayout;
                title.innerText = 'انتصار ملحمي! ⚔️';
                title.className = 'result-title result-win';
                sub.innerText = `+${winPayout.toFixed(2)} NPS`;
                sub.style.color = '#4ef037';
            } else {
                currentBalance -= betAmount; // LOSS DEDUCTION
                title.innerText = 'هزيمة في المبارزة! 🛡️';
                title.className = 'result-title result-loss';
                sub.innerText = `-${betAmount.toFixed(2)} NPS`;
                sub.style.color = '#ff3333';
            }
            document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
        } else {
            title.innerText = winnerSide === 'BLUE' ? 'انتصر الفارس الأزرق!' : 'انتصر الفارس الأحمر!';
            title.className = 'result-title';
            sub.innerText = 'لم تشارك برهان';
            sub.style.color = '#fff';
        }

        overlay.classList.add('active');

        // Reset Bet Selection
        chosenSideForBet = null;
        updateSideSelectorUI();

        // Wait 4s then restart countdown
        setTimeout(() => {
            overlay.classList.remove('active');
            startCountdown();
        }, 4000);
    }

    // Countdown Loop Manager
    function startCountdown() {
        roundState = 'COUNTDOWN';
        countdownTime = 5;
        document.getElementById('liveStatusText').innerText = "تجهيز المعركة القادمة:";
        document.getElementById('timerVal').innerText = `${countdownTime}ث`;

        if (countdownInterval) clearInterval(countdownInterval);

        countdownInterval = setInterval(() => {
            countdownTime--;
            document.getElementById('timerVal').innerText = `${countdownTime}ث`;

            if (countdownTime <= 0) {
                clearInterval(countdownInterval);
                start15SecBattle();
            }
        }, 1000);
    }

    // Render Animation Loop
    function render() {
        ctx.clearRect(0, 0, width, height);

        ctx.save();
        if (cameraShake.intensity > 0) {
            cameraShake.x = (Math.random() - 0.5) * cameraShake.intensity;
            cameraShake.y = (Math.random() - 0.5) * cameraShake.intensity;
            cameraShake.intensity *= 0.85;
            ctx.translate(cameraShake.x, cameraShake.y);
        }

        drawBackground();
        drawMountedKnight(blueKnight, true);
        drawMountedKnight(redKnight, false);
        updateParticles();

        ctx.restore();
        requestAnimationFrame(render);
    }

    // Init Game
    fetchUserData();
    updateBetUI();
    startCountdown();
    requestAnimationFrame(render);

</script>
