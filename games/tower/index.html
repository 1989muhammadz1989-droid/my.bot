<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برج المستقبل | Tower Stack City</title>
    <!-- خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030712;
            --panel-bg: rgba(11, 15, 25, 0.94);
            --gold-glow: #ffb703;
            --cyan-glow: #00f2fe;
            --green-safe: #00e676;
            --red-trap: #ff1744;
            --metal-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية ناطحات سحاب واقعية متحركة */
        .sky-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                linear-gradient(to top, rgba(3, 7, 18, 0.95) 15%, rgba(15, 23, 42, 0.6) 60%, rgba(2, 6, 23, 0.95) 100%),
                radial-gradient(circle at 50% 20%, rgba(0, 242, 254, 0.12), transparent 70%);
            background-size: cover;
        }

        .city-skyline {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 350px;
            background: repeating-linear-gradient(90deg, #070b14 0px, #070b14 30px, transparent 30px, transparent 40px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        /* إطار اللعبة الهيكلي */
        .game-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--metal-border);
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* الهيدر العلوي */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(10, 15, 26, 0.8) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--cyan-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan-glow);
            font-size: 16px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.25);
        }

        .balance-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 183, 3, 0.4);
            padding: 5px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
        }

        .balance-box span {
            color: var(--gold-glow);
            font-size: 15px;
        }

        /* ساحة البناء الكبرى */
        .construction-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
        }

        /* الرافعة المتحركة في الأعلى */
        .crane-container {
            position: absolute;
            top: 0;
            width: 100%;
            height: 120px;
            z-index: 5;
            pointer-events: none;
        }

        .crane-arm {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #ffb703, #e63946);
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
        }

        .crane-hook-line {
            position: absolute;
            top: 18px;
            width: 2px;
            height: 60px;
            background: rgba(255, 255, 255, 0.6);
            left: 50%;
            transform: translateX(-50%);
            animation: craneSwing 2.5s infinite ease-in-out alternate;
        }

        @keyframes craneSwing {
            0% { left: 20%; }
            100% { left: 80%; }
        }

        .crane-block {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 35px;
            background: linear-gradient(135deg, #00f2fe, #0077b6);
            border: 2px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
            color: #000;
        }

        /* برج الطوابق المبنية */
        .tower-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .building-floor {
            width: 150px;
            height: 42px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--cyan-glow);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,242,254,0.1);
            animation: dropLanding 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes dropLanding {
            0% { transform: translateY(-150px) scale(1.1); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .building-floor.collapse {
            animation: floorCollapse 0.6s forwards ease-in;
        }

        @keyframes floorCollapse {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(45deg); opacity: 0; }
        }

        .floor-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .floor-mult-badge {
            font-size: 13px;
            font-weight: 900;
            color: var(--gold-glow);
            text-shadow: 0 0 8px rgba(255, 183, 3, 0.5);
        }

        /* لوحة التحكم السفلية */
        .controls-panel {
            background: linear-gradient(180deg, rgba(10, 14, 23, 0.98) 0%, rgba(3, 7, 18, 1) 100%);
            padding: 14px 18px;
            border-top: 1px solid var(--metal-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        /* اختيار الصعوبة */
        .difficulty-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .diff-btn {
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .diff-btn.active {
            background: linear-gradient(135deg, var(--cyan-glow), #0077b6);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        /* التحكم بالرهان */
        .bet-control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 4px 8px;
        }

        .bet-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .bet-input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bet-input-wrapper label {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .bet-input {
            width: 100px;
            background: transparent;
            border: none;
            text-align: center;
            color: var(--gold-glow);
            font-size: 16px;
            font-weight: 900;
            outline: none;
        }

        .quick-bets {
            display: flex;
            gap: 6px;
        }

        .q-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 5px 0;
            font-size: 10px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }

        /* أزرار الحركة الرئيسية */
        .action-buttons-group {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-btn.drop {
            background: linear-gradient(135deg, #00f2fe, #0077b6);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.35);
        }

        .action-btn.cashout {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* نافذة التنبيه والنتيجة */
        .toast {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 15, 26, 0.96);
            border: 2px solid var(--gold-glow);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--gold-glow);
        }

        .toast-amount {
            font-size: 26px;
            font-weight: 900;
            color: var(--green-safe);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="sky-background"></div>
    <div class="city-skyline"></div>

    <div class="game-wrapper" id="gameWrapper">
        <!-- الشريط العلوي -->
        <div class="header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-building-circle-check"></i></div>
                <div>
                    <div id="userName" style="font-size: 12px; font-weight: 800;">مهندس البرج</div>
                    <div style="font-size: 9px; color: var(--text-muted);">المستوى VIP</div>
                </div>
            </div>
            <div class="balance-box">
                <i class="fa-solid fa-coins" style="color: var(--gold-glow);"></i>
                <span id="balanceDisplay">0.00</span>
                <small style="color: var(--text-muted); font-size: 9px;">nps</small>
            </div>
        </div>

        <!-- ساحة البناء الكبرى -->
        <div class="construction-stage">
            <!-- الرافعة المعلقة -->
            <div class="crane-container">
                <div class="crane-arm"></div>
                <div class="crane-hook-line">
                    <div class="crane-block" id="craneBlock">طابق جديد</div>
                </div>
            </div>

            <!-- مجسم البرج المبني -->
            <div class="tower-stack" id="towerStack">
                <!-- يتم توليد الطوابق هنا عند الإسقاط -->
            </div>
        </div>

        <!-- لوحة التحكم السفلية -->
        <div class="controls-panel">
            <!-- تحديد الصعوبة ونسب الأرباح -->
            <div class="difficulty-selector">
                <button class="diff-btn active" id="btn-easy" onclick="setDifficulty('easy')">سهل (5% ربح)</button>
                <button class="diff-btn" id="btn-medium" onclick="setDifficulty('medium')">متوسط (3% ربح)</button>
                <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">صعب (1% ربح)</button>
            </div>

            <!-- التحكم بالرهان -->
            <div class="bet-control-group">
                <button class="bet-btn" onclick="adjustBet(-5)">-</button>
                <div class="bet-input-wrapper">
                    <label>مبلغ الرهان (nps)</label>
                    <input type="number" id="betInput" class="bet-input" value="10" min="5" max="1000" step="5" onchange="validateBet()">
                </div>
                <button class="bet-btn" onclick="adjustBet(5)">+</button>
            </div>

            <!-- أزرار الرهان السريع -->
            <div class="quick-bets">
                <button class="q-btn" onclick="setBet(5)">أدنى (5)</button>
                <button class="q-btn" onclick="multiplyBet(0.5)">½</button>
                <button class="q-btn" onclick="multiplyBet(2)">2x</button>
                <button class="q-btn" onclick="setBet(1000)">أقصى (1000)</button>
            </div>

            <!-- أزرار التحكم والعمليات -->
            <div class="action-buttons-group">
                <button id="dropBtn" class="action-btn drop" onclick="dropFloor()">
                    <i class="fa-solid fa-arrow-down"></i>
                    <span>إسقاط الطابق</span>
                </button>
                <button id="cashoutBtn" class="action-btn cashout" onclick="cashout()" disabled>
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>سحب أرباحي</span>
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة النصر والربح -->
    <div class="toast" id="winToast">
        <div class="toast-title" id="toastTitle">تم الانسحاب بنجاح! 🎉</div>
        <div class="toast-amount" id="winToastAmount">+0.00 nps</div>
    </div>

    <script>
        /**
         * ==========================================
         * إعدادات خوارزميات اللعبة ونسب الربح والخصارة
         * ==========================================
         * سهل: ربح 5% - لا يتجاوز 3x
         * متوسط: ربح 3% - لا يتجاوز 4x
         * صعب: ربح 1% - لا يتجاوز 5x
         */
        const DIFFICULTY_CONFIG = {
            easy: {
                winRate: 0.05,
                maxCap: 3.0,
                multipliers: [0.1, 0.2, 0.5, 1.0, 1.3, 1.6, 1.9, 2.2, 2.5, 2.8, 3.0]
            },
            medium: {
                winRate: 0.03,
                maxCap: 4.0,
                multipliers: [0.2, 0.4, 1.0, 2.0, 2.6, 3.2, 3.8, 4.0]
            },
            hard: {
                winRate: 0.01,
                maxCap: 5.0,
                multipliers: [0.3, 0.6, 1.5, 3.0, 4.0, 5.0]
            }
        };

        let currentDifficulty = 'easy';
        let currentFloorIndex = 0;
        let isGameActive = false;
        let currentBalance = 1000.00;
        let currentBet = 10;
        let currentMultiplier = 0;

        // نظام الأصوات
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'drop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400 + (currentFloorIndex * 40), audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchUserData();
        });

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('user_id') || urlParams.get('telegram_id') || "10001";
        }

        // جلب بيانات الحساب
        function fetchUserData() {
            const uid = getUserId();
            fetch(`/api/user/get?user_id=${uid}`)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        currentBalance = parseFloat(data.balance);
                        document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                        if(data.full_name) document.getElementById('userName').innerText = data.full_name;
                    }
                })
                .catch(() => {
                    document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                });
        }

        function setDifficulty(diff) {
            if (isGameActive) return;
            currentDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${diff}`).classList.add('active');
        }

        function adjustBet(val) {
            if (isGameActive) return;
            let input = document.getElementById('betInput');
            let nVal = parseInt(input.value || 0) + val;
            setBet(nVal);
        }

        function multiplyBet(factor) {
            if (isGameActive) return;
            let input = document.getElementById('betInput');
            setBet(Math.round(parseInt(input.value || 0) * factor));
        }

        function setBet(val) {
            if (isGameActive) return;
            let input = document.getElementById('betInput');
            if (val < 5) val = 5;
            if (val > 1000) val = 1000;
            input.value = val;
            currentBet = val;
        }

        function validateBet() {
            let input = document.getElementById('betInput');
            let val = parseInt(input.value);
            if (isNaN(val) || val < 5) val = 5;
            if (val > 1000) val = 1000;
            input.value = val;
            currentBet = val;
        }

        // حركة إسقاط الطابق
        function dropFloor() {
            validateBet();

            if (!isGameActive) {
                if (currentBalance < currentBet) {
                    alert('رصيدك غير كافٍ للرهان!');
                    return;
                }

                // بدء جولة جديدة وخصم الرهان
                currentBalance -= currentBet;
                document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                isGameActive = true;
                currentFloorIndex = 0;
                document.getElementById('towerStack').innerHTML = '';
                
                // تعطيل أدوات الإعدادات
                document.querySelectorAll('.diff-btn, .bet-btn, .q-btn, .bet-input').forEach(el => el.disabled = true);
            }

            const config = DIFFICULTY_CONFIG[currentDifficulty];
            const isWin = Math.random() < config.winRate;

            if (isWin) {
                // نجاح الإسقاط
                playSound('drop');
                currentMultiplier = config.multipliers[Math.min(currentFloorIndex, config.multipliers.length - 1)];
                
                // التأكد من عدم تجاوز الحد الأقصى للجولات الرابحة
                if (currentMultiplier > config.maxCap) currentMultiplier = config.maxCap;

                addFloorToStack(currentFloorIndex + 1, currentMultiplier);
                currentFloorIndex++;

                const currentWinnings = (currentBet * currentMultiplier).toFixed(2);
                const cashoutBtn = document.getElementById('cashoutBtn');
                cashoutBtn.disabled = false;
                cashoutBtn.querySelector('span').innerText = `سحب أرباحي (${currentWinnings} nps)`;

            } else {
                // خسارة وانهيار الطابق
                playSound('boom');
                triggerCollapse();
                gameOver(false);
            }
        }

        function addFloorToStack(floorNum, mult) {
            const stack = document.getElementById('towerStack');
            const floorElem = document.createElement('div');
            floorElem.className = 'building-floor';
            floorElem.innerHTML = `
                <span class="floor-label">طابق ${floorNum}</span>
                <span class="floor-mult-badge">${mult}x</span>
            `;
            stack.appendChild(floorElem);

            // رفع الكاميرا ببطء إذا زاد الارتفاع
            if (floorNum > 5) {
                stack.style.transform = `translateY(${(floorNum - 5) * 45}px)`;
            }
        }

        function triggerCollapse() {
            const stack = document.getElementById('towerStack');
            if (stack.lastChild) {
                stack.lastChild.classList.add('collapse');
            }
            document.getElementById('gameWrapper').style.animation = 'shake 0.3s ease';
            setTimeout(() => {
                document.getElementById('gameWrapper').style.animation = '';
            }, 300);
        }

        // سحب الأرباح وإيقاف الجولة
        function cashout() {
            if (!isGameActive || currentMultiplier === 0) return;

            const winAmount = parseFloat((currentBet * currentMultiplier).toFixed(2));
            currentBalance += winAmount;
            document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
            playSound('win');

            // مزامنة الأرباح مع السيرفر
            syncGameWithServer(currentBet, winAmount, currentMultiplier);

            showToast('تم سحب الأرباح! 🎉', `+${winAmount.toFixed(2)} nps`);
            gameOver(true);
        }

        // إعادة ضبط اللعبة والجولة
        function gameOver(isWin) {
            isGameActive = false;

            if (!isWin) {
                // مزامنة الخسارة
                syncGameWithServer(currentBet, 0, 0);
                showToast('انهار البناء! 💥', `خسارة الرهان`);
            }

            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('cashoutBtn').querySelector('span').innerText = 'سحب أرباحي';
            document.querySelectorAll('.diff-btn, .bet-btn, .q-btn, .bet-input').forEach(el => el.disabled = false);
            
            setTimeout(() => {
                document.getElementById('towerStack').style.transform = 'translateY(0)';
            }, 1000);
        }

        // مزامنة نتائج اللعبة مع API السيرفر
        function syncGameWithServer(bet, win, mult) {
            const uid = getUserId();
            fetch('/api/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: uid,
                    game_id: 'tower',
                    bet_amount: bet,
                    win_amount: win,
                    multiplier: mult
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success && data.new_balance !== undefined) {
                    currentBalance = parseFloat(data.new_balance);
                    document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                }
            })
            .catch(err => console.error('Sync Error:', err));
        }

        function showToast(title, amount) {
            const toast = document.getElementById('winToast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('winToastAmount').innerText = amount;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
