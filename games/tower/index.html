<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برج المستقبل | Tower Stack City</title>
    <!-- خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.88);
            --gold-glow: #ffb703;
            --cyan-glow: #00f2fe;
            --green-safe: #10b981;
            --red-trap: #ef4444;
            --metal-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --building-wall: #1e293b;
            --building-accent: #334155;
            --window-glow: #fef08a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #090d16;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية حي سكني واقعية وتفاعلية */
        .sky-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, #0b132b 0%, #1c2541 40%, #3a506b 75%, #5bc0be 100%);
            overflow: hidden;
        }

        /* طبقات الحي السكني والأشجار المبنية بالـ CSS */
        .city-landscape {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* جبال ومبانٍ بعيدة */
        .distant-buildings {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 200px;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,183,3,0.15), transparent 40%),
                repeating-linear-gradient(90deg, #111827 0px, #111827 40px, #1f2937 40px, #1f2937 70px, transparent 70px, transparent 80px);
            opacity: 0.6;
        }

        /* شوارع وأشجار سكنية في الأسفل */
        .residential-street {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(0deg, #0f172a 0%, #1e293b 100%);
            border-top: 4px solid #475569;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .trees-container {
            position: absolute;
            bottom: 65px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 1;
        }

        .tree {
            width: 30px;
            height: 45px;
            background: #064e3b;
            border-radius: 50% 50% 20% 20%;
            position: relative;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5);
        }
        .tree::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 12px;
            background: #78350f;
        }

        /* إطار اللعبة الهيكلي المحسن */
        .game-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            height: 100vh;
            max-height: 920px;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--metal-border);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* الهيدر العلوي العسكري الفاخر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.85) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #0f172a);
            border: 2px solid var(--cyan-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan-glow);
            font-size: 18px;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        .balance-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold-glow);
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.2);
        }

        .balance-box span {
            color: var(--gold-glow);
            font-size: 16px;
        }

        /* ساحة البناء الكبرى */
        .construction-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
        }

        /* رافعة بناء صناعية واقعية */
        .crane-container {
            position: absolute;
            top: 0;
            width: 100%;
            height: 130px;
            z-index: 5;
            pointer-events: none;
        }

        .crane-arm {
            position: absolute;
            top: 8px;
            left: 0;
            right: 0;
            height: 12px;
            background: repeating-linear-gradient(45deg, #d97706, #d97706 10px, #1e293b 10px, #1e293b 20px);
            border-bottom: 2px solid #92400e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .crane-hook-line {
            position: absolute;
            top: 20px;
            width: 2px;
            height: 70px;
            background: #cbd5e1;
            left: 50%;
            transform: translateX(-50%);
            animation: craneSwing 2.8s infinite ease-in-out alternate;
            box-shadow: 0 0 2px #000;
        }

        @keyframes craneSwing {
            0% { left: 18%; }
            100% { left: 82%; }
        }

        .crane-block {
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 44px;
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 2px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* مجسم البرج والمبنى السكني */
        .tower-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        /* الطابق الأرضي الأساسي للحي السكني */
        .ground-floor-base {
            width: 200px;
            height: 55px;
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            border: 2px solid #64748b;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            position: relative;
        }

        .ground-entrance {
            width: 40px;
            height: 35px;
            background: linear-gradient(180deg, #38bdf8 0%, #0f172a 100%);
            border: 2px solid #94a3b8;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            margin: 0 auto;
        }

        .ground-pillar {
            width: 12px;
            height: 100%;
            background: #334155;
            border-left: 1px solid #64748b;
            border-right: 1px solid #64748b;
        }

        /* طوابق المبنى السكني الحقيقية */
        .building-floor {
            width: 180px;
            height: 48px;
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border: 2px solid #475569;
            border-bottom: 3px solid #0f172a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            animation: dropLanding 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            margin-bottom: -1px;
        }

        /* شبكة الشبابيك المضاءة في الطابق */
        .floor-windows {
            display: flex;
            gap: 6px;
            position: absolute;
            left: 12px;
        }

        .window {
            width: 14px;
            height: 22px;
            background: var(--window-glow);
            border: 1px solid #78350f;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(254, 240, 138, 0.8);
        }

        .window.off {
            background: #0f172a;
            box-shadow: none;
            border-color: #334155;
        }

        @keyframes dropLanding {
            0% { transform: translateY(-160px) scale(1.08); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .building-floor.collapse {
            animation: floorCollapse 0.6s forwards ease-in;
        }

        @keyframes floorCollapse {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(350px) rotate(55deg); opacity: 0; }
        }

        .floor-label {
            font-size: 11px;
            color: #e2e8f0;
            font-weight: 800;
            z-index: 2;
            background: rgba(15, 23, 42, 0.6);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .floor-mult-badge {
            font-size: 14px;
            font-weight: 900;
            color: var(--gold-glow);
            text-shadow: 0 0 8px rgba(255, 183, 3, 0.7);
            z-index: 2;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 183, 3, 0.4);
        }

        /* لوحة التحكم السفلية المحسنة */
        .controls-panel {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(9, 13, 22, 1) 100%);
            padding: 14px 18px;
            border-top: 1px solid var(--metal-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        /* اختيار الصعوبة */
        .difficulty-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(0,0,0,0.5);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .diff-btn {
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .diff-btn.active {
            background: linear-gradient(135deg, var(--cyan-glow), #0284c7);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }

        /* التحكم بالرهان */
        .bet-control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 4px 8px;
        }

        .bet-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .bet-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .bet-input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bet-input-wrapper label {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .bet-input {
            width: 100px;
            background: transparent;
            border: none;
            text-align: center;
            color: var(--gold-glow);
            font-size: 17px;
            font-weight: 900;
            outline: none;
        }

        .quick-bets {
            display: flex;
            gap: 6px;
        }

        .q-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 0;
            font-size: 10px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
        }

        /* أزرار الحركة الرئيسية */
        .action-buttons-group {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-btn.drop {
            background: linear-gradient(135deg, #00f2fe, #0284c7);
            color: #000;
            box-shadow: 0 4px 18px rgba(0, 242, 254, 0.4);
        }

        .action-btn.cashout {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #000;
            box-shadow: 0 4px 18px rgba(255, 183, 3, 0.4);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* نافذة التنبيه والنتيجة */
        .toast {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(15, 23, 42, 0.98);
            border: 2px solid var(--gold-glow);
            border-radius: 18px;
            padding: 22px 32px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 35px rgba(255, 183, 3, 0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-title {
            font-size: 19px;
            font-weight: 900;
            color: var(--gold-glow);
        }

        .toast-amount {
            font-size: 28px;
            font-weight: 900;
            color: var(--green-safe);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- خلفية حي سكني وأشجار وشوارع واقعية -->
    <div class="sky-background">
        <div class="city-landscape">
            <div class="distant-buildings"></div>
            <div class="trees-container">
                <div class="tree"></div>
                <div class="tree"></div>
                <div class="tree"></div>
                <div class="tree"></div>
            </div>
            <div class="residential-street"></div>
        </div>
    </div>

    <div class="game-wrapper" id="gameWrapper">
        <!-- الشريط العلوي -->
        <div class="header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-building-user"></i></div>
                <div>
                    <div id="userName" style="font-size: 12px; font-weight: 800;">مهندس البرج</div>
                    <div style="font-size: 9px; color: var(--text-muted);">المستوى VIP</div>
                </div>
            </div>
            <div class="balance-box">
                <i class="fa-solid fa-coins" style="color: var(--gold-glow);"></i>
                <span id="balanceDisplay">0.00</span>
                <small style="color: var(--text-muted); font-size: 9px;">nps</small>
            </div>
        </div>

        <!-- ساحة البناء الكبرى -->
        <div class="construction-stage">
            <!-- الرافعة الصناعية المعلقة -->
            <div class="crane-container">
                <div class="crane-arm"></div>
                <div class="crane-hook-line">
                    <div class="crane-block" id="craneBlock">
                        <i class="fa-solid fa-truck-ramp-box" style="margin-left:6px;"></i> طابق سكني
                    </div>
                </div>
            </div>

            <!-- مجسم البرج المبني والحي السكني -->
            <div class="tower-stack" id="towerStack">
                <!-- الطابق الأرضي الأساسي ثابت في قاعدة الحي -->
                <div class="ground-floor-base">
                    <div class="ground-pillar"></div>
                    <div class="ground-entrance"></div>
                    <div class="ground-pillar"></div>
                </div>
                <!-- يتم توليد الطوابق الجديدة فوق الطابق الأرضي -->
            </div>
        </div>

        <!-- لوحة التحكم السفلية -->
        <div class="controls-panel">
            <!-- تحديد الصعوبة وننسب الأرباح -->
            <div class="difficulty-selector">
                <button class="diff-btn active" id="btn-easy" onclick="setDifficulty('easy')">سهل (5% ربح)</button>
                <button class="diff-btn" id="btn-medium" onclick="setDifficulty('medium')">متوسط (3% ربح)</button>
                <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">صعب (1% ربح)</button>
            </div>

            <!-- التحكم بالرهان -->
            <div class="bet-control-group">
                <button class="bet-btn" onclick="adjustBet(-5)">-</button>
                <div class="bet-input-wrapper">
                    <label>مبلغ الرهان (nps)</label>
                    <input type="number" id="betInput" class="bet-input" value="10" min="5" max="1000" step="5" onchange="validateBet()">
                </div>
                <button class="bet-btn" onclick="adjustBet(5)">+</button>
            </div>

            <!-- أزرار الرهان السريع -->
            <div class="quick-bets">
                <button class="q-btn" onclick="setBet(5)">أدنى (5)</button>
                <button class="q-btn" onclick="multiplyBet(0.5)">½</button>
                <button class="q-btn" onclick="multiplyBet(2)">2x</button>
                <button class="q-btn" onclick="setBet(1000)">أقصى (1000)</button>
            </div>

            <!-- أزرار التحكم والعمليات -->
            <div class="action-buttons-group">
                <button id="dropBtn" class="action-btn drop" onclick="dropFloor()">
                    <i class="fa-solid fa-arrow-down"></i>
                    <span>إسقاط الطابق</span>
                </button>
                <button id="cashoutBtn" class="action-btn cashout" onclick="cashout()" disabled>
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>سحب أرباحي</span>
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة النصر والربح -->
    <div class="toast" id="winToast">
        <div class="toast-title" id="toastTitle">تم الانسحاب بنجاح! 🎉</div>
        <div class="toast-amount" id="winToastAmount">+0.00 nps</div>
    </div>

    <script>
        /**
         * ==========================================
         * إعدادات خوارزميات اللعبة ونسب الربح والخسارة (الحفاظ الكامل عليها)
         * ==========================================
         * سهل: ربح 5% - لا يتجاوز 3x
         * متوسط: ربح 3% - لا يتجاوز 4x
         * صعب: ربح 1% - لا يتجاوز 5x
         */
        const DIFFICULTY_CONFIG = {
            easy: {
                winRate: 0.05,
                maxCap: 3.0,
                multipliers: [0.1, 0.2, 0.5, 1.0, 1.3, 1.6, 1.9, 2.2, 2.5, 2.8, 3.0]
            },
            medium: {
                winRate: 0.03,
                maxCap: 4.0,
                multipliers: [0.2, 0.4, 1.0, 2.0, 2.6, 3.2, 3.8, 4.0]
            },
            hard: {
                winRate: 0.01,
                maxCap: 5.0,
                multipliers: [0.3, 0.6, 1.5, 3.0, 4.0, 5.0]
            }
        };

        let currentDifficulty = 'easy';
        let currentFloorIndex = 0;
        let isGameActive = false;
        let currentBalance = 1000.00;
        let currentBet = 10;
        let currentMultiplier = 0;

        // نظام الأصوات
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'drop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(380 + (currentFloorIndex * 35), audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
                osc.start(); osc.stop(audioCtx.currentTime + 0.18);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchUserData();
        });

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('user_id') || urlParams.get('telegram_id') || "10001";
        }

        // جلب بيانات الحساب المربوطة
        function fetchUserData() {
            const uid = getUserId();
            fetch(`/api/user/get?user_id=${uid}`)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        currentBalance = parseFloat(data.balance);
                        document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                        if(data.full_name) document.getElementById('userName').innerText = data.full_name;
                    }
                })
                .catch(() => {
                    document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                });
        }

        function setDifficulty(diff) {
            if (isGameActive) return;
            currentDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${diff}`).classList.add('active');
        }

        function adjustBet(val) {
            if (isGameActive) return;
            let input = document.getElementById('betInput');
            let nVal = parseInt(input.value || 0) + val;
            setBet(nVal);
        }

        function multiplyBet(factor) {
            if (isGameActive) return;
            let input = document.getElementById('betInput');
            setBet(Math.round(parseInt(input.value || 0) * factor));
        }

        function setBet(val) {
            if (isGameActive) return;
            let input = document.getElementById('betInput');
            if (val < 5) val = 5;
            if (val > 1000) val = 1000;
            input.value = val;
            currentBet = val;
        }

        function validateBet() {
            let input = document.getElementById('betInput');
            let val = parseInt(input.value);
            if (isNaN(val) || val < 5) val = 5;
            if (val > 1000) val = 1000;
            input.value = val;
            currentBet = val;
        }

        // حركة إسقاط الطابق السكني
        function dropFloor() {
            validateBet();

            if (!isGameActive) {
                if (currentBalance < currentBet) {
                    alert('رصيدك غير كافٍ للرهان!');
                    return;
                }

                // بدء جولة جديدة وخصم الرهان
                currentBalance -= currentBet;
                document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                isGameActive = true;
                currentFloorIndex = 0;
                
                // إعادة ضبط تكويم البرج مع الحفاظ على الطابق الأرضي الأساسي
                const stack = document.getElementById('towerStack');
                stack.innerHTML = `
                    <div class="ground-floor-base">
                        <div class="ground-pillar"></div>
                        <div class="ground-entrance"></div>
                        <div class="ground-pillar"></div>
                    </div>
                `;
                
                // تعطيل أدوات الإعدادات أثناء اللعب
                document.querySelectorAll('.diff-btn, .bet-btn, .q-btn, .bet-input').forEach(el => el.disabled = true);
            }

            const config = DIFFICULTY_CONFIG[currentDifficulty];
            const isWin = Math.random() < config.winRate;

            if (isWin) {
                // نجاح الإسقاط
                playSound('drop');
                currentMultiplier = config.multipliers[Math.min(currentFloorIndex, config.multipliers.length - 1)];
                
                // التأكد من عدم تجاوز الحد الأقصى للجولات الرابحة
                if (currentMultiplier > config.maxCap) currentMultiplier = config.maxCap;

                addFloorToStack(currentFloorIndex + 1, currentMultiplier);
                currentFloorIndex++;

                const currentWinnings = (currentBet * currentMultiplier).toFixed(2);
                const cashoutBtn = document.getElementById('cashoutBtn');
                cashoutBtn.disabled = false;
                cashoutBtn.querySelector('span').innerText = `سحب أرباحي (${currentWinnings} nps)`;

            } else {
                // خسارة وانهيار الطابق
                playSound('boom');
                triggerCollapse();
                gameOver(false);
            }
        }

        function addFloorToStack(floorNum, mult) {
            const stack = document.getElementById('towerStack');
            const floorElem = document.createElement('div');
            floorElem.className = 'building-floor';
            
            // توليد شبابيك مضاءة بشكل عشوائي لإعطاء طابع حقيقي للحي
            const w1 = Math.random() > 0.3 ? '' : 'off';
            const w2 = Math.random() > 0.3 ? '' : 'off';
            const w3 = Math.random() > 0.3 ? '' : 'off';

            floorElem.innerHTML = `
                <div class="floor-windows">
                    <div class="window ${w1}"></div>
                    <div class="window ${w2}"></div>
                    <div class="window ${w3}"></div>
                </div>
                <span class="floor-label">طابق ${floorNum}</span>
                <span class="floor-mult-badge">${mult}x</span>
            `;

            // إدراج الطابق في الأعلى فوق الطابق الأرضي
            stack.appendChild(floorElem);

            // رفع الكاميرا عند زيادة ارتفاع المبنى
            if (floorNum > 4) {
                stack.style.transform = `translateY(${(floorNum - 4) * 48}px)`;
            }
        }

        function triggerCollapse() {
            const stack = document.getElementById('towerStack');
            if (stack.lastChild && stack.children.length > 1) {
                stack.lastChild.classList.add('collapse');
            }
            document.getElementById('gameWrapper').style.animation = 'shake 0.3s ease';
            setTimeout(() => {
                document.getElementById('gameWrapper').style.animation = '';
            }, 300);
        }

        // سحب الأرباح وإيقاف الجولة
        function cashout() {
            if (!isGameActive || currentMultiplier === 0) return;

            const winAmount = parseFloat((currentBet * currentMultiplier).toFixed(2));
            currentBalance += winAmount;
            document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
            playSound('win');

            // مزامنة الأرباح مع السيرفر
            syncGameWithServer(currentBet, winAmount, currentMultiplier);

            showToast('تم سحب الأرباح! 🎉', `+${winAmount.toFixed(2)} nps`);
            gameOver(true);
        }

        // إعادة ضبط اللعبة والجولة
        function gameOver(isWin) {
            isGameActive = false;

            if (!isWin) {
                // مزامنة الخسارة
                syncGameWithServer(currentBet, 0, 0);
                showToast('انهار البناء! 💥', `خسارة الرهان`);
            }

            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('cashoutBtn').querySelector('span').innerText = 'سحب أرباحي';
            document.querySelectorAll('.diff-btn, .bet-btn, .q-btn, .bet-input').forEach(el => el.disabled = false);
            
            setTimeout(() => {
                document.getElementById('towerStack').style.transform = 'translateY(0)';
            }, 1000);
        }

        // مزامنة نتائج اللعبة مع API السيرفر (الحفاظ الكامل عليها)
        function syncGameWithServer(bet, win, mult) {
            const uid = getUserId();
            fetch('/api/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: uid,
                    game_id: 'tower',
                    bet_amount: bet,
                    win_amount: win,
                    multiplier: mult
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success && data.new_balance !== undefined) {
                    currentBalance = parseFloat(data.new_balance);
                    document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
                }
            })
            .catch(err => console.error('Sync Error:', err));
        }

        function showToast(title, amount) {
            const toast = document.getElementById('winToast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('winToastAmount').innerText = amount;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
