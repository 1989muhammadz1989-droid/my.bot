<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>لعبة رمي السهم - الحديقة الملكية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #090d16;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      position: relative;
      width: 100%;
      max-width: 850px;
      height: 640px;
      background: #000;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #1e293b;
    }
    canvas {
      width: 100%;
      height: 510px;
      display: block;
    }
    .ui-panel {
      height: 130px;
      background: linear-gradient(180deg, #0f172a 0%, #070a12 100%);
      border-top: 2px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      gap: 20px;
      z-index: 5;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: #94a3b8;
    }
    .stat-value {
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }
    .bet-controls {
      display: flex;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .bet-btn {
      background: linear-gradient(135deg, #334155, #1e293b);
      color: #fff;
      border: none;
      width: 48px;
      height: 48px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .bet-btn:active {
      background: #475569;
    }
    .bet-input {
      width: 90px;
      text-align: center;
      background: transparent;
      border: none;
      color: #facc15;
      font-size: 20px;
      font-weight: bold;
      outline: none;
    }
    .play-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: none;
      padding: 14px 40px;
      font-size: 21px;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
      transition: transform 0.1s, filter 0.2s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .play-btn:active {
      transform: scale(0.96);
    }
    .play-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status-toast {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      display: none;
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      animation: fadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast-win {
      background: rgba(34, 197, 94, 0.95);
      color: #fff;
      border: 1px solid #4ade80;
    }
    .toast-loss {
      background: rgba(239, 68, 68, 0.95);
      color: #fff;
      border: 1px solid #f87171;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -15px) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="statusToast" class="status-toast"></div>
    <canvas id="gameCanvas" width="850" height="510"></canvas>
    
    <div class="ui-panel">
      <div class="stat-box">
        <span class="stat-label">رصيد الحساب</span>
        <span class="stat-value" id="balanceDisplay">0.00 nps</span>
      </div>

      <div class="bet-controls">
        <button class="bet-btn" onclick="adjustBet(-5)">-</button>
        <input type="text" id="betAmount" class="bet-input" value="5" readonly>
        <button class="bet-btn" onclick="adjustBet(5)">+</button>
      </div>

      <button id="shootBtn" class="play-btn" onclick="startShoot()">سدد السهم 🎯</button>
    </div>
  </div>

  <script>
    // 1. محرك الصوت المطور (Web Audio API)
    const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playShootSound() {
      if (AudioCtx.state === 'suspended') AudioCtx.resume();
      // صوت إطلاق وتوتر وتر القوس
      const osc = AudioCtx.createOscillator();
      const gain = AudioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, AudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, AudioCtx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.7, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(AudioCtx.destination);
      osc.start();
      osc.stop(AudioCtx.currentTime + 0.18);
    }

    function playAirSound() {
      if (AudioCtx.state === 'suspended') AudioCtx.resume();
      const bufferSize = AudioCtx.sampleRate * 0.35;
      const buffer = AudioCtx.createBuffer(1, bufferSize, AudioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const whiteNoise = AudioCtx.createBufferSource();
      whiteNoise.buffer = buffer;
      const filter = AudioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(900, AudioCtx.currentTime);
      filter.frequency.linearRampToValueAtTime(400, AudioCtx.currentTime + 0.35);
      const gain = AudioCtx.createGain();
      gain.gain.setValueAtTime(0.2, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.35);
      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(AudioCtx.destination);
      whiteNoise.start();
    }

    function playHitSound(isBullseye) {
      if (AudioCtx.state === 'suspended') AudioCtx.resume();
      const osc = AudioCtx.createOscillator();
      const gain = AudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(isBullseye ? 520 : 220, AudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, AudioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.9, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(AudioCtx.destination);
      osc.start();
      osc.stop(AudioCtx.currentTime + 0.12);
    }

    // 2. إعدادات اللعبة والعناصر
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || '1000';

    let userBalance = 0;
    let betAmount = 5;
    let isPlaying = false;

    // إحداثيات الهدف في منتصف الشاشة والمنظور الأمامي
    const targetPos = { x: canvas.width / 2, y: 190, radius: 65 };
    const bowPos = { x: canvas.width / 2, y: canvas.height - 20 };

    let arrow = {
      x: bowPos.x,
      y: bowPos.y - 40,
      scale: 1,
      angle: 0,
      targetX: 0,
      targetY: 0,
      inFlight: false,
      stringPull: 0
    };

    // جلب معلومات المستخدم
    async function loadUserData() {
      try {
        const res = await fetch(`/api/user/get?user_id=${userId}`);
        const data = await res.json();
        if (data.success) {
          userBalance = data.balance;
          document.getElementById('balanceDisplay').innerText = `${userBalance.toFixed(2)} nps`;
        }
      } catch (e) {
        console.error("خطأ جلب بيانات المستخدم", e);
      }
    }
    loadUserData();

    function adjustBet(delta) {
      if (isPlaying) return;
      let newBet = betAmount + delta;
      if (newBet >= 5 && newBet <= 1000) {
        betAmount = newBet;
        document.getElementById('betAmount').value = betAmount;
      }
    }

    // 3. رسم البيئة والحديقة بلمسات واقعية ثلاثية الأبعاد
    function draw3DScene() {
      const w = canvas.width;
      const h = canvas.height;

      // السماء والشمس (Gradient Sunset/Day)
      let skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.55);
      skyGrad.addColorStop(0, '#0284c7');
      skyGrad.addColorStop(0.6, '#38bdf8');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h * 0.55);

      // توهج أشيّة الشمس في الأفق
      let sunGlow = ctx.createRadialGradient(w/2, 160, 10, w/2, 160, 250);
      sunGlow.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
      sunGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = sunGlow;
      ctx.fillRect(0, 0, w, h * 0.55);

      // الأشجار الخلفية في المدى البعيد
      ctx.fillStyle = '#166534';
      for (let i = 0; i < w; i += 45) {
        ctx.beginPath();
        ctx.arc(i + 20, h * 0.53 - 10, 35, 0, Math.PI * 2);
        ctx.fill();
      }

      // الأرضية والعشب مع تدرج منظور العمق
      let grassGrad = ctx.createLinearGradient(0, h * 0.5, 0, h);
      grassGrad.addColorStop(0, '#15803d');
      grassGrad.addColorStop(0.4, '#16a34a');
      grassGrad.addColorStop(1, '#14532d');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, h * 0.5, w, h * 0.5);

      // خطوط نسيج العشب (Depth Lines)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 2;
      for (let i = -200; i < w + 200; i += 80) {
        ctx.beginPath();
        ctx.moveTo(w / 2, h * 0.5);
        ctx.lineTo(i * 1.5, h);
        ctx.stroke();
      }

      // حامل لوحة الهدف الخشبي (Wood Stand Frame)
      ctx.fillStyle = '#451a03';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      // أرجل الحامل
      ctx.beginPath();
      ctx.moveTo(targetPos.x - 30, targetPos.y);
      ctx.lineTo(targetPos.x - 60, h * 0.58);
      ctx.lineTo(targetPos.x - 45, h * 0.58);
      ctx.lineTo(targetPos.x - 20, targetPos.y);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(targetPos.x + 30, targetPos.y);
      ctx.lineTo(targetPos.x + 60, h * 0.58);
      ctx.lineTo(targetPos.x + 45, h * 0.58);
      ctx.lineTo(targetPos.x + 20, targetPos.y);
      ctx.fill();

      ctx.shadowBlur = 0;

      // رسم لوحة الهدف الواقعية (Target Board)
      drawTargetBoard();
    }

    // رسم لوحة الإصابة الاحترافية الدائرية
    function drawTargetBoard() {
      ctx.save();
      ctx.translate(targetPos.x, targetPos.y);

      // إطار الهدف الخشبي الخارجي
      ctx.beginPath();
      ctx.arc(0, 0, targetPos.radius + 6, 0, Math.PI * 2);
      ctx.fillStyle = '#78350f';
      ctx.fill();

      // حلقات الهدف الدولية الرسمية (Archery Target Rings)
      const rings = [
        { r: targetPos.radius, color: '#f8fafc' },        // أبيض خارجي
        { r: targetPos.radius * 0.8, color: '#0f172a' },  // أسود
        { r: targetPos.radius * 0.6, color: '#3b82f6' },  // أزرق
        { r: targetPos.radius * 0.4, color: '#ef4444' },  // أحمر
        { r: targetPos.radius * 0.2, color: '#eab308' }   // أصفر ذهبي (Bullseye)
      ];

      rings.forEach(ring => {
        ctx.beginPath();
        ctx.arc(0, 0, ring.r, 0, Math.PI * 2);
        ctx.fillStyle = ring.color;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.stroke();
      });

      // نقطة المنتصف الدقيقة +
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-4, 0); ctx.lineTo(4, 0);
      ctx.moveTo(0, -4); ctx.lineTo(0, 4);
      ctx.stroke();

      ctx.restore();
    }

    // رسم قوس اللاعب واليدين في منتصف أسفل الشاشة (First-Person Bow & Hands)
    function drawFirstPersonBow() {
      if (arrow.inFlight) return; // عند الإطلاق يختفي القوس مؤقتاً لتسهيل تتبع السهم

      ctx.save();
      ctx.translate(bowPos.x, bowPos.y);

      // ذراعي اللاعب (Skin Tones)
      ctx.fillStyle = '#d97706';
      // اليد اليسرى الماسكة للقوس
      ctx.beginPath();
      ctx.ellipse(-15, -70, 18, 35, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // جسم القوس الخشبي (Bow Curved Riser)
      ctx.strokeStyle = '#54381e';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, -50, 110, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();

      // تفاصيل الذهب والتغليف على القوس
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 4;
      ctx.stroke();

      // وتر القوس (Bowstring)
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-78, -120);
      ctx.lineTo(0, -30 + arrow.stringPull); // نقطة سحب الوتر
      ctx.lineTo(78, -120);
      ctx.stroke();

      // السهم الجاهز للإطلاق في يد اللاعب
      drawArrowGraphic(0, -65 + arrow.stringPull, 1.1, -Math.PI / 2);

      ctx.restore();
    }

    // رسم السهم المجسم
    function drawArrowGraphic(x, y, scale, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);

      // جسم السهم الخشبي
      ctx.fillStyle = '#a16207';
      ctx.fillRect(-3, -40, 6, 80);

      // رأس السهم المعدني المصقول
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.moveTo(-6, -40);
      ctx.lineTo(0, -58);
      ctx.lineTo(6, -40);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1;
      ctx.stroke();

      // ريش السهم الخلفي (Fletching)
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(-3, 25); ctx.lineTo(-12, 38); ctx.lineTo(-3, 35);
      ctx.moveTo(3, 25); ctx.lineTo(12, 38); ctx.lineTo(3, 35);
      ctx.fill();

      ctx.restore();
    }

    // 4. تنفيذ التسديد والربط مع السيرفر
    async function startShoot() {
      if (isPlaying) return;
      if (userBalance < betAmount) {
        showToast("رصيدك غير كافٍ للرهان!", "loss");
        return;
      }

      isPlaying = true;
      document.getElementById('shootBtn').disabled = true;

      // تأثير انكماش الوتر استعداداً للإطلاق
      arrow.stringPull = 25;
      render();

      try {
        // إرسال طلب الرهان للسيرفر (نفس الـ API والمنطق المستقل لكل جولة)
        const response = await fetch('/api/play', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            game_id: 'archery',
            bet_amount: betAmount
          })
        });

        const data = await response.json();

        if (!data.success) {
          showToast(data.message || "حدث خطأ أثناء الرهان", "loss");
          isPlaying = false;
          arrow.stringPull = 0;
          document.getElementById('shootBtn').disabled = false;
          render();
          return;
        }

        userBalance = data.new_balance;
        document.getElementById('balanceDisplay').innerText = `${userBalance.toFixed(2)} nps`;

        // حساب مكان الإصابة الدقيق بناءً على الخوارزمية
        const isWin = data.multiplier > 0;
        
        if (isWin) {
          // إصابة دقيقة ومتقنة في منتصف الدائرة الذهبية (Bullseye)
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * (targetPos.radius * 0.18);
          arrow.targetX = targetPos.x + Math.cos(angle) * dist;
          arrow.targetY = targetPos.y + Math.sin(angle) * dist;
        } else {
          // خسارة غير ملحوظة: انحراف طبيعي جداً كأنه خطأ لاعب في التصويب (في الحلقة الزرقاء أو البيضاء)
          const angle = Math.random() * Math.PI * 2;
          const dist = targetPos.radius * 0.45 + Math.random() * (targetPos.radius * 0.38);
          arrow.targetX = targetPos.x + Math.cos(angle) * dist;
          arrow.targetY = targetPos.y + Math.sin(angle) * dist;
        }

        // إطلاق القوس
        setTimeout(() => {
          arrow.stringPull = 0;
          arrow.inFlight = true;
          playShootSound();
          setTimeout(playAirSound, 80);
          animateArrowFlight(data);
        }, 120);

      } catch (e) {
        console.error(e);
        isPlaying = false;
        arrow.stringPull = 0;
        document.getElementById('shootBtn').disabled = false;
        render();
      }
    }

    // تحريك السهم من القوس نحو الهدف المنظوري ثلاثي الأبعاد
    function animateArrowFlight(gameData) {
      let progress = 0;
      const duration = 30; // فريمات الطيران

      const startX = bowPos.x;
      const startY = bowPos.y - 65;
      const endX = arrow.targetX;
      const endY = arrow.targetY;

      function step() {
        progress++;
        let t = progress / duration;

        // الطيران المنظوري (Perspective Flight)
        arrow.x = startX + (endX - startX) * t;
        let linearY = startY + (endY - startY) * t;
        let arc = -45 * Math.sin(t * Math.PI); // انحناء قوسي خفيف للطيران
        arrow.y = linearY + arc;

        // انخفاض حجم السهم تدريجياً ليظهر أنه يبتعد في المدى
        arrow.scale = 1.1 - (t * 0.75);

        render();

        // رسم السهم أثناء الطيران مباشرة
        drawArrowGraphic(arrow.x, arrow.y, arrow.scale, -Math.PI / 2);

        if (progress < duration) {
          requestAnimationFrame(step);
        } else {
          // ثبات السهم في الهدف عند الاصطدام
          const isWin = gameData.multiplier > 0;
          playHitSound(isWin);

          // إظهار النتائج بشكل أنيق
          setTimeout(() => {
            if (isWin) {
              showToast(`مبروك! أصبت المنتصف وربحت ${gameData.win_amount} nps`, "win");
            } else {
              showToast("جولة خسارة! لم تصب المنتصف", "loss");
            }

            // إعادة التعيين تلقائياً للجولة التالية
            setTimeout(resetGame, 2200);
          }, 150);
        }
      }

      requestAnimationFrame(step);
    }

    function resetGame() {
      arrow.x = bowPos.x;
      arrow.y = bowPos.y - 40;
      arrow.scale = 1;
      arrow.inFlight = false;
      isPlaying = false;
      document.getElementById('shootBtn').disabled = false;
      render();
    }

    function showToast(msg, type) {
      const toast = document.getElementById('statusToast');
      toast.innerText = msg;
      toast.className = `status-toast toast-${type}`;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2600);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      draw3DScene();
      
      // إذا كان السهم استقر في الهدف بعد الطيران، نقوم برسمه ثابتاً في لوحة الإصابة
      if (arrow.inFlight && !isPlaying) {
        drawArrowGraphic(arrow.targetX, arrow.targetY, 0.35, -Math.PI / 2);
      }

      drawFirstPersonBow();
    }

    // التشغيل المبدئي للعبة
    render();
  </script>
</body>
</html>
