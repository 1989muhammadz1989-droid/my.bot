<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>لعبة رمي السهم - الساحة الملكية الاحترافية</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Tajawal', 'Segoe UI', sans-serif;
    }
    body {
      background: #020617;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 680px;
      background: #020617;
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95), 0 0 40px rgba(56, 189, 248, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    canvas {
      width: 100%;
      height: 530px;
      display: block;
      cursor: crosshair;
    }

    /* شريط المعاينة العلوي للمؤثرات والرياح */
    .top-bar {
      position: absolute;
      top: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 8;
      pointer-events: none;
    }
    .badge {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 14px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .payout-badge {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.2), rgba(245, 158, 11, 0.35));
      border: 1px solid #facc15;
      color: #fef08a;
      font-weight: 900;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.25);
    }

    /* لوحة التحكم والتحكّم بالرهان */
    .ui-panel {
      height: 150px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(3, 7, 18, 1) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      gap: 15px;
      z-index: 5;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 130px;
    }
    .stat-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* خيارات الرهان السريعة */
    .bet-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .quick-bets {
      display: flex;
      gap: 6px;
    }
    .quick-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover {
      background: #334155;
      color: #fff;
    }

    .bet-controls {
      display: flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }
    .bet-btn {
      background: linear-gradient(135deg, #334155, #1e293b);
      color: #f8fafc;
      border: none;
      width: 46px;
      height: 46px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .bet-btn:hover {
      background: #475569;
    }
    .bet-btn:active {
      transform: scale(0.95);
    }
    .bet-input {
      width: 85px;
      text-align: center;
      background: transparent;
      border: none;
      color: #facc15;
      font-size: 20px;
      font-weight: 900;
      outline: none;
    }

    /* زر التسديد الاحترافي */
    .play-btn {
      position: relative;
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      color: #fff;
      border: 1px solid #4ade80;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(34, 197, 94, 0.45), 0 0 15px rgba(34, 197, 94, 0.2);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      overflow: hidden;
      min-width: 200px;
    }
    .play-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(45deg);
      transition: 0.5s;
    }
    .play-btn:hover::before {
      left: 100%;
    }
    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.65);
    }
    .play-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    .play-btn:disabled {
      background: #334155;
      border-color: #475569;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* الإشعارات العائمة التفاعلية */
    .status-toast {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 38px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 900;
      display: none;
      z-index: 10;
      box-shadow: 0 10px 35px rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      white-space: nowrap;
    }
    .toast-win {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.95), rgba(21, 128, 61, 0.95));
      color: #fff;
      border: 1.5px solid #86efac;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    .toast-loss {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(185, 28, 28, 0.95));
      color: #fff;
      border: 1.5px solid #fca5a5;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%, -25px) scale(0.8); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="top-bar">
      <div class="badge" id="windDisplay">
        <span>🌬️ اتجاه الرياح:</span>
        <span id="windVal">1.2 م/ث ➔</span>
      </div>
      <div class="badge payout-badge">
        <span>🎯 مضاعف الفوز: 2.0x</span>
      </div>
    </div>

    <div id="statusToast" class="status-toast"></div>
    <canvas id="gameCanvas" width="880" height="530"></canvas>
    
    <div class="ui-panel">
      <div class="stat-box">
        <span class="stat-label">رصيد الحساب</span>
        <span class="stat-value" id="balanceDisplay">0.00 nps</span>
      </div>

      <div class="bet-container">
        <div class="quick-bets">
          <button class="quick-btn" onclick="setBet(5)">5</button>
          <button class="quick-btn" onclick="setBet(25)">25</button>
          <button class="quick-btn" onclick="setBet(50)">50</button>
          <button class="quick-btn" onclick="setBet(100)">100</button>
        </div>
        <div class="bet-controls">
          <button class="bet-btn" onclick="adjustBet(-5)">-</button>
          <input type="text" id="betAmount" class="bet-input" value="5" readonly>
          <button class="bet-btn" onclick="adjustBet(5)">+</button>
        </div>
      </div>

      <button id="shootBtn" class="play-btn" onclick="startShoot()">تثبيت وتسديد 🎯</button>
    </div>
  </div>

  <script>
    // 1. محرك الصوت المطور المتكامل (Web Audio API 2.0)
    const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playDrawSound() {
      if (AudioCtx.state === 'suspended') AudioCtx.resume();
      const osc = AudioCtx.createOscillator();
      const gain = AudioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, AudioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(280, AudioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.01, AudioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, AudioCtx.currentTime + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(AudioCtx.destination);
      osc.start();
      osc.stop(AudioCtx.currentTime + 0.25);
    }

    function playShootSound() {
      if (AudioCtx.state === 'suspended') AudioCtx.resume();
      const osc = AudioCtx.createOscillator();
      const gain = AudioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(420, AudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, AudioCtx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.9, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(AudioCtx.destination);
      osc.start();
      osc.stop(AudioCtx.currentTime + 0.18);
    }

    function playAirSound() {
      if (AudioCtx.state === 'suspended') AudioCtx.resume();
      const bufferSize = AudioCtx.sampleRate * 0.35;
      const buffer = AudioCtx.createBuffer(1, bufferSize, AudioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const whiteNoise = AudioCtx.createBufferSource();
      whiteNoise.buffer = buffer;
      const filter = AudioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400, AudioCtx.currentTime);
      filter.frequency.linearRampToValueAtTime(400, AudioCtx.currentTime + 0.35);
      const gain = AudioCtx.createGain();
      gain.gain.setValueAtTime(0.35, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.35);
      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(AudioCtx.destination);
      whiteNoise.start();
    }

    function playHitSound(isBullseye) {
      if (AudioCtx.state === 'suspended') AudioCtx.resume();
      const osc = AudioCtx.createOscillator();
      const gain = AudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(isBullseye ? 620 : 260, AudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, AudioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(1.0, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(AudioCtx.destination);
      osc.start();
      osc.stop(AudioCtx.currentTime + 0.15);

      if (isBullseye) {
        setTimeout(() => {
          const winOsc = AudioCtx.createOscillator();
          const winGain = AudioCtx.createGain();
          winOsc.type = 'triangle';
          winOsc.frequency.setValueAtTime(523.25, AudioCtx.currentTime); 
          winOsc.frequency.setValueAtTime(659.25, AudioCtx.currentTime + 0.08); 
          winOsc.frequency.setValueAtTime(783.99, AudioCtx.currentTime + 0.16); 
          winOsc.frequency.setValueAtTime(1046.50, AudioCtx.currentTime + 0.24); 
          winGain.gain.setValueAtTime(0.45, AudioCtx.currentTime);
          winGain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.45);
          winOsc.connect(winGain);
          winOsc.connect(AudioCtx.destination);
          winOsc.start();
          winOsc.stop(AudioCtx.currentTime + 0.45);
        }, 80);
      }
    }

    // 2. إعدادات اللعبة والمتغيرات الحسابية
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || '1000';

    let userBalance = 0;
    let betAmount = 5;
    let isPlaying = false;

    // اهتزاز الشاشة (Camera Shake)
    let shakeTime = 0;

    // عناصر الهدف والتصويب بالمهارة
    const targetPos = { x: canvas.width / 2, y: 180, radius: 72 };
    const bowPos = { x: canvas.width / 2, y: canvas.height - 10 };

    // ميكانيكية الرياح والاهتزاز بالتنفس
    let windSpeed = 1.2;
    let windDir = 1; // 1 = لليمين, -1 = للعدار
    let timeTick = 0;

    // مؤشر تصويب اللاعب التفاعلي
    let aimOffset = { x: 0, y: 0 };
    let playerLockPoint = { x: targetPos.x, y: targetPos.y };

    let arrow = {
      x: bowPos.x,
      y: bowPos.y - 45,
      scale: 1,
      targetX: 0,
      targetY: 0,
      inFlight: false,
      stringPull: 0
    };

    let particles = [];
    let clouds = [
      { x: 30, y: 50, speed: 0.25, size: 50 },
      { x: 360, y: 35, speed: 0.15, size: 65 },
      { x: 690, y: 70, speed: 0.35, size: 55 }
    ];
    let leaves = [];
    for (let i = 0; i < 15; i++) {
      leaves.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.6,
        size: Math.random() * 4 + 3,
        speedX: Math.random() * 0.8 + 0.2,
        speedY: Math.random() * 0.5 + 0.3,
        rot: Math.random() * Math.PI
      });
    }

    // جلب معلومات المستخدم
    async function loadUserData() {
      try {
        const res = await fetch(`/api/user/get?user_id=${userId}`);
        const data = await res.json();
        if (data.success) {
          userBalance = data.balance;
          document.getElementById('balanceDisplay').innerText = `${userBalance.toFixed(2)} nps`;
        }
      } catch (e) {
        console.error("خطأ جلب بيانات المستخدم", e);
      }
    }
    loadUserData();

    function setBet(val) {
      if (isPlaying) return;
      betAmount = val;
      document.getElementById('betAmount').value = betAmount;
    }

    function adjustBet(delta) {
      if (isPlaying) return;
      let newBet = betAmount + delta;
      if (newBet >= 5 && newBet <= 1000) {
        betAmount = newBet;
        document.getElementById('betAmount').value = betAmount;
      }
    }

    // 3. رسم البيئة والمحيط ثلاثي الأبعاد
    function drawScene() {
      const w = canvas.width;
      const h = canvas.height;

      timeTick += 0.04;

      // حساب اهتزاز يد اللاعب الطبيعي (التنفس) عند التصويب
      if (!isPlaying) {
        aimOffset.x = Math.sin(timeTick * 1.5) * 22 + (windSpeed * windDir * 8);
        aimOffset.y = Math.cos(timeTick * 2.1) * 16;
      }

      ctx.save();
      if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * shakeTime;
        let dy = (Math.random() - 0.5) * shakeTime;
        ctx.translate(dx, dy);
        shakeTime *= 0.82;
        if (shakeTime < 0.5) shakeTime = 0;
      }

      // السماء الملكية
      let skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.55);
      skyGrad.addColorStop(0, '#0369a1');
      skyGrad.addColorStop(0.5, '#0284c7');
      skyGrad.addColorStop(1, '#7dd3fc');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h * 0.55);

      // السحب المتحركة
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      clouds.forEach(c => {
        c.x += c.speed * windDir;
        if (c.x - 100 > w) c.x = -100;
        if (c.x + 100 < 0) c.x = w + 100;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 0.6, c.y - c.size * 0.2, c.size * 0.8, 0, Math.PI * 2);
        ctx.arc(c.x - c.size * 0.6, c.y, c.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      });

      // توهج وشعاع الشمس
      let sunGlow = ctx.createRadialGradient(w/2, 130, 5, w/2, 130, 300);
      sunGlow.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
      sunGlow.addColorStop(0.3, 'rgba(254, 240, 138, 0.35)');
      sunGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = sunGlow;
      ctx.fillRect(0, 0, w, h * 0.55);

      // الجبال
      ctx.fillStyle = '#0f766e';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.55);
      ctx.lineTo(160, h * 0.4);
      ctx.lineTo(340, h * 0.55);
      ctx.lineTo(580, h * 0.36);
      ctx.lineTo(780, h * 0.55);
      ctx.lineTo(w, h * 0.44);
      ctx.lineTo(w, h * 0.55);
      ctx.fill();

      // الأرضية والعشب
      let grassGrad = ctx.createLinearGradient(0, h * 0.52, 0, h);
      grassGrad.addColorStop(0, '#15803d');
      grassGrad.addColorStop(0.4, '#16a34a');
      grassGrad.addColorStop(1, '#052e16');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, h * 0.52, w, h * 0.48);

      // أسطر خطوط العشب العمودية للعمق
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 2;
      for (let i = -250; i < w + 250; i += 70) {
        ctx.beginPath();
        ctx.moveTo(w / 2, h * 0.52);
        ctx.lineTo(i * 1.6, h);
        ctx.stroke();
      }

      // تحريك أوراق الشجر
      ctx.fillStyle = '#a3e635';
      leaves.forEach(l => {
        l.x += l.speedX * windDir;
        l.y += l.speedY;
        l.rot += 0.03;
        if (l.y > h || l.x > w || l.x < 0) {
          l.y = Math.random() * h * 0.4;
          l.x = windDir > 0 ? -10 : w + 10;
        }
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.rot);
        ctx.fillRect(-l.size/2, -l.size/2, l.size, l.size*1.8);
        ctx.restore();
      });

      // حامل الهدف الخشبي
      ctx.fillStyle = '#29140a';
      ctx.beginPath();
      ctx.moveTo(targetPos.x - 30, targetPos.y);
      ctx.lineTo(targetPos.x - 65, h * 0.63);
      ctx.lineTo(targetPos.x - 48, h * 0.63);
      ctx.lineTo(targetPos.x - 18, targetPos.y);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(targetPos.x + 30, targetPos.y);
      ctx.lineTo(targetPos.x + 65, h * 0.63);
      ctx.lineTo(targetPos.x + 48, h * 0.63);
      ctx.lineTo(targetPos.x + 18, targetPos.y);
      ctx.fill();

      drawTargetBoard();

      // رسم مؤشر التصويب المتذبذب عند التجهيز للتسديد
      if (!isPlaying) {
        drawAimCrosshair(targetPos.x + aimOffset.x, targetPos.y + aimOffset.y);
      }

      updateAndDrawParticles();

      ctx.restore();
    }

    // رسم مؤشر التصويب
    function drawAimCrosshair(cx, cy) {
      ctx.save();
      ctx.translate(cx, cy);

      ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-25, 0); ctx.lineTo(-10, 0);
      ctx.moveTo(25, 0); ctx.lineTo(10, 0);
      ctx.moveTo(0, -25); ctx.lineTo(0, -10);
      ctx.moveTo(0, 25); ctx.lineTo(0, 10);
      ctx.stroke();

      ctx.restore();
    }

    // رسم لوحة الإصابة المتقدمة
    function drawTargetBoard() {
      ctx.save();
      ctx.translate(targetPos.x, targetPos.y);

      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 22;
      ctx.shadowOffsetY = 12;

      ctx.beginPath();
      ctx.arc(0, 0, targetPos.radius + 8, 0, Math.PI * 2);
      ctx.fillStyle = '#422006';
      ctx.fill();

      ctx.shadowBlur = 0;

      const rings = [
        { r: targetPos.radius, color: '#f8fafc' },        
        { r: targetPos.radius * 0.8, color: '#0f172a' },  
        { r: targetPos.radius * 0.6, color: '#2563eb' },  
        { r: targetPos.radius * 0.4, color: '#dc2626' },  
        { r: targetPos.radius * 0.2, color: '#eab308' }   // الذهبية (Bullseye)
      ];

      rings.forEach(ring => {
        ctx.beginPath();
        ctx.arc(0, 0, ring.r, 0, Math.PI * 2);
        ctx.fillStyle = ring.color;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.stroke();
      });

      let goldGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, targetPos.radius * 0.2);
      goldGlow.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      goldGlow.addColorStop(1, 'rgba(234, 179, 8, 0)');
      ctx.fillStyle = goldGlow;
      ctx.beginPath();
      ctx.arc(0, 0, targetPos.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-5, 0); ctx.lineTo(5, 0);
      ctx.moveTo(0, -5); ctx.lineTo(0, 5);
      ctx.stroke();

      ctx.restore();
    }

    // رسم القوس في منظور الشخص الأول
    function drawFirstPersonBow() {
      if (arrow.inFlight) return;

      ctx.save();
      ctx.translate(bowPos.x, bowPos.y);

      // اليدين والسواعد
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.ellipse(-18, -70, 22, 40, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // القوس الخشبي الملكي
      ctx.strokeStyle = '#3f1d0b';
      ctx.lineWidth = 15;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, -50, 120, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();

      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 4;
      ctx.stroke();

      // الوتر المربوط
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-85, -128);
      ctx.lineTo(0, -30 + arrow.stringPull);
      ctx.lineTo(85, -128);
      ctx.stroke();

      drawArrowGraphic(0, -65 + arrow.stringPull, 1.15, -Math.PI / 2);

      ctx.restore();
    }

    // رسم السهم ثلاثي الأبعاد
    function drawArrowGraphic(x, y, scale, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);

      ctx.fillStyle = '#78350f';
      ctx.fillRect(-3.5, -42, 7, 84);

      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.moveTo(-7, -42);
      ctx.lineTo(0, -62);
      ctx.lineTo(7, -42);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(-3.5, 25); ctx.lineTo(-14, 40); ctx.lineTo(-3.5, 36);
      ctx.moveTo(3.5, 25); ctx.lineTo(14, 40); ctx.lineTo(3.5, 36);
      ctx.fill();

      ctx.restore();
    }

    function createParticles(x, y, isWin) {
      const count = isWin ? 40 : 12;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * (isWin ? 11 : 4),
          vy: (Math.random() - 0.5) * (isWin ? 11 : 4) - (isWin ? 2 : 0),
          color: isWin ? ['#facc15', '#4ade80', '#38bdf8', '#f43f5e'][Math.floor(Math.random()*4)] : '#a16207',
          size: Math.random() * 5 + 3,
          alpha: 1
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        p.size *= 0.96;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // 4. تنفيذ التسديد والتفاعل مع السيرفر والـ API
    async function startShoot() {
      if (isPlaying) return;
      if (userBalance < betAmount) {
        showToast("رصيدك غير كافٍ للرهان!", "loss");
        return;
      }

      isPlaying = true;
      document.getElementById('shootBtn').disabled = true;

      // تثبيت نقطة تصويب اللاعب الحالية
      playerLockPoint.x = targetPos.x + aimOffset.x;
      playerLockPoint.y = targetPos.y + aimOffset.y;

      // شد الوتر
      arrow.stringPull = 30;
      playDrawSound();
      render();

      try {
        const response = await fetch('/api/play', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            game_id: 'archery',
            bet_amount: betAmount
          })
        });

        const data = await response.json();

        if (!data.success) {
          showToast(data.message || "حدث خطأ أثناء الرهان", "loss");
          isPlaying = false;
          arrow.stringPull = 0;
          document.getElementById('shootBtn').disabled = false;
          render();
          return;
        }

        userBalance = data.new_balance;
        document.getElementById('balanceDisplay').innerText = `${userBalance.toFixed(2)} nps`;

        const isWin = data.multiplier > 0;

        if (isWin) {
          // الفوز: السهم يتجه بدقة فائقة إلى المنطقة الذهبية في منتصف الهدف
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * (targetPos.radius * 0.16);
          arrow.targetX = targetPos.x + Math.cos(angle) * dist;
          arrow.targetY = targetPos.y + Math.sin(angle) * dist;
        } else {
          // الخسارة المموّهة: انحراف طبيعي جداً متوافق مع سرعة الرياح واتجاهها
          const windDriftX = (windSpeed * windDir * 28);
          const randAngle = Math.random() * Math.PI * 2;
          const dist = targetPos.radius * 0.45 + Math.random() * (targetPos.radius * 0.35);

          arrow.targetX = targetPos.x + windDriftX + (Math.cos(randAngle) * 15);
          arrow.targetY = targetPos.y + (Math.sin(randAngle) * dist);
        }

        setTimeout(() => {
          arrow.stringPull = 0;
          arrow.inFlight = true;
          playShootSound();
          setTimeout(playAirSound, 60);
          animateArrowFlight(data);
        }, 120);

      } catch (e) {
        console.error(e);
        isPlaying = false;
        arrow.stringPull = 0;
        document.getElementById('shootBtn').disabled = false;
        render();
      }
    }

    function animateArrowFlight(gameData) {
      let progress = 0;
      const duration = 26;

      const startX = bowPos.x;
      const startY = bowPos.y - 65;
      const endX = arrow.targetX;
      const endY = arrow.targetY;

      function step() {
        progress++;
        let t = progress / duration;

        arrow.x = startX + (endX - startX) * t;
        let linearY = startY + (endY - startY) * t;
        let arc = -55 * Math.sin(t * Math.PI);
        arrow.y = linearY + arc;

        arrow.scale = 1.15 - (t * 0.78);

        render();

        drawArrowGraphic(arrow.x, arrow.y, arrow.scale, -Math.PI / 2);

        if (progress < duration) {
          requestAnimationFrame(step);
        } else {
          const isWin = gameData.multiplier > 0;
          shakeTime = isWin ? 15 : 7;
          playHitSound(isWin);
          createParticles(arrow.targetX, arrow.targetY, isWin);

          // تغيير سرعة الرياح للجولة التالية بطريقة مشوقة
          windSpeed = parseFloat((Math.random() * 2.2 + 0.4).toFixed(1));
          windDir = Math.random() > 0.5 ? 1 : -1;
          document.getElementById('windVal').innerText = `${windSpeed} م/ث ${windDir > 0 ? '➔' : '⬅'}`;

          // إظهار نتيجة الجولة وحساب الربح مضاعفاً (2x)
          setTimeout(() => {
            if (isWin) {
              const winPayout = (betAmount * 2).toFixed(2);
              showToast(`🎯 مبروك! أصبت المنتصف وربحت ${winPayout} nps`, "win");
            } else {
              showToast("جولة خسارة! انحرف السهم عن المنتصف", "loss");
            }

            setTimeout(resetGame, 2200);
          }, 150);
        }
      }

      requestAnimationFrame(step);
    }

    function resetGame() {
      arrow.x = bowPos.x;
      arrow.y = bowPos.y - 45;
      arrow.scale = 1;
      arrow.inFlight = false;
      isPlaying = false;
      document.getElementById('shootBtn').disabled = false;
      render();
    }

    function showToast(msg, type) {
      const toast = document.getElementById('statusToast');
      toast.innerText = msg;
      toast.className = `status-toast toast-${type}`;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2600);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawScene();
      
      if (arrow.inFlight && !isPlaying) {
        drawArrowGraphic(arrow.targetX, arrow.targetY, 0.37, -Math.PI / 2);
      }

      drawFirstPersonBow();
    }

    function loop() {
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
