<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة النرد 🎲</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #141e30, #243b55); color: #fff; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
        .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 15px; backdrop-filter: blur(10px); }
        .balance-box { font-size: 1.1rem; font-weight: bold; color: #4eef90; }
        
        /* 3D Dice Stage */
        .dice-container { display: flex; gap: 30px; margin: 40px 0; perspective: 1000px; }
        .die { width: 70px; height: 70px; position: relative; transform-style: preserve-3d; transition: transform 1.5s ease-out; }
        .face { position: absolute; width: 70px; height: 70px; background: #fff; border-radius: 10px; border: 2px solid #ccc; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .dot { background: #222; border-radius: 50%; width: 12px; height: 12px; align-self: center; justify-self: center; }
        .red-dot { background: #e74c3c; }

        /* Cube Positions */
        .f-1 { transform: translateZ(35px); }
        .f-6 { transform: rotateY(180deg) translateZ(35px); }
        .f-2 { transform: rotateY(-90deg) translateZ(35px); }
        .f-5 { transform: rotateY(90deg) translateZ(35px); }
        .f-3 { transform: rotateX(90deg) translateZ(35px); }
        .f-4 { transform: rotateX(-90deg) translateZ(35px); }

        /* Controls */
        .panel { width: 100%; max-width: 450px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; }
        .options { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .opt-btn { flex: 1; padding: 12px; border: 2px solid transparent; background: rgba(255,255,255,0.1); color: #fff; font-size: 0.95rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .opt-btn.active { background: #f39c12; border-color: #f1c40f; box-shadow: 0 0 15px rgba(243, 156, 18, 0.5); }
        
        .bet-control { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .btn-step { width: 45px; height: 45px; border: none; background: #e74c3c; color: white; font-size: 1.5rem; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .bet-input { width: 100px; text-align: center; font-size: 1.3rem; font-weight: bold; padding: 8px; border-radius: 10px; border: none; background: #fff; color: #222; }

        .btn-roll { width: 100%; padding: 15px; border: none; background: linear-gradient(45deg, #2ecc71, #27ae60); color: white; font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4); }
        .btn-roll:disabled { background: #7f8c8d; cursor: not-allowed; }
        .status-msg { margin-top: 15px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

    <div class="header">
        <span>🎲 لعبة أحجار النرد</span>
        <div class="balance-box">الرصيد: <span id="userBalance">0.00</span> $</div>
    </div>

    <!-- 3D Rolling Dice -->
    <div class="dice-container">
        <div class="die" id="die1">
            <div class="face f-1"><div class="dot red-dot" style="grid-area: 2/2;"></div></div>
            <div class="face f-2"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-3"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 2/2;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-4"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-5"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 2/2;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-6"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 2/1;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 2/3;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
        </div>
        <div class="die" id="die2">
            <div class="face f-1"><div class="dot red-dot" style="grid-area: 2/2;"></div></div>
            <div class="face f-2"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-3"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 2/2;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-4"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-5"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 2/2;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
            <div class="face f-6"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 2/1;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 2/3;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="panel">
        <div class="options">
            <button class="opt-btn active" onclick="selectChoice('under7')">أقل من 7 (x2)</button>
            <button class="opt-btn" onclick="selectChoice('equal7')">يساوي 7 (x2)</button>
            <button class="opt-btn" onclick="selectChoice('over7')">أكثر من 7 (x2)</button>
        </div>

        <div class="bet-control">
            <button class="btn-step" onclick="adjustBet(-5)">-</button>
            <input type="number" id="betAmount" class="bet-input" value="5" min="5" max="1000" readonly>
            <button class="btn-step" onclick="adjustBet(5)">+</button>
        </div>

        <button class="btn-roll" id="rollBtn" onclick="playGame()">رمي النرد 🎲</button>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = tg?.initDataUnsafe?.user?.id || new URLSearchParams(window.location.search).get('user_id') || "123456";
        let selectedChoice = 'under7';
        let isRolling = false;

        // Sound Generator Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playDiceSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150 + Math.random() * 200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }, i * 120);
            }
        }

        async function fetchUser() {
            try {
                const res = await fetch(`/api/user/get?user_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('userBalance').innerText = data.balance.toFixed(2);
                }
            } catch (e) { console.error(e); }
        }
        fetchUser();

        function selectChoice(choice) {
            if (isRolling) return;
            selectedChoice = choice;
            document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function adjustBet(delta) {
            if (isRolling) return;
            let input = document.getElementById('betAmount');
            let val = parseInt(input.value) + delta;
            if (val >= 5 && val <= 1000) input.value = val;
        }

        const faceRotations = {
            1: { x: 0, y: 0 },
            6: { x: 0, y: 180 },
            2: { x: 0, y: 90 },
            5: { x: 0, y: -90 },
            3: { x: -90, y: 0 },
            4: { x: 90, y: 0 }
        };

        async function playGame() {
            if (isRolling) return;
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            const statusMsg = document.getElementById('statusMsg');
            const rollBtn = document.getElementById('rollBtn');

            statusMsg.innerText = "";
            rollBtn.disabled = true;
            isRolling = true;

            try {
                // Call main algorithm endpoint
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: 'dice', bet_amount: betAmount })
                });
                const data = await res.json();

                if (!data.success) {
                    statusMsg.style.color = "#e74c3c";
                    statusMsg.innerText = data.message || "حدث خطأ أثناء اللعب";
                    rollBtn.disabled = false;
                    isRolling = false;
                    return;
                }

                // Determine win/loss status according to 10% Win / 90% Loss algorithm
                const isWin = (data.tier !== 'loss'); 
                let d1, d2;

                if (isWin) {
                    // Force target sum matching user choice
                    if (selectedChoice === 'under7') [d1, d2] = getRandomDiceSumInRange(2, 6);
                    else if (selectedChoice === 'equal7') [d1, d2] = getRandomDiceSum(7);
                    else [d1, d2] = getRandomDiceSumInRange(8, 12);
                } else {
                    // Force target sum NOT matching user choice
                    if (selectedChoice === 'under7') [d1, d2] = getRandomDiceSumInRange(7, 12);
                    else if (selectedChoice === 'equal7') [d1, d2] = (Math.random() > 0.5) ? getRandomDiceSumInRange(2, 6) : getRandomDiceSumInRange(8, 12);
                    else [d1, d2] = getRandomDiceSumInRange(2, 7);
                }

                playDiceSound();

                // Rotate dice animation
                const die1El = document.getElementById('die1');
                const die2El = document.getElementById('die2');

                const rX1 = 1440 + faceRotations[d1].x;
                const rY1 = 1440 + faceRotations[d1].y;
                const rX2 = 1440 + faceRotations[d2].x;
                const rY2 = 1440 + faceRotations[d2].y;

                die1El.style.transform = `rotateX(${rX1}deg) rotateY(${rY1}deg)`;
                die2El.style.transform = `rotateX(${rX2}deg) rotateY(${rY2}deg)`;

                setTimeout(() => {
                    const total = d1 + d2;
                    let calculatedWin = isWin ? (betAmount * 2) : 0;
                    
                    if (isWin) {
                        statusMsg.style.color = "#2ecc71";
                        statusMsg.innerText = `مبروك! النتيجة ${total}، كسبت ${calculatedWin.toFixed(2)}$ 🎯`;
                    } else {
                        statusMsg.style.color = "#e74c3c";
                        statusMsg.innerText = `للأسف! النتيجة ${total}، خسرت الرهان ❌`;
                    }

                    document.getElementById('userBalance').innerText = data.new_balance.toFixed(2);
                    rollBtn.disabled = false;
                    isRolling = false;
                }, 1600);

            } catch (err) {
                statusMsg.style.color = "#e74c3c";
                statusMsg.innerText = "تعذر الاتصال بالسيرفر";
                rollBtn.disabled = false;
                isRolling = false;
            }
        }

        function getRandomDiceSum(targetSum) {
            let options = [];
            for (let i = 1; i <= 6; i++) {
                let j = targetSum - i;
                if (j >= 1 && j <= 6) options.push([i, j]);
            }
            return options[Math.floor(Math.random() * options.length)];
        }

        function getRandomDiceSumInRange(min, max) {
            let targetSum = Math.floor(Math.random() * (max - min + 1)) + min;
            return getRandomDiceSum(targetSum);
        }
    </script>
</body>
</html>
