<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎴 لعبة الشدة الملكية | Royal Golden Cards</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-light: #fff3a1;
            --gold-main: #ffd700;
            --gold-dark: #b8860b;
            --gold-shadow: rgba(255, 215, 0, 0.4);
            --gold-border: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --table-felt: radial-gradient(circle at center, #1a4325 0%, #0d2815 60%, #041208 100%);
            --red-card: #e53935;
            --black-card: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: #030a05;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* ------------------ Splash Screen ------------------ */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #153c20 0%, #041007 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .crown-icon {
            font-size: 5rem;
            background: linear-gradient(135deg, #fff2a3, #ffd700, #997a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px var(--gold-shadow));
            animation: pulseCrown 2s infinite ease-in-out;
        }

        @keyframes pulseCrown {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--gold-shadow)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); }
        }

        .splash-title {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #ffd700, #dda0dd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 8px;
        }

        .splash-motto {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fcf6ba;
            margin-bottom: 35px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .btn-start-game {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            color: #1a0f00;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 16px 50px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--gold-shadow), inset 0 0 10px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-start-game:active { transform: scale(0.95); }

        /* ------------------ Header ------------------ */
        .header {
            background: rgba(4, 15, 8, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #d4af37;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 50;
            height: 56px;
            flex-shrink: 0;
        }

        .btn-exit {
            background: rgba(229, 57, 53, 0.15);
            border: 1px solid #ef5350;
            color: #ff6b6b;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-exit:active { transform: scale(0.95); }

        .balance-box {
            background: linear-gradient(145deg, #0f1a12, #050d07);
            border: 2px solid #ffd700;
            padding: 6px 16px;
            border-radius: 25px;
            color: #ffd700;
            font-weight: 900;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3), inset 0 0 8px rgba(0, 0, 0, 0.9);
        }

        .balance-box i { color: #ffe875; }

        /* ------------------ Golden Poker Table Area ------------------ */
        .poker-table {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 10px 14px;
            position: relative;
            background: var(--table-felt);
            min-height: 0;
            overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.95);
        }

        /* الإطار الذهبي الفاخر للطاولة */
        .table-border-ring {
            position: absolute;
            inset: 8px;
            border: 3px solid transparent;
            border-image: var(--gold-border) 1;
            border-radius: 20px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .table-inner-glow {
            position: absolute;
            inset: 12px;
            border: 1px dashed rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            pointer-events: none;
        }

        .section-title {
            font-size: 0.9rem;
            color: #fcf6ba;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        .score-badge {
            color: #ffd700;
            font-weight: 900;
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--gold-shadow);
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }

        /* ------------------ Realistic Golden Cards ------------------ */
        .card {
            width: 68px;
            height: 98px;
            perspective: 1000px;
        }

        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.8);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px 7px;
        }

        .card-back {
            background-color: #580000;
            background-image: 
                radial-gradient(circle at center, #800000 0%, #300000 100%),
                repeating-linear-gradient(45deg, rgba(255, 215, 0, 0.3) 0, rgba(255, 215, 0, 0.3) 2px, transparent 2px, transparent 8px),
                repeating-linear-gradient(-45deg, rgba(255, 215, 0, 0.3) 0, rgba(255, 215, 0, 0.3) 2px, transparent 2px, transparent 8px);
            border: 2px solid #ffd700;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9), 0 0 5px rgba(255, 215, 0, 0.4);
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .card-back::after {
            content: '👑'; 
            font-size: 1.6rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .card-front {
            background: linear-gradient(135deg, #ffffff 0%, #f4f4f4 100%);
            color: var(--black-card);
            transform: rotateY(180deg);
            border: 2px solid #d4af37;
        }
        .card-front.red { color: var(--red-card); }

        .card-corner { font-size: 0.8rem; font-weight: 900; line-height: 1; text-align: right; }
        .card-center-suit { font-size: 1.8rem; align-self: center; line-height: 1; }

        .game-status {
            text-align: center;
            padding: 10px 14px;
            font-size: 0.92rem;
            font-weight: 900;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(3, 12, 6, 0.92);
            border: 1px solid #ffd700;
            box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(255, 215, 0, 0.15);
            z-index: 10;
            width: 92%;
            max-width: 380px;
        }

        /* ------------------ Controls Panel ------------------ */
        .controls-panel {
            flex-shrink: 0;
            background: rgba(3, 10, 5, 0.98);
            border-top: 2px solid #d4af37;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 60;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.9);
        }

        .bet-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .btn-step {
            width: 38px; height: 38px;
            border-radius: 10px; border: none;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000; font-size: 1.3rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }
        .btn-step:active { transform: scale(0.92); }

        .bet-input {
            background: transparent; border: none;
            color: #ffd700; font-size: 1.4rem;
            font-weight: 900; text-align: center; width: 90px; outline: none;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .preset-row { display: flex; gap: 6px; }
        .btn-preset {
            flex: 1; padding: 8px 0;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 8px; color: #fcf6ba;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
            transition: 0.2s;
        }
        .btn-preset:active { background: #ffd700; color: #000; }

        .action-btns { display: flex; gap: 8px; }

        .btn-act {
            flex: 1; padding: 14px;
            border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 900;
            color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-deal { 
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #1b5e20 100%); 
            border: 1px solid #4caf50; 
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }
        .btn-change { 
            background: linear-gradient(135deg, #8e0000 0%, #c62828 50%, #8e0000 100%); 
            border: 1px solid #ef5350; 
        }
        .btn-confirm { 
            background: linear-gradient(135deg, #b38728 0%, #fbf5b7 50%, #aa771c 100%); 
            color: #1a0f00;
            border: 1px solid #ffe875; 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .btn-act:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <!-- 🌟 صفحة البداية الفاخرة -->
    <div class="splash-screen" id="splash">
        <i class="fa-solid fa-crown crown-icon"></i>
        <div class="splash-title">لعبة الشدة الملكية</div>
        <div class="splash-motto">"لا تنتظر الحظ، بل اصنعه بنفسك!"</div>
        <button class="btn-start-game" onclick="launchGame()">
            <i class="fa-solid fa-play"></i> ابدأ اللعب
        </button>
    </div>

    <!-- 🏆 الشريط العلوي (الرصيد وزر الخروج) -->
    <header class="header">
        <button class="btn-exit" onclick="exitGame()">
            <i class="fa-solid fa-xmark"></i> خروج
        </button>
        <div class="balance-box">
            <i class="fa-solid fa-coins"></i>
            <span id="u-balance">0.00</span> NPS
        </div>
    </header>

    <!-- 🃏 طاولة الشدة الذهبية الفاخرة -->
    <div class="poker-table">
        <div class="table-border-ring"></div>
        <div class="table-inner-glow"></div>

        <!-- أوراق الخصم -->
        <div>
            <div class="section-title">أوراق الخصم (المجموع المعروض: <span id="opp-score" class="score-badge">?</span>)</div>
            <div class="cards-container" id="opp-cards"></div>
        </div>

        <!-- حالة الجولة -->
        <div class="game-status" id="status-text">اختر مبلغ الرهان واضغط توزيع الأوراق</div>

        <!-- أوراق اللاعب -->
        <div>
            <div class="section-title">أوراقك (المجموع المعروض: <span id="player-score" class="score-badge">0</span>)</div>
            <div class="cards-container" id="player-cards"></div>
        </div>
    </div>

    <!-- 🎮 لوحة الرهان والتحكم -->
    <div class="controls-panel">
        <div class="bet-selector">
            <span style="font-size: 0.85rem; color: #fcf6ba;">قيمة الرهان (NPS):</span>
            <button class="btn-step" onclick="adjustBet(-5)">-</button>
            <input type="number" id="bet-amount" class="bet-input" value="5" min="5" max="1000" step="5">
            <button class="btn-step" onclick="adjustBet(5)">+</button>
        </div>

        <div class="preset-row">
            <button class="btn-preset" onclick="setBet(5)">5 NPS</button>
            <button class="btn-preset" onclick="adjustBet(10)">+10</button>
            <button class="btn-preset" onclick="adjustBet(25)">+25</button>
            <button class="btn-preset" onclick="multiplyBet(2)">X2</button>
        </div>

        <div class="action-btns" id="action-area">
            <button class="btn-act btn-deal" onclick="startRound()">
                <i class="fa-solid fa-play"></i> توزيع الأوراق (<span id="btn-bet-lbl">5</span> NPS)
            </button>
        </div>
    </div>

    <script>
        // ------------------ Web Audio API Synthesizer (أصوات اللعبة) ------------------
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playFlip() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playClick() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            },
            playWin() {
                this.init();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            },
            playLoss() {
                this.init();
                const now = this.ctx.currentTime;
                [320, 270, 220, 160].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            }
        };

        // ------------------ Telegram WebApp Integration & User Data ------------------
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const urlParams = new URLSearchParams(window.location.search);
        const userId = tg?.initDataUnsafe?.user?.id || urlParams.get('user_id') || urlParams.get('telegram_id') || "123456789";

        let userBalance = 0.0;
        let betAmount = 5;
        let gameState = 'IDLE';
        let playerHand = [];
        let oppHand = [];

        const suits = [
            { symbol: '♠', color: 'black' },
            { symbol: '♥', color: 'red' },
            { symbol: '♦', color: 'red' },
            { symbol: '♣', color: 'black' }
        ];

        const ranks = [
            { name: '2', val: 2 }, { name: '3', val: 3 }, { name: '4', val: 4 },
            { name: '5', val: 5 }, { name: '6', val: 6 }, { name: '7', val: 7 },
            { name: '8', val: 8 }, { name: '9', val: 9 }, { name: '10', val: 10 },
            { name: 'J', val: 10 }, { name: 'Q', val: 10 }, { name: 'K', val: 10 },
            { name: 'A', val: 11 }
        ];

        function launchGame() {
            SoundFX.playClick();
            if (tg) tg.expand();
            document.getElementById('splash').style.display = 'none';
        }

        function exitGame() {
            SoundFX.playClick();
            if (tg) {
                tg.close();
            } else {
                document.getElementById('splash').style.display = 'flex';
            }
        }

        // جلب رصيد المستخدم الحقيقي المربوط بالسيرفر وقاعدة البيانات
        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/get?telegram_id=${userId}`);
                const data = await res.json();
                if (data.success) {
                    userBalance = parseFloat(data.balance);
                    document.getElementById('u-balance').innerText = userBalance.toFixed(2);
                }
            } catch (e) {
                console.error("خطأ في جلب بيانات المستخدم:", e);
            }
        }

        function generateRandomCard() {
            const suit = suits[Math.floor(Math.random() * suits.length)];
            const rank = ranks[Math.floor(Math.random() * ranks.length)];
            return { ...rank, ...suit };
        }

        // توليد البطاقات لتتوافق بدقة مع النتيجة القادمة من خوارزميات السيرفر
        function generateMatchingHands(isWin) {
            let pHand, oHand, pSum, oSum;
            let attempts = 0;

            do {
                pHand = [generateRandomCard(), generateRandomCard(), generateRandomCard()];
                oHand = [generateRandomCard(), generateRandomCard(), generateRandomCard()];
                
                pSum = pHand.reduce((a, b) => a + b.val, 0);
                oSum = oHand.reduce((a, b) => a + b.val, 0);

                attempts++;
                if (attempts > 300) break; // حماية لضمان عدم حدوث Loop

            } while (isWin ? (pSum <= oSum) : (pSum >= oSum));

            return { pHand, oHand };
        }

        function createCardHTML(idPrefix, index) {
            return `
                <div class="card" id="${idPrefix}-${index}">
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front" id="${idPrefix}-${index}-front">
                            <div class="card-corner" id="${idPrefix}-${index}-rank"></div>
                            <div class="card-center-suit" id="${idPrefix}-${index}-suit"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function initTableUI() {
            const oppContainer = document.getElementById('opp-cards');
            const pContainer = document.getElementById('player-cards');
            oppContainer.innerHTML = '';
            pContainer.innerHTML = '';

            for (let i = 0; i < 3; i++) {
                oppContainer.innerHTML += createCardHTML('opp', i);
                pContainer.innerHTML += createCardHTML('p', i);
            }
            document.getElementById('opp-score').innerText = '?';
            document.getElementById('player-score').innerText = '0';
        }

        function setCardData(idPrefix, index, card) {
            const frontEl = document.getElementById(`${idPrefix}-${index}-front`);
            const rankEl = document.getElementById(`${idPrefix}-${index}-rank`);
            const suitEl = document.getElementById(`${idPrefix}-${index}-suit`);

            frontEl.className = `card-front ${card.color}`;
            rankEl.innerText = `${card.name}\n${card.symbol}`;
            suitEl.innerText = card.symbol;
        }

        function flipCard(idPrefix, index) {
            document.getElementById(`${idPrefix}-${index}`).classList.add('flipped');
            SoundFX.playFlip();
        }

        function adjustBet(delta) {
            SoundFX.playClick();
            if (gameState !== 'IDLE' && gameState !== 'REVEALED_1') return;
            betAmount = Math.min(1000, Math.max(5, betAmount + delta));
            updateBetDisplay();
        }

        function setBet(val) {
            SoundFX.playClick();
            if (gameState !== 'IDLE' && gameState !== 'REVEALED_1') return;
            betAmount = Math.max(5, val);
            updateBetDisplay();
        }

        function multiplyBet(factor) {
            SoundFX.playClick();
            if (gameState !== 'IDLE' && gameState !== 'REVEALED_1') return;
            betAmount = Math.min(1000, Math.max(5, Math.round(betAmount * factor)));
            updateBetDisplay();
        }

        function updateBetDisplay() {
            document.getElementById('bet-amount').value = betAmount;
            const btnBet = document.getElementById('btn-bet-lbl');
            if (btnBet) btnBet.innerText = betAmount;
        }

        document.getElementById('bet-amount').addEventListener('change', (e) => {
            let val = parseInt(e.target.value) || 5;
            betAmount = Math.min(1000, Math.max(5, val));
            updateBetDisplay();
        });

        /* ------------------ بدء الجولة (عرض الكرت الأول مؤقتاً) ------------------ */
        async function startRound() {
            SoundFX.playClick();
            if (userBalance < betAmount) {
                alert("⚠️ رصيدك غير كافٍ للرهان! قم بشحن رصيدك للمتابعة.");
                return;
            }

            initTableUI();

            // توليد أوراق بدئية للعرض
            playerHand = [generateRandomCard(), generateRandomCard(), generateRandomCard()];
            oppHand = [generateRandomCard(), generateRandomCard(), generateRandomCard()];

            for (let i = 0; i < 3; i++) {
                setCardData('p', i, playerHand[i]);
                setCardData('opp', i, oppHand[i]);
            }

            gameState = 'REVEALED_1';
            
            // فتح الكرت الأول للاعب وأول كرت للخصم
            setTimeout(() => {
                flipCard('p', 0);
                document.getElementById('player-score').innerText = playerHand[0].val;

                setTimeout(() => {
                    flipCard('opp', 0);
                    document.getElementById('opp-score').innerText = oppHand[0].val + " + ?";
                }, 200);
            }, 200);

            document.getElementById('status-text').innerText = "تم فتح الكرت الأول لك وللخصم! اختر: متابعة الرهان أم تغيير الرهان؟";
            document.getElementById('status-text').style.color = "#ffd700";

            renderDecisionButtons();
        }

        function renderDecisionButtons() {
            const actionArea = document.getElementById('action-area');
            actionArea.innerHTML = `
                <button class="btn-act btn-change" onclick="changeBetOption()">
                    <i class="fa-solid fa-rotate-left"></i> غير الرهان (-10 NPS)
                </button>
                <button class="btn-act btn-confirm" onclick="confirmAndPlay()">
                    <i class="fa-solid fa-check"></i> راهن ومتابعة (${betAmount} NPS)
                </button>
            `;
        }

        async function changeBetOption() {
            SoundFX.playClick();
            if (userBalance < 10) {
                alert("رصيدك لا يكفي لدفع رسوم تغيير الرهان (10 NPS)!");
                return;
            }

            // اقتطاع رسوم التغيير عبر السيرفر ومزامنتها
            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, game_id: "cards", bet_amount: 10 })
                });
                const data = await res.json();
                if (data.success && data.new_balance !== undefined) {
                    userBalance = parseFloat(data.new_balance);
                    document.getElementById('u-balance').innerText = userBalance.toFixed(2);
                }
            } catch (e) {
                userBalance -= 10;
                document.getElementById('u-balance').innerText = userBalance.toFixed(2);
            }

            document.getElementById('status-text').innerText = "تم خصم 10 NPS رسوم تغيير. اضبط الرهان ثم اضغط تأكيد.";
            document.getElementById('status-text').style.color = "#ff5252";

            const actionArea = document.getElementById('action-area');
            actionArea.innerHTML = `
                <button class="btn-act btn-confirm" style="width:100%" onclick="confirmAndPlay()">
                    <i class="fa-solid fa-circle-check"></i> تأكيد الرهان الجديد (<span id="btn-bet-lbl">${betAmount}</span> NPS)
                </button>
            `;
        }

        /* ------------------ الربط الكامل مع السيرفر لحساب الربح والخصم ------------------ */
        async function confirmAndPlay() {
            SoundFX.playClick();
            if (userBalance < betAmount) {
                alert("رصيدك الحالي أقل من مبلغ الرهان المحدد!");
                return;
            }

            let isWin = false;
            let winAmount = 0.0;
            let newBalance = userBalance;

            try {
                // إرسال الرهان لمحرك اللعبة بالسيرفر app.py
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        game_id: "cards", 
                        bet_amount: betAmount
                    })
                });

                const data = await res.json();
                
                if (!data.success) {
                    alert(`⚠️ ${data.message || "حدث خطأ أثناء اللعب!"}`);
                    return;
                }

                // قراءة النتيجة الحقيقية ومضاعف الربح من السيرفر
                newBalance = parseFloat(data.new_balance);
                winAmount = parseFloat(data.win_amount);
                
                // الفوز يحقق ضعف قيمة الرهان (win_amount > 0)
                isWin = data.multiplier > 0 || winAmount > 0;

            } catch(e) {
                alert("حدث خطأ في الاتصال بالسيرفر! يرجى المحاولة مرة أخرى.");
                return;
            }

            // إنتاج بطاقات تناسب النتيجة المحسوبة بالسيرفر بالضبط
            const matchedHands = generateMatchingHands(isWin);
            playerHand = matchedHands.pHand;
            oppHand = matchedHands.oHand;

            for (let i = 0; i < 3; i++) {
                setCardData('p', i, playerHand[i]);
                setCardData('opp', i, oppHand[i]);
            }

            const pScore = playerHand.reduce((a, b) => a + b.val, 0);
            const oppScore = oppHand.reduce((a, b) => a + b.val, 0);

            // تحديث الرصيد المعروض بالرصيد الحقيقي القادم من قاعدة البيانات
            userBalance = newBalance;
            document.getElementById('u-balance').innerText = userBalance.toFixed(2);

            // كشف أوراق اللاعب المتبقية
            flipCard('p', 1);
            flipCard('p', 2);
            document.getElementById('player-score').innerText = pScore;

            // كشف أوراق الخصم المتبقية
            setTimeout(() => {
                flipCard('opp', 1);
                flipCard('opp', 2);
                document.getElementById('opp-score').innerText = oppScore;

                setTimeout(() => {
                    const statusEl = document.getElementById('status-text');
                    if (isWin) {
                        SoundFX.playWin();
                        statusEl.innerText = `🎉 مبروك! ربحت ${winAmount.toFixed(2)} NPS (ضعف الرهان)! (${pScore} ضد ${oppScore})`;
                        statusEl.style.color = "#00e676";
                    } else {
                        SoundFX.playLoss();
                        statusEl.innerText = `💥 خسرت ${betAmount.toFixed(2)} NPS! (${pScore} ضد الخصم ${oppScore})`;
                        statusEl.style.color = "#ff3d00";
                    }

                    resetControls();
                    fetchUserData();
                }, 500);
            }, 450);
        }

        function resetControls() {
            gameState = 'IDLE';
            const actionArea = document.getElementById('action-area');
            actionArea.innerHTML = `
                <button class="btn-act btn-deal" onclick="startRound()">
                    <i class="fa-solid fa-play"></i> جولة جديدة (<span id="btn-bet-lbl">${betAmount}</span> NPS)
                </button>
            `;
        }

        window.onload = () => {
            fetchUserData();
            initTableUI();
        };
    </script>
</body>
</html>
