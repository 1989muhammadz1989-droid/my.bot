<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>صالة البولينج الملكية VIP - GOLDEN GAME 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #02040a;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(8, 12, 24, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(217, 119, 6, 0.4);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .brand {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffe58f, #f59e0b, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }
    .balance-box {
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }
    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: rgba(7, 11, 22, 0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    .aim-slider-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .aim-label {
      font-size: 12px;
      color: #fbbf24;
      font-weight: bold;
    }
    .aim-slider {
      width: 100%;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    .bet-control {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(15, 23, 42, 0.95);
      padding: 6px 18px;
      border-radius: 30px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .btn-step {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }
    .btn-step:active {
      transform: scale(0.9);
    }
    .bet-display {
      font-size: 17px;
      font-weight: bold;
      min-width: 120px;
      text-align: center;
      color: #f8fafc;
    }
    .quick-bets {
      display: flex;
      gap: 8px;
    }
    .btn-quick {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quick:hover {
      background: rgba(51, 65, 85, 1);
      color: #fbbf24;
      border-color: #fbbf24;
    }
    .btn-play {
      width: 100%;
      max-width: 360px;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a, #15803d);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 25px rgba(34, 197, 94, 0.45);
      transition: all 0.2s ease-in-out;
      letter-spacing: 0.5px;
    }
    .btn-play:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }
    .btn-play:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .payout-badge {
      font-size: 12px;
      color: #fbbf24;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 10px;
      border-radius: 10px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    #status-msg {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 900;
      padding: 16px 32px;
      border-radius: 20px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
      backdrop-filter: blur(12px);
    }
    .msg-win {
      background: rgba(22, 163, 74, 0.92);
      color: #fff;
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.9);
      border: 2px solid #86efac;
    }
    .msg-loss {
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.9);
      border: 2px solid #fca5a5;
    }
  </style>

  <!-- Library Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="header">
    <div class="brand">🎳 VIP GOLDEN BOWLING</div>
    <div class="balance-box">الرصيد: <span id="user-balance">100</span> nps</div>
  </div>

  <div id="canvas-container">
    <div id="status-msg"></div>
  </div>

  <div id="controls">
    <div class="payout-badge">مضاعف الربح الثابت: 2× فقط من الرهان</div>
    
    <div class="aim-slider-container">
      <span class="aim-label">🎯 حدد اتجاه الكرة (التصويب)</span>
      <input type="range" id="aim-angle" class="aim-slider" min="-0.6" max="0.6" step="0.01" value="0">
    </div>

    <div class="bet-control">
      <button class="btn-step" id="btn-minus">-</button>
      <div class="bet-display">الرهان: <span id="bet-amount">5</span> nps</div>
      <button class="btn-step" id="btn-plus">+</button>
    </div>

    <div class="quick-bets">
      <button class="btn-quick" onclick="setBet(5)">5</button>
      <button class="btn-quick" onclick="setBet(10)">10</button>
      <button class="btn-quick" onclick="setBet(50)">50</button>
      <button class="btn-quick" onclick="setBet(100)">100</button>
      <button class="btn-quick" onclick="setMaxBet()">الحد الأقصى</button>
    </div>

    <button class="btn-play" id="btn-bet" onclick="handleRoll()">راهن وارمي (5 nps)</button>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. إدارة الحساب والبيانات والرهان
    // ----------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || "123456";
    
    let currentBalance = 100; // قيمة افتراضية للتجربة
    let betAmount = 5;
    const minBet = 5;
    const maxBet = 1000;
    let isRolling = false;

    // محرك الصوت Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playRollSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const bufferSize = audioCtx.sampleRate * 2.0;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(200, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      whiteNoise.start();
    }

    function playHitSound(isWin) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(380, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);

      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);

      if (isWin) {
        setTimeout(() => {
          const winOsc = audioCtx.createOscillator();
          const winGain = audioCtx.createGain();
          winOsc.type = 'sine';
          winOsc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          winOsc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12);
          winOsc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.24);
          winOsc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.36);

          winGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          winGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);

          winOsc.connect(winGain);
          winGain.connect(audioCtx.destination);
          winOsc.start();
          winOsc.stop(audioCtx.currentTime + 0.7);
        }, 80);
      }
    }

    function updateBalanceUI() {
      document.getElementById('user-balance').innerText = currentBalance;
      document.getElementById('btn-bet').innerText = `راهن وارمي (${betAmount} nps)`;
    }

    function setBet(val) {
      if (isRolling) return;
      betAmount = Math.min(Math.max(val, minBet), maxBet);
      document.getElementById('bet-amount').innerText = betAmount;
      updateBalanceUI();
    }

    function setMaxBet() {
      setBet(Math.min(currentBalance, maxBet));
    }

    document.getElementById('btn-minus').addEventListener('click', () => setBet(betAmount - 5));
    document.getElementById('btn-plus').addEventListener('click', () => setBet(betAmount + 5));

    function fetchUserData() {
      fetch(`/api/user/get?user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.balance !== undefined) {
            currentBalance = data.balance;
            updateBalanceUI();
          }
        })
        .catch(() => updateBalanceUI());
    }
    fetchUserData();

    // ----------------------------------------------------
    // 2. الجرافيكس والتكسشرات المتقدمة
    // ----------------------------------------------------
    function createWoodLaneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 2048;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#d97706';
      ctx.fillRect(0, 0, 1024, 2048);
      for (let i = 0; i < 1024; i += 16) {
        ctx.fillStyle = (i / 16) % 2 === 0 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.06)';
        ctx.fillRect(i, 0, 8, 2048);
      }
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(0, 1940, 1024, 25);
      return new THREE.CanvasTexture(canvas);
    }

    function createPinTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(0, 60, 256, 22); ctx.fillRect(0, 95, 256, 16);
      return new THREE.CanvasTexture(canvas);
    }

    function createBallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 50, 256, 256, 256);
      grad.addColorStop(0, '#f59e0b');
      grad.addColorStop(0.5, '#b45309');
      grad.addColorStop(1, '#451a03');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#1e1b18';
      ctx.beginPath(); ctx.arc(220, 200, 18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(280, 200, 18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(250, 260, 20, 0, Math.PI * 2); ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    // ----------------------------------------------------
    // 3. المشهد والعدسات ثلاثية الأبعاد
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02040a);
    scene.fog = new THREE.FogExp2(0x02040a, 0.035);

    const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
    const CAM_START = new THREE.Vector3(0, 1.45, 3.2);
    camera.position.copy(CAM_START);
    camera.lookAt(0, 0.2, -13);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // الإضاءة
    scene.add(new THREE.AmbientLight(0xc7d2fe, 0.6));
    const spotLight = new THREE.SpotLight(0xffedd5, 2.2);
    spotLight.position.set(0, 9, 2);
    spotLight.target.position.set(0, 0, -10);
    spotLight.castShadow = true;
    scene.add(spotLight);

    // الممر
    const laneGeo = new THREE.BoxGeometry(2.1, 0.1, 17);
    const laneMat = new THREE.MeshStandardMaterial({ map: createWoodLaneTexture(), roughness: 0.08, metalness: 0.15 });
    const lane = new THREE.Mesh(laneGeo, laneMat);
    lane.position.set(0, -0.05, -5.5);
    lane.receiveShadow = true;
    scene.add(lane);

    // المزاريب
    const gutterGeo = new THREE.CylinderGeometry(0.2, 0.2, 17, 16, 1, false, 0, Math.PI);
    const gutterMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.4, metalness: 0.8 });
    const leftGutter = new THREE.Mesh(gutterGeo, gutterMat);
    leftGutter.rotation.x = Math.PI / 2; leftGutter.rotation.z = Math.PI;
    leftGutter.position.set(-1.25, -0.08, -5.5);
    scene.add(leftGutter);

    const rightGutter = new THREE.Mesh(gutterGeo, gutterMat);
    rightGutter.rotation.x = Math.PI / 2; rightGutter.rotation.z = Math.PI;
    rightGutter.position.set(1.25, -0.08, -5.5);
    scene.add(rightGutter);

    // الكرة
    const ballGeo = new THREE.SphereGeometry(0.22, 64, 64);
    const ballMat = new THREE.MeshStandardMaterial({ map: createBallTexture(), roughness: 0.05, metalness: 0.85 });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.castShadow = true;
    scene.add(ball);

    // مؤشر التصويب
    const arrowGeo = new THREE.ConeGeometry(0.08, 0.5, 16);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
    arrow.rotation.x = -Math.PI / 2;
    arrow.position.set(0, 0.05, 1.2);
    scene.add(arrow);

    const aimSlider = document.getElementById('aim-angle');
    aimSlider.addEventListener('input', (e) => {
      if (!isRolling) {
        const val = parseFloat(e.target.value);
        arrow.rotation.z = -val;
        arrow.position.x = val * 0.8;
        ball.position.x = val * 0.5;
      }
    });

    // الأحجار (Pins)
    function createPinGeometry() {
      const points = [
        new THREE.Vector2(0, 0), new THREE.Vector2(0.07, 0.01),
        new THREE.Vector2(0.095, 0.08), new THREE.Vector2(0.1, 0.18),
        new THREE.Vector2(0.07, 0.32), new THREE.Vector2(0.045, 0.42),
        new THREE.Vector2(0.05, 0.48), new THREE.Vector2(0.03, 0.54), new THREE.Vector2(0, 0.55)
      ];
      return new THREE.LatheGeometry(points, 32);
    }

    const pinGeo = createPinGeometry();
    const pinMat = new THREE.MeshStandardMaterial({ map: createPinTexture(), roughness: 0.1 });
    const pins = [];
    const pinPositions = [
      { x: 0, z: -12 },
      { x: -0.22, z: -12.4 }, { x: 0.22, z: -12.4 },
      { x: -0.44, z: -12.8 }, { x: 0, z: -12.8 }, { x: 0.44, z: -12.8 },
      { x: -0.66, z: -13.2 }, { x: -0.22, z: -13.2 }, { x: 0.22, z: -13.2 }, { x: 0.66, z: -13.2 }
    ];

    function initPins() {
      pins.forEach(p => scene.remove(p.mesh));
      pins.length = 0;
      pinPositions.forEach(pos => {
        const mesh = new THREE.Mesh(pinGeo, pinMat);
        mesh.castShadow = true;
        mesh.position.set(pos.x, 0, pos.z);
        scene.add(mesh);
        pins.push({ mesh, initX: pos.x, initZ: pos.z, isFallen: false, vx: 0, vz: 0, rotX: 0, rotZ: 0 });
      });
    }

    function resetGame() {
      ball.position.set(parseFloat(aimSlider.value) * 0.5, 0.22, 1.8);
      ball.rotation.set(0, 0, 0);
      camera.position.copy(CAM_START);
      arrow.visible = true;
      initPins();
      isRolling = false;
      document.getElementById('btn-bet').disabled = false;
    }

    // ----------------------------------------------------
    // 4. خوارزمية اللعب وحساب الأرباح (2X Rigged System)
    // ----------------------------------------------------
    let rollSpeed = 0.22;
    let targetX = 0;
    let curveFactor = 0;
    let serverIsWin = false;

    function handleRoll() {
      if (isRolling) return;

      if (currentBalance < betAmount) {
        showMessage("الرصيد غير كافي!", "loss");
        return;
      }

      // 1. خصم الرصيد فوراً
      currentBalance -= betAmount;
      updateBalanceUI();

      isRolling = true;
      document.getElementById('btn-bet').disabled = true;
      arrow.visible = false;

      // 2. تحديد نتيجة الجولة (خوارزمية حاسمة)
      // نسبة فوز 40% كُمثال، أو يمكن ربطها بسيرفر
      serverIsWin = Math.random() < 0.40;

      const playerAim = parseFloat(aimSlider.value);

      if (serverIsWin) {
        // فوز كامل (Strike): توجيه الكرة بدقة متناهية نحو المنتصف
        targetX = 0;
        curveFactor = (0 - playerAim) * 0.02; // تصحيح غير ملحوظ في حركة الكرة لتبدو رمية محترفة
      } else {
        // خسارة طبيعية الذكاء: جعل الكرة تنحرف طفيفاً لتضرب حجر واحد أو تقع بالمرزاب
        const dir = playerAim >= 0 ? 1 : -1;
        targetX = dir * (0.85 + Math.random() * 0.3); 
        curveFactor = dir * (0.015 + Math.random() * 0.01); // انحراف انسيابي يظهر كخطأ تصويب من اللاعب
      }

      playRollSound();
      animateRoll();
    }

    function showMessage(text, type) {
      const msg = document.getElementById('status-msg');
      msg.innerText = text;
      msg.className = type === 'win' ? 'msg-win' : 'msg-loss';
      msg.style.opacity = '1';
      setTimeout(() => { msg.style.opacity = '0'; }, 2200);
    }

    // ----------------------------------------------------
    // 5. الفيزياء والأنيميشن التفاعلي
    // ----------------------------------------------------
    function animateRoll() {
      if (!isRolling) return;

      // تحريك الكرة للأمام
      ball.position.z -= rollSpeed;
      ball.rotation.x -= rollSpeed * 2;

      // تطبيق الانحراف الفيزيائي التدريجي (Curve)
      ball.position.x += curveFactor;

      // كاميرا تلحق الكرة بسلاسة
      if (ball.position.z > -8) {
        camera.position.z = ball.position.z + 2.0;
        camera.position.x = ball.position.x * 0.5;
      }

      // اصطدام الكرة بالأحجار
      if (ball.position.z <= -11.8) {
        processImpact();
        return;
      }

      requestAnimationFrame(animateRoll);
    }

    function processImpact() {
      playHitSound(serverIsWin);

      if (serverIsWin) {
        // سقوط جميع الأحجار (Strike)
        pins.forEach((p, idx) => {
          p.isFallen = true;
          p.vx = (Math.random() - 0.5) * 0.25;
          p.vz = -(Math.random() * 0.2 + 0.1);
          p.rotX = Math.random() * 0.3;
          p.rotZ = Math.random() * 0.3;
        });

        // زيادة الرصيد: الرهان × 2 فقط
        const winAmount = betAmount * 2;
        currentBalance += winAmount;
        updateBalanceUI();

        showMessage(`👑 STRIKE! ربحت ${winAmount} nps`, "win");
      } else {
        // سقوط جزئي أو عدم إحراز strike (خسارة)
        pins.forEach((p, idx) => {
          if (Math.abs(p.initX - ball.position.x) < 0.35) {
            p.isFallen = true;
            p.vx = (p.initX - ball.position.x) * 0.3;
            p.vz = -0.1;
            p.rotX = 0.2;
          }
        });

        showMessage("حاول مرة أخرى!", "loss");
      }

      // أنيميشن سقوط الأحجار
      let frames = 0;
      function animatePins() {
        frames++;
        pins.forEach(p => {
          if (p.isFallen) {
            p.mesh.position.x += p.vx;
            p.mesh.position.z += p.vz;
            p.mesh.rotation.x += p.rotX;
            p.mesh.rotation.z += p.rotZ;
            if (p.mesh.position.y > -0.05) p.mesh.position.y -= 0.02;
          }
        });

        if (frames < 45) {
          requestAnimationFrame(animatePins);
        } else {
          setTimeout(resetGame, 1200);
        }
      }
      animatePins();
    }

    // Loop التحديث الرئيسي للمشهد
    function render() {
      requestAnimationFrame(render);
      renderer.render(scene, camera);
    }

    // تهيئة اللعبة
    resetGame();
    render();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
