<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>صالة البولينج الملكية - GOLDEN GAME 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #050811;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(217, 119, 6, 0.3);
      z-index: 10;
    }
    .brand {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .balance-box {
      background: rgba(30, 41, 59, 0.8);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }
    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 20px;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      z-index: 10;
    }
    .bet-control {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(30, 41, 59, 0.9);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-step {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }
    .btn-step:active {
      transform: scale(0.92);
    }
    .bet-display {
      font-size: 18px;
      font-weight: bold;
      min-width: 110px;
      text-align: center;
      color: #f8fafc;
    }
    .btn-play {
      width: 100%;
      max-width: 340px;
      padding: 15px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
      transition: all 0.2s ease-in-out;
      letter-spacing: 0.5px;
    }
    .btn-play:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-play:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }
    #status-msg {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 900;
      padding: 14px 28px;
      border-radius: 16px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
      backdrop-filter: blur(8px);
    }
    .msg-win {
      background: rgba(34, 197, 94, 0.9);
      color: #fff;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.8);
      border: 1px solid #86efac;
    }
    .msg-loss {
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
      border: 1px solid #fca5a5;
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="header">
    <div class="brand">🎳 GOLDEN GAME</div>
    <div class="balance-box">الرصيد: <span id="user-balance">0</span> nps</div>
  </div>

  <div id="canvas-container">
    <div id="status-msg"></div>
  </div>

  <div id="controls">
    <div class="bet-control">
      <button class="btn-step" id="btn-minus">-</button>
      <div class="bet-display">الرهان: <span id="bet-amount">5</span> nps</div>
      <button class="btn-step" id="btn-plus">+</button>
    </div>
    <button class="btn-play" id="btn-bet">راهن وارمي (5 nps)</button>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. إدارة البيانات والبيئة
    // ----------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || urlParams.get('telegram_id') || "123456";
    
    let currentBalance = 0;
    let betAmount = 5;
    const minBet = 5;
    const maxBet = 1000;
    let isRolling = false;

    // الصوتيات الديناميكية Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playRollSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(200, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.2);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      whiteNoise.start();
    }

    function playHitSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);

      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function fetchUserData() {
      fetch(`/api/user/get?user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            currentBalance = data.balance;
            document.getElementById('user-balance').innerText = currentBalance;
          }
        })
        .catch(err => console.error("خطأ جلب البيانات:", err));
    }

    // ----------------------------------------------------
    // 2. محرك الجرافيكس والتكسشرات المصنعة (Procedural Textures)
    // ----------------------------------------------------
    function createWoodLaneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      // خلفية خشبية فاخرة
      ctx.fillStyle = '#b45309';
      ctx.fillRect(0, 0, 1024, 2048);

      // رسم ألياف الخشب
      for (let i = 0; i < 1024; i += 16) {
        ctx.fillStyle = (i / 16) % 2 === 0 ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.05)';
        ctx.fillRect(i, 0, 8, 2048);
      }

      // خط الرمي (Foul Line)
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(0, 1950, 1024, 20);

      // أسهم التوجيه
      ctx.fillStyle = '#451a03';
      for (let i = 0; i < 7; i++) {
        const x = 128 + i * 128;
        ctx.beginPath();
        ctx.moveTo(x, 1400);
        ctx.lineTo(x - 20, 1460);
        ctx.lineTo(x + 20, 1460);
        ctx.closePath();
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

    function createScreenTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // خلفية الشاشة
      ctx.fillStyle = '#050b14';
      ctx.fillRect(0, 0, 1024, 512);

      // إطار إيضائي
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 16;
      ctx.strokeRect(10, 10, 1004, 492);

      // نص GOLDEN GAME Neon
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 25;
      ctx.font = '900 82px "Segoe UI", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('GOLDEN GAME', 512, 230);

      ctx.font = '700 36px "Segoe UI", sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('VIP BOWLING CLUB', 512, 320);

      return new THREE.CanvasTexture(canvas);
    }

    // ----------------------------------------------------
    // 3. بناء المشهد ثلاثي الأبعاد الواقعي
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040711);
    scene.fog = new THREE.FogExp2(0x040711, 0.035);

    // منظور الكاميرا (ثابت - First Person Perspective)
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    const FIXED_CAM_POS = new THREE.Vector3(0, 1.45, 3.2);
    camera.position.copy(FIXED_CAM_POS);
    camera.lookAt(0, 0.2, -13);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // الإضاءة الاحترافية
    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.5);
    scene.add(ambientLight);

    // كشافات مسار الممر
    const spotLight = new THREE.SpotLight(0xfff1f2, 1.8);
    spotLight.position.set(0, 8, 2);
    spotLight.target.position.set(0, 0, -10);
    spotLight.angle = Math.PI / 4;
    spotLight.penumbra = 0.5;
    spotLight.castShadow = true;
    spotLight.shadow.mapSize.width = 2048;
    spotLight.shadow.mapSize.height = 2048;
    scene.add(spotLight);

    // إضاءة نيون جانبية للممر
    const blueNeonLeft = new THREE.PointLight(0x0284c7, 1.2, 15);
    blueNeonLeft.position.set(-1.8, 0.5, -6);
    scene.add(blueNeonLeft);

    const blueNeonRight = new THREE.PointLight(0x0284c7, 1.2, 15);
    blueNeonRight.position.set(1.8, 0.5, -6);
    scene.add(blueNeonRight);

    // إضاءة أحجار البولينج
    const pinSpot = new THREE.SpotLight(0xfef08a, 2.5);
    pinSpot.position.set(0, 5, -11);
    pinSpot.target.position.set(0, 0, -13);
    scene.add(pinSpot);

    // ممر البولينج (Lane)
    const laneTex = createWoodLaneTexture();
    laneTex.wrapS = THREE.RepeatWrapping;
    laneTex.wrapT = THREE.RepeatWrapping;

    const laneGeo = new THREE.BoxGeometry(2.1, 0.1, 17);
    const laneMat = new THREE.MeshStandardMaterial({
      map: laneTex,
      roughness: 0.12,
      metalness: 0.1
    });
    const lane = new THREE.Mesh(laneGeo, laneMat);
    lane.position.set(0, -0.05, -5.5);
    lane.receiveShadow = true;
    scene.add(lane);

    // المزاريب (Gutters)
    const gutterMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.8 });
    const gutterGeo = new THREE.CylinderGeometry(0.2, 0.2, 17, 16, 1, false, 0, Math.PI);
    
    const leftGutter = new THREE.Mesh(gutterGeo, gutterMat);
    leftGutter.rotation.x = Math.PI / 2;
    leftGutter.rotation.z = Math.PI;
    leftGutter.position.set(-1.25, -0.08, -5.5);
    scene.add(leftGutter);

    const rightGutter = new THREE.Mesh(gutterGeo, gutterMat);
    rightGutter.rotation.x = Math.PI / 2;
    rightGutter.rotation.z = Math.PI;
    rightGutter.position.set(1.25, -0.08, -5.5);
    scene.add(rightGutter);

    // جدران الصالة الجانبية
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.8 });
    const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 20), wallMat);
    wallLeft.position.set(-2.5, 1.8, -5);
    scene.add(wallLeft);

    const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 20), wallMat);
    wallRight.position.set(2.5, 1.8, -5);
    scene.add(wallRight);

    // شاشة GOLDEN GAME الضخمة فوق الأحجار
    const screenTex = createScreenTexture();
    const screenGeo = new THREE.BoxGeometry(4.2, 2.1, 0.2);
    const screenMat = new THREE.MeshStandardMaterial({
      map: screenTex,
      emissiveMap: screenTex,
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 0.8,
      roughness: 0.2
    });
    const screenMesh = new THREE.Mesh(screenGeo, screenMat);
    screenMesh.position.set(0, 3.2, -13.8);
    scene.add(screenMesh);

    // كرة البولينج الاحترافية
    const ballGeo = new THREE.SphereGeometry(0.22, 64, 64);
    const ballMat = new THREE.MeshStandardMaterial({
      color: 0xd97706,
      roughness: 0.05,
      metalness: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.castShadow = true;
    scene.add(ball);

    // سهم التوجيه
    const arrowGeo = new THREE.ConeGeometry(0.08, 0.4, 16);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
    arrow.rotation.x = -Math.PI / 2;
    arrow.position.set(0, 0.05, 1.2);
    scene.add(arrow);

    let arrowAngle = 0;
    let arrowSpeed = 0.035;

    // إنشاء المجسم الدقيق لأحجار البولينج (Realistic Pin Lathe)
    function createPinGeometry() {
      const points = [];
      points.push(new THREE.Vector2(0, 0));
      points.push(new THREE.Vector2(0.07, 0.01));
      points.push(new THREE.Vector2(0.09, 0.08));
      points.push(new THREE.Vector2(0.1, 0.18));
      points.push(new THREE.Vector2(0.07, 0.32));
      points.push(new THREE.Vector2(0.045, 0.42));
      points.push(new THREE.Vector2(0.05, 0.48));
      points.push(new THREE.Vector2(0.03, 0.54));
      points.push(new THREE.Vector2(0, 0.55));
      return new THREE.LatheGeometry(points, 32);
    }

    const pinGeo = createPinGeometry();
    const pinMat = new THREE.MeshStandardMaterial({
      color: 0xfffffa,
      roughness: 0.15,
      metalness: 0.05
    });

    const pins = [];
    const pinPositions = [
      { x: 0, z: -12 },
      { x: -0.22, z: -12.4 }, { x: 0.22, z: -12.4 },
      { x: -0.44, z: -12.8 }, { x: 0, z: -12.8 }, { x: 0.44, z: -12.8 },
      { x: -0.66, z: -13.2 }, { x: -0.22, z: -13.2 }, { x: 0.22, z: -13.2 }, { x: 0.66, z: -13.2 }
    ];

    function createPin(x, z) {
      const pinMesh = new THREE.Mesh(pinGeo, pinMat);
      pinMesh.castShadow = true;
      pinMesh.receiveShadow = true;
      pinMesh.position.set(x, 0, z);
      scene.add(pinMesh);
      return { mesh: pinMesh, initX: x, initZ: z, isFallen: false, vx: 0, vz: 0, rotX: 0, rotZ: 0 };
    }

    function initPins() {
      pins.forEach(p => scene.remove(p.mesh));
      pins.length = 0;
      pinPositions.forEach(pos => {
        pins.push(createPin(pos.x, pos.z));
      });
    }

    function resetBallAndCamera() {
      ball.position.set(0, 0.22, 1.8);
      ball.rotation.set(0, 0, 0);
      camera.position.copy(FIXED_CAM_POS);
      arrow.visible = true;
      arrow.position.set(0, 0.05, 1.2);
    }

    initPins();
    resetBallAndCamera();

    // ----------------------------------------------------
    // 4. حلقة التحريك (Render Loop)
    // ----------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      // تحريك سهم الاتجاه في وضع الانتظار
      if (!isRolling) {
        arrowAngle += arrowSpeed;
        if (arrowAngle > 0.45 || arrowAngle < -0.45) arrowSpeed = -arrowSpeed;
        arrow.position.x = Math.sin(arrowAngle) * 0.6;
        arrow.rotation.z = -arrowAngle;
      }

      // تحريك الأحجار التي سقطت بفيزياء سريعة
      pins.forEach(p => {
        if (p.isFallen && p.mesh.position.y > -0.5) {
          p.mesh.position.x += p.vx;
          p.mesh.position.z += p.vz;
          p.mesh.rotation.x += p.rotX;
          p.mesh.rotation.z += p.rotZ;
          p.mesh.position.y -= 0.015;
        }
      });

      renderer.render(scene, camera);
    }
    animate();

    // ----------------------------------------------------
    // 5. إدارة الأزرار والرهانات مع السيرفر
    // ----------------------------------------------------
    document.getElementById('btn-plus').addEventListener('click', () => {
      if (isRolling) return;
      if (betAmount + 5 <= maxBet && betAmount + 5 <= currentBalance) {
        betAmount += 5;
        updateBetUI();
      }
    });

    document.getElementById('btn-minus').addEventListener('click', () => {
      if (isRolling) return;
      if (betAmount - 5 >= minBet) {
        betAmount -= 5;
        updateBetUI();
      }
    });

    function updateBetUI() {
      document.getElementById('bet-amount').innerText = betAmount;
      document.getElementById('btn-bet').innerText = `راهن وارمي (${betAmount} nps)`;
    }

    document.getElementById('btn-bet').addEventListener('click', () => {
      if (isRolling) return;
      if (currentBalance < betAmount) {
        showStatus("رصيدك غير كافٍ!", "msg-loss");
        return;
      }

      isRolling = true;
      document.getElementById('btn-bet').disabled = true;
      arrow.visible = false;

      // إرسال طلب الجولة للباك إند
      fetch('/api/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: userId,
          game_id: 'bowling',
          bet_amount: betAmount
        })
      })
      .then(res => res.json())
      .then(data => {
        if (!data.success) {
          showStatus(data.message || "حدث خطأ!", "msg-loss");
          isRolling = false;
          document.getElementById('btn-bet').disabled = false;
          arrow.visible = true;
          return;
        }

        // تحديث الرصيد مباشرة
        currentBalance = data.new_balance;
        document.getElementById('user-balance').innerText = currentBalance;

        // تنفيذ الرمية بفيزياء سينمائية
        const isWin = data.win_amount > 0;
        rollBall(isWin, data.win_amount);
      })
      .catch(err => {
        console.error(err);
        isRolling = false;
        document.getElementById('btn-bet').disabled = false;
        arrow.visible = true;
      });
    });

    function rollBall(isWin, winAmount) {
      playRollSound();

      let targetX = isWin ? 0 : (Math.random() > 0.5 ? 0.4 : -0.4);
      let progress = 0;

      const rollInterval = setInterval(() => {
        progress += 0.022;
        ball.position.z = THREE.MathUtils.lerp(1.8, -12, progress);
        ball.position.x = THREE.MathUtils.lerp(0, targetX, progress);
        ball.rotation.x -= 0.25;

        // الكاميرا تبقى ثابتة في موقعها (First Person)

        if (progress >= 1) {
          clearInterval(rollInterval);
          playHitSound();
          handleImpact(isWin, winAmount);
        }
      }, 16);
    }

    function handleImpact(isWin, winAmount) {
      if (isWin) {
        // سقوط كامل الأحجار (Strike)
        pins.forEach(pin => {
          pin.isFallen = true;
          pin.vx = (Math.random() - 0.5) * 0.12;
          pin.vz = -Math.random() * 0.15;
          pin.rotX = Math.random() * 0.2;
          pin.rotZ = Math.random() * 0.2;
        });
        showStatus(`STRIKE! مبروك فزت بـ ${winAmount} nps`, "msg-win");
      } else {
        // سقوط جزئي للأحجار (جولة خاسرة)
        const fallCount = Math.floor(Math.random() * 7) + 1;
        for (let i = 0; i < fallCount; i++) {
          pins[i].isFallen = true;
          pins[i].vx = (Math.random() - 0.5) * 0.1;
          pins[i].vz = -Math.random() * 0.12;
          pins[i].rotX = Math.random() * 0.15;
          pins[i].rotZ = Math.random() * 0.15;
        }
        showStatus("جولة خاسرة! لم تسقط كافة الأحجار", "msg-loss");
      }

      fetchUserData();
      setTimeout(resetRound, 3200);
    }

    function showStatus(text, className) {
      const msg = document.getElementById('status-msg');
      msg.innerText = text;
      msg.className = className;
      msg.style.opacity = '1';
      setTimeout(() => { msg.style.opacity = '0'; }, 2800);
    }

    function resetRound() {
      initPins();
      resetBallAndCamera();
      isRolling = false;
      document.getElementById('btn-bet').disabled = false;
    }

    // جلب البيانات الأولية
    fetchUserData();

    // استجابة تغيير حجم الشاشة
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
